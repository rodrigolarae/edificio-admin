<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vecinoo">
<meta name="theme-color" content="#0F172A">
<title>Vecinoo — Todo tu edificio, en orden</title>
<link rel="manifest" href="manifest.json" onerror="this.remove()">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a1a;min-height:100vh}
:root{--navy:#0F172A;--navy2:#1E293B;--green:#2E766B;--green2:#1d5249;--gold:#E6B800;--gold2:#b89200;--white:#F8FAFC;--gray:#94A3B8;--gray2:#64748B;--red:#DC2626;--light:#E8F0FE;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px}
.login-box{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:400px}
.login-logo{text-align:center;margin-bottom:24px}
.login-step{display:none}.login-step.active{display:block}
.community-list{max-height:260px;overflow-y:auto;margin-bottom:14px}
.community-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e5e5e5;border-radius:10px;cursor:pointer;margin-bottom:6px;transition:all .2s}
.community-item:hover,.community-item.selected{border-color:var(--navy);background:#f0f4ff}
.community-info h3{font-size:13px;font-weight:700}
.community-info p{font-size:11px;color:#6b7280}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:230px;background:#fff;border-right:1px solid #e5e5e5;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:transform .3s}
.sidebar-logo{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.1);background:var(--navy)}
.sidebar-logo-row{display:flex;align-items:center;gap:8px}
.sidebar-logo-icon{width:32px;height:32px;flex-shrink:0}
.sidebar-logo-text h1{font-size:16px;font-weight:800;color:var(--white);line-height:1.2;letter-spacing:-0.3px}
.sidebar-logo-text p{font-size:10px;color:var(--gold);margin-top:1px}
.nav{flex:1;padding:6px 0}
.nav-category{padding:10px 16px 3px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:12px;color:#374151;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s}
.nav-item:hover{background:#f3f4f6}
.nav-item.active{background:#f0f4ff;color:var(--navy);font-weight:600;border-right:3px solid var(--gold)}
.user-info{padding:10px 16px;border-top:1px solid #e5e5e5;font-size:11px;color:#6b7280}
.role-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:600;margin-top:3px}
.role-superadmin{background:var(--navy);color:#fff}
.role-admin{background:#dbeafe;color:#1e40af}
.role-presidente{background:#ede9fe;color:#5b21b6}
.role-tesorero{background:#fef3c7;color:#92400e}
.role-resident{background:#d1fae5;color:#065f46}
.main{flex:1;overflow-y:auto;padding:18px;background:#f0f2f5}
.topbar{display:none;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--navy);border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;z-index:100}
.topbar-logo{display:flex;align-items:center;gap:6px}
.topbar-logo svg{width:24px;height:24px}
.topbar-logo span{font-size:14px;font-weight:800;color:var(--white);letter-spacing:-0.3px}
.hamburger{background:none;border:none;font-size:20px;cursor:pointer;color:var(--white)}
.page-header{margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.page-header h2{font-size:18px;font-weight:700}
.page-header p{font-size:12px;color:#6b7280;margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.metric{background:#fff;border-radius:10px;padding:12px 14px;border:1px solid #e5e5e5}
.metric-label{font-size:10px;color:#6b7280;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.metric-value{font-size:20px;font-weight:700}
.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--navy)}.amber{color:#d97706}.purple{color:#7c3aed}.gold{color:var(--gold2)}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-title{font-size:13px;font-weight:700;color:#111}
.btn{padding:7px 14px;border-radius:8px;border:1px solid #d1d5db;background:#fff;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;color:#374151;font-weight:500;-webkit-appearance:none}
.btn:hover{background:#f9fafb}.btn:active{transform:scale(.98)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn-primary:hover{background:var(--navy2)}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}.btn-gold:hover{background:var(--gold2)}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-warning{background:#d97706;color:#fff;border-color:#d97706}
.btn-dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-purple{background:#7c3aed;color:#fff;border-color:#7c3aed}
.btn-sm{padding:4px 9px;font-size:11px}.btn-block{width:100%;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #e5e5e5;background:#f9fafb}
td{padding:9px 10px;border-bottom:1px solid #f3f4f6;color:#374151;vertical-align:middle}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.badge-green{background:#d1fae5;color:#065f46}.badge-red{background:#fee2e2;color:#991b1b}
.badge-amber{background:#fef3c7;color:#92400e}.badge-blue{background:#dbeafe;color:#1e40af}
.badge-gray{background:#f3f4f6;color:#374151}.badge-purple{background:#ede9fe;color:#5b21b6}
.badge-dark{background:var(--navy);color:#fff}.badge-gold{background:#fef9c3;color:#854d0e}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:11px;font-weight:600;color:#374151;margin-bottom:4px}
.form-control{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:#111;-webkit-appearance:none}
.form-control:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,23,42,.08)}
.form-control:disabled{background:#f9fafb;color:#6b7280;cursor:not-allowed}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-row-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-lg{max-width:780px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:14px;font-weight:700}
.close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:#6b7280}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1e40af;flex-shrink:0}
.empty{text-align:center;padding:32px;color:#9ca3af;font-size:13px}
.alert-bar{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:12px;font-weight:500}
.alert-success{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.receipt{font-size:12px}
.receipt-header{text-align:center;padding-bottom:14px;margin-bottom:14px;border-bottom:2px dashed #e5e5e5}
.receipt-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f3f4f6;font-size:12px}
.receipt-total{font-size:15px;font-weight:700;margin-top:10px;padding-top:10px;border-top:2px solid #111;display:flex;justify-content:space-between}
.progress-bar{height:6px;background:#f3f4f6;border-radius:4px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:4px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f3f4f6;font-size:12px}
.stat-row:last-child{border-bottom:none}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cat-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;border:2px solid #e5e5e5;border-radius:10px;background:#fff;cursor:pointer;transition:all .2s;font-size:10px;font-weight:600;color:#374151;gap:4px;text-align:center}
.cat-btn:hover{border-color:var(--navy);background:#f0f4ff;color:var(--navy)}
.cat-btn.selected{border-color:var(--gold);background:var(--navy);color:#fff}
.cat-icon{font-size:18px}
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.toggle{position:relative;width:38px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#d1d5db;border-radius:20px;cursor:pointer;transition:.3s}
.toggle-slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.toggle-slider{background:var(--green)}
.toggle input:checked+.toggle-slider:before{transform:translateX(18px)}
.section-div{font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;margin:12px 0 8px;padding-bottom:4px;border-bottom:1px solid #e5e5e5}
.doc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.doc-card{border:1px solid #e5e5e5;border-radius:10px;padding:16px 12px;text-align:center;background:#fff}
.doc-icon{font-size:28px;margin-bottom:8px}.doc-title{font-size:11px;font-weight:700;margin-bottom:4px}
.doc-desc{font-size:10px;color:#6b7280;margin-bottom:10px}
.alert-card{padding:10px 14px;background:#fff;border-radius:8px;margin-bottom:8px;border:1px solid #e5e5e5;border-left:4px solid var(--red)}
.alert-card.info{border-left-color:var(--navy)}.alert-card.warning{border-left-color:var(--gold)}
.liq-table{font-size:12px;width:100%}
.liq-table td{padding:5px 8px;border-bottom:1px solid #f3f4f6}
.liq-table .total{font-weight:700;font-size:13px;border-top:2px solid #111}
.tab-bar{display:flex;gap:4px;background:#f3f4f6;padding:4px;border-radius:8px;margin-bottom:12px}
.tab-btn{flex:1;padding:6px;border:none;background:none;font-size:11px;cursor:pointer;border-radius:6px;font-family:inherit;color:#6b7280;font-weight:500}
.tab-btn.active{background:#fff;color:var(--navy);font-weight:700;border-bottom:2px solid var(--gold)}
.loading{text-align:center;padding:32px;color:#6b7280;font-size:13px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #e5e5e5;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.superadmin-bar{background:var(--navy);color:#fff;padding:7px 14px;font-size:11px;display:flex;justify-content:space-between;align-items:center}
.plan-badge{padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700}
.install-banner{background:var(--navy);color:#fff;padding:10px 16px;font-size:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:3px solid var(--gold)}
@keyframes wsp-pulse{0%{box-shadow:0 4px 20px rgba(34,197,94,0.5)}50%{box-shadow:0 4px 28px rgba(34,197,94,0.8),0 0 0 8px rgba(34,197,94,0.15)}100%{box-shadow:0 4px 20px rgba(34,197,94,0.5)}}
.wizard-steps{display:flex;align-items:center;margin-bottom:24px;gap:0}
.wstep{display:flex;align-items:center;gap:8px;flex:1}
.wstep-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.wstep.active .wstep-num{background:var(--navy);color:#fff}
.wstep.done .wstep-num{background:var(--green);color:#fff}
.wstep.pending .wstep-num{background:#e5e5e5;color:#9ca3af}
.wstep-label{font-size:11px;font-weight:600;color:var(--navy)}
.wstep.pending .wstep-label{color:#9ca3af}
.wstep-line{flex:1;height:2px;background:#e5e5e5;margin:0 4px}
.wstep-line.done{background:var(--green)}
.piso-row{background:#f9fafb;border:1px solid #e5e5e5;border-radius:8px;padding:12px;margin-bottom:8px}
.piso-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.piso-title{font-size:13px;font-weight:700;color:var(--navy)}
.depto-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.depto-chip{background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:4px 6px;text-align:center;font-size:11px;cursor:pointer;transition:all .15s}
.depto-chip:hover{border-color:var(--navy);background:#f0f4ff}
.depto-chip.selected{background:var(--navy);color:#fff;border-color:var(--navy)}
.asig-card{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.asig-card.assigned{border-color:var(--green);background:#f0fdf4}
.asig-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item-chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #d1d5db;background:#fff;transition:all .15s}
.item-chip.libre{border-color:#d1d5db;color:#374151}
.item-chip.asignado{background:var(--green);color:#fff;border-color:var(--green)}
.item-chip.selected-chip{background:var(--navy);color:#fff;border-color:var(--navy)}
.votacion-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:16px;margin-bottom:12px;border-top:3px solid var(--gold)}
.liq-gc{font-family:Arial,Helvetica,sans-serif;font-size:12px;background:#fff;border:1px solid #ccc;border-radius:6px;overflow:hidden;margin-bottom:16px}
.liq-gc-header{background:#0F172A;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.liq-gc-header-left h2{font-size:16px;font-weight:800;margin-bottom:2px}
.liq-gc-header-left p{font-size:11px;color:#94A3B8}
.liq-gc-body{padding:16px 20px}
.liq-gc-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #ddd;border-radius:6px;overflow:hidden;margin-bottom:14px}
.liq-gc-info-cell{padding:7px 12px;border-bottom:1px solid #f0f0f0;border-right:1px solid #f0f0f0;font-size:11px}
.liq-gc-info-cell:nth-child(even){border-right:none}
.liq-gc-info-label{color:#6b7280;margin-bottom:1px}
.liq-gc-info-val{font-weight:700;color:#111}
.liq-gc-section{margin-bottom:14px}
.liq-gc-section-title{background:#0F172A;color:#fff;padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.03em}
.liq-gc-table{width:100%;border-collapse:collapse;font-size:11px}
.liq-gc-table th{background:#f3f4f6;padding:6px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #e5e5e5}
.liq-gc-table td{padding:6px 10px;border-bottom:1px solid #f9f9f9;color:#374151;vertical-align:top}
.liq-gc-table .subtotal{font-weight:700;background:#f9fafb}
.liq-gc-table .total-row{font-weight:800;font-size:13px;background:#0F172A;color:#fff}
.liq-gc-table .total-row td{padding:8px 10px}
.liq-gc-destacado{background:#E6B800;color:#0F172A;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-radius:6px}
.liq-gc-destacado-label{font-size:11px;font-weight:600}
.liq-gc-destacado-val{font-size:20px;font-weight:900}
.liq-gc-obs{background:#f9fafb;border:1px solid #e5e5e5;border-radius:6px;padding:12px 14px;font-size:11px;color:#374151;line-height:1.6;margin-bottom:14px}
.liq-gc-footer{background:#f3f4f6;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid #E6B800;flex-wrap:wrap;gap:8px}
.liq-gc-footer-brand{font-size:13px;font-weight:800;color:#0F172A}
.liq-gc-footer-brand span{color:#E6B800}
.liq-gc-saldo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.liq-gc-saldo-card{background:#f9fafb;border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px}
.liq-gc-saldo-label{font-size:10px;color:#6b7280;margin-bottom:3px;font-weight:600;text-transform:uppercase}
.liq-gc-saldo-val{font-size:16px;font-weight:800}
.votacion-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.opcion-voto{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:2px solid #e5e5e5;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.opcion-voto:hover{border-color:var(--navy);background:#f0f4ff}
.opcion-voto.selected{border-color:var(--gold);background:var(--navy);color:#fff}
.voto-bar{height:8px;background:#e5e5e5;border-radius:4px;overflow:hidden;margin-top:4px}
.voto-fill{height:100%;background:var(--navy);border-radius:4px;transition:width .5s}
.resultado-row{padding:10px 0;border-bottom:1px solid #f3f4f6}
.resultado-row:last-child{border-bottom:none}
.acta-box{background:#f9fafb;border:1px solid #e5e5e5;border-radius:8px;padding:14px;font-size:12px;margin-top:12px;border-left:3px solid var(--gold)}
#chatHistory::-webkit-scrollbar{width:4px}
#chatHistory::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:4px}
.espacio-libre{border-top-color:var(--green)!important}
.espacio-ocupado{border-top-color:var(--gold)!important}
@media(max-width:768px){
  .metrics{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}
  .cat-grid{grid-template-columns:repeat(3,1fr)}.doc-grid{grid-template-columns:1fr 1fr}
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:200;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}.topbar{display:flex}.main{padding:12px}
  .form-row-3{grid-template-columns:1fr 1fr}.depto-grid{grid-template-columns:repeat(4,1fr)}
  .form-row-4{grid-template-columns:1fr 1fr}
}
.acta-vot-wrap{background:#fff;border:2px solid #0F172A;border-radius:8px;padding:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;font-size:12px}
.acta-vot-header{background:#0F172A;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-start}
.acta-vot-header h2{font-size:15px;font-weight:800;margin-bottom:2px}
.acta-vot-header p{font-size:10px;color:#94A3B8}
.acta-vot-body{padding:16px 20px}
.acta-vot-meta{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #e5e5e5;border-radius:6px;overflow:hidden;margin-bottom:14px}
.acta-vot-meta-cell{padding:7px 12px;border-bottom:1px solid #f0f0f0;border-right:1px solid #f0f0f0;font-size:11px}
.acta-vot-meta-cell:nth-child(even){border-right:none}
.acta-vot-meta-cell:nth-last-child(-n+2){border-bottom:none}
.acta-vot-meta-label{color:#6b7280;font-size:10px;margin-bottom:1px}

function calcLiquidacion(w){
  const bruto=parseInt(w.gross_salary)||0;
  const afpPct=w.afp_type==='Uno'?0.0058:0.1027;
  const afp=Math.round(bruto*afpPct);const sis=Math.round(bruto*0.0154);const segCes=Math.round(bruto*0.006);
  const salud=w.health_type==='Fonasa'?Math.round(bruto*0.07):parseInt(w.health_amount)||0;
  const imp=calcImpuesto(bruto-afp-salud);const liquido=bruto-afp-salud-segCes-imp;
  return{bruto,afp,sis,segCes,salud,imp,liquido,afpPct,gratif:Math.round(bruto*0.25)};
}
function calcImpuesto(base){
  const utm=65443;const e=base/utm;
  if(e<=13.5)return 0;if(e<=30)return Math.round(base*0.04-0.192*utm);
  if(e<=50)return Math.round(base*0.08-1.392*utm);if(e<=70)return Math.round(base*0.135-4.142*utm);
  return Math.round(base*0.23-10.792*utm);
}
function calcFiniquito(w,type,lastDay){
  const liq=calcLiquidacion(w);
  const years=(new Date(lastDay)-new Date(w.start_date))/(1000*60*60*24*365);
  const yf=Math.floor(years);const mf=Math.round((years-yf)*12);
  const ind=type==='despido'?Math.round(liq.bruto*Math.min(yf+(mf>=6?1:0),11)):0;
  const dias=Math.round((new Date(lastDay).getDate()/30)*liq.liquido);
  const vac=Math.round(years*15/12*(liq.bruto/30));
  return{ind,dias,vac,total:ind+dias+vac,years:yf,months:mf};
}
function calcProrate(amount,units){
  const total=units.reduce((s,u)=>s+(u.sqm||0),0);
  return units.map(u=>({unitId:u.id,sqm:u.sqm||0,pct:total>0?(u.sqm||0)/total:0,amount:total>0?Math.round(amount*(u.sqm||0)/total):0}));
}

function generarInventario(numDeptos,numEstac,numBodegas){
  const deptos=[];
  let contador=1;let piso=1;
  while(contador<=numDeptos){
    const porEste=Math.min(Math.floor(Math.random()*3)+4,numDeptos-contador+1);
    for(let i=0;i<porEste&&contador<=numDeptos;i++,contador++){
      deptos.push({numero:String(contador).padStart(3,'0'),piso,label:`Depto ${String(contador).padStart(3,'0')} · Piso ${piso}`});
    }
    piso++;
  }
  const estacs=Array.from({length:numEstac},(_,i)=>({id:`E${i+1}`,label:`E-${String(i+1).padStart(2,'0')}`}));
  const bods=Array.from({length:numBodegas},(_,i)=>({id:`B${i+1}`,label:`B-${String(i+1).padStart(2,'0')}`}));
  return{deptos,estacs,bods};
}

}

  const pagoMes=pagosU.find(p=>p.month===m);
  const multas=state.comunidadData.multas.filter(f=>f.unidad_id===u.id&&f.status==='pendiente');
  const totalMultas=multas.reduce((s,f)=>s+f.amount,0);
  const base=u.monthly_fee||0;
  const deuda=calcDeudaAcumulada(u.id);

  let estado = 'pagado';
  let label = 'Al día';
  let icon = '✅';
  let color = 'var(--green)';
  let sub = 'Tu pago de este mes está registrado';
  let totalPagar = 0;

  if (!pagoMes) {
    if (deuda.tieneDeudaHistorica) {
      estado = 'moroso';
      label = 'Con deuda histórica';
      icon = '🔴';
      color = 'var(--red)';
      sub = `Tienes ${deuda.mesesSinPagar} mes(es) sin pagar`;
      totalPagar = deuda.totalConMesActual;
    } else {
      estado = 'pendiente';
      label = 'Pendiente este mes';
      icon = '⏳';
      color = '#d97706';
      sub = 'Vence el 10 de este mes';
      totalPagar = base + totalMultas;
    }
  }

  const mesesDeuda = deuda.mesesDeuda.slice(-6).map(md => ({
    mes: md.mes.slice(5),
    total: md.total
  }));
  const maxDeuda = Math.max(1, ...mesesDeuda.map(d => d.total));

  return`
  <div class="page-header">
    <div><h2>Mi Cuenta</h2><p>Depto ${u.numero}${u.piso?' · Piso '+u.piso:''} · ${state.selectedComunidad?.nombre||''}</p></div>
  </div>
  <div class="payment-status-card ${estado}">
    <div class="icon">${icon}</div>
    <div class="label" style="color:${color}">${label}</div>
    <div class="sub">${sub}</div>
    ${totalPagar > 0 ? `<div class="amount" style="color:${color}">${fmt(totalPagar)}</div>` : ''}
    ${!pagoMes ? `
    <div class="details">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span>GC base del mes</span>
        <span style="font-weight:700">${fmt(base)}</span>
      </div>
      ${multas.length > 0 ? `
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="color:var(--red)">⚠ Multas (${multas.length})</span>
        <span style="font-weight:700;color:var(--red)">+${fmt(totalMultas)}</span>
      </div>` : ''}
      ${deuda.mesesSinPagar > 0 ? `
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span>Meses anteriores</span>
        <span style="font-weight:700;color:var(--red)">+${fmt(deuda.totalDeuda)}</span>
      </div>` : ''}
      <div style="border-top:1px solid #e5e5e5;padding-top:8px;display:flex;justify-content:space-between;font-weight:800">
        <span>Total a pagar</span>
        <span style="color:${color}">${fmt(totalPagar)}</span>
      </div>
    </div>
    <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-primary btn-block" style="padding:12px;font-size:15px;font-weight:700;border-radius:10px" onclick="doIniciarPago()">
        💳 Pagar ahora con Flow.cl
      </button>
      <button class="btn btn-sm" style="width:100%;border-color:#9ca3af;color:#9ca3af" onclick="doNotificarPago()">
        📤 Notificar transferencia manual
      </button>
      <div style="font-size:11px;color:#9ca3af;text-align:center">Transfiere y luego notifica — el admin confirmará tu pago</div>
    </div>` : `
    <div style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--green)">
      <span>Registrado el ${fmtD(pagoMes.date)} · ${fmt(pagoMes.amount)} · ${pagoMes.method||'Transferencia'}</span>
    </div>
    <button class="btn btn-sm" style="margin-top:10px" onclick="setState({view:'my_payments'})">Ver todos mis comprobantes →</button>`}
  </div>

  ${mesesDeuda.length > 0 ? `
  <div class="card" style="margin-bottom:12px">
    <div class="card-header"><span class="card-title">📊 Historial de deuda (últimos 6 meses)</span></div>
    <div class="debt-chart">
      ${mesesDeuda.map(d => `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%">
          <div class="bar" style="height:${Math.max(4, (d.total / maxDeuda) * 100)}%;background:${d.total>0 ? 'var(--red)' : 'var(--green)'};">
            ${d.total > 0 ? `<span class="bar-value">${fmt(d.total)}</span>` : ''}
          </div>
          <div class="bar-label">${d.mes}</div>
        </div>
      `).join('')}
    </div>
  </div>` : ''}

  ${state.comunidadData.alertas.filter(a=>a.status==='activa').length > 0 ? `
  <div class="card" style="margin-bottom:12px">
    <div class="card-header">
      <span class="card-title">🔔 Avisos de tu comunidad</span>
      <button class="btn btn-sm" onclick="setState({view:'community'})">Ver todos</button>
    </div>
    ${state.comunidadData.alertas.filter(a=>a.status==='activa').slice(0,3).map(a => `
    <div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f3f4f6">
      <span style="font-size:16px">${a.tipo==='emergencia'?'🚨':a.tipo==='seguridad'?'🔒':a.tipo==='mantencion'?'🔧':'📢'}</span>
      <div><div style="font-size:12px;font-weight:700">${a.titulo}</div>
      <div style="font-size:11px;color:#6b7280">${a.descripcion||''}</div></div>
    </div>`).join('')}
  </div>` : ''}

  <div class="card" style="margin-bottom:12px">
    <div class="card-header"><span class="card-title">🏠 Tu unidad</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <div style="background:#f9fafb;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:18px;font-weight:800;color:var(--navy)">${u.sqm||'—'}</div>
        <div style="font-size:10px;color:#6b7280">Metros²</div>
      </div>
      <div style="background:#f9fafb;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:14px;font-weight:700;color:var(--navy)">${u.parking?'E'+u.parking_num:'—'}</div>
        <div style="font-size:10px;color:#6b7280">Estacionamiento</div>
      </div>
      <div style="background:#f9fafb;border-radius:8px;padding:10px;text-align:center">

        <div style="font-size:10px;color:#6b7280">Bodega</div>

  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px">
    <button class="btn" style="padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#f9fafb;border:1px solid #e5e5e5" onclick="setState({view:'my_payments'})">
      <span style="font-size:20px">🧾</span><span style="font-size:12px;font-weight:600">Mis comprobantes</span>
    </button>
    <button class="btn" style="padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#f9fafb;border:1px solid #e5e5e5" onclick="setState({view:'votaciones'})">

    <button class="btn" style="padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#f9fafb;border:1px solid #e5e5e5" onclick="setState({view:'reservas'})">

}

// ---------- buildConserje (MEJORADA) ----------

  const alertasActivas=(alertas||[]).filter(a=>a.status==="activa").length;
  const mantPendientes=(mantenimientos||[]).filter(m=>!m.completed).length;

  return`

    </div>
    <div class="metric"><div class="metric-label">Alertas activas</div>
      <div class="metric-value ${alertasActivas>0?"red":"green"}">${alertasActivas}</div>
    </div>
    <div class="metric"><div class="metric-label">Mantenciones pend.</div>
      <div class="metric-value amber">${mantPendientes}</div>
    </div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <div style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;margin-bottom:10px">Acciones rápidas</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <button class="btn btn-primary" onclick="setState({view:'conserje_visitas'})">🔔 Nueva visita</button>
      <button class="btn" style="border-color:var(--gold);color:var(--gold2)" onclick="setState({view:'conserje_estac'})">🚗 Estacionamiento</button>
      <button class="btn" style="border-color:#7c3aed;color:#7c3aed" onclick="setState({view:'conserje_paquetes'})">📦 Paquetería</button>
      <button class="btn" onclick="setState({view:'emision_gc'})">📄 Ver / imprimir GC</button>
      <button class="btn" style="border-color:var(--red);color:var(--red)" onclick="setState({view:'community'})">📢 Enviar alerta</button>
      <button class="btn" style="border-color:var(--green);color:var(--green)" onclick="setState({view:'conserje_llaves'})">🔑 Control llaves</button>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-header"><span class="card-title">🔔 Últimas visitas</span>
        <button class="btn btn-sm" onclick="setState({view:'conserje_visitas'})">Ver todas</button>
      </div>
      ${visitas.length===0?'<div class="empty">Sin visitas registradas.</div>':
        visitas.slice(0,4).map(v=>{
          const u=unidades.find(x=>x.id===v.unidad_id);
          return`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6">
            <div style="font-size:20px">👤</div>
            <div style="flex:1">
              <div style="font-size:12px;font-weight:700">${v.nombre_visitante}</div>
              <div style="font-size:11px;color:#6b7280">Depto ${u?.numero||"—"} · ${v.hora_entrada}</div>
            </div>
            <span class="badge ${v.hora_salida?"badge-green":"badge-amber"}">${v.hora_salida?"Salió":"En edificio"}</span>
          </div>`;
        }).join("")}
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">📦 Paquetes recientes</span>
        <button class="btn btn-sm" onclick="setState({view:'conserje_paquetes'})">Ver todos</button>
      </div>
      ${paquetes.length===0?'<div class="empty">Sin paquetes registrados.</div>':
        paquetes.slice(0,4).map(p=>{
          const u=unidades.find(x=>x.id===p.unidad_id);
          const estadoLabel = {pendiente:'Pendiente',entregado:'Entregado',retirado:'Retirado'}[p.estado]||p.estado;

            <span class="badge ${p.estado==='retirado'?'badge-gray':p.estado==='entregado'?'badge-green':'badge-amber'}">${estadoLabel}</span>
          </div>`;
        }).join("")}

  ${estacOcupados.length>0?`<div class="card">
    <div class="card-header"><span class="card-title">🚗 Estacionamientos ocupados</span></div>

        <button class="btn btn-sm btn-primary" onclick="conserjeEstacSalida(this)" data-id="${e.id}">Registrar salida</button>
      </div>`;
    }).join("")}
  </div>`:""}`;
}

    ${paquetes.length===0?'<div class="empty">Sin paquetes registrados.</div>':

        <span class="estado ${estadoClass}">${estadoLabel}</span>

// ---------- buildConciliacion (MEJORADA) ----------
function buildConciliacion(){
  const pagos=state.comunidadData.pagos||[];
  const unidades=state.comunidadData.unidades||[];
  const residentes=state.comunidadData.residentes||[];
  const m=thisMonth();
  const conciliados=state.conciliacionResultados||[];

        <td style="font-size:11px;color:#6b7280">${p?.method||'—'}</td>
      </tr>`;

  </div>`;
}

window.doRegistrarPaquete = function(){
  const unidadId = document.getElementById('paqueteUnidad')?.value;
  const proveedor = document.getElementById('paqueteProveedor')?.value?.trim();
  const tracking = document.getElementById('paqueteTracking')?.value?.trim();
  const obs = document.getElementById('paqueteObs')?.value?.trim();
  const notificar = document.getElementById('paqueteNotificar')?.checked;
  if(!unidadId||!proveedor){ showAlert('Completa depto y proveedor','error'); return; }
  const nuevo = {
    id: 'pqt_'+Date.now(),
    unidad_id: unidadId,
    proveedor: proveedor,
    tracking: tracking||null,
    observaciones: obs||null,
    fecha: new Date().toISOString().split('T')[0],
    estado: 'pendiente',
    created_at: new Date().toISOString(),
  };
  const prev = state.conserjePaquetes||[];
  setState({conserjePaquetes:[nuevo,...prev]});
  if(notificar){
    const u = state.comunidadData.unidades.find(x=>x.id===unidadId);
    const nuevaAlerta = {
      id:'alerta_paq_'+Date.now(),
      comunidad_id:state.selectedComunidad.id,
      titulo:'📦 Paquete para Depto '+(u?.numero||''),
      descripcion:`Tienes un paquete de ${proveedor}${tracking?' (N° '+tracking+')':''} en conserjería.`,
      tipo:'aviso',
      status:'activa',
      created_at:new Date().toISOString(),
    };
    state.comunidadData.alertas = [nuevaAlerta,...(state.comunidadData.alertas||[])];
  }
  ['paqueteProveedor','paqueteTracking','paqueteObs'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  showAlert('✅ Paquete registrado'+(notificar?' y residente notificado':''),'success');
  render();
};

window.marcarPaqueteEntregado = function(id){
  const paquetes = (state.conserjePaquetes||[]).map(p=>p.id===id?{...p, estado:'entregado'}:p);
  setState({conserjePaquetes:paquetes});
  showAlert('✅ Paquete marcado como entregado','success');
  render();
};

window.marcarPaqueteRetirado = function(id){
  const paquetes = (state.conserjePaquetes||[]).map(p=>p.id===id?{...p, estado:'retirado'}:p);
  setState({conserjePaquetes:paquetes});
  showAlert('✅ Paquete retirado por el residente','success');
  render();
};

window.doRegistrarLlave = function(){
  const unidadId = document.getElementById('llaveUnidad')?.value;
  const responsable = document.getElementById('llaveResponsable')?.value?.trim();
  const tipo = document.getElementById('llaveTipo')?.value;
  const hora = document.getElementById('llaveHora')?.value;
  const motivo = document.getElementById('llaveMotivo')?.value?.trim();
  if(!unidadId||!responsable){ showAlert('Completa depto y responsable','error'); return; }
  const nuevo = {
    id: 'llv_'+Date.now(),
    unidad_id: unidadId,
    responsable: responsable,
    tipo: tipo,
    hora_retiro: hora||new Date().toTimeString().slice(0,5),
    motivo: motivo||null,
    fecha_retiro: new Date().toISOString().split('T')[0],
    fecha_devolucion: null,
  };
  const prev = state.conserjeLlaves||[];
  setState({conserjeLlaves:[nuevo,...prev]});
  ['llaveResponsable','llaveMotivo'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  showAlert('🔑 Préstamo registrado','success');
  render();
};

window.devolverLlave = function(id){
  const llaves = (state.conserjeLlaves||[]).map(l=>l.id===id?{...l, fecha_devolucion:new Date().toISOString().split('T')[0]}:l);
  setState({conserjeLlaves:llaves});
  showAlert('✅ Llave devuelta','success');
  render();
};

    ${state.isDemo?buildDemoBanner(state.demoRol||currentUser?.rol||'admin'):''}
    <div class="superadmin-bar">
      <span style="font-size:12px;color:#94A3B8">🏢 ${com?.nombre||''} ${com?.ciudad?'· '+com.ciudad:''}</span>
      <div style="display:flex;gap:8px">
        ${isSuperAdmin?`<button class="btn btn-sm" style="background:#1E293B;color:#fff;border-color:#334155;font-size:10px" onclick="backToSuperAdmin()">← Panel maestro</button>`:''}
        <button class="btn btn-sm" style="background:#1E293B;color:#fff;border-color:#334155;font-size:10px" onclick="logout()">Salir</button>
      </div>
    </div>
    <div class="app">
      <aside class="sidebar" id="mainSidebar">
        <div class="sidebar-logo">
          <div class="sidebar-logo-row">
            <div class="sidebar-logo-icon">${LOGO_SVG}</div>
            <div class="sidebar-logo-text"><h1>${com?.nombre||'Vecinoo'}</h1><p>${comunidadData.unidades.length} unidades</p></div>
          </div>
        </div>
        <nav class="nav">${menuHtml}</nav>
        <div class="user-info">
          <div style="font-weight:600">${sanitize(currentUser?.nombre||'')}</div>
          <div style="font-size:10px;color:#9ca3af">${sanitize(currentUser?.email||'')}</div>
          <span class="role-badge ${roleBadge}">${roleLabel}</span>
          ${(()=>{
            const perfiles=state.perfilesRut||[];
            if(perfiles.length<=1)return'';
            const activo=state.perfilActivo||0;
            return`<div style="margin-top:8px;border-top:1px solid #374151;padding-top:8px">
              <div style="font-size:10px;color:#9ca3af;font-weight:600;margin-bottom:4px">MIS PROPIEDADES</div>
              ${perfiles.map((p,i)=>{
                const unidad=(state.comunidadData?.unidades||[]).find(u=>u.id===p.unidad_id);
                const com=p.comunidad;
                return`<button onclick="cambiarPropiedad(${i})"
                  style="width:100%;text-align:left;background:${i===activo?'rgba(230,184,0,0.15)':'transparent'};border:1px solid ${i===activo?'var(--gold)':'#374151'};border-radius:6px;padding:6px 8px;margin-bottom:4px;cursor:pointer;transition:all .15s">
                  <div style="font-size:11px;font-weight:${i===activo?'700':'500'};color:${i===activo?'var(--gold)':'#e2e8f0'}">
                    ${i===activo?'● ':'○ '}${sanitize(com?.nombre||'Comunidad')}
                  </div>
                  <div style="font-size:10px;color:#9ca3af">Depto ${sanitize(unidad?.numero||'—')}</div>
                </button>`;
              }).join('')}
            </div>`;
          })()}
        </div>
      </aside>
      <main class="main">
        <div class="topbar">
          <button class="hamburger" onclick="openSidebar()">☰</button>
          <div class="topbar-logo"><svg viewBox="0 0 52 52" fill="none" width="24" height="24">${LOGO_SVG}</svg><span>Vecinoo</span></div>
          <span></span>
        </div>
        ${alert?`<div class="alert-bar alert-${sanitize(alert.type)}">${sanitize(alert.msg)}</div>`:''}
        ${buildView()}
        ${state.modal?buildModal():''}
      </main>
    </div>
  </div>`;
}

// ============================================================
//  FUNCIÓN buildView (con las nuevas vistas)
// ============================================================
function buildView(){
  const v=state.view;
  if(isConserje()){
    const bloqueadas=['bank','reports','auditoria','votaciones','documents','change_password','balance','workers','my_account','my_payments','expenses','dashboard'];
    if(bloqueadas.includes(v)) return'<div class="card" style="margin:40px auto;max-width:400px;text-align:center;padding:40px">'+
      '<div style="font-size:48px;margin-bottom:12px">🔒</div>'+
      '<div style="font-size:16px;font-weight:700;color:var(--navy);margin-bottom:8px">Acceso restringido</div>'+
      '<div style="font-size:13px;color:#6b7280">Esta sección no está disponible para el rol Conserje.</div>'+
      '<button class="btn btn-sm btn-primary" style="margin-top:16px" onclick="saGoView(this)" data-view="conserje_dashboard">← Volver a mi panel</button>'+
    '</div>';
  }
  if(v==='dashboard')return buildDashboard();
  if(v==='units')return buildUnits();
  if(v==='residents')return buildResidents();
  if(v==='payments')return buildPayments();
  if(v==='emision_gc')return buildEmisionGC();
  if(v==='expenses'||v==='expenses_view')return buildExpenses(v==='expenses_view');
  if(v==='fines')return buildFines();
  if(v==='workers')return buildWorkers();
  if(v==='bank')return buildBank();
  if(v==='reports')return buildReports();
  if(v==='auditoria')return buildAuditoria();
  if(v==='votaciones')return buildVotaciones();
  if(v==='community')return buildCommunity();
  if(v==='documents')return buildDocuments();
  if(v==='change_password')return buildChangePassword();
  if(v==='settings')return buildSettings();
  if(v==='my_account')return buildMyAccount(); // MEJORADA
  if(v==='my_payments')return buildMyPayments();
  if(v==='balance')return buildBalancePublico();
  if(v==='asistente_ia')return buildAsistenteIA();
  if(v==='reservas')return buildReservas();
  if(v==='mantenimientos')return buildMantenimientos();
  if(v==='calendario_comunidad')return buildCalendarioComunidad();
  if(v==='planes_pago')return buildPlanesPage();
  if(v==='conciliacion')return buildConciliacion(); // MEJORADA
  if(v==='conserje_dashboard')return buildConserje(); // MEJORADA
  if(v==='conserje_visitas')return buildConserjeVisitas();
  if(v==='conserje_estac')return buildConserjeEstac();
  if(v==='conserje_paquetes')return buildConserjePaquetes(); // NUEVA
  if(v==='conserje_llaves')return buildConserjeLlaves(); // NUEVA
  return'';
}

// ============================================================
//  INICIO DE LA APLICACIÓN
// ============================================================
async function init(){
  setState({loading:true});
  try{
    const comunidades=await loadComunidades();
    setState({loading:false,comunidades});
    if(comunidades.length===0){
      console.warn('No se cargaron comunidades — verifica la conexión a Supabase y las políticas RLS.');
    }
  }catch(e){
    setState({loading:false});
    console.error('Error al inicializar:', e);
  }
}
init();
</script>
