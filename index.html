// ── Función principal de auditoría ──
async function auditLog(action, detalle='', extra={}){
  // No auditar en modo demo
  if(state.isDemo) return;

  const user = state.currentUser;
  const com  = state.selectedComunidad;
  if(!user || !com) return;

  const entry = {
    comunidad_id: com.id,
    usuario_id:   user.id,
    usuario_nombre: user.nombre,
    usuario_rol:  user.rol,
    accion:       action,
    detalle:      detalle,
    ip_aprox:     null, // no disponible en frontend por privacidad
    created_at:   new Date().toISOString(),
    ...extra,
  };

  // Insertar en Supabase (silencioso — no interrumpe la operación principal)
  try {
    const {data} = await sb.from('audit_logs').insert(entry).select();
    if(data?.[0]){
      // Actualizar estado local para mostrar en tiempo real
      const auditLogs = [data[0], ...(state.comunidadData.auditLogs||[])].slice(0,200);
      state.comunidadData = {...state.comunidadData, auditLogs};
    }
  } catch(e){
    console.warn('[audit] Error al registrar:', e.message);
  }
}

// ── Vista de Auditoría ──
function buildAuditoria(){
  const logs = state.comunidadData.auditLogs||[];
  const full = isFullAccess();
  const auditFilter = state.auditFilter||'todos';
  const auditSearch = state.auditSearch||'';

  // Filtrar
  const grupos = {
    todos:     logs,
    pagos:     logs.filter(l=>l.accion?.startsWith('PAGO')),
    gastos:    logs.filter(l=>l.accion?.startsWith('GASTO')),
    unidades:  logs.filter(l=>l.accion?.startsWith('UNIDAD')||l.accion==='GC_MODIFICADO'),
    residentes:logs.filter(l=>l.accion?.startsWith('RESIDENTE')||l.accion==='CLAVE_CAMBIADA'),
    multas:    logs.filter(l=>l.accion?.startsWith('MULTA')),
    trabajadores:logs.filter(l=>l.accion?.startsWith('TRABAJADOR')),
    mantenimientos:logs.filter(l=>l.accion?.startsWith('MANT')),
    otros:     logs.filter(l=>l.accion?.startsWith('VOTACION')||l.accion?.startsWith('RESERVA')||l.accion?.startsWith('CONFIG')||l.accion?.startsWith('SESION')),
  };

  let filtered = grupos[auditFilter]||logs;
  if(auditSearch.trim()){
    const q = auditSearch.toLowerCase();
    filtered = filtered.filter(l=>
      l.usuario_nombre?.toLowerCase().includes(q)||
      l.detalle?.toLowerCase().includes(q)||
      l.accion?.toLowerCase().includes(q)
    );
  }

  // Agrupar por día
  const byDay = {};
  filtered.forEach(l=>{
    const day = l.created_at?.split('T')[0]||'';
    if(!byDay[day]) byDay[day]=[];
    byDay[day].push(l);
  });

  return`
  <div class="page-header">
    <div>
      <h2>🔍 Log de Auditoría</h2>
      <p>${logs.length} acciones registradas — quién hizo qué y cuándo</p>
    </div>
    <button class="btn btn-sm btn-primary" onclick="exportarAuditoria()">⬇ Exportar CSV</button>
  </div>

  <!-- Métricas rápidas -->
  <div class="metrics" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">
    <div class="metric">
      <div class="metric-label">Total acciones</div>
      <div class="metric-value blue">${logs.length}</div>
    </div>
    <div class="metric">
      <div class="metric-label">Hoy</div>
      <div class="metric-value green">${logs.filter(l=>l.created_at?.startsWith(today())).length}</div>
    </div>
    <div class="metric">
      <div class="metric-label">Esta semana</div>
      <div class="metric-value amber">${logs.filter(l=>{
        const d=new Date(l.created_at);const now=new Date();
        return(now-d)<7*24*60*60*1000;
      }).length}</div>
    </div>
    <div class="metric">
      <div class="metric-label">Eliminaciones</div>
      <div class="metric-value red">${logs.filter(l=>l.accion?.includes('ELIMINAD')||l.accion?.includes('DESVINCUL')).length}</div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="card" style="padding:12px 16px;margin-bottom:12px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <div style="flex:1;min-width:200px">
        <input class="form-control" id="auditSearchInput" placeholder="🔍 Buscar por usuario, acción o detalle..."
          value="${auditSearch}" oninput="setState({auditSearch:this.value})" style="font-size:12px">
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap">
        ${[
          ['todos','Todos'],['pagos','💰 Pagos'],['gastos','📉 Gastos'],
          ['unidades','🏠 Unidades'],['residentes','👤 Residentes'],
          ['multas','⚠️ Multas'],['trabajadores','👷 Trabajadores'],
          ['mantenimientos','🔧 Mantenim.'],['otros','Otros'],
        ].map(([id,label])=>`
          <button class="btn btn-sm${auditFilter===id?' btn-primary':''}"
            onclick="setState({auditFilter:'${id}'})">
            ${label} <span style="font-size:10px;opacity:.7">(${grupos[id]?.length||0})</span>
          </button>`
        ).join('')}
      </div>
    </div>
  </div>

  <!-- Log agrupado por día -->
  ${filtered.length===0
    ?`<div class="card"><div class="empty">
        ${logs.length===0
          ?'Sin acciones registradas aún. Se irán registrando automáticamente a medida que uses la plataforma.'
          :'Sin resultados para el filtro seleccionado.'}
      </div></div>`
    :Object.entries(byDay).sort(([a],[b])=>b.localeCompare(a)).map(([day,dayLogs])=>`
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #f0f0f0">
          <div style="font-weight:700;font-size:13px;color:var(--navy)">
            📅 ${new Date(day+'T12:00:00').toLocaleDateString('es-CL',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
          </div>
          <span class="badge badge-gray">${dayLogs.length} acción${dayLogs.length>1?'es':''}</span>
        </div>
        ${dayLogs.map(l=>{
          const act = AUDIT_ACTIONS[l.accion]||{icon:'📝',label:l.accion||'Acción',color:'#374151',bg:'#f3f4f6'};
          const hora = l.created_at?new Date(l.created_at).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'—';
          const rolBadge = {admin:'badge-blue',presidente:'badge-purple',tesorero:'badge-amber',residente:'badge-gray',superadmin:'badge-dark'}[l.usuario_rol]||'badge-gray';
          return`<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f9f9f9">
            <!-- Hora -->
            <div style="width:42px;text-align:right;flex-shrink:0;font-size:11px;color:#9ca3af;margin-top:2px">${hora}</div>
            <!-- Ícono acción -->
            <div style="width:28px;height:28px;border-radius:50%;background:${act.bg};display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">${act.icon}</div>
            <!-- Contenido -->
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px">
                <span style="font-weight:700;font-size:12px;color:${act.color}">${act.label}</span>
                <span class="badge ${rolBadge}" style="font-size:9px">${l.usuario_nombre||'—'}</span>
                ${l.usuario_rol?`<span style="font-size:9px;color:#9ca3af">(${l.usuario_rol})</span>`:''}
              </div>
              ${l.detalle?`<div style="font-size:11px;color:#6b7280;margin-top:1px">${l.detalle}</div>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>`
    ).join('')
  }
  `;
}

// ── Exportar auditoría a CSV ──
window.exportarAuditoria = () => {
  const logs = state.comunidadData.auditLogs||[];
  if(!logs.length){showAlert('Sin datos para exportar','error');return;}

  const header = ['Fecha','Hora','Acción','Descripción','Usuario','Rol'];
  const rows = logs.map(l=>{
    const dt = l.created_at?new Date(l.created_at):null;
    const act = AUDIT_ACTIONS[l.accion]||{label:l.accion||''};
    return [
      dt?dt.toLocaleDateString('es-CL'):'',
      dt?dt.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'',
      act.label,
      (l.detalle||'').replace(/,/g,';'),
      l.usuario_nombre||'',
      l.usuario_rol||'',
    ];
  });

  const csv = [header,...rows].map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `auditoria_${state.selectedComunidad?.nombre||'vecinoo'}_${today()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showAlert('✅ CSV exportado');
};

async function init(){
  setState({loading:true});
  try{
    const comunidades=await loadComunidades();
    setState({loading:false,comunidades});
    if(comunidades.length===0){
      console.warn('No se cargaron comunidades — verifica la conexión a Supabase y las políticas RLS.');
    }
  }catch(e){
    setState({loading:false});
    console.error('Error al inicializar:', e);
  }
}
init();
