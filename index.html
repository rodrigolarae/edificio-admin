window.enviarPreguntaIA = q => {
  const input = document.getElementById('chatInput');
  if(input) input.value = q;
  enviarChatIA();
};

window.enviarChatIA = async () => {
  const input = document.getElementById('chatInput');
  const texto = input?.value?.trim();
  if(!texto || state.chatLoading) return;
  if(input) input.value = '';

  const msgs = [...(state.chatMsgs||[]), {role:'user', content:sanitize(texto)}];
  setState({chatMsgs:msgs, chatLoading:true});
  setTimeout(()=>{const h=document.getElementById('chatHistory');if(h)h.scrollTop=h.scrollHeight;},50);

  try{
    // Intento via Supabase Edge Function (evita CORS)
    const res = await fetch(`${SUPABASE_URL}/functions/v1/chat-vecinoo`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_KEY}`},
      body:JSON.stringify({system:buildContextoIA(),messages:msgs.map(m=>({role:m.role,content:m.content}))})
    });
    if(res.ok){
      const data = await res.json();
      const reply = data.content?.[0]?.text||data.reply||'Sin respuesta.';
      setState({chatMsgs:[...msgs,{role:'assistant',content:reply}],chatLoading:false});
    } else {
      // Fallback local con datos reales de la comunidad
      setState({chatMsgs:[...msgs,{role:'assistant',content:respuestaLocalIA(texto)}],chatLoading:false});
    }
  }catch(e){
    setState({chatMsgs:[...msgs,{role:'assistant',content:respuestaLocalIA(texto)}],chatLoading:false});
  }
  setTimeout(()=>{const h=document.getElementById('chatHistory');if(h)h.scrollTop=h.scrollHeight;},100);
};

// Asistente local inteligente — responde con datos reales sin necesitar IA externa
function respuestaLocalIA(pregunta){
  const u=state.currentUser;
  const com=state.selectedComunidad;
  const{unidades,residentes,pagos,gastos,multas,votaciones,alertas,reservas,mantenimientos}=state.comunidadData;
  const m=thisMonth();
  const{totalIn,totalOut,balance,paidUnits,occupied,morose}=getMetrics(m);
  const unit=unidades.find(x=>x.id===u?.unidad_id);
  const gc=unit?.monthly_fee||0;
  const myPagos=pagos.filter(p=>p.usuario_id===u?.id);
  const paid=myPagos.some(p=>p.month===m);
  const myMultas=multas.filter(f=>f.unidad_id===u?.unidad_id&&f.status==='pendiente');
  const votActivas=votaciones.filter(v=>v.estado==='activa');
  const mants=mantenimientos||[];
  const q=pregunta.toLowerCase();

  // ── Mantenimientos ──
  if(q.includes('manteni')||q.includes('contrato')||q.includes('proveedor')||q.includes('servicio')){
    if(mants.length===0)return'🔧 No hay mantenimientos registrados aún. El administrador puede agregarlos desde el menú "Mantenimientos".';
    const vencidos=mants.filter(x=>x.fecha_proximo&&diasHasta(x.fecha_proximo)<0&&x.estado!=='completado');
    const proximos30=mants.filter(x=>x.fecha_proximo&&diasHasta(x.fecha_proximo)>=0&&diasHasta(x.fecha_proximo)<=30&&x.estado!=='completado');
    let resp=`🔧 <b>Estado de mantenimientos del edificio:</b><br>• Total registrados: <b>${mants.length}</b><br>• Activos: <b>${mants.filter(x=>x.estado==='activo').length}</b>`;
    if(vencidos.length>0)resp+=`<br>• <b style="color:var(--red)">⚠️ Vencidos: ${vencidos.length}</b> — ${vencidos.map(x=>x.nombre).join(', ')}`;
    if(proximos30.length>0)resp+=`<br>• Próximos 30 días: <b>${proximos30.length}</b> — ${proximos30.map(x=>`${x.nombre} (${diasHasta(x.fecha_proximo)}d)`).join(', ')}`;
    return resp;
  }
  if(q.includes('vencido')||q.includes('atras')||q.includes('atrás')||q.includes('urgente')){
    const vencidos=mants.filter(x=>x.fecha_proximo&&diasHasta(x.fecha_proximo)<0&&x.estado!=='completado');
    if(vencidos.length===0)return'✅ No hay mantenimientos vencidos. Todo al día.';
    return`🚨 <b>${vencidos.length} mantenimiento(s) vencido(s):</b><br>${vencidos.map(x=>`• <b>${x.nombre}</b> — venció el ${fmtD(x.fecha_proximo)} (${x.proveedor||'sin proveedor'})`).join('<br>')}`;
  }
  if(q.includes('precio')||q.includes('caro')||q.includes('mercado')||q.includes('costo')||q.includes('cotiz')){
    if(mants.length===0)return'No hay contratos registrados para analizar. Agrega tus contratos en el módulo "Mantenimientos".';
    const conMonto=mants.filter(x=>x.monto>0);
    if(conMonto.length===0)return`Tienes ${mants.length} contrato(s) registrado(s) pero ninguno tiene monto. Edítalos para agregar los montos y poder comparar con el mercado.<br><br>Usa el botón 🤖 en cada contrato para un análisis detallado.`;
    return`💰 Tienes <b>${conMonto.length} contrato(s) con monto definido</b>:<br>${conMonto.map(x=>`• ${x.nombre}: <b>${fmt(x.monto)}</b>/${x.periodicidad||'período'}`).join('<br>')}<br><br>Haz clic en el botón <b>🤖</b> junto a cada contrato para ver la comparación con precios del mercado chileno.`;
  }
  if(q.includes('ascensor')||q.includes('piscina')||q.includes('extintor')||q.includes('bomba')||q.includes('jardin')){
    const tipos={ascensor:'ascensor',piscina:'piscina',extintor:'incendios',bomba:'agua',jardin:'jardineria'};
    const tipo=Object.keys(tipos).find(k=>q.includes(k));
    const cat=tipos[tipo];
    const encontrados=mants.filter(x=>x.categoria===cat||x.nombre.toLowerCase().includes(tipo||''));
    if(encontrados.length===0)return`No hay contratos de ${tipo} registrados.`;
    return`🔧 Contratos de <b>${tipo}</b>:<br>${encontrados.map(x=>`• ${x.nombre} — ${x.proveedor||'sin proveedor'} — ${x.monto?fmt(x.monto):'sin monto'} — próximo: ${x.fecha_proximo?fmtD(x.fecha_proximo):'—'}`).join('<br>')}`;
  }

  // ── Resto de preguntas ──
  if(q.includes('debo')||q.includes('pagar')||q.includes('cuanto')||q.includes('cuánto')||q.includes('deuda')||q.includes('gc')){
    if(paid)return`✅ Ya pagaste tu GC de <b>${m}</b>. Monto: <b>${fmt(myPagos.find(p=>p.month===m)?.amount||0)}</b>. ¡Estás al día!`;
    const total=gc+myMultas.reduce((s,f)=>s+f.amount,0);
    return`💰 Tu GC de <b>${m}</b> está <b>pendiente</b>.<br>• GC base: ${fmt(gc)}${myMultas.length>0?`<br>• Multas: ${fmt(myMultas.reduce((s,f)=>s+f.amount,0))}`:''}.<br>• <b>Total a pagar: ${fmt(total)}</b><br><br>Puedes registrar tu pago desde "Mi Cuenta".`;
  }
  if(q.includes('multa')){
    if(myMultas.length===0)return'✅ No tienes multas pendientes.';
    return`⚠️ Tienes <b>${myMultas.length} multa(s)</b> pendientes por <b>${fmt(myMultas.reduce((s,f)=>s+f.amount,0))}</b>:<br>${myMultas.map(f=>`• ${f.reason} — ${fmt(f.amount)}`).join('<br>')}`;
  }
  if(q.includes('votacion')||q.includes('votación')||q.includes('votar')){
    if(votActivas.length===0)return'📊 No hay votaciones activas en este momento.';
    return`🗳️ Hay <b>${votActivas.length} votación(es) activa(s)</b>:<br>${votActivas.map(v=>`• <b>${v.titulo}</b> — cierra el ${fmtD(v.fecha_cierre||v.fecha_cierre_dt)}`).join('<br>')}`;
  }
  if(q.includes('balance')||q.includes('finanza')||q.includes('ingreso')||q.includes('gasto')){
    return`📊 <b>Balance comunidad ${m}:</b><br>• Ingresos: <b style="color:var(--green)">${fmt(totalIn)}</b><br>• Egresos: <b style="color:var(--red)">${fmt(totalOut)}</b><br>• Saldo: <b style="color:${balance>=0?'var(--green)':'var(--red)'}">${fmt(balance)}</b><br>• ${paidUnits.size}/${occupied.length} unidades han pagado su GC.`;
  }
  if(q.includes('moroso')||q.includes('pendiente')||q.includes('no pag')){
    const morososIA=occupied.filter(u=>esUnidadMorosa(u.id));
    if(morososIA.length===0)return'✅ Todas las unidades están al día (sin deuda histórica).';
    const deudaTotal=morososIA.reduce((s,u)=>s+getTotalDeudaUnidad(u.id),0);
    return`⚠️ <b>${morososIA.length} unidad(es) con deuda</b> (incluyendo meses anteriores):<br>${morososIA.slice(0,5).map(u=>{
      const r=state.comunidadData.residentes.find(x=>x.unidad_id===u.id);
      const d=calcDeudaAcumulada(u.id);
      return`• Depto ${u.numero} — ${r?.nombre||'—'}: <b>${fmt(d.totalConMesActual)}</b> (${d.mesesSinPagar} mes(es))`;
    }).join('<br>')}${morososIA.length>5?`<br>...y ${morososIA.length-5} más`:''}.<br><b>Deuda total comunidad: ${fmt(deudaTotal)}</b>`;
  }
  if(q.includes('reserva')){
    const misRes=(reservas||[]).filter(r=>r.usuario_id===u?.id&&r.estado!=='cancelada');
    if(misRes.length===0)return'🗓️ No tienes reservas activas. Puedes hacer una desde el menú "Reservas".';
    return`🗓️ Tienes <b>${misRes.length} reserva(s)</b>:<br>${misRes.map(r=>`• ${r.espacio_id} — ${fmtD(r.fecha)} ${r.hora_inicio}–${r.hora_fin} (${r.estado})`).join('<br>')}`;
  }
  if(q.includes('alerta')||q.includes('aviso')){
    const activas=alertas.filter(a=>a.status==='activa');
    if(activas.length===0)return'🔔 No hay alertas activas en este momento.';
    return`🔔 <b>${activas.length} alerta(s) activa(s)</b>:<br>${activas.slice(0,3).map(a=>`• [${a.tipo}] ${a.titulo}`).join('<br>')}`;
  }
  if(q.includes('pago')||q.includes('historial')||q.includes('último')||q.includes('ultimo')){
    if(myPagos.length===0)return'📋 No tienes pagos registrados aún.';
    const last=myPagos[0];
    return`📋 Tu <b>último pago</b>:<br>• Mes: ${last.month}<br>• Monto: ${fmt(last.amount)}<br>• Método: ${last.method}<br>• Fecha: ${fmtD(last.date)}`;
  }
  if(q.includes('departamento')||q.includes('depto')||q.includes('unidad')){
    if(!unit)return'No tengo información de tu unidad asignada.';
    return`🏠 Tu unidad:<br>• Depto ${unit.numero} · Piso ${unit.piso}${unit.sqm?`<br>• Superficie: ${unit.sqm}m²`:''}<br>• GC mensual: ${gc?fmt(gc):'No definido'}`;
  }
  if(q.includes('hola')||q.includes('buenas')||q.includes('ayuda')){
    return`👋 ¡Hola <b>${u?.nombre||''}!</b> Soy el asistente de Vecinoo. Puedo responderte sobre:<br>• Tu GC y deudas<br>• Votaciones activas<br>• Balance de la comunidad<br>• Multas pendientes<br>• Reservas y pagos<br>• 🔧 <b>Mantenimientos y contratos</b><br><br>¿En qué te ayudo?`;
  }
  return`🤖 Puedo responder sobre <b>${com?.nombre||'tu comunidad'}</b>. Prueba:<br>• ¿Cuánto debo este mes?<br>• ¿Hay mantenimientos vencidos?<br>• ¿Cómo están los contratos?<br>• ¿Cuál es el balance?<br>• ¿Tengo multas pendientes?`;
}

const ESPACIOS_DEFAULT = [
  {id:'sala',icon:'🎉',nombre:'Sala de eventos',capacidad:50,duracion_max:8,dias:[0,1,2,3,4,5,6]},
  {id:'quincho',icon:'🔥',nombre:'Quincho / BBQ',capacidad:20,duracion_max:6,dias:[5,6]},
  {id:'gimnasio',icon:'💪',nombre:'Gimnasio',capacidad:10,duracion_max:2,dias:[0,1,2,3,4,5,6]},
  {id:'otro',icon:'🏢',nombre:'Otro espacio',capacidad:15,duracion_max:4,dias:[0,1,2,3,4,5,6]},
];

  return`

  </div>

  <!-- Espacios disponibles -->
  <div class="grid-2" style="margin-bottom:14px">
    ${espacios.map(e=>{
      const resHoy = reservas.filter(r=>r.espacio_id===e.id&&r.fecha===hoy&&r.estado!=='cancelada');
      const libre = resHoy.length===0;
      return`<div class="card" style="border-top:3px solid ${libre?'var(--green)':'var(--gold)'}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="font-size:20px">${e.icon}</div>

        <div style="font-size:11px;color:#6b7280">Cap. ${e.capacidad} personas · Máx. ${e.duracion_max}h</div>

          Reservar

    }).join('')}

  <div class="card">
    <div class="card-header">
      <span class="card-title">📋 ${full?'Todas las reservas':'Mis reservas'}</span>
    </div>
    ${(full?reservas:myRes).length===0
      ? '<div class="empty">Sin reservas registradas</div>'
      : `<table><thead><tr><th>Espacio</th><th>Fecha</th><th>Horario</th><th>Residente</th><th>Estado</th><th></th></tr></thead>
        <tbody>${(full?[...reservas].sort((a,b)=>a.fecha>b.fecha?1:-1):myRes).slice(0,20).map(r=>{
          const e = espacios.find(x=>x.id===r.espacio_id)||{icon:'🏢',nombre:r.espacio_id};
          const res = state.comunidadData.residentes.find(x=>x.id===r.usuario_id);
          const pasada = r.fecha < hoy;
          return`<tr>
            <td>${e.icon} ${e.nombre}</td>
            <td style="font-weight:600">${fmtD(r.fecha)}</td>
            <td>${r.hora_inicio} – ${r.hora_fin}</td>
            <td>${res?.nombre||'—'}</td>
            <td><span class="badge ${r.estado==='confirmada'?'badge-green':r.estado==='cancelada'?'badge-red':'badge-amber'}">${r.estado||'pendiente'}</span></td>
            <td>
              ${!pasada&&r.estado!=='cancelada'&&(r.usuario_id===u?.id||full)?`<button class="btn btn-sm btn-danger" onclick="cancelarReserva('${r.id}')">Cancelar</button>`:''}

window.guardarReserva = async () => {
  const espacio_id = document.getElementById('res_espacio')?.value;
  const fecha = document.getElementById('res_fecha')?.value;
  const hora_inicio = document.getElementById('res_inicio')?.value;
  const hora_fin = document.getElementById('res_fin')?.value;
  const personas = parseInt(document.getElementById('res_personas')?.value)||0;
  const descripcion = document.getElementById('res_desc')?.value||'';

  if(!espacio_id||!fecha||!hora_inicio||!hora_fin){showAlert('Completa todos los campos','error');return;}
  if(hora_fin<=hora_inicio){showAlert('La hora de fin debe ser posterior al inicio','error');return;}

  const esp = ESPACIOS_DEFAULT.find(e=>e.id===espacio_id);
  const hIni=parseInt(hora_inicio),hFin=parseInt(hora_fin);
  if(esp && (hFin-hIni)>esp.duracion_max){showAlert(`Máximo ${esp.duracion_max} horas para este espacio`,'error');return;}
  if(esp && personas>esp.capacidad){showAlert(`Capacidad máxima: ${esp.capacidad} personas`,'error');return;}

  // Verificar conflictos
  const reservas = state.comunidadData.reservas||[];
  const conflicto = reservas.find(r=>
    r.espacio_id===espacio_id && r.fecha===fecha && r.estado!=='cancelada' &&
    !(hora_fin<=r.hora_inicio||hora_inicio>=r.hora_fin)
  );
  if(conflicto){showAlert(`Horario ocupado (${conflicto.hora_inicio}–${conflicto.hora_fin}). Elige otro horario.`,'error');return;}

  const u = state.currentUser;
  const {data,error} = await sb.from('reservas').insert({
    comunidad_id: state.selectedComunidad.id,
    usuario_id: u?.id,
    unidad_id: u?.unidad_id,
    espacio_id, fecha, hora_inicio, hora_fin,
    personas, descripcion,
    estado: 'pendiente',
    created_at: new Date().toISOString()
  }).select();
  if(error){showAlert('Error al guardar reserva: '+error.message,'error');return;}

  const reservasNew = [...(state.comunidadData.reservas||[]),...data];
  setState({comunidadData:{...state.comunidadData,reservas:reservasNew},modal:null});
  showAlert('✅ Reserva solicitada. La administración la confirmará pronto.');
  notifLocal('Reserva solicitada',`${esp?.nombre||''} el ${fmtD(fecha)} ${hora_inicio}–${hora_fin}`,'🗓️');
};

window.confirmarReserva = async id => {
  await sb.from('reservas').update({estado:'confirmada'}).eq('id',id);
  const reservas = (state.comunidadData.reservas||[]).map(r=>r.id===id?{...r,estado:'confirmada'}:r);
  setState({comunidadData:{...state.comunidadData,reservas}});
  showAlert('✅ Reserva confirmada');
  // Email al residente
  const res = reservas.find(r=>r.id===id);
  if(res){
    const residente = state.comunidadData.residentes.find(x=>x.id===res.usuario_id);
    emailReservaConfirmada(res, residente, 'confirmada', state.selectedComunidad);
  }
};

window.cancelarReserva = async id => {
  await sb.from('reservas').update({estado:'cancelada'}).eq('id',id);
  const reservas = (state.comunidadData.reservas||[]).map(r=>r.id===id?{...r,estado:'cancelada'}:r);
  setState({comunidadData:{...state.comunidadData,reservas}});
  showAlert('Reserva cancelada');
  // Email al residente
  const res = reservas.find(r=>r.id===id);
  if(res){
    const residente = state.comunidadData.residentes.find(x=>x.id===res.usuario_id);
    emailReservaConfirmada(res, residente, 'cancelada', state.selectedComunidad);
  }
};

window.actualizarDisponibilidad = () => {
  const espId = document.getElementById('res_espacio')?.value;
  const fecha = document.getElementById('res_fecha')?.value;
  if(!espId||!fecha)return;
  const reservas = (state.comunidadData.reservas||[]).filter(r=>r.espacio_id===espId&&r.fecha===fecha&&r.estado!=='cancelada');
  const el = document.getElementById('dispInfo');
  if(!el)return;
  if(reservas.length===0){
    el.innerHTML='<span style="color:var(--green)">✓ Sin reservas para este día</span>';
  } else {
    el.innerHTML=`<span style="color:#d97706">⚠ Horarios ocupados: ${reservas.map(r=>`${r.hora_inicio}–${r.hora_fin}`).join(', ')}</span>`;
  }
};

window.descargarBoucher = pagoId => {
  const p = state.comunidadData.pagos.find(x=>x.id===pagoId);
  if(!p) return;
  const r = state.comunidadData.residentes.find(x=>x.id===p.usuario_id);
  const u = state.comunidadData.unidades.find(x=>x.id===p.unidad_id);
  const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">

    <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;padding:30px;background:#fff}@media print{body{padding:10px}button{display:none!important}}</style>

  const win = window.open('','_blank','width=520,height=700');

  win.document.open(); win.document.write(html); win.document.close();
  showAlert('✅ Abre el diálogo → Guardar como PDF','success');
};

// Disparar notificaciones al cargar la app
// ════════════════════════════════════════════════════════════════
//  TIEMPO REAL — Supabase Realtime Channels
// ════════════════════════════════════════════════════════════════
let _realtimeChannels=[];

function initRealtime(){
  const comId=state.selectedComunidad?.id;
  if(!comId||_realtimeChannels.length>0)return;

  const chAlerts=sb.channel(`alertas-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'alertas',filter:`comunidad_id=eq.${comId}`},p=>{
      const alertas=[p.new,...state.comunidadData.alertas];
      setState({comunidadData:{...state.comunidadData,alertas}});
      notifLocal('🔔 Nueva alerta',p.new.titulo,'🔔');
      if(state.view!=='community')mostrarBadgeNav('community');
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'alertas',filter:`comunidad_id=eq.${comId}`},p=>{
      const alertas=state.comunidadData.alertas.map(a=>a.id===p.new.id?p.new:a);
      setState({comunidadData:{...state.comunidadData,alertas}});
    }).subscribe();

  const chVots=sb.channel(`votaciones-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'votaciones',filter:`comunidad_id=eq.${comId}`},p=>{
      const votaciones=[p.new,...state.comunidadData.votaciones];
      setState({comunidadData:{...state.comunidadData,votaciones}});
      notifLocal('🗳️ Nueva votación',p.new.titulo,'🗳️');
      if(state.view!=='votaciones')mostrarBadgeNav('votaciones');
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'votaciones',filter:`comunidad_id=eq.${comId}`},p=>{
      const votaciones=state.comunidadData.votaciones.map(v=>v.id===p.new.id?p.new:v);
      setState({comunidadData:{...state.comunidadData,votaciones}});
    }).subscribe();

  const chVotos=sb.channel(`votos-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'votos'},p=>{
      const esDeEstaCom=state.comunidadData.votaciones.some(v=>v.id===p.new.votacion_id);
      if(!esDeEstaCom)return;
      const yaExiste=state.comunidadData.votos.some(v=>v.id===p.new.id);
      if(yaExiste)return;
      setState({comunidadData:{...state.comunidadData,votos:[...state.comunidadData.votos,p.new]}});
    }).subscribe();

  const chRes=sb.channel(`reservas-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'reservas',filter:`comunidad_id=eq.${comId}`},p=>{
      const reservas=[p.new,...(state.comunidadData.reservas||[])];
      setState({comunidadData:{...state.comunidadData,reservas}});
      if(isFullAccess()){notifLocal('🗓️ Nueva reserva solicitada',`${p.new.espacio_id} — ${p.new.fecha}`,'🗓️');mostrarBadgeNav('reservas');}
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'reservas',filter:`comunidad_id=eq.${comId}`},p=>{
      const reservas=(state.comunidadData.reservas||[]).map(r=>r.id===p.new.id?p.new:r);
      setState({comunidadData:{...state.comunidadData,reservas}});
    }).subscribe();

  const chPagos=sb.channel(`pagos-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'pagos',filter:`comunidad_id=eq.${comId}`},p=>{
      if(state.comunidadData.pagos.some(x=>x.id===p.new.id))return;
      setState({comunidadData:{...state.comunidadData,pagos:[p.new,...state.comunidadData.pagos]}});
      if(isFullAccess()){const res=state.comunidadData.residentes.find(r=>r.id===p.new.usuario_id);notifLocal('💰 Pago recibido',`${res?.nombre||'Residente'} — ${fmt(p.new.amount)}`,'💰');}
    }).subscribe();

  const chDocs=sb.channel(`documentos-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'documentos',filter:`comunidad_id=eq.${comId}`},p=>{
      if(state.comunidadData.documentos.some(d=>d.id===p.new.id))return;
      setState({comunidadData:{...state.comunidadData,documentos:[p.new,...state.comunidadData.documentos]}});
      if(p.new.carpeta==='actas'){notifLocal('📄 Nueva acta disponible',p.new.titulo,'📄');mostrarBadgeNav('documents');}
    }).subscribe();

  const chMants=sb.channel(`mantenimientos-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'mantenimientos',filter:`comunidad_id=eq.${comId}`},p=>{
      if((state.comunidadData.mantenimientos||[]).some(m=>m.id===p.new.id))return;
      const mantenimientos=[...(state.comunidadData.mantenimientos||[]),p.new];
      setState({comunidadData:{...state.comunidadData,mantenimientos}});
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'mantenimientos',filter:`comunidad_id=eq.${comId}`},p=>{
      const mantenimientos=(state.comunidadData.mantenimientos||[]).map(m=>m.id===p.new.id?p.new:m);
      setState({comunidadData:{...state.comunidadData,mantenimientos}});
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'mantenimientos'},p=>{
      const mantenimientos=(state.comunidadData.mantenimientos||[]).filter(m=>m.id!==p.old.id);
      setState({comunidadData:{...state.comunidadData,mantenimientos}});
    }).subscribe();

  _realtimeChannels=[chAlerts,chVots,chVotos,chRes,chPagos,chDocs,chMants];
  console.log('✅ Realtime activo — comunidad',comId);
}

function stopRealtime(){
  _realtimeChannels.forEach(ch=>{try{sb.removeChannel(ch);}catch(e){}});
  _realtimeChannels=[];
}

function diasHasta(fecha){
  if(!fecha)return 999;
  return Math.ceil((new Date(fecha)-new Date())/(1000*60*60*24));
}

window.editarMantenimiento = id => {

window.completarMantenimiento = async id => {
  const m = state.comunidadData.mantenimientos.find(x=>x.id===id);
  if(!m)return;
  // Calcular siguiente fecha según periodicidad
  const sig = _siguienteFecha(m.fecha_proximo||today(), m.periodicidad);
  const updates={
    estado: sig ? 'activo' : 'completado',
    fecha_ultimo: m.fecha_proximo||today(),
    fecha_completado: today(),
    fecha_proximo: sig||null,
  };
  await sb.from('mantenimientos').update(updates).eq('id',id);
  const mantenimientos=(state.comunidadData.mantenimientos||[]).map(x=>x.id===id?{...x,...updates}:x);
  auditLog('MANT_COMPLETADO',`${m.nombre} realizado. ${sig?'Próximo: '+fmtD(sig):'Sin recurrencia'}`,{referencia_id:id,tabla:'mantenimientos'});
  setState({comunidadData:{...state.comunidadData,mantenimientos}});
  showAlert(sig?`✅ Realizado. Próximo: ${fmtD(sig)}`:'✅ Mantenimiento completado');
};

window.eliminarMantenimiento = id => setState({modal:{type:'confirm',message:'¿Eliminar este mantenimiento?',onConfirm:`doEliminarMantenimiento('${id}')`}});
window.doEliminarMantenimiento = async id => {
  await sb.from('mantenimientos').delete().eq('id',id);
  const mantenimientos=(state.comunidadData.mantenimientos||[]).filter(m=>m.id!==id);
  setState({comunidadData:{...state.comunidadData,mantenimientos},modal:null});
  showAlert('Eliminado');
};

function _siguienteFecha(fecha, periodicidad){
  if(!periodicidad||periodicidad==='unico')return null;
  const d=new Date(fecha);
  const map={mensual:1,bimestral:2,trimestral:3,semestral:6,anual:12};
  const meses=map[periodicidad]||0;
  if(!meses)return null;
  d.setMonth(d.getMonth()+meses);
  return d.toISOString().split('T')[0];
}

async function _alertarMantenimiento(m){
  if(!m?.fecha_proximo)return;
  const dias=diasHasta(m.fecha_proximo);
  if(dias<=30){
    const titulo=`Mantenimiento próximo: ${m.nombre}`;
    const desc=`${m.nombre} (${m.proveedor||'sin proveedor'}) está programado para el ${fmtD(m.fecha_proximo)} — en ${dias} día(s).`;
    await sb.from('alertas').insert({
      comunidad_id:state.selectedComunidad?.id,
      tipo:'mantencion',titulo,descripcion:desc,
      date:today(),time:new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}),
      status:'activa',
    }).catch(()=>{});
  }
}

// Generar alertas automáticas para todos los contratos urgentes
window.generarAlertasAutomaticas = async () => {
  const mants = state.comunidadData.mantenimientos||[];
  const hoy = today();
  const urgentes = mants.filter(m=>{
    const diasM = m.fecha_proximo?diasHasta(m.fecha_proximo):null;
    const diasV = m.fecha_vencimiento_contrato?diasHasta(m.fecha_vencimiento_contrato):null;
    return (diasM!==null&&diasM<=30)||(diasV!==null&&diasV<=60);
  });
  if(!urgentes.length){showAlert('No hay contratos urgentes. Todo está al día ✅','success');return;}

  let creadas=0;
  for(const m of urgentes){
    const diasM=m.fecha_proximo?diasHasta(m.fecha_proximo):null;
    const diasV=m.fecha_vencimiento_contrato?diasHasta(m.fecha_vencimiento_contrato):null;
    let titulo='',desc='';
    if(diasM!==null&&diasM<=0){
      titulo=`🚨 Mantenimiento vencido: ${m.nombre}`;
      desc=`El mantenimiento de ${m.nombre} venció hace ${Math.abs(diasM)} día(s). Proveedor: ${m.proveedor||'no especificado'}.`;
    } else if(diasM!==null&&diasM<=30){
      titulo=`⚠️ Mantenimiento próximo: ${m.nombre}`;
      desc=`${m.nombre} está programado en ${diasM} día(s) (${fmtD(m.fecha_proximo)}). Proveedor: ${m.proveedor||'no especificado'}.`;
    } else if(diasV!==null&&diasV<=0){
      titulo=`🚨 Contrato vencido: ${m.nombre}`;
      desc=`El contrato de ${m.nombre} venció hace ${Math.abs(diasV)} día(s). Renovar urgente.`;
    } else if(diasV!==null&&diasV<=60){
      titulo=`📋 Contrato por vencer: ${m.nombre}`;
      desc=`El contrato de ${m.nombre} vence en ${diasV} día(s) (${fmtD(m.fecha_vencimiento_contrato)}). Considerar renovación.`;
    }
    if(!titulo)continue;
    const{error}=await sb.from('alertas').insert({
      comunidad_id:state.selectedComunidad?.id,
      tipo:'mantencion',titulo,descripcion:desc,
      date:hoy,time:new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}),
      status:'activa',
    });
    if(!error)creadas++;
  }
  showAlert(`🔔 ${creadas} alerta(s) de mantenimiento creadas en Alertas comunitarias`,'success');
  setState({modal:null});
};

window.generarAlertaDesdeIA = async (mantId) => {

  const cat = MANT_CATS.find(c=>c.id===m.categoria)||{icon:'🔧',label:m.categoria};

  const tipo = diasVenc!==null&&diasVenc<=60?'Renovación de contrato':'Mantenimiento programado';
  const titulo = `${tipo}: ${m.nombre}`;
  const desc = [
    m.proveedor?`Proveedor: ${m.proveedor}.`:'',
    diasMant!==null?`Próximo mantenimiento en ${diasMant} días (${fmtD(m.fecha_proximo)}).`:'',

    m.monto?`Monto actual: ${fmt(m.monto)} ${m.periodicidad||''}.`:'',
  ].filter(Boolean).join(' ');

  const{error}=await sb.from('alertas').insert({
    comunidad_id:state.selectedComunidad?.id,
    tipo:'mantencion', titulo, descripcion:desc,
    date:today(), time:new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}),
    status:'activa',
  });
  if(error){showAlert('Error al crear alerta: '+error.message,'error');return;}

};

// Análisis local de contrato (fallback cuando Edge Function no está disponible)
function generarAnalisisLocalContrato(mant){
  if(!mant) return 'No se encontró información del contrato.';
  const cat = MANT_CATS?.find(c=>c.id===mant.categoria)||{label:mant.categoria||'General'};
  const mercado={ascensor:{min:80000,max:250000},piscina:{min:60000,max:180000},gas:{min:50000,max:150000},electrico:{min:40000,max:120000},agua:{min:35000,max:100000},jardineria:{min:30000,max:120000},limpieza:{min:180000,max:600000},incendios:{min:25000,max:80000}};
  const ref=mercado[mant.categoria]||{min:30000,max:200000};
  const dias=mant.fecha_proximo?diasHasta(mant.fecha_proximo):null;
  const diasVenc=mant.fecha_vencimiento_contrato?diasHasta(mant.fecha_vencimiento_contrato):null;
  let html=`<b>📋 Análisis del contrato: ${mant.nombre}</b><br><br>`;
  if(mant.monto){
    if(mant.monto<ref.min) html+=`💰 <b>Precio bajo mercado:</b> ${fmt(mant.monto)} está por debajo del rango habitual (${fmt(ref.min)}–${fmt(ref.max)}). Verifica que el servicio sea completo.<br><br>`;
    else if(mant.monto>ref.max) html+=`🔴 <b>Precio sobre mercado:</b> ${fmt(mant.monto)} supera el rango habitual (${fmt(ref.min)}–${fmt(ref.max)}). Se recomienda cotizar con otros proveedores.<br><br>`;
    else html+=`✅ <b>Precio dentro del mercado:</b> ${fmt(mant.monto)} está en el rango habitual para ${cat.label} (${fmt(ref.min)}–${fmt(ref.max)}).<br><br>`;
  } else {
    html+=`ℹ️ No se registró monto para este contrato. Agrega el valor para comparar con el mercado.<br><br>`;
  }
  if(dias!==null&&dias<0) html+=`🚨 <b>Vencido hace ${Math.abs(dias)} días.</b> Requiere atención inmediata.<br>`;
  else if(dias!==null&&dias<=30) html+=`⚠️ <b>Próximo mantenimiento en ${dias} días</b> (${fmtD(mant.fecha_proximo)}). Coordina con el proveedor.<br>`;
  if(diasVenc!==null&&diasVenc<=60) html+=`📋 <b>Contrato vence en ${diasVenc} días.</b> Considera renovar o cotizar.<br>`;
  if(!mant.proveedor) html+=`📝 Falta registrar el proveedor.<br>`;
  return html;
}

// ── Paginación helper ──
const PAG_SIZE=50;
function paginate(arr,page){
  const p=page||0;
  const total=arr.length;
  const pages=Math.ceil(total/PAG_SIZE);
  const slice=arr.slice(p*PAG_SIZE,(p+1)*PAG_SIZE);
  const nav=(p>0||pages>1)?`
  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:12px;color:#6b7280">
    <span>Mostrando ${p*PAG_SIZE+1}–${Math.min((p+1)*PAG_SIZE,total)} de ${total}</span>
    <div style="display:flex;gap:6px">
      ${p>0?`<button class="btn btn-sm" onclick="setState({_pagOffset:${p-1}})">← Anterior</button>`:''}
      <span style="padding:4px 10px;background:#f3f4f6;border-radius:6px;font-weight:600">Pág ${p+1}/${pages}</span>
      ${p<pages-1?`<button class="btn btn-sm" onclick="setState({_pagOffset:${p+1}})">Siguiente →</button>`:''}
    </div>
  </div>`:'';
  return{slice,total,pages,nav};
}

// ── Genera texto de diff legible entre dos objetos ──
function changeDiff(oldObj, newObj, fields){
  const changes=[];
  fields.forEach(({key,label,fmt:fmtFn})=>{
    const ov=oldObj?.[key]; const nv=newObj?.[key];
    if(ov!==nv&&(ov||nv)){
      const f=fmtFn||String;
      changes.push(`${label}: ${f(ov??'—')} → ${f(nv??'—')}`);
    }
  });
  return changes.join(' · ')||'Sin cambios';
}

async function auditLog(action, detalle='', extra={}){
  const user = state.currentUser;
  const com  = state.selectedComunidad;
  if(!user || !com) return;

  // Determinar etiqueta de rol (admin externo = sin unidad_id)
  const esAdminExterno = user.rol==='admin' && !user.unidad_id;
  const rolLabel = esAdminExterno ? 'Administrador Externo' : user.rol;

  const entry = {
    comunidad_id:   com.id,
    usuario_id:     user.id,
    usuario_nombre: user.nombre,
    usuario_rol:    rolLabel,
    accion:         action,
    detalle:        detalle,
    ip_aprox:       null,
    created_at:     new Date().toISOString(),
    ...extra,
  };

  // En demo: actualizar estado local solamente (sin Supabase)
  if(state.isDemo){
    const auditLogs = [entry, ...(state.comunidadData?.auditLogs||[])].slice(0,500);
    state.comunidadData = {...state.comunidadData, auditLogs};
    render();
    return;
  }

  // Insertar en Supabase (silencioso — no interrumpe la operación principal)
  try {
    const {data} = await sb.from('audit_logs').insert(entry).select();
    if(data?.[0]){
      // Actualizar estado local para mostrar en tiempo real
      const auditLogs = [data[0], ...(state.comunidadData.auditLogs||[])].slice(0,200);
      state.comunidadData = {...state.comunidadData, auditLogs};
    }
  } catch(e){
    console.warn('[audit] Error al registrar:', e.message);
  }
}

// ── Exportar auditoría a CSV ──
window.exportarAuditoria = () => {
  const logs = state.comunidadData.auditLogs||[];
  if(!logs.length){showAlert('Sin datos para exportar','error');return;}

  const header = ['Fecha','Hora','Acción','Descripción','Usuario','Rol'];
  const rows = logs.map(l=>{
    const dt = l.created_at?new Date(l.created_at):null;
    const act = AUDIT_ACTIONS[l.accion]||{label:l.accion||''};
    return [
      dt?dt.toLocaleDateString('es-CL'):'',
      dt?dt.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'',
      act.label,
      (l.detalle||'').replace(/,/g,';'),
      l.usuario_nombre||'',
      l.usuario_rol||'',
    ];
  });

  const csv = [header,...rows].map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `auditoria_${state.selectedComunidad?.nombre||'vecinoo'}_${today()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showAlert('✅ CSV exportado');
};
