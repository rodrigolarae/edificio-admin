// Cálculos remuneraciones Chile
function calcLiquidacion(w){
  const bruto=parseInt(w.grossSalary)||0;
  const afpPct=w.afpType==='Uno'?0.0058:0.1027;
  const afp=Math.round(bruto*afpPct);
  const sis=Math.round(bruto*0.0154);// empleador
  const segCes=Math.round(bruto*0.006);// trabajador
  const salud=w.healthType==='Fonasa'?Math.round(bruto*0.07):parseInt(w.healthAmount)||0;
  const baseImp=bruto-afp-salud;
  const imp=calcImpuesto(baseImp);
  const descuentos=afp+salud+segCes+imp;
  const liquido=bruto-descuentos;
  const gratif=Math.round(bruto*0.25);
  return{bruto,afp,sis,segCes,salud,baseImp,imp,descuentos,liquido,gratif,afpPct};
}

function calcImpuesto(base){
  const utm=65443;
  const enUtm=base/utm;
  if(enUtm<=13.5)return 0;
  if(enUtm<=30)return Math.round(base*0.04-0.192*utm);
  if(enUtm<=50)return Math.round(base*0.08-1.392*utm);
  if(enUtm<=70)return Math.round(base*0.135-4.142*utm);
  if(enUtm<=90)return Math.round(base*0.23-10.792*utm);
  if(enUtm<=120)return Math.round(base*0.304-17.448*utm);
  if(enUtm<=150)return Math.round(base*0.355-23.562*utm);
  return Math.round(base*0.4-30.312*utm);
}

function calcFiniquito(w,type,lastDay){
  const liq=calcLiquidacion(w);
  const start=new Date(w.startDate);
  const end=new Date(lastDay);
  const years=(end-start)/(1000*60*60*24*365);
  const yearsFloor=Math.floor(years);
  const monthsFrac=Math.round((years-yearsFloor)*12);
  const indemnizacion=type==='despido'?Math.round(liq.bruto*Math.min(yearsFloor+(monthsFrac>=6?1:0),11)):0;
  const diasProp=Math.round((end.getDate()/30)*liq.liquido);
  const vacProp=Math.round(years*15/12*(liq.bruto/30));
  return{indemnizacion,diasProp,vacProp,total:indemnizacion+diasProp+vacProp,years:yearsFloor,months:monthsFrac};
}

function showAlert(msg,type='success'){

function getTotalSqm(u){return(u.sqm||0)+(u.parking?u.parkingSqm||0:0)+(u.storage?u.storageSqm||0:0);}
function calcProrate(expense,units){
  const total=units.reduce((s,u)=>s+getTotalSqm(u),0);
  return units.map(u=>({unitId:u.id,sqm:getTotalSqm(u),pct:total>0?getTotalSqm(u)/total:0,amount:total>0?Math.round(expense.amount*getTotalSqm(u)/total):0}));
}
function getPendingFines(unitId,month){
  return state.fines.filter(f=>f.unitId===unitId&&f.status==='pendiente'&&f.month===month);
}
function getTotalDue(unitId,month){
  const unit=state.units.find(u=>u.id===unitId);
  const base=unit?.monthlyFee||85000;
  const finesAmt=getPendingFines(unitId,month).reduce((s,f)=>s+f.amount,0);
  return base+finesAmt;
}

  ];
  const nav=isAdmin?navAdmin:navResident;
  return`<div class="app">
  <aside class="sidebar">
    <div class="logo"><h1>🏢 ${state.buildingName}</h1><p>${units.length} unidades · Sistema de Gestión</p></div>
    <div class="mode-switch">

      <div class="nav-section">${isAdmin?'Administración':'Mi Portal'}</div>

    ${buildView()}
    ${state.modal?buildModal():''}
  </main>
</div>`;
}

function buildView(){
  const v=state.view;
  if(v==='dashboard')return buildDashboard();
  if(v==='units')return buildUnits();
  if(v==='residents')return buildResidents();
  if(v==='payments')return buildPayments();
  if(v==='expenses')return buildExpenses();
  if(v==='fines')return buildFines();
  if(v==='workers')return buildWorkers();
  if(v==='bank')return buildBank();
  if(v==='reports')return buildReports();
  if(v==='community')return buildCommunity();
  if(v==='documents')return buildDocuments();
  if(v==='settings')return buildSettings();
  if(v==='my_account')return buildMyAccount();
  if(v==='my_payments')return buildMyPayments();
  return'';

function getMetrics(month){
  const mp=state.payments.filter(p=>p.month===month);
  const me=state.expenses.filter(e=>e.month===month);
  const mf=state.fines.filter(f=>f.month===month);
  const totalIn=mp.reduce((s,p)=>s+p.amount,0);
  const totalOut=me.reduce((s,e)=>s+e.amount,0);
  const totalFines=mf.reduce((s,f)=>s+f.amount,0);
  const paidUnits=new Set(mp.map(p=>p.unitId));
  const occupied=state.units.filter(u=>state.residents.some(r=>r.unitId===u.id));
  const morose=occupied.filter(u=>!paidUnits.has(u.id));
  return{totalIn,totalOut,balance:totalIn-totalOut,paidUnits,occupied,morose,mp,me,mf,totalFines};
}

function buildBank(){
  const{payments,expenses,units,residents}=state;
  const allMovs=[...payments.map(p=>({...p,_t:'crédito',_desc:`GC Depto ${units.find(u=>u.id===p.unitId)?.number||''} · ${residents.find(r=>r.id===p.residentId)?.name||''}`})),...expenses.map(e=>({...e,_t:'débito',_desc:`${e.icon} ${e.label} · ${e.description||''}`}))].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const totalIn=payments.reduce((s,p)=>s+p.amount,0);
  const totalOut=expenses.reduce((s,e)=>s+e.amount,0);
  let saldo=totalIn-totalOut;
  const movs=allMovs.map(m=>{const s=saldo;saldo+=m._t==='débito'?m.amount:-m.amount;return{...m,saldo:s}});
  return`

  <div class="metrics" style="grid-template-columns:repeat(3,1fr)">
    <div class="metric"><div class="metric-label">Total créditos</div><div class="metric-value green">${fmt(totalIn)}</div></div>
    <div class="metric"><div class="metric-label">Total débitos</div><div class="metric-value red">${fmt(totalOut)}</div></div>
    <div class="metric"><div class="metric-label">Saldo disponible</div><div class="metric-value ${totalIn-totalOut>=0?'green':'red'}">${fmt(totalIn-totalOut)}</div></div>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">Cartola</span><span style="font-size:11px;color:#6b7280">Integración bancaria real disponible con Fintoc API</span></div>
    <table><thead><tr><th>Fecha</th><th>Descripción</th><th>Tipo</th><th>Monto</th><th>Saldo</th></tr></thead>
    <tbody>${movs.map(m=>`<tr>
      <td>${fmtD(m.date)}</td><td>${m._desc}</td>
      <td><span class="badge ${m._t==='crédito'?'badge-green':'badge-red'}">${m._t}</span></td>
      <td style="font-weight:700;color:${m._t==='crédito'?'#059669':'#dc2626'}">${m._t==='crédito'?'+':'-'}${fmt(m.amount)}</td>
      <td style="font-weight:600">${fmt(m.saldo)}</td>

  </div>`;
}

function attachEvents(){
  document.getElementById('modeSelect')?.addEventListener('change',function(){
    const v=this.value;
    if(v==='admin'){setState({mode:'admin',view:'dashboard'});}
    else{const rid=v.replace('res_','');setState({mode:v,view:'my_account',currentResident:state.residents.find(r=>r.id===rid)||state.residents[0]});}
  });
  document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>setState({view:btn.dataset.view})));
  document.getElementById('btnAddUnit')?.addEventListener('click',()=>toggleForm('unitForm'));
  document.getElementById('btnCancelUnit')?.addEventListener('click',()=>toggleForm('unitForm',false));
  document.getElementById('btnSaveUnit')?.addEventListener('click',()=>{
    const number=document.getElementById('uNumber').value.trim();
    const floor=document.getElementById('uFloor').value;
    const sqm=document.getElementById('uSqm').value;
    if(!number||!floor||!sqm){showAlert('Completa los campos obligatorios','error');return;}
    const parking=document.getElementById('uParking').checked;
    const storage=document.getElementById('uStorage').checked;
    const units=[...state.units,{id:'u'+uid(),number,floor:parseInt(floor),sqm:parseInt(sqm),monthlyFee:parseInt(document.getElementById('uFee').value)||85000,parking,parkingNum:parking?document.getElementById('uParkingNum').value:'',parkingSqm:parking?parseInt(document.getElementById('uParkingSqm').value||0):0,storage,storageNum:storage?document.getElementById('uStorageNum').value:'',storageSqm:storage?parseInt(document.getElementById('uStorageSqm').value||0):0}];
    save('ea_units',units);setState({units});showAlert('Unidad agregada');
  });
  document.getElementById('btnAddResident')?.addEventListener('click',()=>toggleForm('residentForm'));
  document.getElementById('btnCancelResident')?.addEventListener('click',()=>toggleForm('residentForm',false));
  document.getElementById('btnSaveResident')?.addEventListener('click',()=>{
    const name=document.getElementById('rName').value.trim();
    const email=document.getElementById('rEmail').value.trim();
    const unitId=document.getElementById('rUnit').value;
    if(!name||!email||!unitId){showAlert('Completa campos obligatorios','error');return;}
    const residents=[...state.residents,{id:'r'+uid(),name,email,rut:document.getElementById('rRut').value,phone:document.getElementById('rPhone').value,unitId}];
    save('ea_residents',residents);setState({residents});showAlert('Residente registrado');
  });
  document.getElementById('btnAddPayment')?.addEventListener('click',()=>toggleForm('paymentForm'));
  document.getElementById('btnCancelPayment')?.addEventListener('click',()=>toggleForm('paymentForm',false));
  document.getElementById('btnSavePayment')?.addEventListener('click',()=>{
    const residentId=document.getElementById('pResident').value;
    const amount=document.getElementById('pAmount').value;
    const date=document.getElementById('pDate').value;
    const method=document.getElementById('pMethod').value;
    if(!residentId||!amount||!date){showAlert('Completa campos obligatorios','error');return;}
    const r=state.residents.find(x=>x.id===residentId);
    const curM=date.substr(0,7);
    const pendFines=getPendingFines(r?.unitId||'',curM);
    const finesAmt=pendFines.reduce((s,f)=>s+f.amount,0);
    const base=parseInt(amount)-finesAmt;
    const p={id:uid(),receiptId:uid(),residentId,unitId:r?.unitId,amount:parseInt(amount),baseAmount:base,date,method,month:curM,fines:pendFines};
    // marcar multas como pagadas
    const fines=state.fines.map(f=>pendFines.find(x=>x.id===f.id)?{...f,status:'pagada'}:f);
    const payments=[p,...state.payments];
    save('ea_payments',payments);save('ea_fines',fines);
    setState({payments,fines,modal:{type:'receipt',payment:p,resident:r,unit:state.units.find(u=>u.id===r?.unitId)}});
  });
  document.getElementById('btnAddFine')?.addEventListener('click',()=>toggleForm('fineForm'));
  document.getElementById('btnCancelFine')?.addEventListener('click',()=>toggleForm('fineForm',false));
  document.getElementById('btnSaveFine')?.addEventListener('click',()=>{
    const sel=document.getElementById('fResident').value;
    const amount=document.getElementById('fAmount').value;
    const reason=document.getElementById('fReason').value.trim();
    const date=document.getElementById('fDate').value;
    const month=document.getElementById('fMonth').value;
    if(!sel||!amount||!reason){showAlert('Completa campos obligatorios','error');return;}
    const[residentId,unitId]=sel.split('|');
    const fines=[...state.fines,{id:uid(),residentId,unitId,amount:parseInt(amount),reason,date,month,status:'pendiente'}];
    save('ea_fines',fines);setState({fines});showAlert('Multa aplicada y sumada al GC del residente');
  });
  document.getElementById('btnAddWorker')?.addEventListener('click',()=>toggleForm('workerForm'));
  document.getElementById('btnCancelWorker')?.addEventListener('click',()=>toggleForm('workerForm',false));
  document.getElementById('btnSaveWorker')?.addEventListener('click',()=>{
    const name=document.getElementById('wName').value.trim();
    const rut=document.getElementById('wRut').value.trim();
    const role=document.getElementById('wRole').value.trim();
    const type=document.getElementById('wType').value;
    const grossSalary=document.getElementById('wSalary').value;
    const startDate=document.getElementById('wStart').value;
    if(!name||!rut||!role||!grossSalary){showAlert('Completa campos obligatorios','error');return;}
    const afpType=type==='contrato'?document.getElementById('wAfp').value:'';
    const healthType=type==='contrato'?document.getElementById('wHealth').value:'';
    const isapre=healthType==='Isapre'?document.getElementById('wIsapre').value:'';
    const healthAmount=healthType==='Isapre'?parseInt(document.getElementById('wIsapreAmt').value||0):0;
    const workers=[...state.workers,{id:'w'+uid(),name,rut,role,type,grossSalary:parseInt(grossSalary),startDate,afpType,healthType,isapre,healthAmount,active:true}];
    save('ea_workers',workers);setState({workers});showAlert('Trabajador agregado');
  });
  document.getElementById('btnAddAlert')?.addEventListener('click',()=>toggleForm('alertForm'));
  document.getElementById('btnCancelAlert')?.addEventListener('click',()=>toggleForm('alertForm',false));
  document.getElementById('btnSaveAlert')?.addEventListener('click',()=>{
    const title=document.getElementById('aTitle').value.trim();
    const type=document.getElementById('aType').value;
    const desc=document.getElementById('aDesc')?.value||'';
    if(!title){showAlert('Ingresa un título','error');return;}
    const isAdmin=state.mode==='admin';
    const residentSel=isAdmin?document.getElementById('aResident')?.value:'';
    const residentId=isAdmin&&residentSel!=='admin'?residentSel:state.currentResident?.id||null;
    const unitId=residentId?state.residents.find(r=>r.id===residentId)?.unitId:null;
    const alerts=[{id:uid(),type,title,description:desc,residentId,unitId,date:today(),time:new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}),status:'activa'},...state.alerts];
    save('ea_alerts',alerts);setState({alerts});showAlert('Alerta enviada a la comunidad');
  });
  document.getElementById('reportMonth')?.addEventListener('change',function(){setState({reportMonth:this.value});});
  document.getElementById('btnSaveName')?.addEventListener('click',()=>{
    const n=document.getElementById('bName').value.trim();
    if(n){save('ea_bname',n);setState({buildingName:n});showAlert('Nombre actualizado');}
  });
  document.getElementById('btnSaveExpense')?.addEventListener('click',()=>{
    const amount=document.getElementById('eAmount')?.value;
    const date=document.getElementById('eDate')?.value;
    if(!amount||!date){showAlert('Completa campos obligatorios','error');return;}
    const cat=EXPENSE_CATS.find(c=>c.id===state.selectedCat);
    const e={id:uid(),catId:cat.id,label:cat.label,icon:cat.icon,prorate:cat.prorate,amount:parseInt(amount),date,description:document.getElementById('eDesc')?.value||'',month:date.substr(0,7)};
    const expenses=[e,...state.expenses];
    save('ea_expenses',expenses);setState({expenses,selectedCat:null});showAlert('Gasto registrado');
  });
  document.getElementById('modalOverlay')?.addEventListener('click',function(e){if(e.target===this)setState({modal:null});});
}

function toggleForm(id,show=null){
  const f=document.getElementById(id);
  if(!f)return;
  f.style.display=show===null?(f.style.display==='none'?'block':'none'):show?'block':'none';
}

window.onResidentChange=function(sel){
  const r=state.residents.find(x=>x.id===sel.value);
  const u=r?state.units.find(d=>d.id===r.unitId):null;
  const unitInp=document.getElementById('pUnit');
  const baseInp=document.getElementById('pBase');
  const finesInp=document.getElementById('pFinesAmt');
  const amtInp=document.getElementById('pAmount');
  const finesInfo=document.getElementById('pFinesInfo');
  if(unitInp)unitInp.value=u?`Depto ${u.number} · Piso ${u.floor}`:'—';
  const curM=today().substr(0,7);
  const pendFines=r?getPendingFines(r.unitId,curM):[];
  const finesAmt=pendFines.reduce((s,f)=>s+f.amount,0);
  const base=u?.monthlyFee||85000;
  if(baseInp)baseInp.value=base;
  if(finesInp)finesInp.value=finesAmt;
  if(amtInp)amtInp.value=base+finesAmt;
  if(finesInfo){
    if(pendFines.length>0){finesInfo.style.display='block';finesInfo.innerHTML=`⚠ Multas pendientes: ${pendFines.map(f=>f.reason).join(' | ')} — Total: ${fmt(finesAmt)}`;}
    else{finesInfo.style.display='none';}
  }
};

window.viewReceipt=id=>{
  const p=state.payments.find(x=>x.id===id);
  if(!p)return;
  setState({modal:{type:'receipt',payment:p,resident:state.residents.find(r=>r.id===p.residentId),unit:state.units.find(u=>u.id===p.unitId)}});
};
window.viewLiquidacion=id=>setState({modal:{type:'liquidacion',worker:state.workers.find(w=>w.id===id)}});
window.viewBoleta=id=>setState({modal:{type:'boleta',worker:state.workers.find(w=>w.id===id)}});
window.openFiniquito=id=>setState({modal:{type:'finiquito',worker:state.workers.find(w=>w.id===id),finType:'renuncia',lastDay:today()}});
window.updateFiniquito=id=>{
  const type=document.getElementById('finType')?.value;
  const lastDay=document.getElementById('finLastDay')?.value;
  setState({modal:{type:'finiquito',worker:state.workers.find(w=>w.id===id),finType:type,lastDay}});
};
window.confirmarFiniquito=id=>{
  const type=document.getElementById('finType')?.value||'renuncia';
  const lastDay=document.getElementById('finLastDay')?.value||today();
  const workers=state.workers.map(w=>w.id===id?{...w,active:false,endDate:lastDay,endReason:type}:w);
  save('ea_workers',workers);setState({workers,modal:null});showAlert('Trabajador desvinculado');
};
window.desvincularWorker=id=>{
  if(!confirm('¿Confirmar desvinculación?'))return;
  const workers=state.workers.map(w=>w.id===id?{...w,active:false,endDate:today(),endReason:'honorarios'}:w);
  save('ea_workers',workers);setState({workers});showAlert('Trabajador desvinculado');
};
window.resolveAlert=id=>{
  const alerts=state.alerts.map(a=>a.id===id?{...a,status:'resuelta'}:a);
  save('ea_alerts',alerts);setState({alerts});showAlert('Alerta marcada como resuelta');
};
window.toggleField=id=>{const f=document.getElementById(id);if(f)f.style.display=f.style.display==='none'?'grid':'none';};
window.switchWorkerType=type=>{
  document.getElementById('wType').value=type;
  document.getElementById('wTypeContrato').className='tab-btn'+(type==='contrato'?' active':'');
  document.getElementById('wTypeHonorarios').className='tab-btn'+(type==='honorarios'?' active':'');
  const cf=document.getElementById('contratoFields');
  if(cf)cf.style.display=type==='contrato'?'block':'none';
};
window.toggleIsapre=()=>{
  const v=document.getElementById('wHealth')?.value;
  const f=document.getElementById('isapreFields');
  if(f)f.style.display=v==='Isapre'?'grid':'none';
};
window.updateProrate=()=>{
  const amt=parseInt(document.getElementById('eAmount')?.value||0);
  const prev=document.getElementById('proratePreview');
  const body=document.getElementById('prorateBody');
  if(!prev||!body)return;
  if(amt>0){
    prev.style.display='block';
    body.innerHTML=calcProrate({amount:amt},state.units).map(p=>{
      const u=state.units.find(x=>x.id===p.unitId);
      return`<tr><td>Depto ${u?.number||''}</td><td>${u?.sqm||0}</td><td>${u?.parking?u.parkingSqm:0}</td><td>${u?.storage?u.storageSqm:0}</td><td><b>${p.sqm}</b></td><td>${(p.pct*100).toFixed(1)}%</td><td style="font-weight:700;color:#1a56db">${fmt(p.amount)}</td></tr>`;
    }).join('');
  }else{prev.style.display='none';}
};
window.downloadDoc=(file,title)=>{
  alert(`📄 "${title}"\n\nEste documento estará disponible para descarga una vez que el administrador suba el archivo PDF.\n\nPara subir documentos, contacte al administrador del sistema.`);
};
window.setState=setState;

render();
</script>
</body>
