const AFP_LIST=['Capital','Cuprum','Habitat','PlanVital','ProVida','Uno'];
const ISAPRE_LIST=['Banmédica','Colmena','Cruz Blanca','Más Vida','Nueva Masvida','Vida Tres'];

function calcLiquidacion(w){
  const bruto=parseInt(w.gross_salary)||0;
  const afpPct=w.afp_type==='Uno'?0.0058:0.1027;
  const afp=Math.round(bruto*afpPct);
  const sis=Math.round(bruto*0.0154);
  const segCes=Math.round(bruto*0.006);
  const salud=w.health_type==='Fonasa'?Math.round(bruto*0.07):parseInt(w.health_amount)||0;
  const imp=calcImpuesto(bruto-afp-salud);
  const liquido=bruto-afp-salud-segCes-imp;
  return{bruto,afp,sis,segCes,salud,imp,liquido,afpPct,gratif:Math.round(bruto*0.25)};
}
function calcImpuesto(base){
  const utm=65443;const e=base/utm;
  if(e<=13.5)return 0;
  if(e<=30)return Math.round(base*0.04-0.192*utm);
  if(e<=50)return Math.round(base*0.08-1.392*utm);
  if(e<=70)return Math.round(base*0.135-4.142*utm);
  return Math.round(base*0.23-10.792*utm);
}
function calcFiniquito(w,type,lastDay){
  const liq=calcLiquidacion(w);
  const years=(new Date(lastDay)-new Date(w.start_date))/(1000*60*60*24*365);
  const yf=Math.floor(years);
  const mf=Math.round((years-yf)*12);
  const ind=type==='despido'?Math.round(liq.bruto*Math.min(yf+(mf>=6?1:0),11)):0;
  const dias=Math.round((new Date(lastDay).getDate()/30)*liq.liquido);
  const vac=Math.round(years*15/12*(liq.bruto/30));
  return{ind,dias,vac,total:ind+dias+vac,years:yf,months:mf};
}
function getTotalSqm(u){return(u.sqm||0)+(u.parking?u.parking_sqm||0:0)+(u.storage?u.storage_sqm||0:0);}
function calcProrate(amount,units){
  const total=units.reduce((s,u)=>s+getTotalSqm(u),0);
  return units.map(u=>({unitId:u.id,sqm:getTotalSqm(u),pct:total>0?getTotalSqm(u)/total:0,amount:total>0?Math.round(amount*getTotalSqm(u)/total):0}));
}

// STATE
let state={
  screen:'login', // login, app
  loginStep:1, // 1=comunidad, 2=clave
  comunidades:[],
  selectedComunidad:null,
  claveInput:'',
  currentUser:null,
  comunidadData:{
    unidades:[],residentes:[],pagos:[],gastos:[],
    multas:[],trabajadores:[],alertas:[],documentos:[]
  },
  view:'dashboard',
  modal:null,
  alert:null,
  alertTimer:null,
  loading:false,
  selectedCat:null,
  workerTab:'contrato',
  reportMonth:thisMonth(),
  reportTab:'general',
  editingUnit:null,
};

function setState(p){state={...state,...p};render();}
function showAlert(msg,type='success'){
  if(state.alertTimer)clearTimeout(state.alertTimer);
  const t=setTimeout(()=>setState({alert:null}),3500);
  setState({alert:{msg,type},alertTimer:t});
}

// SUPABASE HELPERS
async function loadComunidades(){
  const{data}=await sb.from('comunidades').select('*').eq('activa',true).order('nombre');
  return data||[];
}
async function loadComunidadData(comunidadId){
  const[u,r,p,g,m,t,a,d]=await Promise.all([
    sb.from('unidades').select('*').eq('comunidad_id',comunidadId).order('numero'),
    sb.from('usuarios').select('*').eq('comunidad_id',comunidadId).eq('activo',true),
    sb.from('pagos').select('*').eq('comunidad_id',comunidadId).order('created_at',{ascending:false}),
    sb.from('gastos').select('*').eq('comunidad_id',comunidadId).order('created_at',{ascending:false}),
    sb.from('multas').select('*').eq('comunidad_id',comunidadId).order('created_at',{ascending:false}),
    sb.from('trabajadores').select('*').eq('comunidad_id',comunidadId),
    sb.from('alertas').select('*').eq('comunidad_id',comunidadId).order('created_at',{ascending:false}),
    sb.from('documentos').select('*').eq('comunidad_id',comunidadId),
  ]);
  return{
    unidades:u.data||[],residentes:r.data||[],pagos:p.data||[],
    gastos:g.data||[],multas:m.data||[],trabajadores:t.data||[],
    alertas:a.data||[],documentos:d.data||[]
  };
}

function isFullAccess(){
  const u=state.currentUser;
  return u&&(u.rol==='admin'||u.rol==='presidente'||u.rol==='tesorero');
}
function getPendingFines(unitId,month){
  return state.comunidadData.multas.filter(f=>f.unidad_id===unitId&&f.status==='pendiente'&&f.month===month);
}
function getTotalDue(unitId,month){
  const u=state.comunidadData.unidades.find(x=>x.id===unitId);
  return(u?.monthly_fee||85000)+getPendingFines(unitId,month).reduce((s,f)=>s+f.amount,0);
}

  document.getElementById('root').innerHTML=state.screen==='login'?buildLogin():buildApp();

function getMetrics(month){
  const{pagos,gastos,unidades,residentes}=state.comunidadData;
  const mp=pagos.filter(p=>p.month===month);
  const me=gastos.filter(g=>g.month===month);
  const totalIn=mp.reduce((s,p)=>s+p.amount,0);
  const totalOut=me.reduce((s,e)=>s+e.amount,0);
  const paidUnits=new Set(mp.map(p=>p.unidad_id));
  const occupied=unidades.filter(u=>residentes.some(r=>r.unidad_id===u.id));
  const morose=occupied.filter(u=>!paidUnits.has(u.id));
  return{totalIn,totalOut,balance:totalIn-totalOut,paidUnits,occupied,morose,mp,me};
}

function buildBank(){
  const{pagos,gastos,unidades,residentes}=state.comunidadData;
  const totalIn=pagos.reduce((s,p)=>s+p.amount,0);
  const totalOut=gastos.reduce((s,g)=>s+g.amount,0);
  const allMovs=[...pagos.map(p=>({...p,_t:'crédito',_desc:`GC Depto ${unidades.find(u=>u.id===p.unidad_id)?.numero||''} · ${residentes.find(r=>r.id===p.usuario_id)?.nombre||''}`})),...gastos.map(g=>({...g,_t:'débito',_desc:`${g.icon} ${g.label}`}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  let saldo=totalIn-totalOut;
  const movs=allMovs.map(m=>{const s=saldo;saldo+=m._t==='débito'?m.amount:-m.amount;return{...m,saldo:s}});
  return`
  <div class="page-header"><div><h2>Cuenta Corriente</h2></div><span class="badge badge-amber">Simulación · Fintoc disponible</span></div>
  <div class="metrics" style="grid-template-columns:repeat(3,1fr)">
    <div class="metric"><div class="metric-label">Créditos</div><div class="metric-value green">${fmt(totalIn)}</div></div>
    <div class="metric"><div class="metric-label">Débitos</div><div class="metric-value red">${fmt(totalOut)}</div></div>
    <div class="metric"><div class="metric-label">Saldo</div><div class="metric-value ${totalIn-totalOut>=0?'green':'red'}">${fmt(totalIn-totalOut)}</div></div>
  </div>
  <div class="card">
    <table><thead><tr><th>Fecha</th><th>Descripción</th><th>Tipo</th><th>Monto</th><th>Saldo</th></tr></thead>
    <tbody>${movs.map(m=>`<tr>
      <td>${fmtD(m.date)}</td><td>${m._desc}</td>
      <td><span class="badge ${m._t==='crédito'?'badge-green':'badge-red'}">${m._t}</span></td>
      <td style="font-weight:700;color:${m._t==='crédito'?'#059669':'#dc2626'}">${m._t==='crédito'?'+':'-'}${fmt(m.amount)}</td>
      <td>${fmt(m.saldo)}</td>
    </tr>`).join('')}</tbody></table>
  </div>`;
}

function attachEvents(){
  document.getElementById('modeSelect')?.addEventListener('change',async function(){
    // No aplica en versión con login real
  });
  document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>setState({view:btn.dataset.view})));
  document.getElementById('btnAddUnit')?.addEventListener('click',()=>toggleForm('unitForm'));
  document.getElementById('btnCancelUnit')?.addEventListener('click',()=>toggleForm('unitForm',false));
  document.getElementById('btnSaveUnit')?.addEventListener('click',async()=>{
    const number=document.getElementById('uNumber').value.trim();
    const floor=document.getElementById('uFloor').value;
    const sqm=document.getElementById('uSqm').value;
    if(!number||!floor||!sqm){showAlert('Completa campos obligatorios','error');return;}
    const parking=document.getElementById('uParking').checked;
    const storage=document.getElementById('uStorage').checked;
    const{data,error}=await sb.from('unidades').insert({
      comunidad_id:state.selectedComunidad.id,numero:number,piso:parseInt(floor),sqm:parseFloat(sqm),
      monthly_fee:parseInt(document.getElementById('uFee').value)||85000,
      parking,parking_num:parking?document.getElementById('uParkingNum').value:'',
      parking_sqm:parking?parseFloat(document.getElementById('uParkingSqm').value||0):0,
      storage,storage_num:storage?document.getElementById('uStorageNum').value:'',
      storage_sqm:storage?parseFloat(document.getElementById('uStorageSqm').value||0):0
    }).select();
    if(error){showAlert('Error al guardar','error');return;}
    const unidades=[...state.comunidadData.unidades,...data];
    setState({comunidadData:{...state.comunidadData,unidades}});showAlert('Unidad agregada');
  });
  document.getElementById('btnAddResident')?.addEventListener('click',()=>toggleForm('residentForm'));
  document.getElementById('btnCancelResident')?.addEventListener('click',()=>toggleForm('residentForm',false));
  document.getElementById('btnSaveResident')?.addEventListener('click',async()=>{
    const nombre=document.getElementById('rName').value.trim();
    const email=document.getElementById('rEmail').value.trim();
    const unitId=document.getElementById('rUnit').value;
    const clave=document.getElementById('rClave').value.trim();
    const rol=document.getElementById('rRole').value;
    if(!nombre||!unitId||!clave){showAlert('Completa campos obligatorios','error');return;}
    const{data,error}=await sb.from('usuarios').insert({
      comunidad_id:state.selectedComunidad.id,unidad_id:unitId,nombre,email,
      rut:document.getElementById('rRut').value,phone:document.getElementById('rPhone').value,
      rol,clave,activo:true
    }).select();
    if(error){showAlert('Error: '+error.message,'error');return;}
    const residentes=[...state.comunidadData.residentes,...data];
    setState({comunidadData:{...state.comunidadData,residentes}});showAlert('Residente registrado');
  });
  document.getElementById('btnAddPayment')?.addEventListener('click',()=>toggleForm('paymentForm'));
  document.getElementById('btnCancelPayment')?.addEventListener('click',()=>toggleForm('paymentForm',false));
  document.getElementById('btnSavePayment')?.addEventListener('click',async()=>{
    const userId=document.getElementById('pResident').value;
    const amount=document.getElementById('pAmount').value;
    const date=document.getElementById('pDate').value;
    const method=document.getElementById('pMethod').value;
    if(!userId||!amount||!date){showAlert('Completa campos','error');return;}
    const r=state.comunidadData.residentes.find(x=>x.id===userId);
    const curM=date.substr(0,7);
    const pf=getPendingFines(r?.unidad_id,curM);
    const finesAmt=pf.reduce((s,f)=>s+f.amount,0);
    const{data,error}=await sb.from('pagos').insert({
      comunidad_id:state.selectedComunidad.id,unidad_id:r?.unidad_id,usuario_id:userId,
      amount:parseInt(amount),base_amount:parseInt(amount)-finesAmt,date,method,month:curM
    }).select();
    if(error){showAlert('Error','error');return;}
    if(pf.length>0){
      await sb.from('multas').update({status:'pagada'}).in('id',pf.map(f=>f.id));
      const multas=state.comunidadData.multas.map(f=>pf.find(x=>x.id===f.id)?{...f,status:'pagada'}:f);
      setState({comunidadData:{...state.comunidadData,multas}});
    }
    const pagos=[...data,...state.comunidadData.pagos];
    setState({comunidadData:{...state.comunidadData,pagos},modal:{type:'receipt',payment:data[0]}});
    showAlert('Pago registrado');
  });
  document.getElementById('btnAddFine')?.addEventListener('click',()=>toggleForm('fineForm'));
  document.getElementById('btnCancelFine')?.addEventListener('click',()=>toggleForm('fineForm',false));
  document.getElementById('btnSaveFine')?.addEventListener('click',async()=>{
    const sel=document.getElementById('fResident').value;
    const amount=document.getElementById('fAmount').value;
    const reason=document.getElementById('fReason').value.trim();
    const date=document.getElementById('fDate').value;
    const month=document.getElementById('fMonth').value;
    if(!sel||!amount||!reason){showAlert('Completa campos','error');return;}
    const[userId,unitId]=sel.split('|');
    const{data,error}=await sb.from('multas').insert({
      comunidad_id:state.selectedComunidad.id,unidad_id:unitId,usuario_id:userId,
      amount:parseInt(amount),reason,date,month,status:'pendiente'
    }).select();
    if(error){showAlert('Error','error');return;}
    const multas=[...data,...state.comunidadData.multas];
    setState({comunidadData:{...state.comunidadData,multas}});showAlert('Multa aplicada');
  });
  document.getElementById('btnAddWorker')?.addEventListener('click',()=>toggleForm('workerForm'));
  document.getElementById('btnCancelWorker')?.addEventListener('click',()=>toggleForm('workerForm',false));
  document.getElementById('btnSaveWorker')?.addEventListener('click',async()=>{
    const nombre=document.getElementById('wName').value.trim();
    const rut=document.getElementById('wRut').value.trim();
    const rol=document.getElementById('wRole').value.trim();
    const tipo=document.getElementById('wType').value;
    const gross_salary=parseInt(document.getElementById('wSalary').value)||0;
    const start_date=document.getElementById('wStart').value;
    if(!nombre||!rut||!rol){showAlert('Completa campos','error');return;}
    const afp_type=tipo==='contrato'?document.getElementById('wAfp').value:'';
    const health_type=tipo==='contrato'?document.getElementById('wHealth').value:'';
    const{data,error}=await sb.from('trabajadores').insert({
      comunidad_id:state.selectedComunidad.id,nombre,rut,rol,tipo,gross_salary,start_date,
      afp_type,health_type,
      health_amount:health_type==='Isapre'?parseInt(document.getElementById('wIsapreAmt').value||0):0,
      activo:true
    }).select();
    if(error){showAlert('Error','error');return;}
    const trabajadores=[...state.comunidadData.trabajadores,...data];
    setState({comunidadData:{...state.comunidadData,trabajadores}});showAlert('Trabajador agregado');
  });
  document.getElementById('btnAddAlert')?.addEventListener('click',()=>toggleForm('alertForm'));
  document.getElementById('btnCancelAlert')?.addEventListener('click',()=>toggleForm('alertForm',false));
  document.getElementById('btnSaveAlert')?.addEventListener('click',async()=>{
    const titulo=document.getElementById('aTitle').value.trim();
    const tipo=document.getElementById('aType').value;
    const descripcion=document.getElementById('aDesc').value;
    if(!titulo){showAlert('Ingresa un título','error');return;}
    const full=isFullAccess();
    const residentSel=full?document.getElementById('aResident')?.value:'';
    const usuario_id=residentSel||state.currentUser?.id||null;
    const unidad_id=usuario_id?state.comunidadData.residentes.find(r=>r.id===usuario_id)?.unidad_id:null;
    const{data,error}=await sb.from('alertas').insert({
      comunidad_id:state.selectedComunidad.id,tipo,titulo,descripcion,
      usuario_id,unidad_id,date:today(),
      time:new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}),status:'activa'
    }).select();
    if(error){showAlert('Error','error');return;}
    const alertas=[...data,...state.comunidadData.alertas];
    setState({comunidadData:{...state.comunidadData,alertas}});showAlert('Alerta enviada');
  });
  document.getElementById('reportMonth')?.addEventListener('change',function(){setState({reportMonth:this.value});});
  document.getElementById('btnSaveSettings')?.addEventListener('click',async()=>{
    const nombre=document.getElementById('bName').value.trim();
    const ciudad=document.getElementById('bCity').value.trim();
    const direccion=document.getElementById('bAddr').value.trim();
    await sb.from('comunidades').update({nombre,ciudad,direccion}).eq('id',state.selectedComunidad.id);
    setState({selectedComunidad:{...state.selectedComunidad,nombre,ciudad,direccion}});
    showAlert('Configuración guardada');
  });
  document.getElementById('btnSaveComunidad')?.addEventListener('click',async()=>{
    const nombre=document.getElementById('ncNombre').value.trim();
    const direccion=document.getElementById('ncDir').value.trim();
    const ciudad=document.getElementById('ncCiudad').value.trim();
    const codigo_acceso=document.getElementById('ncCodigo').value.trim().toUpperCase();
    if(!nombre||!codigo_acceso){showAlert('Completa campos obligatorios','error');return;}
    setState({loading:true});
    const{data,error}=await sb.from('comunidades').insert({nombre,direccion,ciudad,codigo_acceso,activa:true}).select();
    setState({loading:false});
    if(error){showAlert('Error: código ya existe o problema de conexión','error');return;}
    const comunidades=[...state.comunidades,...data];
    setState({comunidades,modal:null});showAlert('Comunidad creada exitosamente');
  });
  document.getElementById('btnSaveExpense')?.addEventListener('click',async()=>{
    const amount=document.getElementById('eAmount')?.value;
    const date=document.getElementById('eDate')?.value;
    if(!amount||!date){showAlert('Completa campos','error');return;}
    const cat=EXPENSE_CATS.find(c=>c.id===state.selectedCat);
    const{data,error}=await sb.from('gastos').insert({
      comunidad_id:state.selectedComunidad.id,cat_id:cat.id,label:cat.label,icon:cat.icon,
      prorate:cat.prorate,amount:parseInt(amount),date,
      description:document.getElementById('eDesc')?.value||'',month:date.substr(0,7)
    }).select();
    if(error){showAlert('Error','error');return;}
    const gastos=[...data,...state.comunidadData.gastos];
    setState({comunidadData:{...state.comunidadData,gastos},selectedCat:null});showAlert('Gasto registrado');
  });
  document.getElementById('modalOverlay')?.addEventListener('click',function(e){if(e.target===this)setState({modal:null});});
}

function toggleForm(id,show=null){
  const f=document.getElementById(id);
  if(!f)return;
  f.style.display=show===null?(f.style.display==='none'?'block':'none'):show?'block':'none';
}

// LOGIN ACTIONS
window.selectComunidad=function(id){
  const c=state.comunidades.find(x=>x.id===id);
  setState({selectedComunidad:c});
};
window.goToStep2=function(){
  if(!state.selectedComunidad)return;
  setState({loginStep:2});
  setTimeout(()=>document.getElementById('claveInput')?.focus(),100);
};
window.doLogin=async function(){
  const clave=document.getElementById('claveInput')?.value?.trim();
  if(!clave){showAlert('Ingresa tu clave','error');return;}
  setState({loading:true});
  const{data,error}=await sb.from('usuarios')
    .select('*')
    .eq('comunidad_id',state.selectedComunidad.id)
    .eq('clave',clave)
    .eq('activo',true)
    .single();
  if(error||!data){
    setState({loading:false});showAlert('Clave incorrecta. Intenta nuevamente.','error');return;
  }
  const comunidadData=await loadComunidadData(state.selectedComunidad.id);
  const full=data.rol==='admin'||data.rol==='presidente'||data.rol==='tesorero';
  setState({loading:false,screen:'app',currentUser:data,comunidadData,view:full?'dashboard':'my_account'});
};
window.logout=function(){
  setState({screen:'login',loginStep:1,currentUser:null,selectedComunidad:null,comunidadData:{unidades:[],residentes:[],pagos:[],gastos:[],multas:[],trabajadores:[],alertas:[],documentos:[]}});
};

// APP ACTIONS
window.viewReceipt=id=>{
  const p=state.comunidadData.pagos.find(x=>x.id===id);
  if(p)setState({modal:{type:'receipt',payment:p}});
};
window.viewLiquidacion=id=>setState({modal:{type:'liquidacion',worker:state.comunidadData.trabajadores.find(w=>w.id===id)}});
window.viewBoleta=id=>setState({modal:{type:'boleta',worker:state.comunidadData.trabajadores.find(w=>w.id===id)}});
window.openFiniquito=id=>setState({modal:{type:'finiquito',worker:state.comunidadData.trabajadores.find(w=>w.id===id),finType:'renuncia',lastDay:today()}});
window.updateFiniquito=id=>{
  const type=document.getElementById('finType')?.value;
  const lastDay=document.getElementById('finLastDay')?.value;
  setState({modal:{type:'finiquito',worker:state.comunidadData.trabajadores.find(w=>w.id===id),finType:type,lastDay}});
};
window.confirmarFiniquito=async id=>{
  const type=document.getElementById('finType')?.value||'renuncia';
  const lastDay=document.getElementById('finLastDay')?.value||today();
  await sb.from('trabajadores').update({activo:false,end_date:lastDay,end_reason:type}).eq('id',id);
  const trabajadores=state.comunidadData.trabajadores.map(w=>w.id===id?{...w,activo:false,end_date:lastDay,end_reason:type}:w);
  setState({comunidadData:{...state.comunidadData,trabajadores},modal:null});showAlert('Trabajador desvinculado');
};
window.desvincularWorker=id=>setState({modal:{type:'confirm',message:'¿Confirmar desvinculación?',onConfirm:`doDesvincular('${id}')`}});
window.doDesvincular=async id=>{
  await sb.from('trabajadores').update({activo:false,end_date:today()}).eq('id',id);
  const trabajadores=state.comunidadData.trabajadores.map(w=>w.id===id?{...w,activo:false}:w);
  setState({comunidadData:{...state.comunidadData,trabajadores},modal:null});showAlert('Trabajador desvinculado');
};
window.resolveAlert=async id=>{
  await sb.from('alertas').update({status:'resuelta'}).eq('id',id);
  const alertas=state.comunidadData.alertas.map(a=>a.id===id?{...a,status:'resuelta'}:a);
  setState({comunidadData:{...state.comunidadData,alertas}});showAlert('Alerta resuelta');
};
window.deleteUnit=id=>setState({modal:{type:'confirm',message:'¿Eliminar esta unidad? Asegúrate que no tenga residente asignado.',onConfirm:`doDeleteUnit('${id}')`}});
window.doDeleteUnit=async id=>{
  await sb.from('unidades').delete().eq('id',id);
  const unidades=state.comunidadData.unidades.filter(u=>u.id!==id);
  setState({comunidadData:{...state.comunidadData,unidades},modal:null});showAlert('Unidad eliminada');
};
window.deleteResident=(id,nombre)=>setState({modal:{type:'confirm',message:`¿Eliminar a ${nombre}? La unidad quedará disponible.`,onConfirm:`doDeleteResident('${id}')`}});
window.doDeleteResident=async id=>{
  await sb.from('usuarios').update({activo:false}).eq('id',id);
  const residentes=state.comunidadData.residentes.filter(r=>r.id!==id);
  setState({comunidadData:{...state.comunidadData,residentes},modal:null});showAlert('Residente eliminado');
};
window.saveEditUnit=async id=>{
  const numero=document.getElementById('eu_number')?.value.trim();
  const piso=parseInt(document.getElementById('eu_floor')?.value);
  const sqm=parseFloat(document.getElementById('eu_sqm')?.value);
  const monthly_fee=parseInt(document.getElementById('eu_fee')?.value)||85000;
  const parking=document.getElementById('eu_parking')?.checked;
  const storage=document.getElementById('eu_storage')?.checked;
  if(!numero||!piso||!sqm){showAlert('Completa campos','error');return;}
  const updates={numero,piso,sqm,monthly_fee,parking,
    parking_num:parking?document.getElementById('eu_parkNum')?.value||'':'',
    parking_sqm:parking?parseFloat(document.getElementById('eu_parkSqm')?.value||0):0,
    storage,storage_num:storage?document.getElementById('eu_storNum')?.value||'':'',
    storage_sqm:storage?parseFloat(document.getElementById('eu_storSqm')?.value||0):0};
  await sb.from('unidades').update(updates).eq('id',id);
  const unidades=state.comunidadData.unidades.map(u=>u.id===id?{...u,...updates}:u);
  setState({comunidadData:{...state.comunidadData,unidades},modal:null});showAlert('Unidad actualizada');
};
window.onResidentChange=function(sel){
  const r=state.comunidadData.residentes.find(x=>x.id===sel.value);
  const u=r?state.comunidadData.unidades.find(x=>x.id===r.unidad_id):null;
  const curM=today().substr(0,7);
  const pf=r?getPendingFines(r.unidad_id,curM):[];
  const fa=pf.reduce((s,f)=>s+f.amount,0);
  const base=u?.monthly_fee||85000;
  const unitInp=document.getElementById('pUnit');
  const baseInp=document.getElementById('pBase');
  const finesInp=document.getElementById('pFinesAmt');
  const amtInp=document.getElementById('pAmount');
  const finesInfo=document.getElementById('pFinesInfo');
  if(unitInp)unitInp.value=u?`Depto ${u.numero} · Piso ${u.piso}`:'—';
  if(baseInp)baseInp.value=base;
  if(finesInp)finesInp.value=fa;
  if(amtInp)amtInp.value=base+fa;
  if(finesInfo){if(pf.length>0){finesInfo.style.display='block';finesInfo.innerHTML=`⚠ Multas: ${fmt(fa)}`;}else finesInfo.style.display='none';}
};
window.toggleField=id=>{const f=document.getElementById(id);if(f)f.style.display=f.style.display==='none'?'grid':'none';};
window.switchWorkerType=type=>{
  document.getElementById('wType').value=type;
  document.getElementById('wTypeContrato').className='tab-btn'+(type==='contrato'?' active':'');
  document.getElementById('wTypeHonorarios').className='tab-btn'+(type==='honorarios'?' active':'');
  const cf=document.getElementById('contratoFields');
  if(cf)cf.style.display=type==='contrato'?'block':'none';
};
window.toggleIsapre=()=>{const v=document.getElementById('wHealth')?.value;const f=document.getElementById('isapreFields');if(f)f.style.display=v==='Isapre'?'grid':'none';};
window.updateProrate=()=>{
  const amt=parseInt(document.getElementById('eAmount')?.value||0);
  const prev=document.getElementById('proratePreview');
  const body=document.getElementById('prorateBody');
  if(!prev||!body)return;
  if(amt>0){prev.style.display='block';body.innerHTML=calcProrate(amt,state.comunidadData.unidades).map(p=>{const u=state.comunidadData.unidades.find(x=>x.id===p.unitId);return`<tr><td>Depto ${u?.numero||''}</td><td>${p.sqm}m²</td><td>${(p.pct*100).toFixed(1)}%</td><td style="font-weight:700;color:#1a56db">${fmt(p.amount)}</td></tr>`;}).join('');}else prev.style.display='none';
};
window.downloadDoc=title=>alert(`Documento "${title}" pendiente de carga.`);

// INIT
async function init(){
  setState({loading:true});
  const comunidades=await loadComunidades();
  setState({loading:false,comunidades});
}

init();
</script>
</body>
</html>
