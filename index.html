<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vecinoo">
<meta name="theme-color" content="#0F172A">
<title>Vecinoo — Todo tu edificio, en orden</title>
<link rel="manifest" href="manifest.json" onerror="this.remove()">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a1a;min-height:100vh}
:root{--navy:#0F172A;--navy2:#1E293B;--green:#2E766B;--green2:#1d5249;--gold:#E6B800;--gold2:#b89200;--white:#F8FAFC;--gray:#94A3B8;--gray2:#64748B;--red:#DC2626;--light:#E8F0FE;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px}
.login-box{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:400px}
.login-logo{text-align:center;margin-bottom:24px}
.login-step{display:none}.login-step.active{display:block}
.community-list{max-height:260px;overflow-y:auto;margin-bottom:14px}
.community-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e5e5e5;border-radius:10px;cursor:pointer;margin-bottom:6px;transition:all .2s}
.community-item:hover,.community-item.selected{border-color:var(--navy);background:#f0f4ff}
.community-info h3{font-size:13px;font-weight:700}
.community-info p{font-size:11px;color:#6b7280}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:230px;background:#fff;border-right:1px solid #e5e5e5;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:transform .3s}
.sidebar-logo{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.1);background:var(--navy)}
.sidebar-logo-row{display:flex;align-items:center;gap:8px}
.sidebar-logo-icon{width:32px;height:32px;flex-shrink:0}
.sidebar-logo-text h1{font-size:16px;font-weight:800;color:var(--white);line-height:1.2;letter-spacing:-0.3px}
.sidebar-logo-text p{font-size:10px;color:var(--gold);margin-top:1px}
.nav{flex:1;padding:6px 0}
.nav-section{padding:10px 16px 3px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:12px;color:#374151;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s}
.nav-item:hover{background:#f3f4f6}
.nav-item.active{background:#f0f4ff;color:var(--navy);font-weight:600;border-right:3px solid var(--gold)}
.user-info{padding:10px 16px;border-top:1px solid #e5e5e5;font-size:11px;color:#6b7280}
.role-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:600;margin-top:3px}
.role-superadmin{background:var(--navy);color:#fff}
.role-admin{background:#dbeafe;color:#1e40af}
.role-presidente{background:#ede9fe;color:#5b21b6}
.role-tesorero{background:#fef3c7;color:#92400e}
.role-resident{background:#d1fae5;color:#065f46}
.main{flex:1;overflow-y:auto;padding:18px;background:#f0f2f5}
.topbar{display:none;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--navy);border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;z-index:100}
.topbar-logo{display:flex;align-items:center;gap:6px}
.topbar-logo svg{width:24px;height:24px}
.topbar-logo span{font-size:14px;font-weight:800;color:var(--white);letter-spacing:-0.3px}
.hamburger{background:none;border:none;font-size:20px;cursor:pointer;color:var(--white)}
.page-header{margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.page-header h2{font-size:18px;font-weight:700}
.page-header p{font-size:12px;color:#6b7280;margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.metric{background:#fff;border-radius:10px;padding:12px 14px;border:1px solid #e5e5e5}
.metric-label{font-size:10px;color:#6b7280;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.metric-value{font-size:20px;font-weight:700}
.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--navy)}.amber{color:#d97706}.purple{color:#7c3aed}.gold{color:var(--gold2)}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-title{font-size:13px;font-weight:700;color:#111}
.btn{padding:7px 14px;border-radius:8px;border:1px solid #d1d5db;background:#fff;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;color:#374151;font-weight:500;-webkit-appearance:none}
.btn:hover{background:#f9fafb}.btn:active{transform:scale(.98)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn-primary:hover{background:var(--navy2)}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}.btn-gold:hover{background:var(--gold2)}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-warning{background:#d97706;color:#fff;border-color:#d97706}
.btn-dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-purple{background:#7c3aed;color:#fff;border-color:#7c3aed}
.btn-sm{padding:4px 9px;font-size:11px}.btn-block{width:100%;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #e5e5e5;background:#f9fafb}
td{padding:9px 10px;border-bottom:1px solid #f3f4f6;color:#374151;vertical-align:middle}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.badge-green{background:#d1fae5;color:#065f46}.badge-red{background:#fee2e2;color:#991b1b}
.badge-amber{background:#fef3c7;color:#92400e}.badge-blue{background:#dbeafe;color:#1e40af}
.badge-gray{background:#f3f4f6;color:#374151}.badge-purple{background:#ede9fe;color:#5b21b6}
.badge-dark{background:var(--navy);color:#fff}.badge-gold{background:#fef9c3;color:#854d0e}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:11px;font-weight:600;color:#374151;margin-bottom:4px}
.form-control{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:#111;-webkit-appearance:none}
.form-control:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,23,42,.08)}
.form-control:disabled{background:#f9fafb;color:#6b7280;cursor:not-allowed}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-row-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-lg{max-width:780px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:14px;font-weight:700}
.close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:#6b7280}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1e40af;flex-shrink:0}
.empty{text-align:center;padding:32px;color:#9ca3af;font-size:13px}
.alert-bar{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:12px;font-weight:500}
.alert-success{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.receipt{font-size:12px}
.receipt-header{text-align:center;padding-bottom:14px;margin-bottom:14px;border-bottom:2px dashed #e5e5e5}
.receipt-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f3f4f6;font-size:12px}
.receipt-total{font-size:15px;font-weight:700;margin-top:10px;padding-top:10px;border-top:2px solid #111;display:flex;justify-content:space-between}
.progress-bar{height:6px;background:#f3f4f6;border-radius:4px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:4px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f3f4f6;font-size:12px}
.stat-row:last-child{border-bottom:none}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cat-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;border:2px solid #e5e5e5;border-radius:10px;background:#fff;cursor:pointer;transition:all .2s;font-size:10px;font-weight:600;color:#374151;gap:4px;text-align:center}
.cat-btn:hover{border-color:var(--navy);background:#f0f4ff;color:var(--navy)}
.cat-btn.selected{border-color:var(--gold);background:var(--navy);color:#fff}
.cat-icon{font-size:18px}
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.toggle{position:relative;width:38px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#d1d5db;border-radius:20px;cursor:pointer;transition:.3s}
.toggle-slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.toggle-slider{background:var(--green)}
.toggle input:checked+.toggle-slider:before{transform:translateX(18px)}
.section-div{font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;margin:12px 0 8px;padding-bottom:4px;border-bottom:1px solid #e5e5e5}
.doc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.doc-card{border:1px solid #e5e5e5;border-radius:10px;padding:16px 12px;text-align:center;background:#fff}
.doc-icon{font-size:28px;margin-bottom:8px}.doc-title{font-size:11px;font-weight:700;margin-bottom:4px}
.doc-desc{font-size:10px;color:#6b7280;margin-bottom:10px}
.alert-card{padding:10px 14px;background:#fff;border-radius:8px;margin-bottom:8px;border:1px solid #e5e5e5;border-left:4px solid var(--red)}
.alert-card.info{border-left-color:var(--navy)}.alert-card.warning{border-left-color:var(--gold)}
.liq-table{font-size:12px;width:100%}
.liq-table td{padding:5px 8px;border-bottom:1px solid #f3f4f6}
.liq-table .total{font-weight:700;font-size:13px;border-top:2px solid #111}
.tab-bar{display:flex;gap:4px;background:#f3f4f6;padding:4px;border-radius:8px;margin-bottom:12px}
.tab-btn{flex:1;padding:6px;border:none;background:none;font-size:11px;cursor:pointer;border-radius:6px;font-family:inherit;color:#6b7280;font-weight:500}
.tab-btn.active{background:#fff;color:var(--navy);font-weight:700;border-bottom:2px solid var(--gold)}
.loading{text-align:center;padding:32px;color:#6b7280;font-size:13px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #e5e5e5;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.superadmin-bar{background:var(--navy);color:#fff;padding:7px 14px;font-size:11px;display:flex;justify-content:space-between;align-items:center}
.plan-badge{padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700}

.install-banner{background:var(--navy);color:#fff;padding:10px 16px;font-size:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:3px solid var(--gold)}
@keyframes wsp-pulse{0%{box-shadow:0 4px 20px rgba(34,197,94,0.5)}50%{box-shadow:0 4px 28px rgba(34,197,94,0.8),0 0 0 8px rgba(34,197,94,0.15)}100%{box-shadow:0 4px 20px rgba(34,197,94,0.5)}}
/* Wizard pasos */
.wizard-steps{display:flex;align-items:center;margin-bottom:24px;gap:0}
.wstep{display:flex;align-items:center;gap:8px;flex:1}
.wstep-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.wstep.active .wstep-num{background:var(--navy);color:#fff}
.wstep.done .wstep-num{background:var(--green);color:#fff}
.wstep.pending .wstep-num{background:#e5e5e5;color:#9ca3af}
.wstep-label{font-size:11px;font-weight:600;color:var(--navy)}
.wstep.pending .wstep-label{color:#9ca3af}
.wstep-line{flex:1;height:2px;background:#e5e5e5;margin:0 4px}
.wstep-line.done{background:var(--green)}
/* Inventario pisos */
.piso-row{background:#f9fafb;border:1px solid #e5e5e5;border-radius:8px;padding:12px;margin-bottom:8px}
.piso-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.piso-title{font-size:13px;font-weight:700;color:var(--navy)}
.depto-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.depto-chip{background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:4px 6px;text-align:center;font-size:11px;cursor:pointer;transition:all .15s}
.depto-chip:hover{border-color:var(--navy);background:#f0f4ff}
.depto-chip.selected{background:var(--navy);color:#fff;border-color:var(--navy)}
/* Asignacion cards */
.asig-card{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.asig-card.assigned{border-color:var(--green);background:#f0fdf4}
.asig-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item-chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #d1d5db;background:#fff;transition:all .15s}
.item-chip.libre{border-color:#d1d5db;color:#374151}
.item-chip.asignado{background:var(--green);color:#fff;border-color:var(--green)}
.item-chip.selected-chip{background:var(--navy);color:#fff;border-color:var(--navy)}
/* Votaciones */
.votacion-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:16px;margin-bottom:12px;border-top:3px solid var(--gold)}

/* ── LIQUIDACIÓN GC ── */
.liq-gc{font-family:Arial,Helvetica,sans-serif;font-size:12px;background:#fff;border:1px solid #ccc;border-radius:6px;overflow:hidden;margin-bottom:16px}
.liq-gc-header{background:#0F172A;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.liq-gc-header-left h2{font-size:16px;font-weight:800;margin-bottom:2px}
.liq-gc-header-left p{font-size:11px;color:#94A3B8}
.liq-gc-body{padding:16px 20px}
.liq-gc-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #ddd;border-radius:6px;overflow:hidden;margin-bottom:14px}
.liq-gc-info-cell{padding:7px 12px;border-bottom:1px solid #f0f0f0;border-right:1px solid #f0f0f0;font-size:11px}
.liq-gc-info-cell:nth-child(even){border-right:none}
.liq-gc-info-label{color:#6b7280;margin-bottom:1px}
.liq-gc-info-val{font-weight:700;color:#111}
.liq-gc-section{margin-bottom:14px}
.liq-gc-section-title{background:#0F172A;color:#fff;padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.03em}
.liq-gc-table{width:100%;border-collapse:collapse;font-size:11px}
.liq-gc-table th{background:#f3f4f6;padding:6px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #e5e5e5}
.liq-gc-table td{padding:6px 10px;border-bottom:1px solid #f9f9f9;color:#374151;vertical-align:top}
.liq-gc-table .subtotal{font-weight:700;background:#f9fafb}
.liq-gc-table .total-row{font-weight:800;font-size:13px;background:#0F172A;color:#fff}
.liq-gc-table .total-row td{padding:8px 10px}
.liq-gc-destacado{background:#E6B800;color:#0F172A;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-radius:6px}
.liq-gc-destacado-label{font-size:11px;font-weight:600}
.liq-gc-destacado-val{font-size:20px;font-weight:900}
.liq-gc-obs{background:#f9fafb;border:1px solid #e5e5e5;border-radius:6px;padding:12px 14px;font-size:11px;color:#374151;line-height:1.6;margin-bottom:14px}
.liq-gc-footer{background:#f3f4f6;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid #E6B800;flex-wrap:wrap;gap:8px}
.liq-gc-footer-brand{font-size:13px;font-weight:800;color:#0F172A}
.liq-gc-footer-brand span{color:#E6B800}
.liq-gc-saldo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.liq-gc-saldo-card{background:#f9fafb;border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px}
.liq-gc-saldo-label{font-size:10px;color:#6b7280;margin-bottom:3px;font-weight:600;text-transform:uppercase}
.liq-gc-saldo-val{font-size:16px;font-weight:800}
.votacion-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.opcion-voto{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:2px solid #e5e5e5;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.opcion-voto:hover{border-color:var(--navy);background:#f0f4ff}
.opcion-voto.selected{border-color:var(--gold);background:var(--navy);color:#fff}
.voto-bar{height:8px;background:#e5e5e5;border-radius:4px;overflow:hidden;margin-top:4px}
.voto-fill{height:100%;background:var(--navy);border-radius:4px;transition:width .5s}
.resultado-row{padding:10px 0;border-bottom:1px solid #f3f4f6}
.resultado-row:last-child{border-bottom:none}
.acta-box{background:#f9fafb;border:1px solid #e5e5e5;border-radius:8px;padding:14px;font-size:12px;margin-top:12px;border-left:3px solid var(--gold)}
/* ── ASISTENTE IA ── */
#chatHistory::-webkit-scrollbar{width:4px}
#chatHistory::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:4px}
/* ── RESERVAS ── */
.espacio-libre{border-top-color:var(--green)!important}
.espacio-ocupado{border-top-color:var(--gold)!important}
@media(max-width:768px){
  .metrics{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}
  .cat-grid{grid-template-columns:repeat(3,1fr)}.doc-grid{grid-template-columns:1fr 1fr}
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:200;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}.topbar{display:flex}.main{padding:12px}
  .form-row-3{grid-template-columns:1fr 1fr}.depto-grid{grid-template-columns:repeat(4,1fr)}
  .form-row-4{grid-template-columns:1fr 1fr}
}

/* ── ACTA VOTACIÓN ── */
.acta-vot-wrap{background:#fff;border:2px solid #0F172A;border-radius:8px;padding:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;font-size:12px}
.acta-vot-header{background:#0F172A;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-start}
.acta-vot-header h2{font-size:15px;font-weight:800;margin-bottom:2px}
.acta-vot-header p{font-size:10px;color:#94A3B8}
.acta-vot-body{padding:16px 20px}
.acta-vot-meta{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #e5e5e5;border-radius:6px;overflow:hidden;margin-bottom:14px}
.acta-vot-meta-cell{padding:7px 12px;border-bottom:1px solid #f0f0f0;border-right:1px solid #f0f0f0;font-size:11px}
.acta-vot-meta-cell:nth-child(even){border-right:none}
.acta-vot-meta-cell:nth-last-child(-n+2){border-bottom:none}

function calcLiquidacion(w){
  const bruto=parseInt(w.gross_salary)||0;
  const afpPct=w.afp_type==='Uno'?0.0058:0.1027;
  const afp=Math.round(bruto*afpPct);const sis=Math.round(bruto*0.0154);const segCes=Math.round(bruto*0.006);
  const salud=w.health_type==='Fonasa'?Math.round(bruto*0.07):parseInt(w.health_amount)||0;
  const imp=calcImpuesto(bruto-afp-salud);const liquido=bruto-afp-salud-segCes-imp;
  return{bruto,afp,sis,segCes,salud,imp,liquido,afpPct,gratif:Math.round(bruto*0.25)};
}
function calcImpuesto(base){
  const utm=65443;const e=base/utm;
  if(e<=13.5)return 0;if(e<=30)return Math.round(base*0.04-0.192*utm);
  if(e<=50)return Math.round(base*0.08-1.392*utm);if(e<=70)return Math.round(base*0.135-4.142*utm);
  return Math.round(base*0.23-10.792*utm);
}
function calcFiniquito(w,type,lastDay){
  const liq=calcLiquidacion(w);
  const years=(new Date(lastDay)-new Date(w.start_date))/(1000*60*60*24*365);
  const yf=Math.floor(years);const mf=Math.round((years-yf)*12);
  const ind=type==='despido'?Math.round(liq.bruto*Math.min(yf+(mf>=6?1:0),11)):0;
  const dias=Math.round((new Date(lastDay).getDate()/30)*liq.liquido);
  const vac=Math.round(years*15/12*(liq.bruto/30));
  return{ind,dias,vac,total:ind+dias+vac,years:yf,months:mf};
}
function calcProrate(amount,units){
  const total=units.reduce((s,u)=>s+(u.sqm||0),0);
  return units.map(u=>({unitId:u.id,sqm:u.sqm||0,pct:total>0?(u.sqm||0)/total:0,amount:total>0?Math.round(amount*(u.sqm||0)/total):0}));
}

// ── Generar deptos 4-6 por piso ──
function generarInventario(numDeptos,numEstac,numBodegas){
  const deptos=[];
  let contador=1;let piso=1;
  while(contador<=numDeptos){
    const porEste=Math.min(Math.floor(Math.random()*3)+4,numDeptos-contador+1);
    for(let i=0;i<porEste&&contador<=numDeptos;i++,contador++){
      deptos.push({numero:String(contador).padStart(3,'0'),piso,label:`Depto ${String(contador).padStart(3,'0')} · Piso ${piso}`});
    }
    piso++;
  }
  const estacs=Array.from({length:numEstac},(_,i)=>({id:`E${i+1}`,label:`E-${String(i+1).padStart(2,'0')}`}));
  const bods=Array.from({length:numBodegas},(_,i)=>({id:`B${i+1}`,label:`B-${String(i+1).padStart(2,'0')}`}));
  return{deptos,estacs,bods};
}

function setState(p){
  // Preservar scroll si solo cambia modal, alert o alertTimer (no cambia la vista principal)
  const scrollOnlyKeys = new Set(['modal','alert','alertTimer','_preserveScroll',
    'auditFilter','auditSearch','pagosMes','gastosMes','workerTab','reportTab','chatLoading']);

// 1. ÍNDICE DE HACINAMIENTO
// OMS: < 1 persona/10m² = hacinamiento crítico
// Resultado: {nivel, valor, label, color}
function calcHacinamiento(unidades){
  var uConDatos=unidades.filter(function(u){return u.sqm&&u.sqm>0&&u.personas_hogar&&u.personas_hogar>0;});
  if(!uConDatos.length) return {nivel:'sin_datos',valor:null,label:'Sin datos',color:'#9ca3af',pct:0};
  var ratios=uConDatos.map(function(u){return u.personas_hogar/u.sqm;});
  var promedio=ratios.reduce(function(s,v){return s+v;},0)/ratios.length;
  // Clasificación: personas/m²
  // < 0.04: óptimo (4 personas en 100m²)
  // 0.04-0.08: moderado (4 en 50m²)
  // 0.08-0.12: crítico (4 en 33m²)
  // > 0.12: hacinamiento severo (4 en 25m²)
  var uCriticas=uConDatos.filter(function(u){return u.personas_hogar/u.sqm>0.1;}).length;
  var pctCritico=Math.round(uCriticas/uConDatos.length*100);
  var nivel=promedio<0.04?'optimo':promedio<0.08?'moderado':promedio<0.12?'critico':'severo';
  var labels={optimo:'Óptimo',moderado:'Moderado',critico:'Crítico',severo:'Severo'};
  var colors={optimo:'var(--green)',moderado:'#d97706',critico:'var(--red)',severo:'#374151'};
  return{
    nivel:nivel,
    valor:Math.round(promedio*100)/100,
    label:labels[nivel],
    color:colors[nivel],
    pct:pctCritico,
    uMedidas:uConDatos.length,
    uTotal:unidades.length,
    detalle:uConDatos.map(function(u){
      var ratio=u.personas_hogar/u.sqm;
      return{numero:u.numero,personas:u.personas_hogar,sqm:u.sqm,ratio:ratio,
        critico:ratio>0.1};
    }).sort(function(a,b){return b.ratio-a.ratio;})
  };
}

// 2. ÍNDICE DE ROTACIÓN DE RESIDENTES
// Compara residentes activos actuales vs. historial de cambios
// Alta rotación = inestabilidad social
function calcRotacion(residentes, auditLogs){
  var logs=auditLogs||[];
  var altas=logs.filter(function(l){return l.accion==='RESIDENTE_CREADO';}).length;
  var bajas=logs.filter(function(l){return l.accion==='RESIDENTE_DESACTIVADO'||l.accion==='RESIDENTE_ELIMINADO';}).length;
  var totalActivos=residentes.filter(function(r){return r.activo;}).length||1;
  var rotacionAnual=Math.round((bajas/totalActivos)*100);
  var nivel=rotacionAnual<10?'estable':rotacionAnual<25?'moderada':rotacionAnual<40?'alta':'critica';
  var labels={estable:'Estable (<10%)',moderada:'Moderada (10-25%)',alta:'Alta (25-40%)',critica:'Crítica (>40%)'};
  var colors={estable:'var(--green)',moderada:'#d97706',alta:'var(--red)',critica:'#374151'};
  return{
    nivel:nivel,label:labels[nivel],color:colors[nivel],
    altas:altas,bajas:bajas,rotacionPct:rotacionAnual,
    totalActivos:totalActivos
  };
}

// 3. DENSIDAD DE CONFLICTOS COMUNITARIOS
// Multas por tipo como termómetro social (no financiero)
function calcConflictos(multas, unidades){
  var total=multas.length;
  var porTipo={ruido:0,mascotas:0,estacionamiento:0,basura:0,otros:0};
  multas.forEach(function(m){
    var r=m.reason||m.descripcion||'';
    var rl=r.toLowerCase();
    if(rl.includes('ruido')||rl.includes('sonido')||rl.includes('música')) porTipo.ruido++;
    else if(rl.includes('mascota')||rl.includes('perro')||rl.includes('gato')) porTipo.mascotas++;
    else if(rl.includes('estacionamiento')||rl.includes('parking')||rl.includes('vehículo')) porTipo.estacionamiento++;
    else if(rl.includes('basura')||rl.includes('reciclaje')||rl.includes('residuo')) porTipo.basura++;
    else porTipo.otros++;
  });
  var totalUnidades=unidades.length||1;
  var densidad=Math.round(total/totalUnidades*10)/10; // multas por unidad
  var nivel=densidad<0.3?'bajo':densidad<0.7?'moderado':densidad<1.5?'alto':'critico';
  var labels={bajo:'Bajo',moderado:'Moderado',alto:'Alto',critico:'Crítico'};
  var colors={bajo:'var(--green)',moderado:'#d97706',alto:'var(--red)',critico:'#374151'};
  // Unidades reincidentes (más de 1 multa)
  var porUnidad={};
  multas.forEach(function(m){porUnidad[m.unidad_id]=(porUnidad[m.unidad_id]||0)+1;});
  var reincidentes=Object.values(porUnidad).filter(function(v){return v>1;}).length;
  return{
    nivel:nivel,label:labels[nivel],color:colors[nivel],
    total:total,densidad:densidad,porTipo:porTipo,reincidentes:reincidentes,
    tipoLiderar:Object.entries(porTipo).sort(function(a,b){return b[1]-a[1];})[0]
  };
}

function calcScoreSalud(c){
  // Score 0-100 basado en: cobro (40pts) + morosos (30pts) + actividad (30pts)
  var pct=c.cobro_pct||0;
  var mor=c.morosos||0;
  var uni=c.unidades_count||1;
  var morPct=Math.round(mor/uni*100);
  var scoreCobro=Math.round(pct*0.4);
  var scoreMor=Math.round(Math.max(0,30-(morPct*1.5)));
  var scoreActiv=c.activa?30:0;
  return Math.min(100,scoreCobro+scoreMor+scoreActiv);
}
function scoreSemaforoBg(score){
  if(score>=80)return'#f0fdf4';
  if(score>=60)return'#fffbeb';
  if(score>=40)return'#fff7ed';
  return'#fef2f2';
}
function scoreColor(score){
  if(score>=80)return'var(--green)';
  if(score>=60)return'#d97706';
  if(score>=40)return'#ea580c';
  return'var(--red)';
}
function scoreLabel(score){
  if(score>=80)return'🟢 Saludable';
  if(score>=60)return'🟡 Atención';
  if(score>=40)return'🟠 Riesgo';
  return'🔴 Crítico';
}
function clasificarHogar(u, pagos, multas){
  // Clasificación: verde/amarillo/rojo/negro basada en historial
  var hoy=new Date();
  var meses=[];
  for(var i=0;i<6;i++){
    var d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
    meses.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  var pagosMeses=pagos.filter(function(p){return p.unidad_id===u.id;}).map(function(p){return p.month;});
  var mesesSinPagar=meses.filter(function(m){return!pagosMeses.includes(m);}).length;
  var tieneMultas=multas.filter(function(m){return m.unidad_id===u.id&&m.status==='pendiente';}).length>0;
  if(mesesSinPagar===0&&!tieneMultas)return{nivel:'verde',label:'Al día',color:'var(--green)',bg:'#f0fdf4'};
  if(mesesSinPagar<=2)return{nivel:'amarillo',label:'Riesgo leve',color:'#d97706',bg:'#fffbeb'};
  if(mesesSinPagar<=4)return{nivel:'rojo',label:'Crítico',color:'var(--red)',bg:'#fef2f2'};
  return{nivel:'negro',label:'Crónico',color:'#374151',bg:'#f9fafb'};
}

    return '<div class="page-header"><div><h2>🔍 Ver Comunidad</h2><p>Selecciona una comunidad para ver su detalle</p></div></div>'+selectorHtml+'<div class="card"><div class="empty">Selecciona una comunidad arriba.</div></div>';
  }

  var score=calcScoreSalud(c=com);
  var sc=scoreColor(score);
  var pct=com.cobro_pct||0;
  var mor=com.morosos||0;
  var uni=com.unidades_count||1;
  var morPct=Math.round(mor/uni*100);
  var intervenciones=(state.saIntervenciones||[]).filter(function(v){return v.comunidad_id===com.id;});
  var intResueltas=intervenciones.filter(function(v){return v.estado==='resuelto';}).length;
  var cobradoMes=Math.round(pct/100*uni*(com.monto_mantencion||80000));
  var deudaTotal=mor*(com.monto_mantencion||80000);

  // Calcular indicadores sociales con datos reales
  var cdData=state.comunidadData||{};
  var unidadesData=cdData.unidades||[];
  var multasData=cdData.multas||[];
  var residentesData=cdData.residentes||[];
  var auditData=cdData.auditLogs||[];

  var hac=calcHacinamiento(unidadesData);
  var rot=calcRotacion(residentesData,auditData);
  var conf=calcConflictos(multasData,unidadesData);

  var kpisHtml=[
    [pct+'%','Tasa de cobro',pct>=80?'var(--green)':'var(--red)'],
    [mor,'Morosos',mor>3?'var(--red)':'var(--green)'],
    [morPct+'%','Índice mora',morPct>10?'var(--red)':'var(--green)'],
    ['68%','Participación','var(--blue)'],
  ].map(function(k){
    return '<div style="background:white;border-radius:8px;padding:8px 12px;text-align:center;min-width:80px">'+
      '<div style="font-size:20px;font-weight:800;color:'+k[2]+'">'+k[0]+'</div>'+
      '<div style="font-size:10px;color:#6b7280">'+k[1]+'</div></div>';
  }).join('');

  // Cards de indicadores sociales SUBDERE
  var indSocialHtml=
    '<div class="card" style="border-left:4px solid #7c3aed;margin-bottom:12px">'+
      '<div class="card-header"><span class="card-title">🏛️ Indicadores Sociales — Vista SUBDERE</span>'+
        '<span style="font-size:10px;color:#9ca3af">Datos agregados · Sin identificación individual</span>'+
      '</div>'+
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 0">'+

        // Hacinamiento
        '<div style="background:'+scoreSemaforoBg(hac.nivel==="optimo"?90:hac.nivel==="moderado"?70:hac.nivel==="critico"?50:30)+';border-radius:8px;padding:12px;text-align:center">'+
          '<div style="font-size:22px;font-weight:800;color:'+hac.color+'">'+(hac.valor?hac.valor+' p/m²':'N/D')+'</div>'+
          '<div style="font-size:11px;font-weight:700;color:'+hac.color+'">Hacinamiento</div>'+
          '<div style="font-size:10px;color:#6b7280;margin-top:2px">'+hac.label+'</div>'+
          (hac.pct>0?'<div style="font-size:10px;color:var(--red);margin-top:3px">'+hac.pct+'% unidades críticas</div>':'')+
          '<div style="font-size:9px;color:#9ca3af;margin-top:2px">'+hac.uMedidas+'/'+hac.uTotal+' unidades con dato</div>'+
        '</div>'+

        // Rotación
        '<div style="background:'+scoreSemaforoBg(rot.nivel==="estable"?90:rot.nivel==="moderada"?70:rot.nivel==="alta"?50:30)+';border-radius:8px;padding:12px;text-align:center">'+
          '<div style="font-size:22px;font-weight:800;color:'+rot.color+'">'+rot.rotacionPct+'%</div>'+
          '<div style="font-size:11px;font-weight:700;color:'+rot.color+'">Rotación anual</div>'+
          '<div style="font-size:10px;color:#6b7280;margin-top:2px">'+rot.label+'</div>'+
          '<div style="font-size:9px;color:#9ca3af;margin-top:3px">'+rot.bajas+' bajas · '+rot.altas+' altas</div>'+
        '</div>'+

        // Conflictos
        '<div style="background:'+scoreSemaforoBg(conf.nivel==="bajo"?90:conf.nivel==="moderado"?70:conf.nivel==="alto"?50:30)+';border-radius:8px;padding:12px;text-align:center">'+
          '<div style="font-size:22px;font-weight:800;color:'+conf.color+'">'+conf.densidad+'</div>'+
          '<div style="font-size:11px;font-weight:700;color:'+conf.color+'">Conflictos/unidad</div>'+
          '<div style="font-size:10px;color:#6b7280;margin-top:2px">'+conf.label+'</div>'+
          (conf.tipoLiderar&&conf.tipoLiderar[1]>0?'<div style="font-size:9px;color:#6b7280;margin-top:3px">Tipo: '+conf.tipoLiderar[0]+' ('+conf.tipoLiderar[1]+')</div>':'')+
          '<div style="font-size:9px;color:#9ca3af;margin-top:2px">'+conf.reincidentes+' unidades reincidentes</div>'+
        '</div>'+

      '</div>'+

      // Detalle hacinamiento si hay datos
      (hac.detalle&&hac.detalle.filter(function(u){return u.critico;}).length>0?
        '<div style="margin-top:8px;padding-top:8px;border-top:1px solid #f3f4f6">'+
          '<div style="font-size:10px;font-weight:700;color:var(--red);margin-bottom:4px">⚠ Unidades con hacinamiento crítico (>0.10 p/m²):</div>'+
          hac.detalle.filter(function(u){return u.critico;}).slice(0,4).map(function(u){
            return '<div style="display:flex;align-items:center;gap:8px;font-size:10px;color:#374151;padding:2px 0">'+
              '<span style="font-weight:700">Depto '+u.numero+'</span>'+
              '<span>'+u.personas+' personas · '+u.sqm+'m²</span>'+
              '<span style="color:var(--red);font-weight:700">'+Math.round(u.ratio*100)/100+' p/m²</span>'+
            '</div>';
          }).join('')+
        '</div>':'')+'</div>';

  return '<div class="page-header">'+
    '<div><h2>🔍 '+com.nombre+'</h2><p>'+(com.ciudad||'')+(com.region?' · '+com.region:'')+'</p></div>'+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn btn-sm" onclick="saRiesgocom(this)" data-id="'+com.id+'" data-nombre="'+com.nombre+'">🗺️ Riesgo</button>'+
      '<button class="btn btn-sm btn-primary" onclick="saIntCom(this)" data-id="'+com.id+'" data-nombre="'+com.nombre+'">🤝 Intervenir</button>'+
      '<button class="btn btn-sm" onclick="saAlertaCom(this)" data-id="'+com.id+'" data-nombre="'+com.nombre+'">🔔 Alerta</button>'+
    '</div>'+
  '</div>'+
  selectorHtml+
  '<div style="background:'+scoreSemaforoBg(score)+';border:2px solid '+sc+';border-radius:12px;padding:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">'+
    '<div>'+
      '<div style="font-size:32px;font-weight:800;color:'+sc+'">'+score+'<span style="font-size:16px">/100</span></div>'+
      '<div style="font-size:13px;font-weight:700;color:'+sc+'">'+scoreLabel(score)+'</div>'+
      '<div style="font-size:11px;color:#6b7280">Índice de salud comunitaria</div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+kpisHtml+'</div>'+
  '</div>'+
  indSocialHtml+
  '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px">'+
    '<div class="card">'+
      '<div class="card-header"><span class="card-title">💰 Financiero del mes</span></div>'+
      '<div class="stat-row"><span>Cobrado</span><span style="color:var(--green);font-weight:700">'+fmt(cobradoMes)+'</span></div>'+
      '<div class="stat-row"><span>Unidades pagadas</span><span style="font-weight:700">'+Math.round(pct/100*uni)+' / '+uni+'</span></div>'+
      '<div class="stat-row"><span>Deuda acumulada</span><span style="color:var(--red);font-weight:700">'+fmt(deudaTotal)+'</span></div>'+
      '<div class="stat-row"><span>Mantención mensual</span><span style="font-weight:700">'+fmt(com.monto_mantencion||0)+'</span></div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="card-header"><span class="card-title">🗳️ Participación</span></div>'+
      '<div class="stat-row"><span>Votaciones totales</span><span style="font-weight:700">3</span></div>'+
      '<div class="stat-row"><span>Cerradas con acta</span><span style="font-weight:700">2</span></div>'+
      '<div class="stat-row"><span>% participación</span><span style="color:var(--blue);font-weight:700">68%</span></div>'+
      '<div class="stat-row"><span>Alertas activas</span><span style="color:var(--red);font-weight:700">2</span></div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="card-header"><span class="card-title">🤝 Intervenciones</span></div>'+
      '<div class="stat-row"><span>Total</span><span style="font-weight:700">'+intervenciones.length+'</span></div>'+
      '<div class="stat-row"><span>Resueltas</span><span style="color:var(--green);font-weight:700">'+intResueltas+'</span></div>'+
      '<div class="stat-row"><span>Pendientes</span><span style="color:#d97706;font-weight:700">'+(intervenciones.length-intResueltas)+'</span></div>'+
      '<div style="margin-top:8px"><button class="btn btn-sm btn-primary" style="width:100%" onclick="saIntCom(this)" data-id="'+com.id+'" data-nombre="'+com.nombre+'">Registrar →</button></div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="card-header"><span class="card-title">📂 Documentos</span></div>'+
      '<div class="stat-row"><span>Documentos subidos</span><span style="font-weight:700">4</span></div>'+
      '<div class="stat-row"><span>Actas de votación</span><span style="font-weight:700">2</span></div>'+
      '<div style="margin-top:8px;display:flex;gap:6px">'+
        '<button class="btn btn-sm" style="flex:1" onclick="saVerDocs(this)" data-id="'+com.id+'" data-nombre="'+com.nombre+'">📂 Docs</button>'+
        '<button class="btn btn-sm" style="flex:1" onclick="saAlertaCom(this)" data-id="'+com.id+'" data-nombre="'+com.nombre+'">🔔 Alerta</button>'+
      '</div>'+
    '</div>'+
  '</div>'+
  '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;font-size:11px;color:#6b7280">'+
    '🔒 Modo solo lectura — el Admin Municipal puede ver todo pero no modificar datos internos.'+
  '</div>';
}

// ══════════════════════════════════════════════════════════════
//  COMPARATIVA — ranking y análisis entre comunidades
// ══════════════════════════════════════════════════════════════
function buildSAComparativa(){
  var comunidades=state.comunidades||[];
  var activas=comunidades.filter(function(c){return c.activa;});
  var ciudades=activas.map(function(c){return c.ciudad;}).filter(function(v,i,a){return v&&a.indexOf(v)===i;});
  var filtroCity=state.saFiltroCity||'todas';
  var comsVer=filtroCity==='todas'?activas:activas.filter(function(c){return c.ciudad===filtroCity;});
  var porScore=[].concat(comsVer).sort(function(a,b){return calcScoreSalud(b)-calcScoreSalud(a);});
  var porCobro=[].concat(comsVer).sort(function(a,b){return(b.cobro_pct||0)-(a.cobro_pct||0);});
  var porMora=[].concat(comsVer).sort(function(a,b){
    return((b.morosos||0)/(b.unidades_count||1))-((a.morosos||0)/(a.unidades_count||1));
  });

  var filtroHtml='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">'+
    '<button class="btn btn-sm '+(filtroCity==='todas'?'btn-primary':'')+'" onclick="saFiltrarCiudad(this)" data-city="todas">🌐 Todas</button>'+
    ciudades.map(function(c){
      return '<button class="btn btn-sm '+(filtroCity===c?'btn-primary':'')+'" onclick="saFiltrarCiudad(this)" data-city="'+c+'">'+c+'</button>';
    }).join('')+
  '</div>';

  var resumenRows=comsVer.map(function(c){
    var score=calcScoreSalud(c);
    var sc=scoreColor(score);
    var pct=c.cobro_pct||0;
    var mor=c.morosos||0;
    var tend=pct>=90?'↑ Mejora':pct>=75?'→ Estable':'↓ Deterioro';
    var tcolor=pct>=90?'var(--green)':pct>=75?'#d97706':'var(--red)';
    return '<tr>'+
      '<td style="font-weight:600;cursor:pointer" onclick="saSelCom(this)" data-id="'+c.id+'">'+c.nombre+'</td>'+
      '<td style="text-align:center;font-weight:800;color:'+sc+'">'+score+'</td>'+
      '<td style="text-align:center;color:'+(pct>=80?'var(--green)':'var(--red)')+';font-weight:700">'+pct+'%</td>'+
      '<td style="text-align:center;color:'+(mor>3?'var(--red)':'var(--green)')+';font-weight:700">'+mor+'</td>'+
      '<td style="text-align:center;color:'+tcolor+';font-weight:600">'+tend+'</td>'+
      '<td style="text-align:center"><button class="btn btn-sm" style="font-size:10px" onclick="saSelCom(this)" data-id="'+c.id+'">Ver →</button></td>'+
    '</tr>';
  }).join('');

  function miniRank(title,arr,valFn,colorFn){
    return '<div class="card">'+
      '<div class="card-header"><span class="card-title">'+title+'</span></div>'+
      arr.slice(0,5).map(function(c,i){
        var val=valFn(c);
        var color=colorFn(val);
        var score=calcScoreSalud(c);
        return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f3f4f6;cursor:pointer" onclick="saSelCom(this)" data-id="'+c.id+'">'+
          '<div style="width:22px;height:22px;border-radius:50%;background:'+(i===0?'#fef9c3':'#f3f4f6')+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">'+(i+1)+'</div>'+
          '<div style="flex:1;font-size:12px;font-weight:600;color:var(--navy)">'+c.nombre+'</div>'+
          '<div style="font-size:16px;font-weight:800;color:'+color+'">'+val+'</div>'+
          '<div style="font-size:10px;color:'+scoreColor(score)+';background:'+scoreSemaforoBg(score)+';padding:1px 5px;border-radius:6px">'+score+'</div>'+
        '</div>';
      }).join('')+
    '</div>';
  }

  return '<div class="page-header">'+
    '<div><h2>📊 Comparativa de Comunidades</h2>'+
    '<p>Análisis comparativo para priorización de intervención municipal</p></div>'+
    '<button class="btn btn-sm" onclick="saGoView(this)" data-view="sa_dashboard">← Panel</button>'+
  '</div>'+
  filtroHtml+
  '<div class="card" style="margin-bottom:14px">'+
    '<div class="card-header"><span class="card-title">Resumen — '+comsVer.length+' comunidades</span></div>'+
    '<table><thead><tr>'+
      '<th>Comunidad</th><th style="text-align:center">Score</th>'+
      '<th style="text-align:center">Cobro</th><th style="text-align:center">Morosos</th>'+
      '<th style="text-align:center">Tendencia</th><th style="text-align:center">Detalle</th>'+
    '</tr></thead><tbody>'+resumenRows+'</tbody></table>'+
  '</div>'+
  '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">'+
    miniRank('🏆 Mejor score',porScore,
      function(c){return calcScoreSalud(c)+'/100';},
      function(v){return scoreColor(parseInt(v));})+
    miniRank('💰 Mejor cobro',porCobro,
      function(c){return(c.cobro_pct||0)+'%';},
      function(v){return parseInt(v)>=80?'var(--green)':'var(--red)';})+
    miniRank('🔴 Mayor morosidad',porMora,
      function(c){return Math.round((c.morosos||0)/(c.unidades_count||1)*100)+'%';},
      function(v){return parseInt(v)>10?'var(--red)':'var(--green)';})+
  '</div>';
}

function buildSARiesgo(){
  var comunidades=state.comunidades||[];
  var filtroId=state.saRiesgoComId||null;
  var filtroNombre=state.saRiesgoComNombre||null;
  var comsFiltradas=filtroId?comunidades.filter(function(c){return c.id===filtroId;}):comunidades;

  // Clasificar hogares por comunidad (datos demo)
  function getClasificacion(com){
    var uni=com.unidades_count||0;
    var mor=com.morosos||0;
    var pct=com.cobro_pct||100;
    var alDia=Math.round(uni*(pct/100));
    var riesgo=Math.max(0,mor-Math.floor(mor*0.4));
    var critico=Math.floor(mor*0.4);
    var cronico=Math.max(0,mor-riesgo-critico);
    return{
      verde:{n:alDia,label:'Al día',color:'var(--green)',bg:'#f0fdf4'},
      amarillo:{n:riesgo,label:'Riesgo (1-2 meses)',color:'#d97706',bg:'#fffbeb'},
      rojo:{n:critico,label:'Crítico (3+ meses)',color:'var(--red)',bg:'#fef2f2'},
      negro:{n:cronico,label:'Crónico (histórico)',color:'#374151',bg:'#f3f4f6'},
    };
  }

  // Ranking global por score
  var ranking=[].concat(comunidades).sort(function(a,b){return calcScoreSalud(a)-calcScoreSalud(b);});
  var rankingHtml=ranking.map(function(c,idx){
    var score=calcScoreSalud(c);
    var sc=scoreColor(score);
    var bg=scoreSemaforoBg(score);
    return '<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:'+bg+';margin-bottom:6px;cursor:pointer" onclick="setState({saRiesgoComId:\''+c.id+'\',saRiesgoComNombre:\''+c.nombre+'\'})">'+
      '<div style="font-size:18px;font-weight:800;color:#9ca3af;width:24px;text-align:center">'+(idx+1)+'</div>'+
      '<div style="flex:1">'+
        '<div style="font-size:12px;font-weight:700;color:var(--navy)">'+c.nombre+'</div>'+
        '<div style="font-size:10px;color:#6b7280">'+(c.ciudad||'')+'</div>'+
      '</div>'+
      '<div style="text-align:right">'+
        '<div style="font-size:18px;font-weight:800;color:'+sc+'">'+score+'</div>'+
        '<div style="font-size:9px;color:#6b7280">score</div>'+
      '</div>'+
      '<div style="font-size:11px;color:'+sc+';font-weight:700">'+scoreLabel(score).split(' ')[1]+'</div>'+
    '</div>';
  }).join('');

  // Detalle de comunidad seleccionada
  var detalleHtml='';
  if(filtroId){
    var com=comunidades.find(function(c){return c.id===filtroId;});
    if(com){
      var cls=getClasificacion(com);
      var score=calcScoreSalud(com);
      var morPct=com.unidades_count?Math.round((com.morosos||0)/com.unidades_count*100):0;
      detalleHtml='<div class="card" style="border-left:5px solid '+scoreColor(score)+';margin-bottom:12px">'+
        '<div class="card-header">'+
          '<span class="card-title">🏢 '+com.nombre+' — Score '+score+'/100</span>'+
          '<button class="btn btn-sm" onclick="setState({saRiesgoComId:null,saRiesgoComNombre:null})">← Volver</button>'+
        '</div>'+
        // Clasificación de hogares
        '<div style="margin-bottom:12px">'+
          '<div style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;margin-bottom:8px">Clasificación de hogares</div>'+
          '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">'+
          Object.entries(cls).map(function(entry){
            var k=entry[0];var v=entry[1];
            var pctBar=com.unidades_count?Math.round(v.n/com.unidades_count*100):0;
            return '<div style="background:'+v.bg+';border-radius:8px;padding:10px;text-align:center">'+
              '<div style="font-size:24px;font-weight:800;color:'+v.color+'">'+v.n+'</div>'+
              '<div style="font-size:10px;font-weight:600;color:'+v.color+';margin-bottom:4px">'+v.label+'</div>'+
              '<div style="background:#e5e7eb;border-radius:4px;height:4px">'+
                '<div style="background:'+v.color+';border-radius:4px;height:4px;width:'+pctBar+'%"></div>'+
              '</div>'+
              '<div style="font-size:9px;color:#9ca3af;margin-top:3px">'+pctBar+'% del edificio</div>'+
            '</div>';
          }).join('')+
          '</div>'+
        '</div>'+
        // Indicadores
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+
          '<div style="background:#f9fafb;border-radius:8px;padding:10px;text-align:center">'+
            '<div style="font-size:22px;font-weight:800;color:var(--red)">'+morPct+'%</div>'+
            '<div style="font-size:10px;color:#6b7280">Índice de morosidad</div>'+
          '</div>'+
          '<div style="background:#f9fafb;border-radius:8px;padding:10px;text-align:center">'+
            '<div style="font-size:22px;font-weight:800;color:'+(com.cobro_pct>=80?'var(--green)':'var(--red)')+'">'+( com.cobro_pct||0)+'%</div>'+
            '<div style="font-size:10px;color:#6b7280">Tasa de cobro</div>'+
          '</div>'+
          '<div style="background:#f9fafb;border-radius:8px;padding:10px;text-align:center">'+
            '<div style="font-size:22px;font-weight:800;color:'+scoreColor(score)+'">'+score+'/100</div>'+
            '<div style="font-size:10px;color:#6b7280">Score salud</div>'+
          '</div>'+
        '</div>'+
        '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
      '<div style="margin-top:8px"><button class="btn btn-sm btn-primary" style="width:100%" onclick="saIntComId(this)" data-id="'+com.id+'" data-nombre="'+com.nombre+'">Registrar intervención →</button></div>'+
          '<button class="btn btn-sm" onclick="saAlertaCom(this)" data-id="'+com.id+'" data-nombre="'+com.nombre+'">🔔 Enviar alerta</button>'+
        '</div>'+
      '</div>';
    }
  }

// ══════════════════════════════════════════════════════════════
//  MÉTRICAS DE IMPACTO
// ══════════════════════════════════════════════════════════════
function buildSAImpacto(){
  var comunidades=state.comunidades||[];
  var activas=comunidades.filter(function(c){return c.activa;});
  var totalUnidades=comunidades.reduce(function(s,c){return s+(c.unidades_count||0);},0);
  var totalMorosos=comunidades.reduce(function(s,c){return s+(c.morosos||0);},0);
  var cobrosArr=comunidades.filter(function(c){return c.cobro_pct;}).map(function(c){return c.cobro_pct;});
  var cobroprom=cobrosArr.length?Math.round(cobrosArr.reduce(function(s,v){return s+v;},0)/cobrosArr.length):0;
  var scores=comunidades.map(function(c){return calcScoreSalud(c);});
  var scoreGlobal=scores.length?Math.round(scores.reduce(function(s,v){return s+v;},0)/scores.length):0;
  var intervenciones=state.saIntervenciones||[];
  var intResueltas=intervenciones.filter(function(v){return v.estado==='resuelto';}).length;
  var intTotal=intervenciones.length;

  // Tabla de impacto por comunidad (simulada con datos demo)
  var impactoRows=activas.map(function(c){
    var score=calcScoreSalud(c);
    // En producción esto vendría de histórico real
    var cobro_ant=Math.max(40,( c.cobro_pct||0)-Math.round(Math.random()*15));
    var mor_ant=Math.min(100,(c.morosos||0)+Math.round(Math.random()*3));
    var mejoraCobro=(c.cobro_pct||0)-cobro_ant;
    var mejoraMor=mor_ant-(c.morosos||0);
    return '<tr>'+
      '<td style="font-weight:700">'+c.nombre+'</td>'+
      '<td style="text-align:center">'+
        '<span style="color:var(--red);font-size:11px">'+cobro_ant+'%</span>'+
        '<span style="color:#9ca3af;font-size:11px"> → </span>'+
        '<span style="color:var(--green);font-weight:700">'+( c.cobro_pct||0)+'%</span>'+
        (mejoraCobro>0?'<span style="color:var(--green);font-size:10px"> +'+mejoraCobro+'%</span>':'')+
      '</td>'+
      '<td style="text-align:center">'+
        '<span style="color:var(--red);font-size:11px">'+mor_ant+'</span>'+
        '<span style="color:#9ca3af;font-size:11px"> → </span>'+
        '<span style="color:var(--green);font-weight:700">'+(c.morosos||0)+'</span>'+
        (mejoraMor>0?'<span style="color:var(--green);font-size:10px"> -'+mejoraMor+'</span>':'')+
      '</td>'+
      '<td style="text-align:center;font-weight:800;color:'+scoreColor(score)+'">'+score+'/100</td>'+
      '<td style="text-align:center"><span class="badge '+(score>=80?'badge-green':score>=60?'badge-amber':'badge-red')+'">'+scoreLabel(score).split(' ').slice(1).join(' ')+'</span></td>'+
    '</tr>';
  }).join('');

  return '<div class="page-header">'+
    '<div><h2>📈 Métricas de Impacto</h2>'+
    '<p>Demostración de valor — antes vs después de implementar Vecinoo</p></div>'+
    '<button class="btn btn-sm" onclick="saGoView(this)" data-view="sa_dashboard">← Panel</button>'+
  '</div>'+
  // KPIs de impacto global
  '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">'+
    '<div class="metric" style="border-top:3px solid var(--green)">'+
      '<div class="metric-label">Comunidades digitalizadas</div>'+
      '<div class="metric-value green">'+activas.length+'</div>'+
      '<div style="font-size:10px;color:#6b7280;margin-top:2px">'+totalUnidades+' hogares con acceso digital</div>'+
    '</div>'+
    '<div class="metric" style="border-top:3px solid var(--blue)">'+
      '<div class="metric-label">Score salud promedio</div>'+
      '<div class="metric-value blue">'+scoreGlobal+'/100</div>'+
    '</div>'+
    '<div class="metric" style="border-top:3px solid var(--gold)">'+
      '<div class="metric-label">Cobro promedio</div>'+
      '<div class="metric-value gold">'+cobroprom+'%</div>'+
      '<div style="font-size:10px;color:var(--green);margin-top:2px">↑ vs gestión manual (est. 60%)</div>'+
    '</div>'+
    '<div class="metric" style="border-top:3px solid var(--purple)">'+
      '<div class="metric-label">Intervenciones resueltas</div>'+
      '<div class="metric-value" style="color:var(--purple)">'+intResueltas+'/'+intTotal+'</div>'+
    '</div>'+
  '</div>'+
  // Tabla de impacto por comunidad
  '<div class="card">'+
    '<div class="card-header"><span class="card-title">Evolución por comunidad</span>'+
      '<span style="font-size:10px;color:#9ca3af">* Comparativa vs. línea base al ingreso</span>'+
    '</div>'+
    '<table>'+
      '<thead><tr>'+
        '<th>Comunidad</th>'+
        '<th style="text-align:center">Cobro (antes → ahora)</th>'+
        '<th style="text-align:center">Morosos (antes → ahora)</th>'+
        '<th style="text-align:center">Score actual</th>'+
        '<th style="text-align:center">Estado</th>'+
      '</tr></thead>'+
      '<tbody>'+impactoRows+'</tbody>'+
    '</table>'+
  '</div>'+
  // Argumento para postulación
  '<div class="card" style="border-left:4px solid var(--gold);margin-top:12px;padding:14px 16px">'+
    '<div style="font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;margin-bottom:8px">💡 Para postulación Capital Semilla / Startup Chile</div>'+
    '<div style="font-size:12px;color:var(--navy2);line-height:1.7">'+
      'Vecinoo gestiona hoy <b>'+totalUnidades+' hogares</b> en <b>'+activas.length+' comunidades</b>, '+
      'con un cobro promedio del <b>'+cobroprom+'%</b> vs el ~60% estimado en gestión manual. '+
      'Eso representa una mejora de <b>'+(cobroprom-60)+'+ puntos porcentuales</b> en recuperación financiera comunitaria. '+
      'Con intervención dirigida y trazabilidad total, Vecinoo es la herramienta de política pública comunitaria más concreta del mercado chileno.'+
    '</div>'+
  '</div>';
}

function buildPlanesPage(){
  const planes = state.comunidadData.planesPago||[];
  const unidades = state.comunidadData.unidades||[];
  const residentes = state.comunidadData.residentes||[];
  const morosos = unidades.filter(u=>esUnidadMorosa(u.id));

  const planesActivos = planes.filter(p=>p.estado==='activo');
  const planesCumplidos = planes.filter(p=>p.estado==='cumplido');
  const planesAtrasados = planes.filter(p=>{
    const vencidas = (p.cuotas||[]).filter(c=>!c.pagada&&new Date(c.fecha_vencimiento)<new Date());
    return vencidas.length > 0;
  });

  return`
  <div class="page-header">
    <div><h2>🤝 Planes de Pago</h2><p>Gestión de acuerdos de pago para morosos</p></div>
    ${isFullAccess()?`<button class="btn btn-primary" onclick="setState({modal:{type:'nuevo_plan'}})">+ Nuevo plan</button>`:''}
  </div>
  <div class="metrics" style="grid-template-columns:repeat(4,1fr)">
    <div class="metric"><div class="metric-label">Morosos</div><div class="metric-value red">${morosos.length}</div></div>
    <div class="metric"><div class="metric-label">Planes activos</div><div class="metric-value blue">${planesActivos.length}</div></div>
    <div class="metric"><div class="metric-label">Con atraso</div><div class="metric-value red">${planesAtrasados.length}</div></div>
    <div class="metric"><div class="metric-label">Cumplidos</div><div class="metric-value green">${planesCumplidos.length}</div></div>
  </div>

  ${morosos.length>0&&planes.length===0?`
  <div style="background:#fef9c3;border:1px solid #fde047;border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <span style="font-size:13px;color:#92400e">⚠️ Hay <b>${morosos.length} morosos</b> sin plan de pago. Un acuerdo formal mejora la recuperación.</span>
    ${isFullAccess()?`<button class="btn btn-sm" style="border-color:#d97706;color:#d97706" onclick="setState({modal:{type:'nuevo_plan'}})">Crear plan →</button>`:''}
  </div>`:''}

  ${planesActivos.length===0&&planesCumplidos.length===0?`<div class="card"><div class="empty">No hay planes de pago registrados.</div></div>`:''}

  ${planesActivos.map(plan=>{
    const u = unidades.find(x=>x.id===plan.unidad_id);
    const r = residentes.find(x=>x.unidad_id===plan.unidad_id&&x.activo);
    const cuotas = plan.cuotas||[];
    const pagadas = cuotas.filter(c=>c.pagada).length;
    const vencidas = cuotas.filter(c=>!c.pagada&&new Date(c.fecha_vencimiento)<new Date());
    const pct = Math.round(pagadas/Math.max(cuotas.length,1)*100);
    return`
    <div class="card" style="border-left:4px solid ${vencidas.length>0?'var(--red)':'var(--blue)'};margin-bottom:10px">
      <div class="card-header">
        <span class="card-title">Depto ${u?.numero||'—'} — ${r?.nombre||'—'}</span>
        <span class="badge ${vencidas.length>0?'badge-red':'badge-blue'}">${vencidas.length>0?'⚠ '+vencidas.length+' cuota(s) vencida(s)':'Al día'}</span>
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:#6b7280">
        <span>Deuda original: <b>${fmt(plan.monto_total)}</b></span>
        <span>Cuotas: <b>${pagadas}/${cuotas.length}</b></span>
        <span>Recuperado: <b style="color:var(--green)">${fmt(cuotas.filter(c=>c.pagada).reduce((s,c)=>s+c.monto,0))}</b></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${pct===100?'var(--green)':vencidas.length>0?'var(--red)':'var(--blue)'}"></div></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-top:10px">
        ${cuotas.map((c,i)=>{
          const vencida=!c.pagada&&new Date(c.fecha_vencimiento)<new Date();
          return`<div style="background:${c.pagada?'#f0fdf4':vencida?'#fef2f2':'#f9fafb'};border:1px solid ${c.pagada?'#bbf7d0':vencida?'#fecaca':'#e5e5e5'};border-radius:8px;padding:8px;font-size:11px">
            <div style="font-weight:700;color:${c.pagada?'var(--green)':vencida?'var(--red)':'var(--navy)'}">Cuota ${i+1}</div>
            <div style="color:#6b7280">${c.fecha_vencimiento}</div>
            <div style="font-weight:700">${fmt(c.monto)}</div>
            ${c.pagada?`<div style="color:var(--green)">✅ Pagada</div>`:
              vencida?`<div style="color:var(--red)">⚠ Vencida</div>${isFullAccess()?`<button class="btn btn-sm" style="margin-top:4px;width:100%;font-size:10px" onclick="marcarCuotaPagada('${plan.id}',${i})">Marcar pagada</button>`:''}`
              :`<div style="color:#9ca3af">Pendiente</div>${isFullAccess()||state.currentUser?.unidad_id===plan.unidad_id?`<button class="btn btn-sm btn-primary" style="margin-top:4px;width:100%;font-size:10px" onclick="doIniciarPago(${c.monto},'${plan.id}',${i})">💳 Pagar</button>`:''}
            }
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('')}

  ${planesCumplidos.length>0?`
  <div class="card">
    <div class="card-header"><span class="card-title" style="color:var(--green)">✅ Planes cumplidos (${planesCumplidos.length})</span></div>
    ${planesCumplidos.map(plan=>{
      const u=unidades.find(x=>x.id===plan.unidad_id);
      const r=residentes.find(x=>x.unidad_id===plan.unidad_id&&x.activo);
      return`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6;font-size:12px">
        <span style="font-weight:600">Depto ${u?.numero||'—'} · ${r?.nombre||'—'}</span>
        <span style="color:var(--green);font-weight:700">${fmt(plan.monto_total)} recuperado</span>
      </div>`;
    }).join('')}
  </div>`:''}`;
}

window.calcCuotasPlan = function(){
  const unidId = document.getElementById('planUnidad')?.value;
  const nCuotas = parseInt(document.getElementById('planCuotas')?.value)||3;
  let deuda = parseFloat(document.getElementById('planDeuda')?.value);
  if(unidId && !deuda){
    const opt = document.querySelector('#planUnidad option:checked');
    deuda = parseFloat(opt?.dataset?.deuda)||0;
    if(deuda) document.getElementById('planDeuda').value = deuda;
  }
  if(!deuda||!nCuotas) return;
  const mCuota = Math.ceil(deuda/nCuotas);
  const fechaBase = new Date(document.getElementById('planFecha')?.value||Date.now());
  const cuotas = Array.from({length:nCuotas},(_,i)=>{
    const f = new Date(fechaBase);
    f.setMonth(f.getMonth()+i);
    return{n:i+1, monto:mCuota, fecha:f.toISOString().split('T')[0]};
  });
  const resumen = document.getElementById('planResumen');
  const content = document.getElementById('planResumenContent');
  if(resumen&&content){
    resumen.style.display='block';
    content.innerHTML = `<div style="font-weight:700;color:var(--navy);margin-bottom:6px">Resumen del plan:</div>`+
      cuotas.map(c=>`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #e5e5e5">
        <span>Cuota ${c.n} — ${c.fecha}</span><span style="font-weight:700">${fmt(c.monto)}</span>
      </div>`).join('')+
      `<div style="display:flex;justify-content:space-between;padding:4px 0;font-weight:700">
        <span>Total a recuperar</span><span style="color:var(--green)">${fmt(mCuota*nCuotas)}</span>
      </div>`;
  }
};

window.doCrearPlan = async function(){
  const unidId = document.getElementById('planUnidad')?.value;
  const nCuotas = parseInt(document.getElementById('planCuotas')?.value)||3;
  const deuda = parseFloat(document.getElementById('planDeuda')?.value);

  const notas = document.getElementById('planNotas')?.value?.trim();
  if(!unidId||!deuda||!fechaBase){ showAlert('Completa unidad, deuda y fecha','error'); return; }
  const mCuota = Math.ceil(deuda/nCuotas);
  const fBase = new Date(fechaBase);
  const cuotas = Array.from({length:nCuotas},(_,i)=>{
    const f = new Date(fBase);
    f.setMonth(f.getMonth()+i);
    return{monto:mCuota, fecha_vencimiento:f.toISOString().split('T')[0], pagada:false, fecha_pago:null};
  });
  const nuevoPlan = {
    id:'plan_'+Date.now(), unidad_id:unidId,
    monto_total:deuda, cuotas, notas:notas||null,

window.marcarCuotaPagada = function(planId, cuotaIdx){
  const planes = state.comunidadData.planesPago||[];

  plan.cuotas[cuotaIdx].fecha_pago = new Date().toISOString().split('T')[0];
  if(plan.cuotas.every(c=>c.pagada)) plan.estado='cumplido';
  // Registrar pago en tabla pagos
  const u = state.comunidadData.unidades.find(x=>x.id===plan.unidad_id);
  auditLog('CUOTA_PLAN_PAGADA',`Cuota ${cuotaIdx+1} plan ${planId} · Depto ${u?.numero||'—'} · ${fmt(plan.cuotas[cuotaIdx].monto)}`);

window.procesarExtracto=function(input){
  const file=input.files[0];
  if(!file){return;}
  const reader=new FileReader();
  reader.onload=function(e){
    const text=e.target.result;
    const lineas=text.split('\n').filter(l=>l.trim());
    const pagos=state.comunidadData.pagos||[];
    const unidades=state.comunidadData.unidades||[];
    const residentes=state.comunidadData.residentes||[];
    const resultados=[];

    lineas.slice(1).forEach(linea=>{
      const cols=linea.split(',').map(c=>c.trim().replace(/"/g,''));
      if(cols.length<3) return;
      // Intentar detectar formato: fecha, descripcion, monto
      const fecha=cols[0]||'';
      const descripcion=cols[1]||'';
      const montoStr=(cols[2]||'').replace(/\./g,'').replace(',','.');
      const monto=parseFloat(montoStr);
      if(!monto||monto<=0) return;

      // Buscar coincidencia con pagos registrados
      let match=null;
      unidades.forEach(u=>{
        const r=residentes.find(x=>x.unidad_id===u.id&&x.activo);
        const gcMonto=u.monthly_fee||0;
        // Coincidencia por monto exacto o ±5%
        if(Math.abs(monto-gcMonto)/gcMonto<0.05){
          match={unidad_id:u.id,numero:u.numero,nombre:r?.nombre||'—',monto:gcMonto};
        }
      });
      resultados.push({fecha,descripcion,monto,match,confirmado:false});
    });

    setState({conciliacionResultados:resultados,view:'conciliacion'});
    showAlert(`✅ Extracto procesado — ${resultados.length} movimientos analizados`,'success');
  };
  reader.readAsText(file);
};

window.confirmarMatch=function(idx){
  const resultados=[...(state.conciliacionResultados||[])];
  const r=resultados[idx];
  if(!r||!r.match) return;
  // Registrar el pago
  const m=thisMonth();
  const nuevoPago={
    id:'conc_'+Date.now()+'_'+idx,
    comunidad_id:state.selectedComunidad.id,
    unidad_id:r.match.unidad_id,
    month:m,
    amount:r.monto,
    method:'transferencia_banco',
    date:r.fecha||new Date().toISOString().split('T')[0],
    created_at:new Date().toISOString(),
  };
  state.comunidadData.pagos=[nuevoPago,...(state.comunidadData.pagos||[])];
  resultados[idx].confirmado=true;
  resultados[idx].registrado=true;
  setState({conciliacionResultados:resultados});
  showAlert('✅ Pago de Depto '+r.match.numero+' registrado','success');
  render();
};

window.confirmarTodosMatch=function(){
  const resultados=state.conciliacionResultados||[];
  let count=0;
  resultados.forEach((_,i)=>{
    if(resultados[i].match&&!resultados[i].confirmado){
      window.confirmarMatch(i);
      count++;
    }
  });
  showAlert('✅ '+count+' pagos confirmados automáticamente','success');
};

window.descartarMatch=function(idx){
  const resultados=[...(state.conciliacionResultados||[])];
  resultados.splice(idx,1);
  setState({conciliacionResultados:resultados});
  render();
};

window.doEnviarAlertaGlobal=async()=>{
  const tipo=document.getElementById('saAlertaTipo')?.value||'aviso';
  const destino=document.getElementById('saAlertaDestino')?.value||'global';
  const titulo=document.getElementById('saAlertaTitulo')?.value?.trim();
  const mensaje=document.getElementById('saAlertaMensaje')?.value?.trim();
  const fecha=document.getElementById('saAlertaFecha')?.value||today();
  if(!titulo||!mensaje){showAlert('Título y mensaje son obligatorios','error');return;}

  setState({loading:true});
  try{
    const comunidades=state.comunidades||[];
    const destComuns=destino==='global'?comunidades:comunidades.filter(c=>c.id===destino);
    let errores=0;
    for(const c of destComuns){
      const{error}=await sb.from('alertas').insert({
        comunidad_id:c.id,tipo,titulo,descripcion:mensaje,
        date:fecha,time:'08:00',status:'activa'
      });
      if(error)errores++;

function getMetrics(month){
  const{pagos,gastos,unidades,residentes}=state.comunidadData;
  const mp=pagos.filter(p=>p.month===month);
  const me=gastos.filter(g=>g.month===month);
  const totalIn=mp.reduce((s,p)=>s+p.amount,0);
  const totalOut=me.reduce((s,e)=>s+e.amount,0);
  const paidUnits=new Set(mp.map(p=>p.unidad_id));
  const occupied=unidades.filter(u=>residentes.some(r=>r.unidad_id===u.id));
  const morose=occupied.filter(u=>!paidUnits.has(u.id));
  return{totalIn,totalOut,balance:totalIn-totalOut,paidUnits,occupied,morose,mp,me};
}

// ── Deuda acumulada por unidad (cobros atrasados) ──
// ════════════════════════════════════════════════════════════════
//  DEUDA ACUMULADA — Cobros atrasados entre meses
//  Calcula correctamente todos los meses sin pago desde el ingreso
// ════════════════════════════════════════════════════════════════
function calcDeudaAcumulada(unitId){
  if(_deudaCache[unitId]) return _deudaCache[unitId];
  const _empty = {mesesDeuda:[], totalDeuda:0, mesesSinPagar:0, tieneDeudaHistorica:false, mesActualPagado:true, gcMesActual:0, totalConMesActual:0, mesActual:thisMonth()};
  if(!unitId || !state.comunidadData?.unidades) return _empty;
  const unit = state.comunidadData.unidades.find(u=>u.id===unitId);
  if(!unit?.monthly_fee) return _empty;

  const pagos = state.comunidadData.pagos.filter(p=>p.unidad_id===unitId);
  const mesesPagados = new Set(pagos.map(p=>p.month));

  // Determinar mes de inicio:
  // 1. Si hay pagos: desde el primer mes pagado
  // 2. Si no hay pagos pero tiene fecha_ingreso: desde ese mes
  // 3. Si no: desde hace 12 meses (límite razonable de búsqueda)
  let inicio;
  if(pagos.length > 0){
    // Partir desde el primer pago registrado
    inicio = pagos.map(p=>p.month).sort()[0];
  } else if(unit.fecha_ingreso){
    inicio = unit.fecha_ingreso.substr(0,7);
  } else {
    // Sin historial: revisar 12 meses hacia atrás
    const d = new Date(); d.setMonth(d.getMonth()-11);
    inicio = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }

  // FIN: mes ANTERIOR al mes actual
  // El mes en curso NO es deuda aún (el residente puede pagar hoy)
  const ahora = new Date();
  const mesActual = `${ahora.getFullYear()}-${String(ahora.getMonth()+1).padStart(2,'0')}`;
  const finDate = new Date(ahora.getFullYear(), ahora.getMonth(), 1);
  finDate.setMonth(finDate.getMonth()-1); // mes anterior
  const fin = `${finDate.getFullYear()}-${String(finDate.getMonth()+1).padStart(2,'0')}`;

  // Si el inicio es el mes actual o posterior, no hay deuda histórica
  if(inicio >= mesActual) return {mesesDeuda:[], totalDeuda:0, mesesSinPagar:0, tieneDeudaHistorica:false, mesActualPagado: mesesPagados.has(mesActual)};

  const mesesDeuda = [];
  let cur = new Date(inicio+'-02'); // día 2 para evitar timezone bugs
  const finObj = new Date(fin+'-02');

  while(cur <= finObj){
    const mes = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`;
    if(!mesesPagados.has(mes)){
      const multas = state.comunidadData.multas.filter(
        f=>f.unidad_id===unitId && f.month===mes && f.status==='pendiente'
      );
      const multasAmt = multas.reduce((s,f)=>s+f.amount,0);
      mesesDeuda.push({
        mes,
        gc: unit.monthly_fee,
        multas: multasAmt,
        total: unit.monthly_fee + multasAmt,
        diasAtraso: Math.floor((new Date() - new Date(mes+'-01')) / (1000*60*60*24))
      });
    }
    cur.setMonth(cur.getMonth()+1);
  }

  const totalDeuda = mesesDeuda.reduce((s,m)=>s+m.total,0);
  const mesActualPagado = mesesPagados.has(mesActual);
  const gcMesActual = mesActualPagado ? 0 : (unit.monthly_fee||0);

  const result = {
    mesesDeuda,
    totalDeuda,
    mesesSinPagar: mesesDeuda.length,
    tieneDeudaHistorica: mesesDeuda.length > 0,
    mesActualPagado,
    gcMesActual,
    // Total real incluyendo mes actual si no pagó
    totalConMesActual: totalDeuda + gcMesActual,
    mesActual,
  };
  _deudaCache[unitId] = result;
  return result;
}

// Devuelve true si una unidad tiene deuda en CUALQUIER mes (no solo el actual)
function esUnidadMorosa(unitId){
  const deuda = calcDeudaAcumulada(unitId);
  // Es morosa si tiene deuda histórica O no pagó el mes actual
  return deuda.tieneDeudaHistorica || !deuda.mesActualPagado;
}

// Devuelve el total adeudado real de una unidad (histórico + mes actual)
function getTotalDeudaUnidad(unitId){
  const deuda = calcDeudaAcumulada(unitId);
  return deuda.totalConMesActual || 0;
}

}

  <div class="card">

function buildEmisionGC(){
  if(isConserje()) return buildConserjeGC();
  const{unidades,residentes,pagos,gastos,multas,estacionamientos,bodegas}=state.comunidadData;
  const com=state.selectedComunidad;
  const curM=thisMonth();
  const selMes=state.gcMes||curM;

  // Gastos del mes seleccionado
  const gastosM=gastos.filter(g=>g.month===selMes);
  const totalEgresos=gastosM.reduce((s,g)=>s+g.amount,0);
  const totalIngresos=pagos.filter(p=>p.month===selMes).reduce((s,p)=>s+p.amount,0);

  // Calcular prorrateo total (m²)
  const totalSqm=unidades.reduce((s,u)=>s+(u.sqm||0),0);

  // Gastos fijos vs prorrateo
  const gastosProrate=gastosM.filter(g=>g.prorate);
  const gastosFixed=gastosM.filter(g=>!g.prorate);
  const totalProrate=gastosProrate.reduce((s,g)=>s+g.amount,0);
  const totalFixed=gastosFixed.reduce((s,g)=>s+g.amount,0);

  // Agrupar gastos por categoría para el desglose
  const catMap={};
  gastosM.forEach(g=>{
    if(!catMap[g.label])catMap[g.label]={icon:g.icon,label:g.label,total:0,items:[]};
    catMap[g.label].total+=g.amount;
    catMap[g.label].items.push(g);
  });

  // Unidades con residentes
  const occupied=unidades.filter(u=>residentes.some(r=>r.unidad_id===u.id));

  // Meses disponibles
  const meses=[...new Set([...pagos.map(p=>p.month),...gastos.map(g=>g.month)])].sort().reverse();
  if(!meses.includes(curM))meses.unshift(curM);

  return`
  <div class="page-header">
    <div><h2>Emitir Liquidación de GC</h2><p>Genera la liquidación mensual para toda la comunidad</p></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select class="form-control" style="width:auto" id="gcMesSelect" onchange="setState({gcMes:this.value})">
        ${meses.map(m=>`<option value="${m}" ${m===selMes?'selected':''}>${m}</option>`).join('')}
      </select>
      <button class="btn btn-gold" onclick="window.print()">🖨 Imprimir / PDF</button>
      <button class="btn btn-primary" onclick="enviarGCTodos()">📩 Emitir a todos</button>
    </div>
  </div>

  ${totalEgresos===0?`<div style="background:#fef9c3;border:1px solid #fde047;border-radius:8px;padding:14px;margin-bottom:16px;font-size:13px;color:#854d0e">
    ⚠️ <b>Sin gastos registrados para ${selMes}.</b> Ve a "Gastos" e ingresa los egresos del mes antes de emitir la liquidación.
    <button class="btn btn-sm btn-warning" onclick="setState({view:'expenses'})" style="margin-left:12px">→ Ir a Gastos</button>
  </div>`:''}

  <!-- Resumen financiero del mes -->
  <div class="liq-gc-saldo-grid" style="margin-bottom:16px">
    <div class="liq-gc-saldo-card">
      <div class="liq-gc-saldo-label">Total ingresos</div>
      <div class="liq-gc-saldo-val" style="color:var(--green)">${fmt(totalIngresos)}</div>
      <div style="font-size:10px;color:#9ca3af;margin-top:2px">${pagos.filter(p=>p.month===selMes).length} pagos recibidos</div>
    </div>
    <div class="liq-gc-saldo-card">
      <div class="liq-gc-saldo-label">Total egresos</div>
      <div class="liq-gc-saldo-val" style="color:var(--red)">${fmt(totalEgresos)}</div>
      <div style="font-size:10px;color:#9ca3af;margin-top:2px">${gastosM.length} gastos registrados</div>
    </div>
    <div class="liq-gc-saldo-card">
      <div class="liq-gc-saldo-label">Saldo en caja</div>
      <div class="liq-gc-saldo-val" style="color:${totalIngresos-totalEgresos>=0?'var(--green)':'var(--red)'}">${fmt(totalIngresos-totalEgresos)}</div>
      <div style="font-size:10px;color:#9ca3af;margin-top:2px">Mes ${selMes}</div>
    </div>
  </div>

  <!-- LIQUIDACIÓN COMPLETA -->
  <div class="liq-gc" id="liquidacionGC">

    <!-- Header -->
    <div class="liq-gc-header">
      <div class="liq-gc-header-left">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          ${LOGO_SVG.replace('viewBox','style="width:36px;height:36px" viewBox')}
          <div>
            <h2 style="font-size:18px;font-weight:900;color:#F8FAFC;margin:0">LIQUIDACIÓN DE GASTOS COMUNES</h2>
            <p style="font-size:11px;color:#94A3B8;margin:0">Período: ${selMes}</p>
          </div>
        </div>
        <div style="font-size:13px;font-weight:700;color:#F8FAFC">${com?.nombre||'Comunidad'}</div>
        <div style="font-size:11px;color:#94A3B8">${com?.direccion||''} ${com?.ciudad?'· '+com.ciudad:''}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:10px;color:#E6B800;font-weight:600;margin-bottom:4px">Fecha de emisión</div>
        <div style="font-size:14px;font-weight:700;color:#fff">${new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'})}</div>

          <tbody>

              const bod=bodegas?.find(b=>b.unidad_id===u.id);

              const finesAmt=pf.reduce((s,f)=>s+f.amount,0);

function buildBank(){
  const{pagos,gastos,unidades}=state.comunidadData;
  const totalIn=pagos.reduce((s,p)=>s+p.amount,0);
  const totalOut=gastos.reduce((s,g)=>s+g.amount,0);
  const saldoActual=totalIn-totalOut;

  // Historial mensual acumulado (saldo real que va de mes a mes)
  const meses=[...new Set([...pagos.map(p=>p.month),...gastos.map(g=>g.month)])].sort();
  let saldoAcumulado=0;
  const historial=meses.map(m=>{
    const ingr=pagos.filter(p=>p.month===m).reduce((s,p)=>s+p.amount,0);
    const egr=gastos.filter(g=>g.month===m).reduce((s,g)=>s+g.amount,0);
    saldoAcumulado+=ingr-egr;
    return{mes:m,ingr,egr,balance:ingr-egr,saldoAcum:saldoAcumulado};
  });

  // Movimientos detallados (para la tabla)
  const allMovs=[
    ...pagos.map(p=>({...p,_t:'crédito',_desc:`GC Depto ${unidades.find(u=>u.id===p.unidad_id)?.numero||''}`})),
    ...gastos.map(g=>({...g,_t:'débito',_desc:`${g.icon} ${g.label}`}))
  ].sort((a,b)=>new Date(b.date||b.created_at)-new Date(a.date||a.created_at));

  return`
  <div class="page-header">
    <div><h2>Cuenta Corriente</h2><p>Saldo acumulado de toda la historia</p></div>
    <span class="badge badge-gold">Fintoc próximamente</span>
  </div>

  <div class="metrics" style="grid-template-columns:repeat(3,1fr)">
    <div class="metric"><div class="metric-label">Total ingresos GC</div><div class="metric-value green">${fmt(totalIn)}</div></div>
    <div class="metric"><div class="metric-label">Total egresos</div><div class="metric-value red">${fmt(totalOut)}</div></div>
    <div class="metric" style="border-left:4px solid ${saldoActual>=0?'var(--green)':'var(--red)'}">
      <div class="metric-label">Saldo en caja</div>
      <div class="metric-value ${saldoActual>=0?'green':'red'}">${fmt(saldoActual)}</div>
      <div style="font-size:10px;color:#6b7280;margin-top:3px">${saldoActual>=0?'✓ Superávit acumulado':'⚠ Déficit acumulado'}</div>
    </div>
  </div>

  ${historial.length>0?`
  <div class="card">
    <div class="card-header"><span class="card-title">📈 Historial mensual con saldo acumulado</span></div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Mes</th><th style="text-align:right">Ingresos</th><th style="text-align:right">Egresos</th><th style="text-align:right">Balance del mes</th><th style="text-align:right">Saldo acumulado</th></tr></thead>
        <tbody>
          ${[...historial].reverse().map(h=>`<tr>
            <td style="font-weight:600">${h.mes}</td>
            <td style="text-align:right;color:var(--green);font-weight:600">${fmt(h.ingr)}</td>
            <td style="text-align:right;color:var(--red)">${fmt(h.egr)}</td>
            <td style="text-align:right;font-weight:600;color:${h.balance>=0?'var(--green)':'var(--red)'}">${h.balance>=0?'+':''}${fmt(h.balance)}</td>
