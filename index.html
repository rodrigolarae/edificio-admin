/* ===== ESTILOS BASE (sin cambios) ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a1a;min-height:100vh}
:root{--navy:#0F172A;--navy2:#1E293B;--green:#2E766B;--green2:#1d5249;--gold:#E6B800;--gold2:#b89200;--white:#F8FAFC;--gray:#94A3B8;--gray2:#64748B;--red:#DC2626;--light:#E8F0FE;}

/* ===== MEJORAS DE ESTILO ===== */
/* Nuevo estilo para tarjetas de estado de pago */
.payment-status-card {
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  margin-bottom: 16px;
  border: 2px solid transparent;
}
.payment-status-card.pagado { background: #f0fdf4; border-color: var(--green); }
.payment-status-card.pendiente { background: #fffbeb; border-color: #d97706; }
.payment-status-card.moroso { background: #fef2f2; border-color: var(--red); }
.payment-status-card .icon { font-size: 40px; margin-bottom: 6px; }
.payment-status-card .label { font-size: 20px; font-weight: 800; }
.payment-status-card .sub { font-size: 13px; color: #6b7280; margin-top: 4px; }
.payment-status-card .amount { font-size: 24px; font-weight: 900; margin-top: 8px; }
.payment-status-card .details { margin-top: 12px; padding: 10px; background: white; border-radius: 8px; border: 1px solid #e5e5e5; }

/* Gráfico de barras para deuda */
.debt-chart {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 120px;
  padding: 10px 0;
}
.debt-chart .bar {
  flex: 1;
  background: var(--navy);
  border-radius: 4px 4px 0 0;
  min-height: 4px;
  transition: height 0.3s;
  position: relative;
}
.debt-chart .bar-label {
  font-size: 9px;
  color: #6b7280;
  text-align: center;
  margin-top: 4px;
}
.debt-chart .bar-value {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  font-weight: 600;
  color: var(--navy);
}

/* Módulo paquetería */
.paquete-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #f3f4f6;
}
.paquete-item .icon { font-size: 24px; }
.paquete-item .info { flex: 1; }
.paquete-item .info .nombre { font-weight: 700; font-size: 13px; }
.paquete-item .info .detalle { font-size: 11px; color: #6b7280; }
.paquete-item .estado { font-size: 11px; font-weight: 600; }
.paquete-item .estado.entregado { color: var(--green); }
.paquete-item .estado.retirado { color: #9ca3af; }
.paquete-item .estado.pendiente { color: var(--gold2); }

/* Menú con categorías */
.nav-category {
  padding: 10px 16px 3px;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: #9ca3af;
}
</style>
</head>

// ---------- MEJORA: buildMyAccount (residente) ----------
// Reemplazar la función buildMyAccount original por esta versión mejorada.
function buildMyAccount(){
  const m=thisMonth();
  const u=state.comunidadData.unidades.find(x=>x.id===state.currentUser?.unidad_id);
  const r=state.currentUser;
  if(!u||!r)return`<div class="page-header"><h2>Mi Cuenta</h2></div><div class="card"><div class="empty">No tienes una unidad asignada. Contacta al administrador.</div></div>`;

  const pagosU=state.comunidadData.pagos.filter(p=>p.unidad_id===u.id);
  const pagoMes=pagosU.find(p=>p.month===m);
  const multas=state.comunidadData.multas.filter(f=>f.unidad_id===u.id&&f.status==='pendiente');
  const totalMultas=multas.reduce((s,f)=>s+f.amount,0);
  const base=u.monthly_fee||0;
  const deuda=calcDeudaAcumulada(u.id);
  const alDia=pagoMes&&deuda.mesesSinPagar===0;

  // Determinar estado de pago
  let estado = 'pagado';
  let label = 'Al día';
  let icon = '✅';
  let color = 'var(--green)';
  let bg = '#f0fdf4';
  let sub = 'Tu pago de este mes está registrado';
  let totalPagar = 0;

  if (!pagoMes) {
    if (deuda.tieneDeudaHistorica) {
      estado = 'moroso';
      label = 'Con deuda histórica';
      icon = '🔴';
      color = 'var(--red)';
      bg = '#fef2f2';
      sub = `Tienes ${deuda.mesesSinPagar} mes(es) sin pagar`;
      totalPagar = deuda.totalConMesActual;
    } else {
      estado = 'pendiente';
      label = 'Pendiente este mes';
      icon = '⏳';
      color = '#d97706';
      bg = '#fffbeb';
      sub = 'Vence el 10 de este mes';
      totalPagar = base + totalMultas;
    }
  } else {
    totalPagar = 0;
  }

  // Datos para gráfico de deuda (últimos 6 meses)
  const mesesDeuda = deuda.mesesDeuda.slice(-6).map(md => ({
    mes: md.mes.slice(5),
    total: md.total
  }));
  const maxDeuda = Math.max(1, ...mesesDeuda.map(d => d.total));

  return`
  <div class="page-header">
    <div><h2>Mi Cuenta</h2><p>Depto ${u.numero}${u.piso?' · Piso '+u.piso:''} · ${state.selectedComunidad?.nombre||''}</p></div>
  </div>

  <!-- Tarjeta de estado de pago mejorada -->
  <div class="payment-status-card ${estado}">
    <div class="icon">${icon}</div>
    <div class="label" style="color:${color}">${label}</div>
    <div class="sub">${sub}</div>
    ${totalPagar > 0 ? `<div class="amount" style="color:${color}">${fmt(totalPagar)}</div>` : ''}
    ${!pagoMes ? `
    <div class="details">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span>GC base del mes</span>
        <span style="font-weight:700">${fmt(base)}</span>
      </div>
      ${multas.length > 0 ? `
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="color:var(--red)">⚠ Multas (${multas.length})</span>
        <span style="font-weight:700;color:var(--red)">+${fmt(totalMultas)}</span>
      </div>` : ''}
      ${deuda.mesesSinPagar > 0 ? `
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span>Meses anteriores</span>
        <span style="font-weight:700;color:var(--red)">+${fmt(deuda.totalDeuda)}</span>
      </div>` : ''}
      <div style="border-top:1px solid #e5e5e5;padding-top:8px;display:flex;justify-content:space-between;font-weight:800">
        <span>Total a pagar</span>
        <span style="color:${color}">${fmt(totalPagar)}</span>
      </div>
    </div>
    <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-primary btn-block" style="padding:12px;font-size:15px;font-weight:700;border-radius:10px" onclick="doIniciarPago()">
        💳 Pagar ahora con Flow.cl
      </button>
      <button class="btn btn-sm" style="width:100%;border-color:#9ca3af;color:#9ca3af" onclick="doNotificarPago()">
        📤 Notificar transferencia manual
      </button>
      <div style="font-size:11px;color:#9ca3af;text-align:center">Transfiere y luego notifica — el admin confirmará tu pago</div>
    </div>` : `
    <div style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--green)">
      <span>Registrado el ${fmtD(pagoMes.date)} · ${fmt(pagoMes.amount)} · ${pagoMes.method||'Transferencia'}</span>
    </div>
    <button class="btn btn-sm" style="margin-top:10px" onclick="setState({view:'my_payments'})">Ver todos mis comprobantes →</button>`}
  </div>

  <!-- Gráfico de deuda histórica (últimos 6 meses) -->
  ${mesesDeuda.length > 0 ? `
  <div class="card" style="margin-bottom:12px">
    <div class="card-header"><span class="card-title">📊 Historial de deuda (últimos 6 meses)</span></div>
    <div class="debt-chart">
      ${mesesDeuda.map(d => `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%">
          <div class="bar" style="height:${Math.max(4, (d.total / maxDeuda) * 100)}%;background:${d.total>0 ? 'var(--red)' : 'var(--green)'};">
            ${d.total > 0 ? `<span class="bar-value">${fmt(d.total)}</span>` : ''}
          </div>
          <div class="bar-label">${d.mes}</div>
        </div>
      `).join('')}
    </div>
  </div>` : ''}

  <!-- Alertas activas -->
  ${state.comunidadData.alertas.filter(a=>a.status==='activa').length > 0 ? `
  <div class="card" style="margin-bottom:12px">
    <div class="card-header">
      <span class="card-title">🔔 Avisos de tu comunidad</span>
      <button class="btn btn-sm" onclick="setState({view:'community'})">Ver todos</button>
    </div>
    ${state.comunidadData.alertas.filter(a=>a.status==='activa').slice(0,3).map(a => `
    <div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f3f4f6">
      <span style="font-size:16px">${a.tipo==='emergencia'?'🚨':a.tipo==='seguridad'?'🔒':a.tipo==='mantencion'?'🔧':'📢'}</span>
      <div><div style="font-size:12px;font-weight:700">${a.titulo}</div>
      <div style="font-size:11px;color:#6b7280">${a.descripcion||''}</div></div>
    </div>`).join('')}
  </div>` : ''}

  <!-- Datos de la unidad -->
  <div class="card" style="margin-bottom:12px">
    <div class="card-header"><span class="card-title">🏠 Tu unidad</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <div style="background:#f9fafb;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:18px;font-weight:800;color:var(--navy)">${u.sqm||'—'}</div>
        <div style="font-size:10px;color:#6b7280">Metros²</div>
      </div>
      <div style="background:#f9fafb;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:14px;font-weight:700;color:var(--navy)">${u.parking?'E'+u.parking_num:'—'}</div>
        <div style="font-size:10px;color:#6b7280">Estacionamiento</div>
      </div>
      <div style="background:#f9fafb;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:14px;font-weight:700;color:var(--navy)">${u.storage?'B'+(u.storage_num||''):'—'}</div>
        <div style="font-size:10px;color:#6b7280">Bodega</div>
      </div>
    </div>
  </div>

  <!-- Acciones rápidas -->
  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px">
    <button class="btn" style="padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#f9fafb;border:1px solid #e5e5e5" onclick="setState({view:'my_payments'})">
      <span style="font-size:20px">🧾</span><span style="font-size:12px;font-weight:600">Mis comprobantes</span>
    </button>
    <button class="btn" style="padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#f9fafb;border:1px solid #e5e5e5" onclick="setState({view:'votaciones'})">
      <span style="font-size:20px">🗳️</span><span style="font-size:12px;font-weight:600">Votaciones activas</span>
    </button>
    <button class="btn" style="padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#f9fafb;border:1px solid #e5e5e5" onclick="setState({view:'reservas'})">
      <span style="font-size:20px">🗓️</span><span style="font-size:12px;font-weight:600">Reservar espacio</span>
    </button>
    <button class="btn" style="padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#f9fafb;border:1px solid #e5e5e5" onclick="setState({view:'balance'})">
      <span style="font-size:20px">📊</span><span style="font-size:12px;font-weight:600">Balance comunidad</span>
    </button>
  </div>`;
}

// ---------- MEJORA: buildConserje (incluye paquetería) ----------
// Reemplazar la función buildConserje original por esta versión que añade el módulo de paquetería.
function buildConserje(){
  const{unidades,residentes,alertas,multas,mantenimientos}=state.comunidadData;
  const hoy=new Date().toLocaleDateString("es-CL",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  const visitas=state.conserjeVisitas||[];
  const estacs=state.conserjeEstac||[];
  const paquetes=state.conserjePaquetes||[]; // Nuevo array para paquetería
  const visitasHoy=visitas.filter(v=>v.fecha===new Date().toISOString().split("T")[0]);
  const estacOcupados=estacs.filter(e=>!e.hora_salida);
  const alertasActivas=(alertas||[]).filter(a=>a.status==="activa").length;
  const mantPendientes=(mantenimientos||[]).filter(m=>!m.completed).length;
  const paquetesPendientes=paquetes.filter(p=>p.estado==='pendiente'||p.estado==='entregado').length;

  // Vista de paquetería integrada en el mismo panel
  return`
  <div class="page-header">
    <div><h2>🏢 Panel del Conserje</h2><p>${hoy}</p></div>
    <button class="btn btn-primary" onclick="setState({view:'conserje_visitas'})">🔔 Registrar visita</button>
  </div>
  <div class="metrics" style="grid-template-columns:repeat(5,1fr)">
    <div class="metric" style="cursor:pointer" onclick="setState({view:'conserje_visitas'})">
      <div class="metric-label">Visitas hoy</div><div class="metric-value blue">${visitasHoy.length}</div>
    </div>
    <div class="metric" style="cursor:pointer" onclick="setState({view:'conserje_estac'})">
      <div class="metric-label">Estac. ocupados</div>
      <div class="metric-value ${estacOcupados.length>0?"amber":"green"}">${estacOcupados.length}</div>
    </div>
    <div class="metric" style="cursor:pointer" onclick="setState({view:'conserje_paquetes'})">
      <div class="metric-label">📦 Paquetes pendientes</div>
      <div class="metric-value ${paquetesPendientes>0?"gold":"green"}">${paquetesPendientes}</div>
    </div>
    <div class="metric"><div class="metric-label">Alertas activas</div>
      <div class="metric-value ${alertasActivas>0?"red":"green"}">${alertasActivas}</div>
    </div>
    <div class="metric"><div class="metric-label">Mantenciones pend.</div>
      <div class="metric-value amber">${mantPendientes}</div>
    </div>
  </div>

  <!-- Panel de acciones rápidas -->
  <div class="card" style="margin-bottom:12px">
    <div style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;margin-bottom:10px">Acciones rápidas</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <button class="btn btn-primary" onclick="setState({view:'conserje_visitas'})">🔔 Nueva visita</button>
      <button class="btn" style="border-color:var(--gold);color:var(--gold2)" onclick="setState({view:'conserje_estac'})">🚗 Estacionamiento</button>
      <button class="btn" style="border-color:#7c3aed;color:#7c3aed" onclick="setState({view:'conserje_paquetes'})">📦 Paquetería</button>
      <button class="btn" onclick="setState({view:'emision_gc'})">📄 Ver / imprimir GC</button>
      <button class="btn" style="border-color:var(--red);color:var(--red)" onclick="setState({view:'community'})">📢 Enviar alerta</button>
      <button class="btn" style="border-color:var(--green);color:var(--green)" onclick="setState({view:'conserje_llaves'})">🔑 Control llaves</button>
    </div>
  </div>

  <!-- Resumen de visitas recientes y paquetes -->
  <div class="grid-2">
    <div class="card">
      <div class="card-header"><span class="card-title">🔔 Últimas visitas</span>
        <button class="btn btn-sm" onclick="setState({view:'conserje_visitas'})">Ver todas</button>
      </div>
      ${visitas.length===0?'<div class="empty">Sin visitas registradas.</div>':
        visitas.slice(0,4).map(v=>{
          const u=unidades.find(x=>x.id===v.unidad_id);
          return`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6">
            <div style="font-size:20px">👤</div>
            <div style="flex:1">
              <div style="font-size:12px;font-weight:700">${v.nombre_visitante}</div>
              <div style="font-size:11px;color:#6b7280">Depto ${u?.numero||"—"} · ${v.hora_entrada}</div>
            </div>
            <span class="badge ${v.hora_salida?"badge-green":"badge-amber"}">${v.hora_salida?"Salió":"En edificio"}</span>
          </div>`;
        }).join("")}
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">📦 Paquetes recientes</span>
        <button class="btn btn-sm" onclick="setState({view:'conserje_paquetes'})">Ver todos</button>
      </div>
      ${paquetes.length===0?'<div class="empty">Sin paquetes registrados.</div>':
        paquetes.slice(0,4).map(p=>{
          const u=unidades.find(x=>x.id===p.unidad_id);
          const estadoLabel = {pendiente:'Pendiente',entregado:'Entregado',retirado:'Retirado'}[p.estado]||p.estado;
          return`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6">
            <div style="font-size:20px">📦</div>
            <div style="flex:1">
              <div style="font-size:12px;font-weight:700">${p.proveedor||'Paquete'}</div>
              <div style="font-size:11px;color:#6b7280">Depto ${u?.numero||"—"} · ${p.fecha||''}</div>
            </div>
            <span class="badge ${p.estado==='retirado'?'badge-gray':p.estado==='entregado'?'badge-green':'badge-amber'}">${estadoLabel}</span>
          </div>`;
        }).join("")}
    </div>
  </div>

  ${estacOcupados.length>0?`<div class="card">
    <div class="card-header"><span class="card-title">🚗 Estacionamientos ocupados</span></div>
    ${estacOcupados.map(e=>{
      const u=unidades.find(x=>x.id===e.unidad_id);
      return`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6">
        <div><div style="font-size:12px;font-weight:700">Est. ${e.numero}</div>
        <div style="font-size:11px;color:#6b7280">${e.hora_entrada}${e.patente?" · "+e.patente:""}</div></div>
        <button class="btn btn-sm btn-primary" onclick="conserjeEstacSalida(this)" data-id="${e.id}">Registrar salida</button>
      </div>`;
    }).join("")}
  </div>`:""}`;
}

// ---------- NUEVA VISTA: Paquetería para conserje ----------
function buildConserjePaquetes(){
  const{unidades,residentes}=state.comunidadData;
  const paquetes=state.conserjePaquetes||[];
  const unidOpts=unidades.map(u=>{
    const r=residentes.find(x=>x.unidad_id===u.id&&x.activo);
    return`<option value="${u.id}">Depto ${u.numero}${r?" — "+r.nombre:""}</option>`;
  }).join("");

  return`
  <div class="page-header">
    <div><h2>📦 Paquetería</h2><p>Registro de envíos y notificaciones</p></div>
    <button class="btn btn-sm" onclick="saGoView(this)" data-view="conserje_dashboard">← Panel</button>
  </div>

  <!-- Formulario nuevo paquete -->
  <div class="card" style="border-left:4px solid var(--gold);margin-bottom:14px">
    <div class="card-header"><span class="card-title">+ Registrar paquete</span></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Depto destinatario *</label>
        <select class="form-control" id="paqueteUnidad"><option value="">Seleccionar...</option>${unidOpts}</select></div>
      <div class="form-group"><label class="form-label">Proveedor / Remitente *</label>
        <input class="form-control" id="paqueteProveedor" placeholder="Ej: Correos Chile, Amazon..."></div>
    </div>
    <div class="form-row">

// ---------- MEJORA: buildConciliacion (más intuitiva) ----------
// Reemplazar buildConciliacion por esta versión mejorada.
function buildConciliacion(){
  const pagos=state.comunidadData.pagos||[];
  const unidades=state.comunidadData.unidades||[];
  const residentes=state.comunidadData.residentes||[];
  const m=thisMonth();
  const conciliados=state.conciliacionResultados||[];

  // Métricas de conciliación
  const totalMovs=conciliados.length;
  const matches=conciliados.filter(c=>c.match&&c.confirmado).length;
  const pendientes=conciliados.filter(c=>c.match&&!c.confirmado).length;
  const sinMatch=conciliados.filter(c=>!c.match).length;

  return`
  <div class="page-header">
    <div><h2>🏦 Conciliación Bancaria</h2>
    <p>Sube el extracto del banco y compara con los pagos registrados</p></div>
  </div>

  <!-- Métricas de conciliación -->
  ${conciliados.length>0?`
  <div class="metrics" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">
    <div class="metric"><div class="metric-label">Movimientos analizados</div><div class="metric-value blue">${totalMovs}</div></div>
    <div class="metric"><div class="metric-label">✅ Coincidencias confirmadas</div><div class="metric-value green">${matches}</div></div>
    <div class="metric"><div class="metric-label">⏳ Pendientes de confirmar</div><div class="metric-value amber">${pendientes}</div></div>
    <div class="metric"><div class="metric-label">⚠️ Sin coincidencia</div><div class="metric-value red">${sinMatch}</div></div>
  </div>`:''}

  <!-- Instrucciones -->
  <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px 16px;margin-bottom:14px">
    <div style="font-size:13px;font-weight:700;color:#1e40af;margin-bottom:8px">¿Cómo funciona?</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;font-size:11px;color:#374151">
      <div style="display:flex;gap:8px"><span style="color:#1e40af;font-weight:700">1.</span><span>Descarga el extracto CSV/Excel de tu banco</span></div>
      <div style="display:flex;gap:8px"><span style="color:#1e40af;font-weight:700">2.</span><span>Súbelo aquí — Vecinoo lee los montos y fechas</span></div>
      <div style="display:flex;gap:8px"><span style="color:#1e40af;font-weight:700">3.</span><span>El sistema compara cada depósito con los pagos</span></div>
      <div style="display:flex;gap:8px"><span style="color:#1e40af;font-weight:700">4.</span><span>Confirma o descarta cada coincidencia</span></div>
    </div>
  </div>

  <!-- Upload -->
  <div class="card" style="margin-bottom:14px;border-left:4px solid var(--blue)">
    <div class="card-header"><span class="card-title">📂 Subir extracto bancario</span></div>
    <div style="border:2px dashed #bfdbfe;border-radius:10px;padding:24px;text-align:center;background:#f8fafc;margin-bottom:10px">
      <div style="font-size:32px;margin-bottom:8px">📊</div>
      <div style="font-size:13px;font-weight:600;color:var(--navy);margin-bottom:4px">Arrastra tu archivo CSV o Excel aquí</div>
      <div style="font-size:11px;color:#9ca3af;margin-bottom:12px">Formatos: .csv, .xlsx, .xls — máx. 5MB</div>
      <input type="file" id="extractoFile" accept=".csv,.xlsx,.xls" style="display:none" onchange="procesarExtracto(this)">
      <button class="btn btn-primary" onclick="document.getElementById('extractoFile').click()">Seleccionar archivo</button>
    </div>
    <div style="font-size:11px;color:#6b7280">
      <b>Columnas requeridas:</b> Fecha, Descripción, Monto (depósito). El sistema detecta automáticamente el formato de BancoEstado, Santander y BCI.
    </div>
  </div>

  <!-- Resultados de conciliación -->
  ${conciliados.length>0?`
  <div class="card">
    <div class="card-header">
      <span class="card-title">🔍 Resultados — ${conciliados.length} movimientos analizados</span>
      <button class="btn btn-sm btn-primary" onclick="confirmarTodosMatch()">✅ Confirmar todos los matches</button>
    </div>
    ${conciliados.map((c,i)=>`
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f3f4f6;flex-wrap:wrap">
      <div style="min-width:100px">
        <div style="font-size:11px;color:#6b7280">${c.fecha}</div>
        <div style="font-size:14px;font-weight:700;color:var(--green)">+${fmt(c.monto)}</div>
      </div>
      <div style="flex:1;min-width:160px">
        <div style="font-size:11px;color:#374151">${c.descripcion||'Sin descripción'}</div>
      </div>
      ${c.match?`
      <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:6px 10px;font-size:11px">
        <div style="color:var(--green);font-weight:700">✅ Match encontrado</div>
        <div style="color:#374151">Depto ${c.match.numero} · ${c.match.nombre} · ${fmt(c.match.monto)}</div>
      </div>
      <div style="display:flex;gap:6px">
        ${!c.confirmado?`
          <button class="btn btn-sm" style="background:var(--green);color:white;border-color:var(--green)" onclick="confirmarMatch(${i})">Confirmar</button>
          <button class="btn btn-sm" onclick="descartarMatch(${i})">Descartar</button>
        `:`<span class="badge badge-green">✅ Confirmado</span>`}
      </div>`:`
      <div style="background:#fef9c3;border:1px solid #fde047;border-radius:8px;padding:6px 10px;font-size:11px">
        <div style="color:#92400e;font-weight:700">⚠ Sin coincidencia</div>
        <div style="color:#6b7280">No se encontró pago similar</div>
      </div>
      <button class="btn btn-sm" onclick="asignarManual(${i})">Asignar manualmente</button>`}
    </div>`).join('')}
  </div>`:''}

  <!-- Estado de pagos del mes actual -->
  <div class="card">
    <div class="card-header"><span class="card-title">📋 Estado de pagos — ${m}</span></div>
    <table><thead><tr><th>Depto</th><th>Residente</th><th>GC</th><th>Estado</th><th>Método</th></tr></thead>
    <tbody>${unidades.map(u=>{
      const r=residentes.find(x=>x.unidad_id===u.id&&x.activo);
      const p=pagos.find(x=>x.unidad_id===u.id&&x.month===m);
      return`<tr>
        <td style="font-weight:700">Depto ${u.numero}</td>
        <td>${r?.nombre||'—'}</td>
        <td>${fmt(u.monthly_fee||0)}</td>
        <td><span class="badge ${p?'badge-green':'badge-amber'}">${p?'✅ Pagado':'⏳ Pendiente'}</span></td>
        <td style="font-size:11px;color:#6b7280">${p?.method||'—'}</td>
      </tr>`;
    }).join('')}</tbody></table>
  </div>`;
}

window.doRegistrarPaquete = function(){
  const unidadId = document.getElementById('paqueteUnidad')?.value;
  const proveedor = document.getElementById('paqueteProveedor')?.value?.trim();
  const tracking = document.getElementById('paqueteTracking')?.value?.trim();
  const obs = document.getElementById('paqueteObs')?.value?.trim();
  const notificar = document.getElementById('paqueteNotificar')?.checked;
  if(!unidadId||!proveedor){ showAlert('Completa depto y proveedor','error'); return; }
  const nuevo = {
    id: 'pqt_'+Date.now(),
    unidad_id: unidadId,
    proveedor: proveedor,
    tracking: tracking||null,
    observaciones: obs||null,
    fecha: new Date().toISOString().split('T')[0],
    estado: 'pendiente', // pendiente, entregado, retirado
    created_at: new Date().toISOString(),
  };
  const prev = state.conserjePaquetes||[];
  setState({conserjePaquetes:[nuevo,...prev]});
  if(notificar){
    const u = state.comunidadData.unidades.find(x=>x.id===unidadId);
    const nuevaAlerta = {
      id:'alerta_paq_'+Date.now(),
      comunidad_id:state.selectedComunidad.id,
      titulo:'📦 Paquete para Depto '+(u?.numero||''),
      descripcion:`Tienes un paquete de ${proveedor}${tracking?' (N° '+tracking+')':''} en conserjería.`,
      tipo:'aviso',
      status:'activa',
      created_at:new Date().toISOString(),
    };
    state.comunidadData.alertas = [nuevaAlerta,...(state.comunidadData.alertas||[])];
  }
  // Limpiar campos
  ['paqueteProveedor','paqueteTracking','paqueteObs'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  showAlert('✅ Paquete registrado'+(notificar?' y residente notificado':''),'success');
  render();
};

window.marcarPaqueteEntregado = function(id){
  const paquetes = (state.conserjePaquetes||[]).map(p=>p.id===id?{...p, estado:'entregado'}:p);
  setState({conserjePaquetes:paquetes});
  showAlert('✅ Paquete marcado como entregado','success');
  render();
};

window.marcarPaqueteRetirado = function(id){
  const paquetes = (state.conserjePaquetes||[]).map(p=>p.id===id?{...p, estado:'retirado'}:p);
  setState({conserjePaquetes:paquetes});
  showAlert('✅ Paquete retirado por el residente','success');
  render();
};

// Llaves
window.doRegistrarLlave = function(){
  const unidadId = document.getElementById('llaveUnidad')?.value;
  const responsable = document.getElementById('llaveResponsable')?.value?.trim();
  const tipo = document.getElementById('llaveTipo')?.value;
  const hora = document.getElementById('llaveHora')?.value;
  const motivo = document.getElementById('llaveMotivo')?.value?.trim();
  if(!unidadId||!responsable){ showAlert('Completa depto y responsable','error'); return; }
  const nuevo = {
    id: 'llv_'+Date.now(),
    unidad_id: unidadId,
    responsable: responsable,
    tipo: tipo,
    hora_retiro: hora||new Date().toTimeString().slice(0,5),
    motivo: motivo||null,
    fecha_retiro: new Date().toISOString().split('T')[0],
    fecha_devolucion: null,
  };
  const prev = state.conserjeLlaves||[];
  setState({conserjeLlaves:[nuevo,...prev]});
  ['llaveResponsable','llaveMotivo'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  showAlert('🔑 Préstamo registrado','success');
  render();
};

window.devolverLlave = function(id){
  const llaves = (state.conserjeLlaves||[]).map(l=>l.id===id?{...l, fecha_devolucion:new Date().toISOString().split('T')[0]}:l);
  setState({conserjeLlaves:llaves});
  showAlert('✅ Llave devuelta','success');
  render();
};
