<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdificioAdmin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a1a;min-height:100vh}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:230px;background:#fff;border-right:1px solid #e5e5e5;display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:20px 16px 16px;border-bottom:1px solid #e5e5e5;background:#1a56db}
.logo h1{font-size:15px;font-weight:700;color:#fff}
.logo p{font-size:11px;color:#bfdbfe;margin-top:2px}
.mode-switch{padding:10px;border-bottom:1px solid #e5e5e5}
.mode-switch select{width:100%;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;background:#fff}
.nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-section{padding:12px 16px 4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;color:#374151;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s}
.nav-item:hover{background:#f3f4f6}
.nav-item.active{background:#eff6ff;color:#1a56db;font-weight:600;border-right:3px solid #1a56db}
.user-info{padding:12px 16px;border-top:1px solid #e5e5e5;font-size:12px;color:#6b7280}
.role-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;margin-top:4px}
.role-admin{background:#dbeafe;color:#1e40af}
.role-resident{background:#d1fae5;color:#065f46}
.main{flex:1;overflow-y:auto;padding:24px;background:#f0f2f5}
.page-header{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start}
.page-header h2{font-size:20px;font-weight:700}
.page-header p{font-size:13px;color:#6b7280;margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.metric{background:#fff;border-radius:10px;padding:16px;border:1px solid #e5e5e5}
.metric-label{font-size:11px;color:#6b7280;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.metric-value{font-size:22px;font-weight:700}
.green{color:#059669}.red{color:#dc2626}.blue{color:#1a56db}.amber{color:#d97706}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-title{font-size:14px;font-weight:700;color:#111}
.btn{padding:8px 16px;border-radius:8px;border:1px solid #d1d5db;background:#fff;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;color:#374151;font-weight:500}
.btn:hover{background:#f9fafb}
.btn-primary{background:#1a56db;color:#fff;border-color:#1a56db}
.btn-primary:hover{background:#1e40af}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-success{background:#059669;color:#fff;border-color:#059669}
.btn-danger{background:#dc2626;color:#fff;border-color:#dc2626}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;border-bottom:1px solid #e5e5e5;background:#f9fafb}
td{padding:11px 12px;border-bottom:1px solid #f3f4f6;color:#374151}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600}
.badge-green{background:#d1fae5;color:#065f46}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-gray{background:#f3f4f6;color:#374151}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
.form-control{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:#111;transition:border .15s}
.form-control:focus{outline:none;border-color:#1a56db;box-shadow:0 0 0 3px rgba(26,86,219,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:16px;font-weight:700}
.close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:#6b7280}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.avatar{width:34px;height:34px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#1e40af;flex-shrink:0}
.empty{text-align:center;padding:40px;color:#9ca3af;font-size:14px}
.alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;font-weight:500}
.alert-success{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.receipt{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:28px;font-size:13px}
.receipt-header{text-align:center;padding-bottom:20px;margin-bottom:20px;border-bottom:2px dashed #e5e5e5}
.receipt-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f3f4f6}
.receipt-total{font-size:17px;font-weight:700;margin-top:12px;padding-top:12px;border-top:2px solid #e5e5e5;display:flex;justify-content:space-between}
.progress-bar{height:8px;background:#f3f4f6;border-radius:4px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:4px;transition:width .4s}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f3f4f6;font-size:13px}
.stat-row:last-child{border-bottom:none}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.cat-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 8px;border:2px solid #e5e5e5;border-radius:10px;background:#fff;cursor:pointer;transition:all .2s;font-size:11px;font-weight:600;color:#374151;gap:6px;text-align:center}
.cat-btn:hover{border-color:#1a56db;background:#eff6ff;color:#1a56db}
.cat-btn.selected{border-color:#1a56db;background:#1a56db;color:#fff}
.cat-icon{font-size:22px}
.prorate-table{font-size:12px;margin-top:12px}
.prorate-table th{font-size:10px}
.prorate-table td{padding:7px 10px}
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#d1d5db;border-radius:22px;cursor:pointer;transition:.3s}
.toggle-slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.toggle-slider{background:#1a56db}
.toggle input:checked+.toggle-slider:before{transform:translateX(18px)}
.section-divider{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid #e5e5e5}
</style>
</head>
<body>
<div id="app"></div>
<script>
const fmt=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);
const fmtD=d=>new Date(d).toLocaleDateString('es-CL');
const uid=()=>Math.random().toString(36).substr(2,9).toUpperCase();
const today=()=>new Date().toISOString().split('T')[0];
const thisMonth=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const load=(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}};

const EXPENSE_CATS=[
  {id:'agua',icon:'💧',label:'Agua',prorate:true},
  {id:'luz',icon:'💡',label:'Electricidad',prorate:true},
  {id:'gas',icon:'🔥',label:'Gas',prorate:true},
  {id:'internet',icon:'📡',label:'Internet',prorate:true},
  {id:'ascensor',icon:'🛗',label:'Ascensor',prorate:false},
  {id:'piscina',icon:'🏊',label:'Piscina',prorate:false},
  {id:'jardineria',icon:'🌿',label:'Jardinería',prorate:false},
  {id:'limpieza',icon:'🧹',label:'Limpieza',prorate:false},
  {id:'seguridad',icon:'🔒',label:'Seguridad',prorate:false},
  {id:'mantencion',icon:'🔧',label:'Mantención',prorate:false},
  {id:'seguros',icon:'🛡️',label:'Seguros',prorate:false},
  {id:'admin',icon:'📋',label:'Administración',prorate:false},
  {id:'estacionamiento',icon:'🅿️',label:'Estacionamiento',prorate:false},
  {id:'bodega',icon:'📦',label:'Bodega',prorate:false},
  {id:'otros',icon:'➕',label:'Otros',prorate:false},
];

const INIT_UNITS=[
  {id:'u1',number:'101',floor:1,sqm:65,parking:true,parkingSqm:12,storage:true,storageSqm:6},
  {id:'u2',number:'102',floor:1,sqm:72,parking:true,parkingSqm:12,storage:false,storageSqm:0},
  {id:'u3',number:'201',floor:2,sqm:65,parking:false,parkingSqm:0,storage:true,storageSqm:8},
  {id:'u4',number:'202',floor:2,sqm:80,parking:true,parkingSqm:14,storage:true,storageSqm:6},
  {id:'u5',number:'301',floor:3,sqm:65,parking:false,parkingSqm:0,storage:false,storageSqm:0},
];

const INIT_RESIDENTS=[
  {id:'r1',name:'María González',email:'maria@email.com',phone:'912345678',unitId:'u1',rut:'12.345.678-9'},
  {id:'r2',name:'Juan Pérez',email:'juan@email.com',phone:'923456789',unitId:'u2',rut:'13.456.789-0'},
  {id:'r3',name:'Ana Rodríguez',email:'ana@email.com',phone:'934567890',unitId:'u3',rut:'14.567.890-1'},
  {id:'r4',name:'Carlos López',email:'carlos@email.com',phone:'945678901',unitId:'u4',rut:'15.678.901-2'},
];

const INIT_PAYMENTS=[
  {id:uid(),unitId:'u1',residentId:'r1',amount:85000,date:'2025-06-05',method:'Transferencia',month:'2025-06',receiptId:uid(),items:[]},
  {id:uid(),unitId:'u2',residentId:'r2',amount:92000,date:'2025-06-03',method:'Transferencia',month:'2025-06',receiptId:uid(),items:[]},
  {id:uid(),unitId:'u3',residentId:'r3',amount:78000,date:'2025-05-28',method:'Efectivo',month:'2025-05',receiptId:uid(),items:[]},
];

const INIT_EXPENSES=[
  {id:uid(),catId:'agua',label:'Agua',icon:'💧',amount:180000,date:'2025-06-01',description:'Cuenta agua junio',month:'2025-06',prorate:true},
  {id:uid(),catId:'luz',label:'Electricidad',icon:'💡',amount:95000,date:'2025-06-01',description:'Luz áreas comunes',month:'2025-06',prorate:true},
  {id:uid(),catId:'mantencion',label:'Mantención',icon:'🔧',amount:120000,date:'2025-06-10',description:'Reparación ascensor',month:'2025-06',prorate:false},
  {id:uid(),catId:'limpieza',label:'Limpieza',icon:'🧹',amount:80000,date:'2025-06-05',description:'Servicio limpieza',month:'2025-06',prorate:false},
];

let state={
  view:'dashboard',mode:'admin',
  units:load('ea_units',INIT_UNITS),
  residents:load('ea_residents',INIT_RESIDENTS),
  payments:load('ea_payments',INIT_PAYMENTS),
  expenses:load('ea_expenses',INIT_EXPENSES),
  modal:null,alert:null,alertTimer:null,
  currentResident:INIT_RESIDENTS[0],
  reportMonth:thisMonth(),
  selectedCat:null,
  buildingName:load('ea_bname','EdificioAdmin'),
};

function setState(p){state={...state,...p};render();}
function showAlert(msg,type='success'){
  if(state.alertTimer)clearTimeout(state.alertTimer);
  const t=setTimeout(()=>setState({alert:null,alertTimer:null}),3500);
  setState({alert:{msg,type},alertTimer:t});
}

// Prorrateo
function getTotalSqm(unit){
  return(unit.sqm||0)+(unit.parking?unit.parkingSqm||0:0)+(unit.storage?unit.storageSqm||0:0);
}
function calcProrate(expense,units){
  const total=units.reduce((s,u)=>s+getTotalSqm(u),0);
  return units.map(u=>({
    unitId:u.id,
    sqm:getTotalSqm(u),
    pct:total>0?getTotalSqm(u)/total:0,
    amount:total>0?Math.round(expense.amount*getTotalSqm(u)/total):0
  }));
}

function addUnit(data){
  const u={...data,id:'u'+uid()};
  const units=[...state.units,u];
  save('ea_units',units);setState({units});showAlert('Unidad agregada');
}
function addResident(data){
  const r={...data,id:'r'+uid()};
  const residents=[...state.residents,r];
  save('ea_residents',residents);setState({residents});showAlert('Residente registrado');
}
function addPayment(data){
  const p={...data,id:uid(),receiptId:uid(),month:data.date.substr(0,7),amount:parseInt(data.amount)};
  const payments=[p,...state.payments];
  save('ea_payments',payments);
  setState({payments,modal:{type:'receipt',payment:p,
    resident:state.residents.find(r=>r.id===p.residentId),
    unit:state.units.find(u=>u.id===p.unitId)}});
}
function addExpense(data){
  const e={...data,id:uid(),month:data.date.substr(0,7),amount:parseInt(data.amount)};
  const expenses=[e,...state.expenses];
  save('ea_expenses',expenses);setState({expenses,selectedCat:null});showAlert('Gasto registrado');
}

function render(){document.getElementById('app').innerHTML=buildApp();attachEvents();}

function buildApp(){
  const{mode,alert,units,residents}=state;
  const isAdmin=mode==='admin';
  const navAdmin=[
    {id:'dashboard',icon:'⊞',label:'Dashboard'},
    {id:'units',icon:'🏠',label:'Unidades'},
    {id:'residents',icon:'👤',label:'Residentes'},
    {id:'payments',icon:'💰',label:'Ingresos'},
    {id:'expenses',icon:'📉',label:'Gastos'},
    {id:'bank',icon:'🏦',label:'Cuenta Corriente'},
    {id:'reports',icon:'📄',label:'Informes'},
    {id:'settings',icon:'⚙️',label:'Configuración'},
  ];
  const navResident=[
    {id:'my_account',icon:'👤',label:'Mi Cuenta'},
    {id:'my_payments',icon:'📋',label:'Mis Pagos'},
  ];
  const nav=isAdmin?navAdmin:navResident;
  return`<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <h1>🏢 ${state.buildingName}</h1>
      <p>${units.length} unidades · Sistema de Gestión</p>
    </div>
    <div class="mode-switch">
      <select id="modeSelect">
        <option value="admin" ${mode==='admin'?'selected':''}>👔 Administrador</option>
        ${residents.map(r=>`<option value="res_${r.id}" ${mode==='res_'+r.id?'selected':''}>${r.name.split(' ')[0]} (Res.)</option>`).join('')}
      </select>
    </div>
    <nav class="nav">
      <div class="nav-section">${isAdmin?'Administración':'Mi Portal'}</div>
      ${nav.map(n=>`<button class="nav-item${state.view===n.id?' active':''}" data-view="${n.id}">${n.icon} ${n.label}</button>`).join('')}
    </nav>
    <div class="user-info">
      <div>${isAdmin?'Administrador':state.currentResident?.name||''}</div>
      <span class="role-badge ${isAdmin?'role-admin':'role-resident'}">${isAdmin?'Admin':'Residente'}</span>
    </div>
  </aside>
  <main class="main">
    ${alert?`<div class="alert alert-${alert.type}">${alert.msg}</div>`:''}
    ${buildView()}
    ${state.modal?buildModal():''}
  </main>
</div>`;
}

function buildView(){
  const v=state.view;
  if(v==='dashboard')return buildDashboard();
  if(v==='units')return buildUnits();
  if(v==='residents')return buildResidents();
  if(v==='payments')return buildPayments();
  if(v==='expenses')return buildExpenses();
  if(v==='bank')return buildBank();
  if(v==='reports')return buildReports();
  if(v==='settings')return buildSettings();
  if(v==='my_account')return buildMyAccount();
  if(v==='my_payments')return buildMyPayments();
  return'';
}

function getMetrics(month){
  const mp=state.payments.filter(p=>p.month===month);
  const me=state.expenses.filter(e=>e.month===month);
  const totalIn=mp.reduce((s,p)=>s+p.amount,0);
  const totalOut=me.reduce((s,e)=>s+e.amount,0);
  const paidUnits=new Set(mp.map(p=>p.unitId));
  const occupied=state.units.filter(u=>state.residents.some(r=>r.unitId===u.id));
  const morose=occupied.filter(u=>!paidUnits.has(u.id));
  return{totalIn,totalOut,balance:totalIn-totalOut,paidUnits,occupied,morose,mp,me};
}

function buildDashboard(){
  const m=thisMonth();
  const{totalIn,totalOut,balance,paidUnits,occupied,morose,mp,me}=getMetrics(m);
  const pct=Math.round(paidUnits.size/Math.max(occupied.length,1)*100);
  const recents=[...state.payments.map(p=>({...p,_t:'ingreso'})),...state.expenses.map(e=>({...e,_t:'gasto'}))].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,7);
  return`
  <div class="page-header"><div><h2>Dashboard</h2><p>${new Date().toLocaleDateString('es-CL',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p></div></div>
  <div class="metrics">
    <div class="metric"><div class="metric-label">Ingresos del mes</div><div class="metric-value green">${fmt(totalIn)}</div></div>
    <div class="metric"><div class="metric-label">Gastos del mes</div><div class="metric-value red">${fmt(totalOut)}</div></div>
    <div class="metric"><div class="metric-label">Saldo neto</div><div class="metric-value ${balance>=0?'green':'red'}">${fmt(balance)}</div></div>
    <div class="metric"><div class="metric-label">Unidades morosas</div><div class="metric-value amber">${morose.length} / ${occupied.length}</div></div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="card-header"><span class="card-title">Estado de cobros — ${m}</span></div>
      <div style="font-size:13px;color:#6b7280;margin-bottom:8px">${paidUnits.size} pagados · ${morose.length} pendientes</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:#059669"></div></div>
      <div style="font-size:12px;color:#6b7280;margin-top:6px">${pct}% cobrado</div>
      ${morose.length>0?`<div style="margin-top:10px;font-size:12px;color:#dc2626;font-weight:600">⚠ Morosos: ${morose.map(u=>`Depto ${u.number}`).join(', ')}</div>`:''}
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Balance del mes</span></div>
      <div class="stat-row"><span>Total ingresos</span><span class="green" style="font-weight:700">${fmt(totalIn)}</span></div>
      <div class="stat-row"><span>Total gastos</span><span class="red" style="font-weight:700">${fmt(totalOut)}</span></div>
      <div class="stat-row" style="font-size:15px;font-weight:700"><span>Saldo neto</span><span class="${balance>=0?'green':'red'}">${fmt(balance)}</span></div>
    </div>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">Últimos movimientos</span></div>
    <table><thead><tr><th>Tipo</th><th>Descripción</th><th>Fecha</th><th>Monto</th></tr></thead>
    <tbody>${recents.map(r=>`<tr>
      <td><span class="badge ${r._t==='ingreso'?'badge-green':'badge-red'}">${r._t==='ingreso'?'💰':'📉'} ${r._t}</span></td>
      <td>${r._t==='ingreso'?`Depto ${state.units.find(u=>u.id===r.unitId)?.number||''} · ${state.residents.find(x=>x.id===r.residentId)?.name||''}`:r.icon+' '+r.label+' · '+(r.description||'')}</td>
      <td>${fmtD(r.date)}</td>
      <td style="font-weight:700;color:${r._t==='ingreso'?'#059669':'#dc2626'}">${r._t==='ingreso'?'+':'-'}${fmt(r.amount)}</td>
    </tr>`).join('')}</tbody></table>
  </div>`;
}

function buildUnits(){
  const{units,residents}=state;
  return`
  <div class="page-header">
    <div><h2>Unidades del Edificio</h2><p>${units.length} unidades registradas</p></div>
    <button class="btn btn-primary" id="btnAddUnit">+ Agregar unidad</button>
  </div>
  <div id="unitForm" style="display:none" class="card">
    <div class="card-title" style="margin-bottom:16px">Nueva unidad</div>
    <div class="form-row-3">
      <div class="form-group"><label class="form-label">N° Departamento *</label><input class="form-control" id="uNumber" placeholder="Ej: 101"></div>
      <div class="form-group"><label class="form-label">Piso *</label><input class="form-control" id="uFloor" type="number" placeholder="1"></div>
      <div class="form-group"><label class="form-label">Metraje depto (m²) *</label><input class="form-control" id="uSqm" type="number" placeholder="65"></div>
    </div>

function buildBank(){
  const{payments,expenses,units,residents}=state;
  const allMovs=[...payments.map(p=>({...p,_t:'crédito',_desc:`GC Depto ${units.find(u=>u.id===p.unitId)?.number||''} · ${residents.find(r=>r.id===p.residentId)?.name||''}`})),...expenses.map(e=>({...e,_t:'débito',_desc:`${e.icon} ${e.label} · ${e.description||''}`}))].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const totalIn=payments.reduce((s,p)=>s+p.amount,0);
  const totalOut=expenses.reduce((s,e)=>s+e.amount,0);
  let saldo=totalIn-totalOut;
  const movs=allMovs.map(m=>{const s=saldo;saldo+=m._t==='débito'?m.amount:-m.amount;return{...m,saldo:s}});
  return`
  <div class="page-header"><div><h2>Cuenta Corriente</h2><p>Cartola de movimientos</p></div><span class="badge badge-amber" style="padding:6px 12px">Simulación bancaria</span></div>
  <div class="metrics" style="grid-template-columns:repeat(3,1fr)">
    <div class="metric"><div class="metric-label">Total créditos</div><div class="metric-value green">${fmt(totalIn)}</div></div>
    <div class="metric"><div class="metric-label">Total débitos</div><div class="metric-value red">${fmt(totalOut)}</div></div>
    <div class="metric"><div class="metric-label">Saldo disponible</div><div class="metric-value ${totalIn-totalOut>=0?'green':'red'}">${fmt(totalIn-totalOut)}</div></div>
  </div>
  <div class="card">
    <table><thead><tr><th>Fecha</th><th>Descripción</th><th>Tipo</th><th>Monto</th><th>Saldo</th></tr></thead>
    <tbody>${movs.map(m=>`<tr>
      <td>${fmtD(m.date)}</td><td>${m._desc}</td>
      <td><span class="badge ${m._t==='crédito'?'badge-green':'badge-red'}">${m._t}</span></td>
      <td style="font-weight:700;color:${m._t==='crédito'?'#059669':'#dc2626'}">${m._t==='crédito'?'+':'-'}${fmt(m.amount)}</td>
      <td style="font-weight:600">${fmt(m.saldo)}</td>
    </tr>`).join('')}</tbody></table>
  </div>`;
}

      <td>${p.month}</td><td class="green" style="font-weight:700">${fmt(p.amount)}</td>
      <td>${p.method}</td><td>${fmtD(p.date)}</td>
      <td><button class="btn btn-sm" onclick="viewReceipt('${p.id}')">Ver</button></td>
    </tr>`).join('')}</tbody></table>`}
  </div>`;
}

function buildMyPayments(){
  const r=state.currentResident;
  const myP=state.payments.filter(p=>p.residentId===r?.id);
  return`
  <div class="page-header"><div><h2>Mis Comprobantes</h2><p>${myP.length} pagos</p></div></div>
  <div class="card">
    ${myP.length===0?'<div class="empty">Sin comprobantes</div>':
    `<table><thead><tr><th>Mes</th><th>Monto</th><th>Método</th><th>Fecha</th><th></th></tr></thead>
    <tbody>${myP.map(p=>`<tr>
      <td><b>${p.month}</b></td><td class="green" style="font-weight:700">${fmt(p.amount)}</td>
      <td><span class="badge badge-blue">${p.method}</span></td><td>${fmtD(p.date)}</td>
      <td><button class="btn btn-sm btn-primary" onclick="viewReceipt('${p.id}')">⬇ Ver</button></td>
    </tr>`).join('')}</tbody></table>`}
  </div>`;
}

function buildModal(){
  const m=state.modal;
  if(m.type==='receipt'){
    const{payment:p,resident:r,unit:u}=m;
    return`<div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header"><span class="modal-title">Comprobante de Pago</span><button class="close-btn" onclick="setState({modal:null})">×</button></div>
        <div class="receipt">
          <div class="receipt-header">
            <div style="font-size:32px">🏢</div>
            <h2 style="font-size:20px;font-weight:800;margin:6px 0">${state.buildingName}</h2>
            <p style="color:#6b7280;font-size:13px">Comprobante de Gasto Común</p>
            <p style="font-size:11px;color:#9ca3af;margin-top:4px">N° ${p.receiptId}</p>
          </div>
          <div class="receipt-row"><span style="color:#6b7280">Residente</span><span style="font-weight:700">${r?.name||'—'}</span></div>
          <div class="receipt-row"><span style="color:#6b7280">RUT</span><span>${r?.rut||'—'}</span></div>
          <div class="receipt-row"><span style="color:#6b7280">Departamento</span><span style="font-weight:600">Depto ${u?.number||'—'} · Piso ${u?.floor||'—'}</span></div>
          ${u?.parking?`<div class="receipt-row"><span style="color:#6b7280">Estacionamiento</span><span>${u.parkingNum||''} · ${u.parkingSqm}m²</span></div>`:''}
          ${u?.storage?`<div class="receipt-row"><span style="color:#6b7280">Bodega</span><span>${u.storageNum||''} · ${u.storageSqm}m²</span></div>`:''}
          <div class="receipt-row"><span style="color:#6b7280">Período</span><span>${p.month}</span></div>
          <div class="receipt-row"><span style="color:#6b7280">Fecha de pago</span><span>${fmtD(p.date)}</span></div>
          <div class="receipt-row"><span style="color:#6b7280">Método</span><span>${p.method}</span></div>
          <div class="receipt-total"><span>TOTAL PAGADO</span><span style="color:#059669">${fmt(p.amount)}</span></div>
          <div style="margin-top:20px;text-align:center;font-size:11px;color:#9ca3af;border-top:1px dashed #e5e5e5;padding-top:12px">Comprobante válido · ${state.buildingName} · ${new Date().getFullYear()}</div>
        </div>
        <div style="margin-top:16px;display:flex;gap:8px;justify-content:center">
          <button class="btn btn-primary" onclick="window.print()">🖨 Imprimir</button>
          <button class="btn" onclick="setState({modal:null})">Cerrar</button>
        </div>
      </div>
    </div>`;
  }
  return'';
}

function attachEvents(){
  document.getElementById('modeSelect')?.addEventListener('change',function(){
    const v=this.value;
    if(v==='admin'){setState({mode:'admin',view:'dashboard'});}
    else{const rid=v.replace('res_','');setState({mode:v,view:'my_account',currentResident:state.residents.find(r=>r.id===rid)||state.residents[0]});}
  });
  document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>setState({view:btn.dataset.view})));
  document.getElementById('btnAddUnit')?.addEventListener('click',()=>{const f=document.getElementById('unitForm');f.style.display=f.style.display==='none'?'block':'none';});
  document.getElementById('btnCancelUnit')?.addEventListener('click',()=>{document.getElementById('unitForm').style.display='none';});
  document.getElementById('btnSaveUnit')?.addEventListener('click',()=>{
    const number=document.getElementById('uNumber').value.trim();
    const floor=document.getElementById('uFloor').value;
    const sqm=document.getElementById('uSqm').value;
    if(!number||!floor||!sqm){showAlert('Completa los campos obligatorios','error');return;}
    const parking=document.getElementById('uParking').checked;
    const storage=document.getElementById('uStorage').checked;
    addUnit({number,floor:parseInt(floor),sqm:parseInt(sqm),parking,parkingNum:parking?document.getElementById('uParkingNum').value:'',parkingSqm:parking?parseInt(document.getElementById('uParkingSqm').value||0):0,storage,storageNum:storage?document.getElementById('uStorageNum').value:'',storageSqm:storage?parseInt(document.getElementById('uStorageSqm').value||0):0});
  });
  document.getElementById('btnAddResident')?.addEventListener('click',()=>{const f=document.getElementById('residentForm');f.style.display=f.style.display==='none'?'block':'none';});
  document.getElementById('btnCancelResident')?.addEventListener('click',()=>{document.getElementById('residentForm').style.display='none';});
  document.getElementById('btnSaveResident')?.addEventListener('click',()=>{
    const name=document.getElementById('rName').value.trim();
    const email=document.getElementById('rEmail').value.trim();
    const unitId=document.getElementById('rUnit').value;
    if(!name||!email||!unitId){showAlert('Completa los campos obligatorios','error');return;}
    addResident({name,email,rut:document.getElementById('rRut').value,phone:document.getElementById('rPhone').value,unitId});
  });
  document.getElementById('btnAddPayment')?.addEventListener('click',()=>{const f=document.getElementById('paymentForm');f.style.display=f.style.display==='none'?'block':'none';});
  document.getElementById('btnCancelPayment')?.addEventListener('click',()=>{document.getElementById('paymentForm').style.display='none';});
  document.getElementById('btnSavePayment')?.addEventListener('click',()=>{
    const residentId=document.getElementById('pResident').value;
    const amount=document.getElementById('pAmount').value;
    const date=document.getElementById('pDate').value;
    const method=document.getElementById('pMethod').value;
    if(!residentId||!amount||!date){showAlert('Completa los campos obligatorios','error');return;}
    const r=state.residents.find(x=>x.id===residentId);
    addPayment({residentId,unitId:r?.unitId,amount,date,method});
  });
  document.getElementById('btnSaveExpense')?.addEventListener('click',()=>{
    const amount=document.getElementById('eAmount')?.value;
    const date=document.getElementById('eDate')?.value;
    if(!amount||!date){showAlert('Completa los campos obligatorios','error');return;}
    const cat=EXPENSE_CATS.find(c=>c.id===state.selectedCat);
    addExpense({catId:cat.id,label:cat.label,icon:cat.icon,prorate:cat.prorate,amount,date,description:document.getElementById('eDesc')?.value||''});
  });
  document.getElementById('reportMonth')?.addEventListener('change',function(){setState({reportMonth:this.value});});
  document.getElementById('btnSaveName')?.addEventListener('click',()=>{
    const n=document.getElementById('bName').value.trim();
    if(n){save('ea_bname',n);setState({buildingName:n});showAlert('Nombre actualizado');}
  });
  document.getElementById('modalOverlay')?.addEventListener('click',function(e){if(e.target===this)setState({modal:null});});
}

window.toggleParkingForm=()=>{
  const c=document.getElementById('uParking').checked;
  document.getElementById('parkingFields').style.display=c?'grid':'none';
};
window.toggleStorageForm=()=>{
  const c=document.getElementById('uStorage').checked;
  document.getElementById('storageFields').style.display=c?'grid':'none';
};
window.updateProrate=()=>{
  const amt=parseInt(document.getElementById('eAmount')?.value||0);
  const prev=document.getElementById('proratePreview');
  const body=document.getElementById('prorateBody');
  if(!prev||!body)return;
  if(amt>0){
    prev.style.display='block';
    const rows=calcProrate({amount:amt},state.units);
    body.innerHTML=rows.map(p=>{
      const u=state.units.find(x=>x.id===p.unitId);
      return`<tr>
        <td>Depto ${u?.number||''}</td>
        <td>${u?.sqm||0}</td>
        <td>${u?.parking?u.parkingSqm:0}</td>
        <td>${u?.storage?u.storageSqm:0}</td>
        <td><b>${p.sqm}</b></td>
        <td>${(p.pct*100).toFixed(1)}%</td>
        <td style="font-weight:700;color:#1a56db">${fmt(p.amount)}</td>
      </tr>`;
    }).join('');
  }else{prev.style.display='none';}
};
window.viewReceipt=id=>{
  const p=state.payments.find(x=>x.id===id);
  if(!p)return;
  setState({modal:{type:'receipt',payment:p,resident:state.residents.find(r=>r.id===p.residentId),unit:state.units.find(u=>u.id===p.unitId)}});
};
window.setState=setState;

render();
</script>
</body>
</html>
