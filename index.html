function attachEvents(){
  document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>{
    const v=btn.dataset.view;
    setState({view:v});
    limpiarBadgeNav(v);
  }));

  // Auto-focus en campos de contraseña al mostrar el paso de login
  setTimeout(()=>{
    const claveInput = document.getElementById('claveInput');
    const superClave = document.getElementById('superClave');
    if(claveInput && state.loginStep === 2) claveInput.focus();
    if(superClave && state.loginStep === 3) superClave.focus();
  }, 50);

  // Unidades
  document.getElementById('btnAddUnit')?.addEventListener('click',()=>toggleForm('unitForm'));
  document.getElementById('btnCancelUnit')?.addEventListener('click',()=>toggleForm('unitForm',false));
  document.getElementById('btnSaveUnit')?.addEventListener('click',async()=>{
    const number=document.getElementById('uNumber').value.trim();
    const floor=document.getElementById('uFloor').value;
    const sqm=document.getElementById('uSqm').value;
    if(!number||!floor){showAlert('Completa N° depto y piso','error');return;}
    const{data,error}=await sb.from('unidades').insert({
      comunidad_id:state.selectedComunidad.id,numero:number,piso:parseInt(floor),
      sqm:sqm?parseFloat(sqm):null,monthly_fee:null
    }).select();
    if(error){showAlert('Error: '+error.message,'error');return;}
    auditLog('UNIDAD_CREADA',`Depto ${data[0].numero} · P${data[0].piso} · ${data[0].sqm||'?'}m²`,{referencia_id:data[0].id,tabla:'unidades'});
    setState({comunidadData:{...state.comunidadData,unidades:[...state.comunidadData.unidades,...data]}});
    showAlert('✓ Departamento agregado');
  });

  // Residentes
  document.getElementById('btnAddResident')?.addEventListener('click',()=>toggleForm('residentForm'));
  document.getElementById('btnCancelResident')?.addEventListener('click',()=>toggleForm('residentForm',false));
  document.getElementById('btnSaveResident')?.addEventListener('click',async()=>{
    const nombre=document.getElementById('rName').value.trim();
    const unitId=document.getElementById('rUnit').value;
    const clave=document.getElementById('rClave').value.trim();
    const rol=document.getElementById('rRole').value;
    if(!nombre||!unitId||!clave){showAlert('Completa campos obligatorios','error');return;}
    const{data,error}=await sb.from('usuarios').insert({
      comunidad_id:state.selectedComunidad.id,
      unidad_id:unitId,
      nombre,
      email:document.getElementById('rEmail').value,
      rut:document.getElementById('rRut').value,
      phone:document.getElementById('rPhone').value,
      rol,
      clave,
      activo:true
    }).select();
    if(error){showAlert('Error: '+error.message,'error');return;}
    const _uNew=state.comunidadData.unidades.find(u=>u.id===data[0].unidad_id);
    auditLog('RESIDENTE_CREADO',`${data[0].nombre} · Depto ${_uNew?.numero||'—'} · Rol: ${data[0].rol}`,{referencia_id:data[0].id,tabla:'usuarios'});
    setState({comunidadData:{...state.comunidadData,residentes:[...state.comunidadData.residentes,...data]}});
    showAlert('Residente registrado');
    // Email de bienvenida
    const unidadNueva = state.comunidadData.unidades.find(x=>x.id===unitId);
    emailBienvenida(data[0], unidadNueva, clave, state.selectedComunidad);
  });

  // Pagos
  document.getElementById('btnAddPayment')?.addEventListener('click',()=>toggleForm('paymentForm'));
  document.getElementById('btnCancelPayment')?.addEventListener('click',()=>toggleForm('paymentForm',false));
  document.getElementById('btnSavePayment')?.addEventListener('click',async(e)=>{
    const btn=e.currentTarget; if(btn.disabled)return; btn.disabled=true; btn.textContent='Procesando...';
    const userId=document.getElementById('pResident').value;
    const amount=document.getElementById('pAmount').value;
    const date=document.getElementById('pDate').value;
    const method=document.getElementById('pMethod').value;
    if(!userId||!amount||!date){showAlert('Completa campos','error');btn.disabled=false;btn.textContent='✓ Registrar y emitir comprobante';return;}
    const r=state.comunidadData.residentes.find(x=>x.id===userId);
    const curM=date.substr(0,7);
    // Verificar pago duplicado
    const yaExiste=state.comunidadData.pagos.some(p=>p.usuario_id===userId&&p.month===curM);
    if(yaExiste){if(!confirm(`⚠ Ya existe un pago de ${r?.nombre} para ${curM}. ¿Registrar de todas formas?`)){btn.disabled=false;btn.textContent='✓ Registrar y emitir comprobante';return;}}
    const pf=getPendingFines(r?.unidad_id,curM);
    const finesAmt=pf.reduce((s,f)=>s+f.amount,0);
    const{data,error}=await sb.from('pagos').insert({comunidad_id:state.selectedComunidad.id,unidad_id:r?.unidad_id,usuario_id:userId,amount:parseInt(amount),base_amount:parseInt(amount)-finesAmt,date,method,month:curM,registrado_por:state.currentUser?.nombre||'Admin'}).select();
    if(error){showAlert('Error al registrar pago','error');btn.disabled=false;btn.textContent='✓ Registrar y emitir comprobante';return;}
    if(pf.length>0){await sb.from('multas').update({status:'pagada'}).in('id',pf.map(f=>f.id));const multas=state.comunidadData.multas.map(f=>pf.find(x=>x.id===f.id)?{...f,status:'pagada'}:f);setState({comunidadData:{...state.comunidadData,multas}});}
    const _rPago=state.comunidadData.residentes.find(x=>x.id===data[0].usuario_id);
  const _uPago=state.comunidadData.unidades.find(x=>x.id===data[0].unidad_id);
  auditLog('PAGO_REGISTRADO',`Depto ${_uPago?.numero||'—'} · ${_rPago?.nombre||'—'} · ${fmt(data[0].amount)} · ${data[0].method}`,{referencia_id:data[0].id,tabla:'pagos'});
  setState({comunidadData:{...state.comunidadData,pagos:[...data,...state.comunidadData.pagos]},modal:{type:'receipt',payment:data[0]}});
    const residentePago=state.comunidadData.residentes.find(x=>x.id===userId);
    const unidadPago=state.comunidadData.unidades.find(x=>x.id===r?.unidad_id);
    emailComprobantePago(data[0],residentePago,unidadPago,state.selectedComunidad);
    btn.disabled=false;btn.textContent='✓ Registrar y emitir comprobante';
  });

  // Multas
  document.getElementById('btnAddFine')?.addEventListener('click',()=>toggleForm('fineForm'));
  document.getElementById('btnCancelFine')?.addEventListener('click',()=>toggleForm('fineForm',false));
  document.getElementById('btnSaveFine')?.addEventListener('click',async()=>{
    const sel=document.getElementById('fResident').value;
    const amount=document.getElementById('fAmount').value;
    const reason=document.getElementById('fReason').value.trim();
    const date=document.getElementById('fDate').value;
    const month=document.getElementById('fMonth').value;
    if(!sel||!amount||!reason){showAlert('Completa campos','error');return;}
    const[userId,unitId]=sel.split('|');
    const{data,error}=await sb.from('multas').insert({comunidad_id:state.selectedComunidad.id,unidad_id:unitId,usuario_id:userId,amount:parseInt(amount),reason,date,month,status:'pendiente'}).select();
    if(error){showAlert('Error','error');return;}
    const _uMul=state.comunidadData.unidades.find(u=>u.id===data[0].unidad_id);
    const _rMul=state.comunidadData.residentes.find(r=>r.id===data[0].usuario_id);
    auditLog('MULTA_APLICADA',`Depto ${_uMul?.numero||'—'} · ${_rMul?.nombre||'—'} · ${fmt(data[0].amount)} · Motivo: ${data[0].reason}`,{referencia_id:data[0].id,tabla:'multas'});
    setState({comunidadData:{...state.comunidadData,multas:[...data,...state.comunidadData.multas]}});
    showAlert('Multa aplicada');
    notifLocal('Nueva multa aplicada',`Se ha registrado una multa de ${fmt(parseInt(document.getElementById('fAmount')?.value)||0)}.`,'⚠️');
    // Email multa
    const[multaUserId]=sel.split('|');
    const residenteMulta = state.comunidadData.residentes.find(x=>x.id===multaUserId);
    emailMulta(data[0], residenteMulta, state.selectedComunidad);
  });

  // Trabajadores
  document.getElementById('btnAddWorker')?.addEventListener('click',()=>toggleForm('workerForm'));
  document.getElementById('btnCancelWorker')?.addEventListener('click',()=>toggleForm('workerForm',false));
  document.getElementById('btnSaveWorker')?.addEventListener('click',async()=>{
    const nombre=document.getElementById('wName').value.trim();
    const rut=document.getElementById('wRut').value.trim();
    const rol=document.getElementById('wRole').value.trim();
    const tipo=document.getElementById('wType').value;
    const gross_salary=parseInt(document.getElementById('wSalary').value)||0;
    const start_date=document.getElementById('wStart').value;
    if(!nombre||!rut||!rol){showAlert('Completa campos','error');return;}
    const afp_type=tipo==='contrato'?document.getElementById('wAfp').value:'';
    const health_type=tipo==='contrato'?document.getElementById('wHealth').value:'';
    const{data,error}=await sb.from('trabajadores').insert({comunidad_id:state.selectedComunidad.id,nombre,rut,rol,tipo,gross_salary,start_date,afp_type,health_type,health_amount:health_type==='Isapre'?parseInt(document.getElementById('wIsapreAmt')?.value||0):0,activo:true}).select();
    if(error){showAlert('Error','error');return;}
    auditLog('TRABAJADOR_CREADO',`${data[0].nombre} · ${data[0].rol} · ${data[0].tipo}`,{referencia_id:data[0].id,tabla:'trabajadores'});
    setState({comunidadData:{...state.comunidadData,trabajadores:[...state.comunidadData.trabajadores,...data]}});showAlert('Trabajador agregado');
  });

  // Votaciones
  document.getElementById('btnAddVotacion')?.addEventListener('click',()=>toggleForm('votacionForm'));
  document.getElementById('btnCancelVotacion')?.addEventListener('click',()=>toggleForm('votacionForm',false));
  document.getElementById('btnAddOpcion')?.addEventListener('click',()=>{
    const c=document.getElementById('opcionesContainer');if(!c)return;
    const d=document.createElement('div');d.style.marginBottom='8px';
    d.innerHTML=`<input class="form-control opcion-input" placeholder="Nueva opción">`;
    c.appendChild(d);
  });
  document.getElementById('btnSaveVotacion')?.addEventListener('click',async()=>{
    const titulo=document.getElementById('vTitulo').value.trim();
    const desc=document.getElementById('vDesc').value;
    const inicio=document.getElementById('vInicio').value;
    const cierre=document.getElementById('vCierre').value;
    const opciones=[...document.querySelectorAll('.opcion-input')].map(i=>i.value.trim()).filter(Boolean);
    if(!titulo||!cierre||opciones.length<2){showAlert('Completa título, fecha de cierre y al menos 2 opciones','error');return;}
    const{data,error}=await sb.from('votaciones').insert({comunidad_id:state.selectedComunidad.id,titulo,descripcion:desc,opciones:JSON.stringify(opciones),fecha_inicio:inicio||today(),fecha_cierre:cierre,estado:'activa',creada_por:state.currentUser?.nombre||'Admin'}).select();
    if(error){showAlert('Error','error');return;}
    setState({comunidadData:{...state.comunidadData,votaciones:[...data,...state.comunidadData.votaciones]}});
    showAlert('Votación publicada');toggleForm('votacionForm',false);
    notifLocal('Nueva votación activa',`"${document.getElementById('vTitulo')?.value||'Votación'}" ya está disponible.`,'🗳️');
    // Email a todos los residentes
    emailNuevaVotacion(data[0], state.comunidadData.residentes, state.selectedComunidad);
  });

  // Alertas
  document.getElementById('btnAddAlert')?.addEventListener('click',()=>toggleForm('alertForm'));
  document.getElementById('btnCancelAlert')?.addEventListener('click',()=>toggleForm('alertForm',false));
  document.getElementById('btnSaveAlert')?.addEventListener('click',async()=>{
    const titulo=document.getElementById('aTitle').value.trim();
    const tipo=document.getElementById('aType').value;
    const descripcion=document.getElementById('aDesc').value;
    if(!titulo){showAlert('Ingresa un título','error');return;}
    const full=isFullAccess();
    const residentSel=full?document.getElementById('aResident')?.value:'';
    const usuario_id=residentSel||state.currentUser?.id||null;
    const unidad_id=usuario_id?state.comunidadData.residentes.find(r=>r.id===usuario_id)?.unidad_id:null;
    const{data,error}=await sb.from('alertas').insert({comunidad_id:state.selectedComunidad.id,tipo,titulo,descripcion,usuario_id,unidad_id,date:today(),time:new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}),status:'activa'}).select();
    if(error){showAlert('Error','error');return;}
    setState({comunidadData:{...state.comunidadData,alertas:[...data,...state.comunidadData.alertas]}});
    showAlert('Alerta enviada');
    // Email alerta — si es para todos (sin residente específico) envía a toda la comunidad
    const destAlerta = residentSel
      ? state.comunidadData.residentes.filter(r=>r.id===residentSel)
      : state.comunidadData.residentes;
    emailAlerta(data[0], destAlerta, state.selectedComunidad);
  });

  // Gastos
  document.getElementById('btnSaveExpense')?.addEventListener('click',async()=>{
    const amount=document.getElementById('eAmount')?.value;
    const date=document.getElementById('eDate')?.value;
    if(!amount||!date){showAlert('Completa campos','error');return;}
    const cat=EXPENSE_CATS.find(c=>c.id===state.selectedCat);
    const{data,error}=await sb.from('gastos').insert({comunidad_id:state.selectedComunidad.id,cat_id:cat.id,label:cat.label,icon:cat.icon,prorate:cat.prorate,amount:parseInt(amount),date,description:document.getElementById('eDesc')?.value||'',month:date.substr(0,7)}).select();
    if(error){showAlert('Error','error');return;}
    auditLog('GASTO_REGISTRADO',`${data[0].icon||''} ${data[0].label} · ${fmt(data[0].amount)} · ${data[0].description||''}`,{referencia_id:data[0].id,tabla:'gastos'});
    setState({comunidadData:{...state.comunidadData,gastos:[...data,...state.comunidadData.gastos]},selectedCat:null});showAlert('Gasto registrado');
  });

  // Cambiar clave
  document.getElementById('btnCambiarClave')?.addEventListener('click',async()=>{
    const actual=document.getElementById('pwActual').value;
    const nueva=document.getElementById('pwNueva').value;
    const confirm=document.getElementById('pwConfirm').value;
    if(!actual||!nueva||!confirm){showAlert('Completa todos los campos','error');return;}
    if(actual!==state.currentUser.clave){showAlert('La clave actual es incorrecta','error');return;}
    if(nueva.length<6){showAlert('La nueva clave debe tener al menos 6 caracteres','error');return;}
    if(nueva!==confirm){showAlert('Las claves no coinciden','error');return;}
    const{error}=await sb.from('usuarios').update({clave:nueva}).eq('id',state.currentUser.id);
    if(error){showAlert('Error','error');return;}
    setState({currentUser:{...state.currentUser,clave:nueva}});
    showAlert('Clave cambiada exitosamente ✓');
    ['pwActual','pwNueva','pwConfirm'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  });

  // Configuración
  document.getElementById('btnSaveSettings')?.addEventListener('click',async()=>{
    const nombre=document.getElementById('bName').value.trim();
    const ciudad=document.getElementById('bCity').value.trim();
    const direccion=document.getElementById('bAddr').value.trim();
    const gc_default=parseInt(document.getElementById('bGcDefault')?.value)||null;
    await sb.from('comunidades').update({nombre,ciudad,direccion,gc_default}).eq('id',state.selectedComunidad.id);
    setState({selectedComunidad:{...state.selectedComunidad,nombre,ciudad,direccion,gc_default}});showAlert('Guardado');
  });

  document.getElementById('reportMonth')?.addEventListener('change',function(){setState({reportMonth:this.value});});
  document.getElementById('modalOverlay')?.addEventListener('click',function(e){if(e.target===this)setState({modal:null});});
  attachPaymentResidenteEvent();

  // Botón agregar depto desde modal inventario
  document.getElementById('btnAddUnitModal')?.addEventListener('click',async()=>{
    const numero=prompt('N° del departamento:');
    const piso=prompt('Piso:');
    if(!numero||!piso){return;}
    const{data,error}=await sb.from('unidades').insert({comunidad_id:state.selectedComunidad?.id||state.modal?.comunidadId,numero,piso:parseInt(piso),monthly_fee:null}).select();
    if(error){showAlert('Error: '+error.message,'error');return;}
    setState({comunidadData:{...state.comunidadData,unidades:[...state.comunidadData.unidades,...data]}});showAlert('Depto agregado');
  });
}

window.toggleAsignacion=(deptoNumero,tipo,itemLabel)=>{
  const asig={...state.wizard.asignaciones};
  if(!asig[deptoNumero])asig[deptoNumero]={estacs:[],bods:[]};
  const list=tipo==='estac'?asig[deptoNumero].estacs:asig[deptoNumero].bods;
  const idx=list.indexOf(itemLabel);
  if(idx>=0)list.splice(idx,1);else list.push(itemLabel);
  setState({wizard:{...state.wizard,asignaciones:asig}});
};

window.wizardCrearComunidad=async()=>{
  const{datos,inventario,asignaciones}=state.wizard;
  setState({loading:true});
  // 1. Crear comunidad
  const{data:comData,error:comError}=await sb.from('comunidades').insert({
    nombre:datos.nombre,direccion:datos.direccion,ciudad:datos.ciudad,region:datos.region,
    codigo_acceso:datos.codigo,plan:datos.plan,monto_implementacion:datos.impl,
    monto_mantencion:datos.mant,notas:datos.notas,activa:true,fecha_inicio:today()
  }).select();
  if(comError){setState({loading:false});showAlert('Error: el código ya existe','error');return;}
  const comId=comData[0].id;
  // 2. Crear admin
  await sb.from('usuarios').insert({comunidad_id:comId,nombre:datos.adminNombre,email:datos.adminEmail,phone:datos.adminPhone,rol:'admin',clave:datos.adminClave,activo:true});
  // 3. Crear departamentos y mapear número → id
  const deptoMap={};
  for(const d of inventario.deptos){
    const{data}=await sb.from('unidades').insert({comunidad_id:comId,numero:d.numero,piso:d.piso,monthly_fee:null}).select();
    if(data&&data[0])deptoMap[d.numero]=data[0].id;
  }
  // 4. Crear estacionamientos y asignar
  for(const e of inventario.estacs){
    const depto=Object.keys(asignaciones).find(k=>(asignaciones[k].estacs||[]).includes(e.label));
    const unidad_id=depto?deptoMap[depto]:null;
    await sb.from('estacionamientos').insert({comunidad_id:comId,numero:e.label,unidad_id});
    // Si tiene asignación, actualizar la unidad con el número de estac en parking_num
    if(unidad_id){await sb.from('unidades').update({parking:true,parking_num:e.label}).eq('id',unidad_id);}
  }
  // 5. Crear bodegas y asignar
  for(const b of inventario.bods){
    const depto=Object.keys(asignaciones).find(k=>(asignaciones[k].bods||[]).includes(b.label));
    const unidad_id=depto?deptoMap[depto]:null;
    await sb.from('bodegas').insert({comunidad_id:comId,numero:b.label,unidad_id});
    if(unidad_id){await sb.from('unidades').update({storage:true,storage_num:b.label}).eq('id',unidad_id);}
  }
  const comunidades=await loadAllComunidades();
  setState({loading:false,comunidades,view:'sa_dashboard',wizard:{step:1,datos:{},inventario:{deptos:[],estacs:[],bods:[]},asignaciones:{}}});
  showAlert(`🎉 Comunidad "${datos.nombre}" creada con ${inventario.deptos.length} deptos`);
};

const _sbOriginalFrom = sb.from.bind(sb);
sb.from = function(table){
  const query = _sbOriginalFrom(table);
  if(!state.isDemo) return query;
  // En modo demo, interceptar insert/update/delete y devolver respuesta simulada
  const demoResponse = { data: [], error: null };
  return {
    ...query,
    insert: (data) => ({ select: () => Promise.resolve({ data: Array.isArray(data)?data:[data], error: null }), then: (r)=>r({data:Array.isArray(data)?data:[data],error:null}) }),
    update: (data) => ({ eq: () => ({ eq: () => Promise.resolve(demoResponse) }), then: (r)=>r(demoResponse) }),
    delete: () => ({ eq: () => Promise.resolve(demoResponse), in: () => Promise.resolve(demoResponse) }),
    upsert: () => Promise.resolve(demoResponse),
    select: query.select.bind(query),
    eq: query.eq.bind(query),
    order: query.order.bind(query),
  };
};

// ── Seguridad: rate limiting y bloqueo por intentos fallidos ──
const _loginAttempts={};
const _MAX_ATTEMPTS=5;
const _LOCK_MS=15*60*1000; // 15 minutos

function _getLockKey(scope){return`login_${scope}_${state.selectedComunidad?.id||'sa'}`;}

function _checkLock(scope){
  const key=_getLockKey(scope);
  const rec=_loginAttempts[key];
  if(!rec)return false;
  if(Date.now()<rec.until){
    const mins=Math.ceil((rec.until-Date.now())/60000);
    showAlert(`Demasiados intentos. Espera ${mins} min.`,'error');
    return true;
  }
  delete _loginAttempts[key];
  return false;
}

function _registerFail(scope){
  const key=_getLockKey(scope);
  if(!_loginAttempts[key])_loginAttempts[key]={count:0,until:0};
  _loginAttempts[key].count++;
  if(_loginAttempts[key].count>=_MAX_ATTEMPTS){
    _loginAttempts[key].until=Date.now()+_LOCK_MS;
    showAlert('Cuenta bloqueada 15 min por múltiples intentos fallidos.','error');
  }else{
    const left=_MAX_ATTEMPTS-_loginAttempts[key].count;
    showAlert(`Clave incorrecta. ${left} intento${left!==1?'s':''} restante${left!==1?'s':''}.`,'error');
  }
}

function _clearFail(scope){delete _loginAttempts[_getLockKey(scope)];}

// Hash SHA-256 del lado cliente (para comparar con hash almacenado en BD)
async function _sha256(text){
  const enc=new TextEncoder();
  const buf=await crypto.subtle.digest('SHA-256',enc.encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// Sanitiza texto para prevenir XSS al renderizar en innerHTML
function sanitize(str){
  if(str==null)return'';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// Timeout de sesión: 2 horas de inactividad
let _sessionTimer=null;
function _resetSessionTimer(){
  if(_sessionTimer)clearTimeout(_sessionTimer);
  if(state.screen!=='login'){
    _sessionTimer=setTimeout(()=>{
      showAlert('Sesión expirada por inactividad.','error');
      setTimeout(()=>window.logout(),2500);
    },2*60*60*1000);
  }
}
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,_resetSessionTimer,{passive:true}));

  try{
    // Login con clave en texto plano (lo que existe en la BD actual)
    const{data,error}=await sb.from('superadmin').select('id,nombre').eq('clave',clave).maybeSingle();
    setState({loading:false});
    if(error||!data){
      _registerFail('sa');
      showAlert('Clave incorrecta','error');
      return;
    }
    _clearFail('sa');
    // Guardar hash en segundo plano si la columna ya existe (no bloquea el login)
    _sha256(clave).then(async hash=>{
      try{ await sb.from('superadmin').update({clave_hash:hash}).eq('id',data.id); }catch(e){}
    });
    const comunidades=await loadAllComunidades();
    _resetSessionTimer();
    setState({screen:'superadmin',isSuperAdmin:true,view:'sa_dashboard',comunidades});
  }catch(e){setState({loading:false});showAlert('Error al conectar','error');console.error(e);}
};

window.doLogin=async()=>{
  if(_checkLock('user'))return;
  const clave=document.getElementById('claveInput')?.value?.trim();
  if(!clave){showAlert('Ingresa tu clave','error');return;}
  await new Promise(r=>setTimeout(r,150+Math.random()*150));
  setState({loading:true});
  try{
    // Login con clave en texto plano (columna que existe en la BD)
    const{data,error}=await sb.from('usuarios')
      .select('id,nombre,rol,unidad_id,email,phone,rut,clave')
      .eq('comunidad_id',state.selectedComunidad.id)
      .eq('clave',clave)
      .maybeSingle();
    if(error||!data||data.activo===false){
      setState({loading:false});
      _registerFail('user');
      return;
    }
    _clearFail('user');
    // Guardar hash en segundo plano si la columna ya fue migrada (no bloquea el login)
    _sha256(clave).then(async hash=>{
      try{ await sb.from('usuarios').update({clave_hash:hash}).eq('id',data.id); }catch(e){}
    });
    const comunidadData=await loadComunidadData(state.selectedComunidad.id);
    const full=data.rol==='admin'||data.rol==='presidente'||data.rol==='tesorero';
    _resetSessionTimer();
    setState({loading:false,screen:'app',currentUser:data,comunidadData,view:full?'dashboard':'my_account'});
    setTimeout(()=>auditLog('SESION_INICIO',`${data.nombre} ingresó como ${data.rol}`),300);
    setTimeout(onAppReady,1500);
  }catch(e){setState({loading:false});showAlert('Error al conectar. Verifica tu internet.','error');console.error(e);}
};

function attachPaymentResidenteEvent(){
  document.getElementById('btnConfirmarPagoResidente')?.addEventListener('click',async(e)=>{
    const btn=e.currentTarget; if(btn.disabled)return; btn.disabled=true; btn.textContent='Procesando...';
    const u=state.currentUser;
    const unit=state.comunidadData.unidades.find(x=>x.id===u?.unidad_id);
    const monto=parseInt(document.getElementById('rp_monto')?.value)||0;
    const fecha=document.getElementById('rp_fecha')?.value||today();
    const metodo=document.getElementById('rp_metodo')?.value||'Transferencia';
    const operacion=document.getElementById('rp_operacion')?.value||'';
    if(!monto){showAlert('Ingresa el monto pagado','error');btn.disabled=false;btn.textContent='✅ Confirmar pago';return;}
    const curM=fecha.substr(0,7);
    // Anti-duplicado
    const yaExiste=state.comunidadData.pagos.some(p=>p.usuario_id===u?.id&&p.month===curM);
    if(yaExiste){showAlert('Ya tienes un pago registrado para este mes.','error');btn.disabled=false;btn.textContent='✅ Confirmar pago';return;}
    const pf=getPendingFines(u?.unidad_id,curM);
    const finesAmt=pf.reduce((s,f)=>s+f.amount,0);
    const{data,error}=await sb.from('pagos').insert({
      comunidad_id:state.selectedComunidad.id,
      unidad_id:u?.unidad_id,
      usuario_id:u?.id,
      amount:monto,
      base_amount:monto-finesAmt,
      date:fecha,
      method:metodo,
      month:curM,
      operacion_ref:operacion
    }).select();
    if(error){showAlert('Error al registrar: '+error.message,'error');btn.disabled=false;btn.textContent='✅ Confirmar pago';return;}
    if(pf.length>0){
      await sb.from('multas').update({status:'pagada'}).in('id',pf.map(f=>f.id));
      const multas=state.comunidadData.multas.map(f=>pf.find(x=>x.id===f.id)?{...f,status:'pagada'}:f);
      state.comunidadData={...state.comunidadData,multas};
    }
    const pagos=[...data,...state.comunidadData.pagos];
    setState({comunidadData:{...state.comunidadData,pagos},modal:{type:'receipt',payment:data[0]}});
    showAlert('✅ Pago registrado correctamente');
    notifLocal('Pago registrado',`Tu GC de ${curM} fue registrado exitosamente.`,'✅');
    const unidadRes=state.comunidadData.unidades.find(x=>x.id===u?.unidad_id);
    emailComprobantePago(data[0],u,unidadRes,state.selectedComunidad);
    btn.disabled=false;btn.textContent='✅ Confirmar pago';
  });
}

function buildActaVotacionModal(votacionId){

  const com=state.selectedComunidad;
  const v=votaciones.find(x=>x.id===votacionId);
  if(!v)return'';

  let opciones=v.opciones||[];
  if(typeof opciones==='string'){try{opciones=JSON.parse(opciones);}catch(e){opciones=[];}}
  if(!Array.isArray(opciones))opciones=[];

  const votosDev=votos.filter(x=>x.votacion_id===votacionId);
  const totalVotos=votosDev.length;
  const totalPosibles=residentes.length;
  const pctParticipacion=totalPosibles>0?Math.round(totalVotos/totalPosibles*100):0;

  const fechaEmision=ahora.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});
  const horaEmision=ahora.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  const numeroActa='VOT-'+String(ahora.getFullYear()).slice(2)+String(ahora.getMonth()+1).padStart(2,'0')+'-'+String(Math.floor(Math.random()*9000)+1000);

  // Calcular resultados y ganador
  const resultados=opciones.map(op=>{
    const n=votosDev.filter(x=>x.opcion_elegida===op).length;
    const pct=totalVotos>0?Math.round(n/totalVotos*100):0;
    return{op,n,pct};
  }).sort((a,b)=>b.n-a.n);

  const ganador=resultados[0];
  const empate=resultados.length>1&&resultados[0].n===resultados[1].n;

  return`<div class="modal-overlay" id="modalOverlay">
    <div class="modal modal-lg" style="max-width:720px;max-height:95vh;overflow-y:auto">

        <span class="modal-title">📄 Acta de Votación</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm btn-success" id="btnGuardarActaDoc" onclick="guardarActaEnDocumentos('${votacionId}')" title="Guardar en Documentos">

          </button>
          <button class="btn btn-sm btn-primary" onclick="descargarActaPDF('${votacionId}')">⬇ Descargar PDF</button>
          <button class="btn btn-sm" onclick="window.print()">🖨 Imprimir</button>
          <button class="close-btn" onclick="setState({modal:null})">×</button>
        </div>

        ✅ <span>Esta acta ya está guardada en <b>Documentos → Actas</b></span>
        <button class="btn btn-sm btn-success" style="margin-left:auto" onclick="setState({modal:null,view:'documents'})">Ver en Documentos →</button>
      </div>`:''}

      <!-- ACTA IMPRIMIBLE -->
      <div class="acta-vot-wrap" id="actaVotacionContent">

        <!-- Header -->
        <div class="acta-vot-header">
          <div>
            <h2>ACTA DE VOTACIÓN</h2>
            <p>${com?.nombre||''} · ${com?.direccion||''}</p>
          </div>
          <div style="text-align:right">
            <div style="font-size:13px;font-weight:800">Veci<span style="color:#E6B800">noo</span></div>
            <div style="font-size:9px;color:#94A3B8">vecinoo.cl</div>
            <div style="font-size:9px;color:#94A3B8;margin-top:4px">N° ${numeroActa}</div>
          </div>
        </div>

        <div class="acta-vot-body">

          <!-- Metadatos -->
          <div class="acta-vot-meta">
            <div class="acta-vot-meta-cell">
              <div class="acta-vot-meta-label">Asunto de la votación</div>
              <div class="acta-vot-meta-val">${v.titulo}</div>
            </div>
            <div class="acta-vot-meta-cell">
              <div class="acta-vot-meta-label">Estado</div>
              <div class="acta-vot-meta-val" style="color:#065f46">✓ Cerrada</div>
            </div>
            <div class="acta-vot-meta-cell">
              <div class="acta-vot-meta-label">Fecha apertura</div>
              <div class="acta-vot-meta-val">${fmtD(v.fecha_inicio||v.fecha_inicio_dt)}</div>
            </div>
            <div class="acta-vot-meta-cell">
              <div class="acta-vot-meta-label">Fecha cierre</div>
              <div class="acta-vot-meta-val">${fmtD(v.fecha_cierre||v.fecha_cierre_dt)}</div>
            </div>
            <div class="acta-vot-meta-cell">
              <div class="acta-vot-meta-label">Fecha de emisión del acta</div>
              <div class="acta-vot-meta-val">${fechaEmision}</div>
            </div>
            <div class="acta-vot-meta-cell">
              <div class="acta-vot-meta-label">Hora de emisión</div>
              <div class="acta-vot-meta-val">${horaEmision} hrs.</div>
            </div>
            ${v.descripcion?`<div class="acta-vot-meta-cell" style="grid-column:span 2">
              <div class="acta-vot-meta-label">Descripción</div>
              <div class="acta-vot-meta-val" style="font-weight:400">${v.descripcion}</div>
            </div>`:''}
          </div>

          <!-- Participación -->
          <div class="acta-vot-section-title">PARTICIPACIÓN</div>
          <div style="margin-bottom:14px"></div>
          <div class="acta-vot-participacion">
            <div class="acta-vot-part-card">
              <div class="acta-vot-part-label">Votantes habilitados</div>

            </div>
            <div class="acta-vot-part-card" style="${pctParticipacion>=50?'border-color:#a7f3d0;background:#f0fdf4':'border-color:#fca5a5;background:#fff1f2'}">

              <div class="acta-vot-part-val" style="color:${pctParticipacion>=50?'#065f46':'#991b1b'}">${pctParticipacion}%</div>
            </div>
          </div>

          <!-- Resultado destacado -->
          ${totalVotos>0?`<div class="acta-vot-destacado">
            <div>
              <div class="acta-vot-destacado-label">${empate?'RESULTADO: EMPATE TÉCNICO':'RESULTADO FINAL — OPCIÓN GANADORA'}</div>
              <div class="acta-vot-destacado-val">${empate?'Empate entre opciones':ganador.op}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:22px;font-weight:900">${empate?'—':ganador.pct+'%'}</div>
              <div style="font-size:10px;font-weight:600">${empate?'':'('+ganador.n+' votos)'}</div>
            </div>
          </div>`:`<div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#92400e;font-weight:600">
            ⚠ Ningún voto fue emitido en esta votación.
          </div>`}

          <!-- Tabla de resultados -->
          <div class="acta-vot-section-title">DESGLOSE DE RESULTADOS</div>
          <div style="margin-bottom:0"></div>
          <table class="acta-vot-result-table">
            <thead><tr><th>#</th><th>Opción</th><th>Votos</th><th>Porcentaje</th><th>Distribución</th></tr></thead>
            <tbody>
              ${resultados.map((r,i)=>`<tr class="${i===0&&!empate&&totalVotos>0?'ganador':''}">
                <td style="color:#6b7280;font-weight:600">${i+1}</td>

                <td style="font-weight:700;font-size:13px">${r.n}</td>
                <td style="font-weight:700;color:${i===0&&!empate?'#065f46':'#374151'}">${r.pct}%</td>
                <td>
                  <div class="acta-vot-bar-bg">
                    <span class="acta-vot-bar-fill" style="width:${r.pct}%;background:${i===0&&!empate?'#2E766B':'#94A3B8'}"></span>
                  </div>

                <td colspan="2" style="font-size:12px">TOTAL VOTOS EMITIDOS</td>

          <!-- Quórum -->
          <div style="background:#f9fafb;border:1px solid #e5e5e5;border-radius:6px;padding:10px 14px;font-size:11px;color:#374151;line-height:1.7;margin-bottom:16px">
            <div style="font-weight:700;margin-bottom:4px">📋 Observaciones del acta</div>
            La presente votación fue realizada de forma digital a través de la plataforma Vecinoo.
            ${pctParticipacion>=50?'Se alcanzó el quórum mínimo del 50% de participación.':'La participación no alcanzó el quórum del 50%. El comité deberá evaluar la validez de la resolución según el reglamento interno de copropiedad.'}
            ${v.creada_por?` Votación creada por: ${v.creada_por}.`:''}
            Los votos son anónimos y fueron registrados individualmente por cada residente habilitado.
          </div>

          <!-- Firmas -->
          <div class="acta-vot-firmas">
            <div class="acta-vot-firma">
              <div class="acta-vot-firma-linea"></div>
              <div class="acta-vot-firma-label">Administrador</div>
              <div style="font-size:9px;color:#9ca3af;margin-top:2px">Nombre y firma</div>
            </div>
            <div class="acta-vot-firma">
              <div class="acta-vot-firma-linea"></div>
              <div class="acta-vot-firma-label">Presidente del Comité</div>
              <div style="font-size:9px;color:#9ca3af;margin-top:2px">Nombre y firma</div>
            </div>
            <div class="acta-vot-firma">
              <div class="acta-vot-firma-linea"></div>
              <div class="acta-vot-firma-label">Tesorero</div>
              <div style="font-size:9px;color:#9ca3af;margin-top:2px">Nombre y firma</div>
            </div>
          </div>

        </div><!-- /body -->

        <!-- Footer -->
        <div class="acta-vot-footer">
          <div class="acta-vot-footer-brand">Veci<span>noo</span> — vecinoo.cl</div>
          <div style="color:#6b7280">Acta N° ${numeroActa} · Emitida el ${fechaEmision} a las ${horaEmision} hrs.</div>
        </div>

      </div><!-- /acta -->

window.generarActaVotacion = id => {
  setState({modal:{type:'acta_votacion', votacionId:id}});
};

// Guardar acta en Documentos (sin abrir ventana PDF)
window.guardarActaEnDocumentos = async (votacionId) => {
  const{votaciones,votos,residentes}=state.comunidadData;
  const v=votaciones.find(x=>x.id===votacionId);
  if(!v){showAlert('Votación no encontrada','error');return;}

  // Verificar si ya existe
  const yaGuardada=state.comunidadData.documentos.some(d=>d.votacion_id===votacionId);
  if(yaGuardada){
    showAlert('Esta acta ya está guardada en Documentos','error');
    return;
  }

  const btn=document.getElementById('btnGuardarActaDoc');
  if(btn){btn.disabled=true;btn.textContent='Guardando...';}

  const ahora=new Date();
  const fechaEmision=ahora.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});
  const nActa='VOT-'+String(ahora.getFullYear()).slice(2)+String(ahora.getMonth()+1).padStart(2,'0')+'-'+String(Math.floor(Math.random()*9000)+1000);

  const votosDev=votos.filter(x=>x.votacion_id===votacionId);
  let opciones=v.opciones||[];
  if(typeof opciones==='string'){try{opciones=JSON.parse(opciones);}catch(e){opciones=[];}}
  const totalVotos=votosDev.length;
  const totalPosibles=residentes.length;
  const pctPart=totalPosibles>0?Math.round(totalVotos/totalPosibles*100):0;

  // Calcular ganador
  const resultados=opciones.map(op=>({op,n:votosDev.filter(x=>x.opcion_elegida===op).length})).sort((a,b)=>b.n-a.n);
  const ganador=resultados[0];
  const empate=resultados.length>1&&resultados[0].n===resultados[1].n;

  const docData={
    comunidad_id: state.selectedComunidad?.id,
    icon: '📄',
    titulo: 'Acta — '+v.titulo,
    title: 'Acta — '+v.titulo,
    descripcion: `Acta N° ${nActa} · Emitida el ${fechaEmision} · ${totalVotos} votos · Participación ${pctPart}%${!empate&&ganador?` · Ganador: "${ganador.op}"` :''}`,
    desc: `Acta de votación emitida el ${fechaEmision}. N° ${nActa}`,
    carpeta: 'actas',
    tipo: 'acta_votacion',
    numero_acta: nActa,
    votacion_id: votacionId,
    fecha_emision: ahora.toISOString(),
    emitida_por: state.currentUser?.nombre||'Admin',
    votos_total: totalVotos,
    participacion_pct: pctPart,
    ganador: empate?'Empate':(ganador?.op||'—'),
  };

  const{data,error}=await sb.from('documentos').insert(docData).select();
  if(btn){btn.disabled=false;btn.textContent='💾 Guardar en Documentos';}

  if(error){
    showAlert('Error al guardar: '+error.message,'error');
    return;
  }
  const documentos=[data[0],...state.comunidadData.documentos];
  setState({comunidadData:{...state.comunidadData,documentos}});
  showAlert('✅ Acta guardada en Documentos → Actas','success');
  // Re-render el modal para mostrar el banner de "ya guardada"
  setTimeout(()=>setState({modal:{type:'acta_votacion',votacionId}}),800);
};

// EMAIL_FROM visible en frontend está bien — no es un secreto
const EMAIL_FROM = 'Vecinoo <noreply@vecinoo.cl>';

// sendEmail llama al backend seguro — no expone ninguna key
async function sendEmail({to, subject, html}){
  // Envía emails via Vercel API function /api/send-email (evita CORS)
  if(!to||!to.includes('@')){
    console.warn('Email no enviado: destinatario invalido ->', to);
    return false;
  }
  try{
    const res=await fetch('/api/send-email',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({to,subject,html,from:EMAIL_FROM})
    });
    if(!res.ok){
      const d=await res.json().catch(()=>({}));
      console.warn('Email error:', d);
      return false;
    }
    console.log('Email enviado a', to);
    return true;
  }catch(e){
    // Si la API no existe aún, silenciar el error para no romper otras funciones
    console.warn('sendEmail no disponible aun:', e.message);
    return false;
  }
}

async function initPushNotifications(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return;
  if(Notification.permission==='denied')return;
  try{
    // Solo registrar si sw.js existe en el servidor
    const swCheck = await fetch('/sw.js',{method:'HEAD'}).catch(()=>null);
    if(!swCheck||!swCheck.ok)return; // sw.js no está en el servidor, omitir silenciosamente
    let reg = await navigator.serviceWorker.getRegistration('/sw.js');
    if(!reg) reg = await navigator.serviceWorker.register('/sw.js');
    const perm = await Notification.requestPermission();
    if(perm !== 'granted') return;
    const userId = state.currentUser?.id;
    if(userId){
      await sb.from('push_subscriptions').upsert({
        usuario_id: userId,
        comunidad_id: state.selectedComunidad?.id,
        updated_at: new Date().toISOString()
      }, {onConflict:'usuario_id'});
    }
  }catch(e){ console.warn('Push no disponible:', e); }
}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=window.atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

// Notificación local (sin servidor) — funciona siempre que el usuario haya dado permiso
function notifLocal(title, body, icon='💬'){
  if(Notification.permission==='granted'){
    new Notification(`${icon} ${title}`, {body, icon:'/icon-192.png', badge:'/icon-192.png'});
  }
}

// Disparadores de notificación integrados en las acciones existentes
function checkVotacionesActivas(){
  const activas = state.comunidadData.votaciones.filter(v=>v.estado==='activa');
  activas.forEach(v=>{
    const cierre = new Date(v.fecha_cierre||v.fecha_cierre_dt);
    const horasLeft = (cierre - new Date()) / 36e5;
    if(horasLeft > 0 && horasLeft <= 24){
      notifLocal('Votación por cerrar', `"${v.titulo}" cierra en menos de 24 horas.`, '🗳️');
    }
  });
}

function checkGCVencimiento(){
  const u = state.currentUser;
  if(!u) return;
  const unit = state.comunidadData.unidades.find(x=>x.id===u.unidad_id);
  if(!unit?.monthly_fee) return;
  const paid = state.comunidadData.pagos.some(p=>p.usuario_id===u.id&&p.month===thisMonth());
  if(!paid){
    const hoy = new Date().getDate();
    if(hoy >= 25){ // Avisar desde el día 25
      notifLocal('GC pendiente', `Tu gasto común de ${thisMonth()} aún no está registrado.`, '💰');
    }
  }
}

// Disparar verificaciones al cargar datos
function runNotifChecks(){
  if(!state.currentUser || state.screen !== 'app') return;
  setTimeout(()=>{ checkVotacionesActivas(); checkGCVencimiento(); }, 2000);
}

function buildMiniHistorial(){
  const meses=[];
  for(let i=5;i>=0;i--){
    const d=new Date(); d.setMonth(d.getMonth()-i);
    const mes=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const ingr=state.comunidadData.pagos.filter(p=>p.month===mes).reduce((s,p)=>s+p.amount,0);
    const egr=state.comunidadData.gastos.filter(g=>g.month===mes).reduce((s,g)=>s+g.amount,0);
    meses.push({mes,ingr,egr,bal:ingr-egr});
  }
  return`<table><thead><tr><th>Período</th><th>Ingresos</th><th>Egresos</th><th>Saldo</th></tr></thead>
  <tbody>${meses.map(m=>`<tr>
    <td style="font-weight:600">${m.mes}</td>
    <td class="green" style="font-weight:600">${fmt(m.ingr)}</td>
    <td class="red">${fmt(m.egr)}</td>
    <td style="font-weight:700" class="${m.bal>=0?'green':'red'}">${fmt(m.bal)}</td>
  </tr>`).join('')}</tbody></table>`;
}

window.enviarPreguntaIA = q => {
  const input = document.getElementById('chatInput');
  if(input) input.value = q;
  enviarChatIA();
};

window.enviarChatIA = async () => {
  const input = document.getElementById('chatInput');
  const texto = input?.value?.trim();
  if(!texto || state.chatLoading) return;
  if(input) input.value = '';

  const msgs = [...(state.chatMsgs||[]), {role:'user', content:sanitize(texto)}];
  setState({chatMsgs:msgs, chatLoading:true});
  setTimeout(()=>{const h=document.getElementById('chatHistory');if(h)h.scrollTop=h.scrollHeight;},50);

  try{
    // Intento via Supabase Edge Function (evita CORS)
    const res = await fetch(`${SUPABASE_URL}/functions/v1/chat-vecinoo`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_KEY}`},
      body:JSON.stringify({system:buildContextoIA(),messages:msgs.map(m=>({role:m.role,content:m.content}))})
    });
    if(res.ok){
      const data = await res.json();
      const reply = data.content?.[0]?.text||data.reply||'Sin respuesta.';
      setState({chatMsgs:[...msgs,{role:'assistant',content:reply}],chatLoading:false});
    } else {
      // Fallback local con datos reales de la comunidad
      setState({chatMsgs:[...msgs,{role:'assistant',content:respuestaLocalIA(texto)}],chatLoading:false});
    }
  }catch(e){
    setState({chatMsgs:[...msgs,{role:'assistant',content:respuestaLocalIA(texto)}],chatLoading:false});
  }
  setTimeout(()=>{const h=document.getElementById('chatHistory');if(h)h.scrollTop=h.scrollHeight;},100);
};

// Asistente local inteligente — responde con datos reales sin necesitar IA externa
function respuestaLocalIA(pregunta){
  const u=state.currentUser;
  const com=state.selectedComunidad;
  const{unidades,residentes,pagos,gastos,multas,votaciones,alertas,reservas,mantenimientos}=state.comunidadData;
  const m=thisMonth();
  const{totalIn,totalOut,balance,paidUnits,occupied,morose}=getMetrics(m);
  const unit=unidades.find(x=>x.id===u?.unidad_id);
  const gc=unit?.monthly_fee||0;
  const myPagos=pagos.filter(p=>p.usuario_id===u?.id);
  const paid=myPagos.some(p=>p.month===m);
  const myMultas=multas.filter(f=>f.unidad_id===u?.unidad_id&&f.status==='pendiente');
  const votActivas=votaciones.filter(v=>v.estado==='activa');
  const mants=mantenimientos||[];
  const q=pregunta.toLowerCase();

  // ── Mantenimientos ──
  if(q.includes('manteni')||q.includes('contrato')||q.includes('proveedor')||q.includes('servicio')){
    if(mants.length===0)return'🔧 No hay mantenimientos registrados aún. El administrador puede agregarlos desde el menú "Mantenimientos".';
    const vencidos=mants.filter(x=>x.fecha_proximo&&diasHasta(x.fecha_proximo)<0&&x.estado!=='completado');
    const proximos30=mants.filter(x=>x.fecha_proximo&&diasHasta(x.fecha_proximo)>=0&&diasHasta(x.fecha_proximo)<=30&&x.estado!=='completado');
    let resp=`🔧 <b>Estado de mantenimientos del edificio:</b><br>• Total registrados: <b>${mants.length}</b><br>• Activos: <b>${mants.filter(x=>x.estado==='activo').length}</b>`;
    if(vencidos.length>0)resp+=`<br>• <b style="color:var(--red)">⚠️ Vencidos: ${vencidos.length}</b> — ${vencidos.map(x=>x.nombre).join(', ')}`;
    if(proximos30.length>0)resp+=`<br>• Próximos 30 días: <b>${proximos30.length}</b> — ${proximos30.map(x=>`${x.nombre} (${diasHasta(x.fecha_proximo)}d)`).join(', ')}`;
    return resp;
  }
  if(q.includes('vencido')||q.includes('atras')||q.includes('atrás')||q.includes('urgente')){
    const vencidos=mants.filter(x=>x.fecha_proximo&&diasHasta(x.fecha_proximo)<0&&x.estado!=='completado');
    if(vencidos.length===0)return'✅ No hay mantenimientos vencidos. Todo al día.';
    return`🚨 <b>${vencidos.length} mantenimiento(s) vencido(s):</b><br>${vencidos.map(x=>`• <b>${x.nombre}</b> — venció el ${fmtD(x.fecha_proximo)} (${x.proveedor||'sin proveedor'})`).join('<br>')}`;
  }
  if(q.includes('precio')||q.includes('caro')||q.includes('mercado')||q.includes('costo')||q.includes('cotiz')){
    if(mants.length===0)return'No hay contratos registrados para analizar. Agrega tus contratos en el módulo "Mantenimientos".';
    const conMonto=mants.filter(x=>x.monto>0);
    if(conMonto.length===0)return`Tienes ${mants.length} contrato(s) registrado(s) pero ninguno tiene monto. Edítalos para agregar los montos y poder comparar con el mercado.<br><br>Usa el botón 🤖 en cada contrato para un análisis detallado.`;
    return`💰 Tienes <b>${conMonto.length} contrato(s) con monto definido</b>:<br>${conMonto.map(x=>`• ${x.nombre}: <b>${fmt(x.monto)}</b>/${x.periodicidad||'período'}`).join('<br>')}<br><br>Haz clic en el botón <b>🤖</b> junto a cada contrato para ver la comparación con precios del mercado chileno.`;
  }
  if(q.includes('ascensor')||q.includes('piscina')||q.includes('extintor')||q.includes('bomba')||q.includes('jardin')){
    const tipos={ascensor:'ascensor',piscina:'piscina',extintor:'incendios',bomba:'agua',jardin:'jardineria'};
    const tipo=Object.keys(tipos).find(k=>q.includes(k));
    const cat=tipos[tipo];
    const encontrados=mants.filter(x=>x.categoria===cat||x.nombre.toLowerCase().includes(tipo||''));
    if(encontrados.length===0)return`No hay contratos de ${tipo} registrados.`;
    return`🔧 Contratos de <b>${tipo}</b>:<br>${encontrados.map(x=>`• ${x.nombre} — ${x.proveedor||'sin proveedor'} — ${x.monto?fmt(x.monto):'sin monto'} — próximo: ${x.fecha_proximo?fmtD(x.fecha_proximo):'—'}`).join('<br>')}`;
  }

  // ── Resto de preguntas ──
  if(q.includes('debo')||q.includes('pagar')||q.includes('cuanto')||q.includes('cuánto')||q.includes('deuda')||q.includes('gc')){
    if(paid)return`✅ Ya pagaste tu GC de <b>${m}</b>. Monto: <b>${fmt(myPagos.find(p=>p.month===m)?.amount||0)}</b>. ¡Estás al día!`;
    const total=gc+myMultas.reduce((s,f)=>s+f.amount,0);
    return`💰 Tu GC de <b>${m}</b> está <b>pendiente</b>.<br>• GC base: ${fmt(gc)}${myMultas.length>0?`<br>• Multas: ${fmt(myMultas.reduce((s,f)=>s+f.amount,0))}`:''}.<br>• <b>Total a pagar: ${fmt(total)}</b><br><br>Puedes registrar tu pago desde "Mi Cuenta".`;
  }
  if(q.includes('multa')){
    if(myMultas.length===0)return'✅ No tienes multas pendientes.';
    return`⚠️ Tienes <b>${myMultas.length} multa(s)</b> pendientes por <b>${fmt(myMultas.reduce((s,f)=>s+f.amount,0))}</b>:<br>${myMultas.map(f=>`• ${f.reason} — ${fmt(f.amount)}`).join('<br>')}`;
  }
  if(q.includes('votacion')||q.includes('votación')||q.includes('votar')){
    if(votActivas.length===0)return'📊 No hay votaciones activas en este momento.';
    return`🗳️ Hay <b>${votActivas.length} votación(es) activa(s)</b>:<br>${votActivas.map(v=>`• <b>${v.titulo}</b> — cierra el ${fmtD(v.fecha_cierre||v.fecha_cierre_dt)}`).join('<br>')}`;
  }
  if(q.includes('balance')||q.includes('finanza')||q.includes('ingreso')||q.includes('gasto')){
    return`📊 <b>Balance comunidad ${m}:</b><br>• Ingresos: <b style="color:var(--green)">${fmt(totalIn)}</b><br>• Egresos: <b style="color:var(--red)">${fmt(totalOut)}</b><br>• Saldo: <b style="color:${balance>=0?'var(--green)':'var(--red)'}">${fmt(balance)}</b><br>• ${paidUnits.size}/${occupied.length} unidades han pagado su GC.`;
  }
  if(q.includes('moroso')||q.includes('pendiente')||q.includes('no pag')){
    const morososIA=occupied.filter(u=>esUnidadMorosa(u.id));
    if(morososIA.length===0)return'✅ Todas las unidades están al día (sin deuda histórica).';
    const deudaTotal=morososIA.reduce((s,u)=>s+getTotalDeudaUnidad(u.id),0);
    return`⚠️ <b>${morososIA.length} unidad(es) con deuda</b> (incluyendo meses anteriores):<br>${morososIA.slice(0,5).map(u=>{
      const r=state.comunidadData.residentes.find(x=>x.unidad_id===u.id);
      const d=calcDeudaAcumulada(u.id);
      return`• Depto ${u.numero} — ${r?.nombre||'—'}: <b>${fmt(d.totalConMesActual)}</b> (${d.mesesSinPagar} mes(es))`;
    }).join('<br>')}${morososIA.length>5?`<br>...y ${morososIA.length-5} más`:''}.<br><b>Deuda total comunidad: ${fmt(deudaTotal)}</b>`;
  }
  if(q.includes('reserva')){
    const misRes=(reservas||[]).filter(r=>r.usuario_id===u?.id&&r.estado!=='cancelada');
    if(misRes.length===0)return'🗓️ No tienes reservas activas. Puedes hacer una desde el menú "Reservas".';
    return`🗓️ Tienes <b>${misRes.length} reserva(s)</b>:<br>${misRes.map(r=>`• ${r.espacio_id} — ${fmtD(r.fecha)} ${r.hora_inicio}–${r.hora_fin} (${r.estado})`).join('<br>')}`;
  }
  if(q.includes('alerta')||q.includes('aviso')){
    const activas=alertas.filter(a=>a.status==='activa');
    if(activas.length===0)return'🔔 No hay alertas activas en este momento.';
    return`🔔 <b>${activas.length} alerta(s) activa(s)</b>:<br>${activas.slice(0,3).map(a=>`• [${a.tipo}] ${a.titulo}`).join('<br>')}`;
  }
  if(q.includes('pago')||q.includes('historial')||q.includes('último')||q.includes('ultimo')){
    if(myPagos.length===0)return'📋 No tienes pagos registrados aún.';
    const last=myPagos[0];
    return`📋 Tu <b>último pago</b>:<br>• Mes: ${last.month}<br>• Monto: ${fmt(last.amount)}<br>• Método: ${last.method}<br>• Fecha: ${fmtD(last.date)}`;
  }
  if(q.includes('departamento')||q.includes('depto')||q.includes('unidad')){
    if(!unit)return'No tengo información de tu unidad asignada.';
    return`🏠 Tu unidad:<br>• Depto ${unit.numero} · Piso ${unit.piso}${unit.sqm?`<br>• Superficie: ${unit.sqm}m²`:''}<br>• GC mensual: ${gc?fmt(gc):'No definido'}`;
  }
  if(q.includes('hola')||q.includes('buenas')||q.includes('ayuda')){
    return`👋 ¡Hola <b>${u?.nombre||''}!</b> Soy el asistente de Vecinoo. Puedo responderte sobre:<br>• Tu GC y deudas<br>• Votaciones activas<br>• Balance de la comunidad<br>• Multas pendientes<br>• Reservas y pagos<br>• 🔧 <b>Mantenimientos y contratos</b><br><br>¿En qué te ayudo?`;
  }
  return`🤖 Puedo responder sobre <b>${com?.nombre||'tu comunidad'}</b>. Prueba:<br>• ¿Cuánto debo este mes?<br>• ¿Hay mantenimientos vencidos?<br>• ¿Cómo están los contratos?<br>• ¿Cuál es el balance?<br>• ¿Tengo multas pendientes?`;
}

const ESPACIOS_DEFAULT = [
  {id:'sala',icon:'🎉',nombre:'Sala de eventos',capacidad:50,duracion_max:8,dias:[0,1,2,3,4,5,6]},
  {id:'quincho',icon:'🔥',nombre:'Quincho / BBQ',capacidad:20,duracion_max:6,dias:[5,6]},
  {id:'gimnasio',icon:'💪',nombre:'Gimnasio',capacidad:10,duracion_max:2,dias:[0,1,2,3,4,5,6]},
  {id:'otro',icon:'🏢',nombre:'Otro espacio',capacidad:15,duracion_max:4,dias:[0,1,2,3,4,5,6]},
];

  return`

  </div>

  <!-- Espacios disponibles -->
  <div class="grid-2" style="margin-bottom:14px">
    ${espacios.map(e=>{
      const resHoy = reservas.filter(r=>r.espacio_id===e.id&&r.fecha===hoy&&r.estado!=='cancelada');
      const libre = resHoy.length===0;
      return`<div class="card" style="border-top:3px solid ${libre?'var(--green)':'var(--gold)'}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="font-size:20px">${e.icon}</div>

        <div style="font-size:11px;color:#6b7280">Cap. ${e.capacidad} personas · Máx. ${e.duracion_max}h</div>

          Reservar

    }).join('')}

  <div class="card">
    <div class="card-header">
      <span class="card-title">📋 ${full?'Todas las reservas':'Mis reservas'}</span>
    </div>
    ${(full?reservas:myRes).length===0
      ? '<div class="empty">Sin reservas registradas</div>'
      : `<table><thead><tr><th>Espacio</th><th>Fecha</th><th>Horario</th><th>Residente</th><th>Estado</th><th></th></tr></thead>
        <tbody>${(full?[...reservas].sort((a,b)=>a.fecha>b.fecha?1:-1):myRes).slice(0,20).map(r=>{
          const e = espacios.find(x=>x.id===r.espacio_id)||{icon:'🏢',nombre:r.espacio_id};
          const res = state.comunidadData.residentes.find(x=>x.id===r.usuario_id);
          const pasada = r.fecha < hoy;
          return`<tr>
            <td>${e.icon} ${e.nombre}</td>
            <td style="font-weight:600">${fmtD(r.fecha)}</td>
            <td>${r.hora_inicio} – ${r.hora_fin}</td>
            <td>${res?.nombre||'—'}</td>
            <td><span class="badge ${r.estado==='confirmada'?'badge-green':r.estado==='cancelada'?'badge-red':'badge-amber'}">${r.estado||'pendiente'}</span></td>
            <td>
              ${!pasada&&r.estado!=='cancelada'&&(r.usuario_id===u?.id||full)?`<button class="btn btn-sm btn-danger" onclick="cancelarReserva('${r.id}')">Cancelar</button>`:''}

window.guardarReserva = async () => {
  const espacio_id = document.getElementById('res_espacio')?.value;
  const fecha = document.getElementById('res_fecha')?.value;
  const hora_inicio = document.getElementById('res_inicio')?.value;
  const hora_fin = document.getElementById('res_fin')?.value;
  const personas = parseInt(document.getElementById('res_personas')?.value)||0;
  const descripcion = document.getElementById('res_desc')?.value||'';

  if(!espacio_id||!fecha||!hora_inicio||!hora_fin){showAlert('Completa todos los campos','error');return;}
  if(hora_fin<=hora_inicio){showAlert('La hora de fin debe ser posterior al inicio','error');return;}

  const esp = ESPACIOS_DEFAULT.find(e=>e.id===espacio_id);
  const hIni=parseInt(hora_inicio),hFin=parseInt(hora_fin);
  if(esp && (hFin-hIni)>esp.duracion_max){showAlert(`Máximo ${esp.duracion_max} horas para este espacio`,'error');return;}
  if(esp && personas>esp.capacidad){showAlert(`Capacidad máxima: ${esp.capacidad} personas`,'error');return;}

  // Verificar conflictos
  const reservas = state.comunidadData.reservas||[];
  const conflicto = reservas.find(r=>
    r.espacio_id===espacio_id && r.fecha===fecha && r.estado!=='cancelada' &&
    !(hora_fin<=r.hora_inicio||hora_inicio>=r.hora_fin)
  );
  if(conflicto){showAlert(`Horario ocupado (${conflicto.hora_inicio}–${conflicto.hora_fin}). Elige otro horario.`,'error');return;}

  const u = state.currentUser;
  const {data,error} = await sb.from('reservas').insert({
    comunidad_id: state.selectedComunidad.id,
    usuario_id: u?.id,
    unidad_id: u?.unidad_id,
    espacio_id, fecha, hora_inicio, hora_fin,
    personas, descripcion,
    estado: 'pendiente',
    created_at: new Date().toISOString()
  }).select();
  if(error){showAlert('Error al guardar reserva: '+error.message,'error');return;}

  const reservasNew = [...(state.comunidadData.reservas||[]),...data];
  setState({comunidadData:{...state.comunidadData,reservas:reservasNew},modal:null});
  showAlert('✅ Reserva solicitada. La administración la confirmará pronto.');
  notifLocal('Reserva solicitada',`${esp?.nombre||''} el ${fmtD(fecha)} ${hora_inicio}–${hora_fin}`,'🗓️');
};

window.confirmarReserva = async id => {
  await sb.from('reservas').update({estado:'confirmada'}).eq('id',id);
  const reservas = (state.comunidadData.reservas||[]).map(r=>r.id===id?{...r,estado:'confirmada'}:r);
  setState({comunidadData:{...state.comunidadData,reservas}});
  showAlert('✅ Reserva confirmada');
  // Email al residente
  const res = reservas.find(r=>r.id===id);
  if(res){
    const residente = state.comunidadData.residentes.find(x=>x.id===res.usuario_id);
    emailReservaConfirmada(res, residente, 'confirmada', state.selectedComunidad);
  }
};

window.cancelarReserva = async id => {
  await sb.from('reservas').update({estado:'cancelada'}).eq('id',id);
  const reservas = (state.comunidadData.reservas||[]).map(r=>r.id===id?{...r,estado:'cancelada'}:r);
  setState({comunidadData:{...state.comunidadData,reservas}});
  showAlert('Reserva cancelada');
  // Email al residente
  const res = reservas.find(r=>r.id===id);
  if(res){
    const residente = state.comunidadData.residentes.find(x=>x.id===res.usuario_id);
    emailReservaConfirmada(res, residente, 'cancelada', state.selectedComunidad);
  }
};

window.actualizarDisponibilidad = () => {
  const espId = document.getElementById('res_espacio')?.value;
  const fecha = document.getElementById('res_fecha')?.value;
  if(!espId||!fecha)return;
  const reservas = (state.comunidadData.reservas||[]).filter(r=>r.espacio_id===espId&&r.fecha===fecha&&r.estado!=='cancelada');
  const el = document.getElementById('dispInfo');
  if(!el)return;
  if(reservas.length===0){
    el.innerHTML='<span style="color:var(--green)">✓ Sin reservas para este día</span>';
  } else {
    el.innerHTML=`<span style="color:#d97706">⚠ Horarios ocupados: ${reservas.map(r=>`${r.hora_inicio}–${r.hora_fin}`).join(', ')}</span>`;
  }
};

window.descargarBoucher = pagoId => {
  const p = state.comunidadData.pagos.find(x=>x.id===pagoId);
  if(!p) return;
  const r = state.comunidadData.residentes.find(x=>x.id===p.usuario_id);
  const u = state.comunidadData.unidades.find(x=>x.id===p.unidad_id);
  const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">

    <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;padding:30px;background:#fff}@media print{body{padding:10px}button{display:none!important}}</style>

  const win = window.open('','_blank','width=520,height=700');

  win.document.open(); win.document.write(html); win.document.close();
  showAlert('✅ Abre el diálogo → Guardar como PDF','success');
};

// Disparar notificaciones al cargar la app
// ════════════════════════════════════════════════════════════════
//  TIEMPO REAL — Supabase Realtime Channels
// ════════════════════════════════════════════════════════════════
let _realtimeChannels=[];

function initRealtime(){
  const comId=state.selectedComunidad?.id;
  if(!comId||_realtimeChannels.length>0)return;

  const chAlerts=sb.channel(`alertas-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'alertas',filter:`comunidad_id=eq.${comId}`},p=>{
      const alertas=[p.new,...state.comunidadData.alertas];
      setState({comunidadData:{...state.comunidadData,alertas}});
      notifLocal('🔔 Nueva alerta',p.new.titulo,'🔔');
      if(state.view!=='community')mostrarBadgeNav('community');
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'alertas',filter:`comunidad_id=eq.${comId}`},p=>{
      const alertas=state.comunidadData.alertas.map(a=>a.id===p.new.id?p.new:a);
      setState({comunidadData:{...state.comunidadData,alertas}});
    }).subscribe();

  const chVots=sb.channel(`votaciones-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'votaciones',filter:`comunidad_id=eq.${comId}`},p=>{
      const votaciones=[p.new,...state.comunidadData.votaciones];
      setState({comunidadData:{...state.comunidadData,votaciones}});
      notifLocal('🗳️ Nueva votación',p.new.titulo,'🗳️');
      if(state.view!=='votaciones')mostrarBadgeNav('votaciones');
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'votaciones',filter:`comunidad_id=eq.${comId}`},p=>{
      const votaciones=state.comunidadData.votaciones.map(v=>v.id===p.new.id?p.new:v);
      setState({comunidadData:{...state.comunidadData,votaciones}});
    }).subscribe();

  const chVotos=sb.channel(`votos-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'votos'},p=>{
      const esDeEstaCom=state.comunidadData.votaciones.some(v=>v.id===p.new.votacion_id);
      if(!esDeEstaCom)return;
      const yaExiste=state.comunidadData.votos.some(v=>v.id===p.new.id);
      if(yaExiste)return;
      setState({comunidadData:{...state.comunidadData,votos:[...state.comunidadData.votos,p.new]}});
    }).subscribe();

  const chRes=sb.channel(`reservas-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'reservas',filter:`comunidad_id=eq.${comId}`},p=>{
      const reservas=[p.new,...(state.comunidadData.reservas||[])];
      setState({comunidadData:{...state.comunidadData,reservas}});
      if(isFullAccess()){notifLocal('🗓️ Nueva reserva solicitada',`${p.new.espacio_id} — ${p.new.fecha}`,'🗓️');mostrarBadgeNav('reservas');}
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'reservas',filter:`comunidad_id=eq.${comId}`},p=>{
      const reservas=(state.comunidadData.reservas||[]).map(r=>r.id===p.new.id?p.new:r);
      setState({comunidadData:{...state.comunidadData,reservas}});
    }).subscribe();

  const chPagos=sb.channel(`pagos-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'pagos',filter:`comunidad_id=eq.${comId}`},p=>{
      if(state.comunidadData.pagos.some(x=>x.id===p.new.id))return;
      setState({comunidadData:{...state.comunidadData,pagos:[p.new,...state.comunidadData.pagos]}});
      if(isFullAccess()){const res=state.comunidadData.residentes.find(r=>r.id===p.new.usuario_id);notifLocal('💰 Pago recibido',`${res?.nombre||'Residente'} — ${fmt(p.new.amount)}`,'💰');}
    }).subscribe();

  const chDocs=sb.channel(`documentos-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'documentos',filter:`comunidad_id=eq.${comId}`},p=>{
      if(state.comunidadData.documentos.some(d=>d.id===p.new.id))return;
      setState({comunidadData:{...state.comunidadData,documentos:[p.new,...state.comunidadData.documentos]}});
      if(p.new.carpeta==='actas'){notifLocal('📄 Nueva acta disponible',p.new.titulo,'📄');mostrarBadgeNav('documents');}
    }).subscribe();

  const chMants=sb.channel(`mantenimientos-${comId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'mantenimientos',filter:`comunidad_id=eq.${comId}`},p=>{
      if((state.comunidadData.mantenimientos||[]).some(m=>m.id===p.new.id))return;
      const mantenimientos=[...(state.comunidadData.mantenimientos||[]),p.new];
      setState({comunidadData:{...state.comunidadData,mantenimientos}});
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'mantenimientos',filter:`comunidad_id=eq.${comId}`},p=>{
      const mantenimientos=(state.comunidadData.mantenimientos||[]).map(m=>m.id===p.new.id?p.new:m);
      setState({comunidadData:{...state.comunidadData,mantenimientos}});
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'mantenimientos'},p=>{
      const mantenimientos=(state.comunidadData.mantenimientos||[]).filter(m=>m.id!==p.old.id);
      setState({comunidadData:{...state.comunidadData,mantenimientos}});
    }).subscribe();

  _realtimeChannels=[chAlerts,chVots,chVotos,chRes,chPagos,chDocs,chMants];
  console.log('✅ Realtime activo — comunidad',comId);
}

function stopRealtime(){
  _realtimeChannels.forEach(ch=>{try{sb.removeChannel(ch);}catch(e){}});
  _realtimeChannels=[];
}

function diasHasta(fecha){
  if(!fecha)return 999;
  return Math.ceil((new Date(fecha)-new Date())/(1000*60*60*24));
}

window.guardarEditMantenimiento = async id => {

    proveedor:   document.getElementById('mn_proveedor')?.value||'',

    monto:       parseInt(document.getElementById('mn_monto')?.value)||null,

    fecha_inicio_contrato:document.getElementById('mn_inicio')?.value||null,
    fecha_vencimiento_contrato:document.getElementById('mn_vencimiento')?.value||null,
    descripcion: document.getElementById('mn_desc')?.value||'',

  if(!updates.nombre||!updates.fecha_proximo){showAlert('Completa campos obligatorios','error');return;}
  await sb.from('mantenimientos').update(updates).eq('id',id);
  const mantenimientos=(state.comunidadData.mantenimientos||[]).map(m=>m.id===id?{...m,...updates}:m);
  const _mOld=state.comunidadData.mantenimientos.find(m=>m.id===id);
  auditLog('MANT_EDITADO',`${updates.nombre||_mOld?.nombre||id} actualizado`,{referencia_id:id,tabla:'mantenimientos'});
  setState({comunidadData:{...state.comunidadData,mantenimientos},modal:null});
  showAlert('✅ Mantenimiento actualizado');

window.editarMantenimiento = id => {

};

window.completarMantenimiento = async id => {
  const m = state.comunidadData.mantenimientos.find(x=>x.id===id);
  if(!m)return;
  // Calcular siguiente fecha según periodicidad
  const sig = _siguienteFecha(m.fecha_proximo||today(), m.periodicidad);
  const updates={
    estado: sig ? 'activo' : 'completado',
    fecha_ultimo: m.fecha_proximo||today(),
    fecha_completado: today(),
    fecha_proximo: sig||null,
  };
  await sb.from('mantenimientos').update(updates).eq('id',id);
  const mantenimientos=(state.comunidadData.mantenimientos||[]).map(x=>x.id===id?{...x,...updates}:x);
  auditLog('MANT_COMPLETADO',`${m.nombre} realizado. ${sig?'Próximo: '+fmtD(sig):'Sin recurrencia'}`,{referencia_id:id,tabla:'mantenimientos'});
  setState({comunidadData:{...state.comunidadData,mantenimientos}});
  showAlert(sig?`✅ Realizado. Próximo: ${fmtD(sig)}`:'✅ Mantenimiento completado');
};

window.eliminarMantenimiento = id => setState({modal:{type:'confirm',message:'¿Eliminar este mantenimiento?',onConfirm:`doEliminarMantenimiento('${id}')`}});
window.doEliminarMantenimiento = async id => {
  await sb.from('mantenimientos').delete().eq('id',id);
  const mantenimientos=(state.comunidadData.mantenimientos||[]).filter(m=>m.id!==id);
  setState({comunidadData:{...state.comunidadData,mantenimientos},modal:null});
  showAlert('Eliminado');
};

function _siguienteFecha(fecha, periodicidad){
  if(!periodicidad||periodicidad==='unico')return null;
  const d=new Date(fecha);
  const map={mensual:1,bimestral:2,trimestral:3,semestral:6,anual:12};
  const meses=map[periodicidad]||0;
  if(!meses)return null;
  d.setMonth(d.getMonth()+meses);
  return d.toISOString().split('T')[0];
}

async function _alertarMantenimiento(m){
  if(!m?.fecha_proximo)return;
  const dias=diasHasta(m.fecha_proximo);
  if(dias<=30){
    const titulo=`Mantenimiento próximo: ${m.nombre}`;
    const desc=`${m.nombre} (${m.proveedor||'sin proveedor'}) está programado para el ${fmtD(m.fecha_proximo)} — en ${dias} día(s).`;
    await sb.from('alertas').insert({
      comunidad_id:state.selectedComunidad?.id,
      tipo:'mantencion',titulo,descripcion:desc,
      date:today(),time:new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}),
      status:'activa',
    }).catch(()=>{});
  }
}

// Generar alertas automáticas para todos los contratos urgentes
window.generarAlertasAutomaticas = async () => {
  const mants = state.comunidadData.mantenimientos||[];
  const hoy = today();
  const urgentes = mants.filter(m=>{
    const diasM = m.fecha_proximo?diasHasta(m.fecha_proximo):null;
    const diasV = m.fecha_vencimiento_contrato?diasHasta(m.fecha_vencimiento_contrato):null;
    return (diasM!==null&&diasM<=30)||(diasV!==null&&diasV<=60);
  });
  if(!urgentes.length){showAlert('No hay contratos urgentes. Todo está al día ✅','success');return;}

  let creadas=0;
  for(const m of urgentes){
    const diasM=m.fecha_proximo?diasHasta(m.fecha_proximo):null;
    const diasV=m.fecha_vencimiento_contrato?diasHasta(m.fecha_vencimiento_contrato):null;
    let titulo='',desc='';
    if(diasM!==null&&diasM<=0){
      titulo=`🚨 Mantenimiento vencido: ${m.nombre}`;
      desc=`El mantenimiento de ${m.nombre} venció hace ${Math.abs(diasM)} día(s). Proveedor: ${m.proveedor||'no especificado'}.`;
    } else if(diasM!==null&&diasM<=30){
      titulo=`⚠️ Mantenimiento próximo: ${m.nombre}`;
      desc=`${m.nombre} está programado en ${diasM} día(s) (${fmtD(m.fecha_proximo)}). Proveedor: ${m.proveedor||'no especificado'}.`;
    } else if(diasV!==null&&diasV<=0){
      titulo=`🚨 Contrato vencido: ${m.nombre}`;
      desc=`El contrato de ${m.nombre} venció hace ${Math.abs(diasV)} día(s). Renovar urgente.`;
    } else if(diasV!==null&&diasV<=60){
      titulo=`📋 Contrato por vencer: ${m.nombre}`;
      desc=`El contrato de ${m.nombre} vence en ${diasV} día(s) (${fmtD(m.fecha_vencimiento_contrato)}). Considerar renovación.`;
    }
    if(!titulo)continue;
    const{error}=await sb.from('alertas').insert({
      comunidad_id:state.selectedComunidad?.id,
      tipo:'mantencion',titulo,descripcion:desc,
      date:hoy,time:new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}),
      status:'activa',
    });
    if(!error)creadas++;
  }
  showAlert(`🔔 ${creadas} alerta(s) de mantenimiento creadas en Alertas comunitarias`,'success');
  setState({modal:null});
};

  const{error}=await sb.from('alertas').insert({

// Análisis local de contrato (fallback cuando Edge Function no está disponible)
function generarAnalisisLocalContrato(mant){
  if(!mant) return 'No se encontró información del contrato.';
  const cat = MANT_CATS?.find(c=>c.id===mant.categoria)||{label:mant.categoria||'General'};
  const mercado={ascensor:{min:80000,max:250000},piscina:{min:60000,max:180000},gas:{min:50000,max:150000},electrico:{min:40000,max:120000},agua:{min:35000,max:100000},jardineria:{min:30000,max:120000},limpieza:{min:180000,max:600000},incendios:{min:25000,max:80000}};
  const ref=mercado[mant.categoria]||{min:30000,max:200000};
  const dias=mant.fecha_proximo?diasHasta(mant.fecha_proximo):null;
  const diasVenc=mant.fecha_vencimiento_contrato?diasHasta(mant.fecha_vencimiento_contrato):null;
  let html=`<b>📋 Análisis del contrato: ${mant.nombre}</b><br><br>`;
  if(mant.monto){
    if(mant.monto<ref.min) html+=`💰 <b>Precio bajo mercado:</b> ${fmt(mant.monto)} está por debajo del rango habitual (${fmt(ref.min)}–${fmt(ref.max)}). Verifica que el servicio sea completo.<br><br>`;
    else if(mant.monto>ref.max) html+=`🔴 <b>Precio sobre mercado:</b> ${fmt(mant.monto)} supera el rango habitual (${fmt(ref.min)}–${fmt(ref.max)}). Se recomienda cotizar con otros proveedores.<br><br>`;
    else html+=`✅ <b>Precio dentro del mercado:</b> ${fmt(mant.monto)} está en el rango habitual para ${cat.label} (${fmt(ref.min)}–${fmt(ref.max)}).<br><br>`;
  } else {
    html+=`ℹ️ No se registró monto para este contrato. Agrega el valor para comparar con el mercado.<br><br>`;
  }
  if(dias!==null&&dias<0) html+=`🚨 <b>Vencido hace ${Math.abs(dias)} días.</b> Requiere atención inmediata.<br>`;
  else if(dias!==null&&dias<=30) html+=`⚠️ <b>Próximo mantenimiento en ${dias} días</b> (${fmtD(mant.fecha_proximo)}). Coordina con el proveedor.<br>`;
  if(diasVenc!==null&&diasVenc<=60) html+=`📋 <b>Contrato vence en ${diasVenc} días.</b> Considera renovar o cotizar.<br>`;
  if(!mant.proveedor) html+=`📝 Falta registrar el proveedor.<br>`;
  return html;
}
