<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vecinoo">
<meta name="theme-color" content="#0F172A">
<title>Vecinoo — Todo tu edificio, en orden</title>
<link rel="manifest" href="manifest.json" onerror="this.remove()">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a1a;min-height:100vh}
:root{--navy:#0F172A;--navy2:#1E293B;--green:#2E766B;--green2:#1d5249;--gold:#E6B800;--gold2:#b89200;--white:#F8FAFC;--gray:#94A3B8;--gray2:#64748B;--red:#DC2626;--light:#E8F0FE;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px}
.login-box{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:400px}
.login-logo{text-align:center;margin-bottom:24px}
.login-step{display:none}.login-step.active{display:block}
.community-list{max-height:260px;overflow-y:auto;margin-bottom:14px}
.community-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e5e5e5;border-radius:10px;cursor:pointer;margin-bottom:6px;transition:all .2s}
.community-item:hover,.community-item.selected{border-color:var(--navy);background:#f0f4ff}
.community-info h3{font-size:13px;font-weight:700}
.community-info p{font-size:11px;color:#6b7280}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:230px;background:#fff;border-right:1px solid #e5e5e5;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:transform .3s}
.sidebar-logo{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.1);background:var(--navy)}
.sidebar-logo-row{display:flex;align-items:center;gap:8px}
.sidebar-logo-icon{width:32px;height:32px;flex-shrink:0}
.sidebar-logo-text h1{font-size:16px;font-weight:800;color:var(--white);line-height:1.2;letter-spacing:-0.3px}
.sidebar-logo-text p{font-size:10px;color:var(--gold);margin-top:1px}
.nav{flex:1;padding:6px 0}
.nav-section{padding:10px 16px 3px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:12px;color:#374151;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s}
.nav-item:hover{background:#f3f4f6}
.nav-item.active{background:#f0f4ff;color:var(--navy);font-weight:600;border-right:3px solid var(--gold)}
.user-info{padding:10px 16px;border-top:1px solid #e5e5e5;font-size:11px;color:#6b7280}
.role-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:600;margin-top:3px}
.role-superadmin{background:var(--navy);color:#fff}
.role-admin{background:#dbeafe;color:#1e40af}
.role-presidente{background:#ede9fe;color:#5b21b6}
.role-tesorero{background:#fef3c7;color:#92400e}
.role-resident{background:#d1fae5;color:#065f46}
.main{flex:1;overflow-y:auto;padding:18px;background:#f0f2f5}
.topbar{display:none;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--navy);border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;z-index:100}
.topbar-logo{display:flex;align-items:center;gap:6px}
.topbar-logo svg{width:24px;height:24px}
.topbar-logo span{font-size:14px;font-weight:800;color:var(--white);letter-spacing:-0.3px}
.hamburger{background:none;border:none;font-size:20px;cursor:pointer;color:var(--white)}
.page-header{margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.page-header h2{font-size:18px;font-weight:700}
.page-header p{font-size:12px;color:#6b7280;margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.metric{background:#fff;border-radius:10px;padding:12px 14px;border:1px solid #e5e5e5}
.metric-label{font-size:10px;color:#6b7280;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.metric-value{font-size:20px;font-weight:700}
.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--navy)}.amber{color:#d97706}.purple{color:#7c3aed}.gold{color:var(--gold2)}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-title{font-size:13px;font-weight:700;color:#111}
.btn{padding:7px 14px;border-radius:8px;border:1px solid #d1d5db;background:#fff;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;color:#374151;font-weight:500;-webkit-appearance:none}
.btn:hover{background:#f9fafb}.btn:active{transform:scale(.98)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn-primary:hover{background:var(--navy2)}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}.btn-gold:hover{background:var(--gold2)}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-warning{background:#d97706;color:#fff;border-color:#d97706}
.btn-dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-purple{background:#7c3aed;color:#fff;border-color:#7c3aed}
.btn-sm{padding:4px 9px;font-size:11px}.btn-block{width:100%;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #e5e5e5;background:#f9fafb}
td{padding:9px 10px;border-bottom:1px solid #f3f4f6;color:#374151;vertical-align:middle}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.badge-green{background:#d1fae5;color:#065f46}.badge-red{background:#fee2e2;color:#991b1b}
.badge-amber{background:#fef3c7;color:#92400e}.badge-blue{background:#dbeafe;color:#1e40af}
.badge-gray{background:#f3f4f6;color:#374151}.badge-purple{background:#ede9fe;color:#5b21b6}
.badge-dark{background:var(--navy);color:#fff}.badge-gold{background:#fef9c3;color:#854d0e}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:11px;font-weight:600;color:#374151;margin-bottom:4px}
.form-control{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:#111;-webkit-appearance:none}
.form-control:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,23,42,.08)}
.form-control:disabled{background:#f9fafb;color:#6b7280;cursor:not-allowed}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-row-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-lg{max-width:780px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:14px;font-weight:700}
.close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:#6b7280}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1e40af;flex-shrink:0}
.empty{text-align:center;padding:32px;color:#9ca3af;font-size:13px}
.alert-bar{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:12px;font-weight:500}
.alert-success{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.receipt{font-size:12px}
.receipt-header{text-align:center;padding-bottom:14px;margin-bottom:14px;border-bottom:2px dashed #e5e5e5}
.receipt-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f3f4f6;font-size:12px}
.receipt-total{font-size:15px;font-weight:700;margin-top:10px;padding-top:10px;border-top:2px solid #111;display:flex;justify-content:space-between}
.progress-bar{height:6px;background:#f3f4f6;border-radius:4px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:4px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f3f4f6;font-size:12px}
.stat-row:last-child{border-bottom:none}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cat-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;border:2px solid #e5e5e5;border-radius:10px;background:#fff;cursor:pointer;transition:all .2s;font-size:10px;font-weight:600;color:#374151;gap:4px;text-align:center}
.cat-btn:hover{border-color:var(--navy);background:#f0f4ff;color:var(--navy)}
.cat-btn.selected{border-color:var(--gold);background:var(--navy);color:#fff}
.cat-icon{font-size:18px}
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.toggle{position:relative;width:38px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#d1d5db;border-radius:20px;cursor:pointer;transition:.3s}
.toggle-slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.toggle-slider{background:var(--green)}
.toggle input:checked+.toggle-slider:before{transform:translateX(18px)}
.section-div{font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;margin:12px 0 8px;padding-bottom:4px;border-bottom:1px solid #e5e5e5}
.doc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.doc-card{border:1px solid #e5e5e5;border-radius:10px;padding:16px 12px;text-align:center;background:#fff}
.doc-icon{font-size:28px;margin-bottom:8px}.doc-title{font-size:11px;font-weight:700;margin-bottom:4px}
.doc-desc{font-size:10px;color:#6b7280;margin-bottom:10px}
.alert-card{padding:10px 14px;background:#fff;border-radius:8px;margin-bottom:8px;border:1px solid #e5e5e5;border-left:4px solid var(--red)}
.alert-card.info{border-left-color:var(--navy)}.alert-card.warning{border-left-color:var(--gold)}
.liq-table{font-size:12px;width:100%}
.liq-table td{padding:5px 8px;border-bottom:1px solid #f3f4f6}
.liq-table .total{font-weight:700;font-size:13px;border-top:2px solid #111}
.tab-bar{display:flex;gap:4px;background:#f3f4f6;padding:4px;border-radius:8px;margin-bottom:12px}
.tab-btn{flex:1;padding:6px;border:none;background:none;font-size:11px;cursor:pointer;border-radius:6px;font-family:inherit;color:#6b7280;font-weight:500}
.tab-btn.active{background:#fff;color:var(--navy);font-weight:700;border-bottom:2px solid var(--gold)}
.loading{text-align:center;padding:32px;color:#6b7280;font-size:13px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #e5e5e5;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.superadmin-bar{background:var(--navy);color:#fff;padding:7px 14px;font-size:11px;display:flex;justify-content:space-between;align-items:center}
.plan-badge{padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700}
.plan-basico{background:#f3f4f6;color:#374151}
.plan-profesional{background:#dbeafe;color:#1e40af}
.plan-enterprise{background:#fef9c3;color:#854d0e}
.install-banner{background:var(--navy);color:#fff;padding:10px 16px;font-size:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:3px solid var(--gold)}
/* Wizard pasos */
.wizard-steps{display:flex;align-items:center;margin-bottom:24px;gap:0}
.wstep{display:flex;align-items:center;gap:8px;flex:1}
.wstep-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.wstep.active .wstep-num{background:var(--navy);color:#fff}
.wstep.done .wstep-num{background:var(--green);color:#fff}
.wstep.pending .wstep-num{background:#e5e5e5;color:#9ca3af}
.wstep-label{font-size:11px;font-weight:600;color:var(--navy)}
.wstep.pending .wstep-label{color:#9ca3af}
.wstep-line{flex:1;height:2px;background:#e5e5e5;margin:0 4px}
.wstep-line.done{background:var(--green)}
/* Inventario pisos */
.piso-row{background:#f9fafb;border:1px solid #e5e5e5;border-radius:8px;padding:12px;margin-bottom:8px}
.piso-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.piso-title{font-size:13px;font-weight:700;color:var(--navy)}
.depto-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.depto-chip{background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:4px 6px;text-align:center;font-size:11px;cursor:pointer;transition:all .15s}
.depto-chip:hover{border-color:var(--navy);background:#f0f4ff}
.depto-chip.selected{background:var(--navy);color:#fff;border-color:var(--navy)}
/* Asignacion cards */
.asig-card{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.asig-card.assigned{border-color:var(--green);background:#f0fdf4}
.asig-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item-chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #d1d5db;background:#fff;transition:all .15s}
.item-chip.libre{border-color:#d1d5db;color:#374151}
.item-chip.asignado{background:var(--green);color:#fff;border-color:var(--green)}
.item-chip.selected-chip{background:var(--navy);color:#fff;border-color:var(--navy)}
/* Votaciones */
.votacion-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:16px;margin-bottom:12px;border-top:3px solid var(--gold)}

/* ── LIQUIDACIÓN GC ── */
.liq-gc{font-family:Arial,Helvetica,sans-serif;font-size:12px;background:#fff;border:1px solid #ccc;border-radius:6px;overflow:hidden;margin-bottom:16px}
.liq-gc-header{background:#0F172A;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.liq-gc-header-left h2{font-size:16px;font-weight:800;margin-bottom:2px}
.liq-gc-header-left p{font-size:11px;color:#94A3B8}
.liq-gc-body{padding:16px 20px}
.liq-gc-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #ddd;border-radius:6px;overflow:hidden;margin-bottom:14px}
.liq-gc-info-cell{padding:7px 12px;border-bottom:1px solid #f0f0f0;border-right:1px solid #f0f0f0;font-size:11px}
.liq-gc-info-cell:nth-child(even){border-right:none}
.liq-gc-info-label{color:#6b7280;margin-bottom:1px}
.liq-gc-info-val{font-weight:700;color:#111}
.liq-gc-section{margin-bottom:14px}
.liq-gc-section-title{background:#0F172A;color:#fff;padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.03em}
.liq-gc-table{width:100%;border-collapse:collapse;font-size:11px}
.liq-gc-table th{background:#f3f4f6;padding:6px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #e5e5e5}
.liq-gc-table td{padding:6px 10px;border-bottom:1px solid #f9f9f9;color:#374151;vertical-align:top}
.liq-gc-table .subtotal{font-weight:700;background:#f9fafb}
.liq-gc-table .total-row{font-weight:800;font-size:13px;background:#0F172A;color:#fff}
.liq-gc-table .total-row td{padding:8px 10px}
.liq-gc-destacado{background:#E6B800;color:#0F172A;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-radius:6px}
.liq-gc-destacado-label{font-size:11px;font-weight:600}
.liq-gc-destacado-val{font-size:20px;font-weight:900}
.liq-gc-obs{background:#f9fafb;border:1px solid #e5e5e5;border-radius:6px;padding:12px 14px;font-size:11px;color:#374151;line-height:1.6;margin-bottom:14px}
.liq-gc-footer{background:#f3f4f6;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid #E6B800;flex-wrap:wrap;gap:8px}
.liq-gc-footer-brand{font-size:13px;font-weight:800;color:#0F172A}
.liq-gc-footer-brand span{color:#E6B800}
.liq-gc-saldo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.liq-gc-saldo-card{background:#f9fafb;border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px}
.liq-gc-saldo-label{font-size:10px;color:#6b7280;margin-bottom:3px;font-weight:600;text-transform:uppercase}
.liq-gc-saldo-val{font-size:16px;font-weight:800}
.votacion-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.opcion-voto{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:2px solid #e5e5e5;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.opcion-voto:hover{border-color:var(--navy);background:#f0f4ff}
.opcion-voto.selected{border-color:var(--gold);background:var(--navy);color:#fff}
.voto-bar{height:8px;background:#e5e5e5;border-radius:4px;overflow:hidden;margin-top:4px}
.voto-fill{height:100%;background:var(--navy);border-radius:4px;transition:width .5s}
.resultado-row{padding:10px 0;border-bottom:1px solid #f3f4f6}
.resultado-row:last-child{border-bottom:none}
.acta-box{background:#f9fafb;border:1px solid #e5e5e5;border-radius:8px;padding:14px;font-size:12px;margin-top:12px;border-left:3px solid var(--gold)}
/* ── ASISTENTE IA ── */
#chatHistory::-webkit-scrollbar{width:4px}
#chatHistory::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:4px}
/* ── RESERVAS ── */
.espacio-libre{border-top-color:var(--green)!important}
.espacio-ocupado{border-top-color:var(--gold)!important}
@media(max-width:768px){
  .metrics{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}
  .cat-grid{grid-template-columns:repeat(3,1fr)}.doc-grid{grid-template-columns:1fr 1fr}
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:200;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}.topbar{display:flex}.main{padding:12px}
  .form-row-3{grid-template-columns:1fr 1fr}.depto-grid{grid-template-columns:repeat(4,1fr)}
  .form-row-4{grid-template-columns:1fr 1fr}
}

/* ── ACTA VOTACIÓN ── */
.acta-vot-wrap{background:#fff;border:2px solid #0F172A;border-radius:8px;padding:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;font-size:12px}
.acta-vot-header{background:#0F172A;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-start}
.acta-vot-header h2{font-size:15px;font-weight:800;margin-bottom:2px}
.acta-vot-header p{font-size:10px;color:#94A3B8}
.acta-vot-body{padding:16px 20px}
.acta-vot-meta{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #e5e5e5;border-radius:6px;overflow:hidden;margin-bottom:14px}
.acta-vot-meta-cell{padding:7px 12px;border-bottom:1px solid #f0f0f0;border-right:1px solid #f0f0f0;font-size:11px}
.acta-vot-meta-cell:nth-child(even){border-right:none}
.acta-vot-meta-cell:nth-last-child(-n+2){border-bottom:none}
.acta-vot-meta-label{color:#6b7280;font-size:10px;margin-bottom:1px}
.acta-vot-meta-val{font-weight:700;color:#111}

function calcLiquidacion(w){
  const bruto=parseInt(w.gross_salary)||0;
  const afpPct=w.afp_type==='Uno'?0.0058:0.1027;
  const afp=Math.round(bruto*afpPct);const sis=Math.round(bruto*0.0154);const segCes=Math.round(bruto*0.006);
  const salud=w.health_type==='Fonasa'?Math.round(bruto*0.07):parseInt(w.health_amount)||0;
  const imp=calcImpuesto(bruto-afp-salud);const liquido=bruto-afp-salud-segCes-imp;
  return{bruto,afp,sis,segCes,salud,imp,liquido,afpPct,gratif:Math.round(bruto*0.25)};
}
function calcImpuesto(base){
  const utm=65443;const e=base/utm;
  if(e<=13.5)return 0;if(e<=30)return Math.round(base*0.04-0.192*utm);
  if(e<=50)return Math.round(base*0.08-1.392*utm);if(e<=70)return Math.round(base*0.135-4.142*utm);
  return Math.round(base*0.23-10.792*utm);
}
function calcFiniquito(w,type,lastDay){
  const liq=calcLiquidacion(w);
  const years=(new Date(lastDay)-new Date(w.start_date))/(1000*60*60*24*365);
  const yf=Math.floor(years);const mf=Math.round((years-yf)*12);
  const ind=type==='despido'?Math.round(liq.bruto*Math.min(yf+(mf>=6?1:0),11)):0;
  const dias=Math.round((new Date(lastDay).getDate()/30)*liq.liquido);
  const vac=Math.round(years*15/12*(liq.bruto/30));
  return{ind,dias,vac,total:ind+dias+vac,years:yf,months:mf};
}
function calcProrate(amount,units){
  const total=units.reduce((s,u)=>s+(u.sqm||0),0);
  return units.map(u=>({unitId:u.id,sqm:u.sqm||0,pct:total>0?(u.sqm||0)/total:0,amount:total>0?Math.round(amount*(u.sqm||0)/total):0}));
}

// ── Generar deptos 4-6 por piso ──
function generarInventario(numDeptos,numEstac,numBodegas){
  const deptos=[];
  let contador=1;let piso=1;
  while(contador<=numDeptos){
    const porEste=Math.min(Math.floor(Math.random()*3)+4,numDeptos-contador+1);
    for(let i=0;i<porEste&&contador<=numDeptos;i++,contador++){
      deptos.push({numero:String(contador).padStart(3,'0'),piso,label:`Depto ${String(contador).padStart(3,'0')} · Piso ${piso}`});
    }
    piso++;
  }
  const estacs=Array.from({length:numEstac},(_,i)=>({id:`E${i+1}`,label:`E-${String(i+1).padStart(2,'0')}`}));
  const bods=Array.from({length:numBodegas},(_,i)=>({id:`B${i+1}`,label:`B-${String(i+1).padStart(2,'0')}`}));
  return{deptos,estacs,bods};
}

let _deudaCache = {};

function setState(p){
  // Preservar scroll si solo cambia modal, alert o alertTimer (no cambia la vista principal)
  const scrollOnlyKeys = new Set(['modal','alert','alertTimer','_preserveScroll',
    'auditFilter','auditSearch','pagosMes','gastosMes','workerTab','reportTab','chatLoading']);
  const isScrollPreserving = Object.keys(p).every(k => scrollOnlyKeys.has(k));
  state={...state,...p, _preserveScroll: p._preserveScroll ?? isScrollPreserving};
  _deudaCache = {}; // invalida cache al cambiar estado
  render();
}

// Variante explícita que preserva scroll
function setStatePreserveScroll(p){
  setState({...p, _preserveScroll:true});
}

function showAlert(msg,type='success'){

  if(announcer) announcer.textContent = msg;
  setStatePreserveScroll({alert:{msg,type},alertTimer:t});
}

function render(){

  const mainEl = document.querySelector('.main');
  const scrollTop = mainEl ? mainEl.scrollTop : 0;

  document.getElementById('root').innerHTML=
    state.screen==='login'?buildLogin():
    state.screen==='superadmin'?buildSuperAdminApp():
    buildApp();
  attachEvents();

  // Restaurar scroll (excepto cuando se cambia de vista — ahí queremos ir al top)
  if(mainEl && state._preserveScroll){
    const newMain = document.querySelector('.main');
    if(newMain) newMain.scrollTop = scrollTop;
  }
  state._preserveScroll = false;
}

}

function buildSANueva(){
  const{wizard}=state;
  const{step}=wizard;
  const steps=[
    {n:1,label:'Datos del edificio'},
    {n:2,label:'Inventario'},
    {n:3,label:'Asignaciones'},
    {n:4,label:'Confirmación'},
  ];
  return`
  <div class="page-header"><div><h2>Nueva comunidad</h2><p>Sigue los pasos para configurar el edificio</p></div></div>
  <div class="wizard-steps">
    ${steps.map((s,i)=>`
      <div class="wstep ${step===s.n?'active':step>s.n?'done':'pending'}">
        <div class="wstep-num">${step>s.n?'✓':s.n}</div>
        <div class="wstep-label">${s.label}</div>
      </div>
      ${i<steps.length-1?`<div class="wstep-line ${step>s.n?'done':''}"></div>`:''}
    `).join('')}
  </div>
  ${step===1?buildWizardStep1():step===2?buildWizardStep2():step===3?buildWizardStep3():buildWizardStep4()}`;
}

    <p style="font-size:12px;color:#6b7280;margin-bottom:16px">Ingresa las cantidades. Los departamentos se distribuirán automáticamente en 4 a 6 por piso.</p>

          </div>
        </div>`).join('')}
      ${inv.estacs.length>0?`<div style="margin-top:8px"><div style="font-size:11px;font-weight:700;color:#64748B;margin-bottom:4px">Estacionamientos</div><div style="display:flex;flex-wrap:wrap;gap:4px">${inv.estacs.map(e=>`<span style="background:#dbeafe;border-radius:4px;padding:2px 8px;font-size:11px">${e.label}</span>`).join('')}</div></div>`:''}

function agruparPorPiso(deptos){
  const map={};
  deptos.forEach(d=>{if(!map[d.piso])map[d.piso]=[];map[d.piso].push(d);});
  return Object.keys(map).sort((a,b)=>a-b).map(p=>({piso:p,deptos:map[p]}));
}

function buildWizardStep3(){
  const inv=state.wizard.inventario;
  const asig=state.wizard.asignaciones;

  const hayBodegas=inv.bods.length>0;
  if(!hayEstacs&&!hayBodegas){
    return`<div class="card">
      <div style="text-align:center;padding:32px">
        <div style="font-size:40px;margin-bottom:10px">✅</div>
        <div style="font-weight:700;font-size:15px;margin-bottom:6px">Sin estacionamientos ni bodegas</div>

          <button class="btn" onclick="setWizardStep(2)">← Volver</button>
          <button class="btn btn-gold" onclick="setWizardStep(4)">Siguiente → Confirmar</button>
        </div>
      </div>
    </div>`;

  // Calcular cuántos estacs/bodegas ya asignados
  const estAsig=Object.values(asig).flatMap(a=>a.estacs||[]);
  const bodAsig=Object.values(asig).flatMap(a=>a.bods||[]);
  return`
  <div class="card">

    <p style="font-size:12px;color:#6b7280;margin-bottom:14px">
      Para cada departamento, selecciona qué estacionamientos y/o bodegas le corresponden. Los ítems ya asignados se marcan en verde.

    <div style="display:flex;gap:8px;margin-bottom:14px;background:#f9fafb;padding:10px;border-radius:8px;flex-wrap:wrap">
      ${hayEstacs?`<span class="badge badge-blue">🅿️ ${inv.estacs.length} estacionamientos · ${estAsig.length} asignados</span>`:''}
      ${hayBodegas?`<span class="badge badge-amber">📦 ${inv.bods.length} bodegas · ${bodAsig.length} asignadas</span>`:''}
      <span class="badge badge-gray">🏠 ${inv.deptos.length} departamentos</span>
    </div>
    ${inv.deptos.map(d=>{
      const a=asig[d.numero]||{estacs:[],bods:[]};
      const tieneAlgo=a.estacs.length>0||a.bods.length>0;
      return`<div class="asig-card ${tieneAlgo?'assigned':''}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <span style="font-weight:700;font-size:13px">🏠 ${d.label}</span>
          ${tieneAlgo?`<span style="font-size:10px;color:var(--green);font-weight:600">✓ ${a.estacs.length>0?a.estacs.join(', '):''}${a.estacs.length>0&&a.bods.length>0?' · ':''}${a.bods.length>0?a.bods.join(', '):''}
          </span>`:'<span style="font-size:10px;color:#9ca3af">Sin asignación</span>'}
        </div>
        ${hayEstacs?`<div style="margin-bottom:6px">
          <div style="font-size:10px;font-weight:600;color:#64748B;margin-bottom:4px">ESTACIONAMIENTO</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${inv.estacs.map(e=>{
              const yaAsig=a.estacs.includes(e.label);
              const otroDepto=!yaAsig&&estAsig.includes(e.label);
              return`<button class="item-chip ${yaAsig?'asignado':otroDepto?'':'libre'}" 
                style="${otroDepto?'opacity:.35;cursor:not-allowed':''}"
                onclick="${otroDepto?'':`toggleAsignacion('${d.numero}','estac','${e.label}')`}">${e.label}</button>`;
            }).join('')}
          </div>

        ${hayBodegas?`<div>
          <div style="font-size:10px;font-weight:600;color:#64748B;margin-bottom:4px">BODEGA</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${inv.bods.map(b=>{
              const yaAsig=a.bods.includes(b.label);
              const otroDepto=!yaAsig&&bodAsig.includes(b.label);
              return`<button class="item-chip ${yaAsig?'asignado':otroDepto?'':'libre'}"
                style="${otroDepto?'opacity:.35;cursor:not-allowed':''}"
                onclick="${otroDepto?'':`toggleAsignacion('${d.numero}','bod','${b.label}')`}">${b.label}</button>`;
            }).join('')}
          </div>
        </div>`:''}
      </div>`;

      <button class="btn" onclick="setWizardStep(2)">← Volver</button>
      <button class="btn btn-gold" onclick="setWizardStep(4)">Siguiente → Confirmar</button>
    </div>
  </div>`;

function buildSAFacturacion(){
  const{comunidades}=state;

    <div class="metric"><div class="metric-label">Activas</div><div class="metric-value blue">${comunidades.filter(c=>c.activa).length}</div></div>
    <div class="metric"><div class="metric-label">Promedio</div><div class="metric-value gold">${comunidades.length>0?fmt(Math.round(totalMes/comunidades.length)):fmt(0)}</div></div>

function getMetrics(month){
  const{pagos,gastos,unidades,residentes}=state.comunidadData;
  const mp=pagos.filter(p=>p.month===month);
  const me=gastos.filter(g=>g.month===month);
  const totalIn=mp.reduce((s,p)=>s+p.amount,0);
  const totalOut=me.reduce((s,e)=>s+e.amount,0);
  const paidUnits=new Set(mp.map(p=>p.unidad_id));
  const occupied=unidades.filter(u=>residentes.some(r=>r.unidad_id===u.id));
  const morose=occupied.filter(u=>!paidUnits.has(u.id));
  return{totalIn,totalOut,balance:totalIn-totalOut,paidUnits,occupied,morose,mp,me};
}

// ── Deuda acumulada por unidad (cobros atrasados) ──
// ════════════════════════════════════════════════════════════════
//  DEUDA ACUMULADA — Cobros atrasados entre meses
//  Calcula correctamente todos los meses sin pago desde el ingreso
// ════════════════════════════════════════════════════════════════
function calcDeudaAcumulada(unitId){
  if(_deudaCache[unitId]) return _deudaCache[unitId];
  const _empty = {mesesDeuda:[], totalDeuda:0, mesesSinPagar:0, tieneDeudaHistorica:false, mesActualPagado:true, gcMesActual:0, totalConMesActual:0, mesActual:thisMonth()};
  if(!unitId || !state.comunidadData?.unidades) return _empty;
  const unit = state.comunidadData.unidades.find(u=>u.id===unitId);
  if(!unit?.monthly_fee) return _empty;

  const pagos = state.comunidadData.pagos.filter(p=>p.unidad_id===unitId);
  const mesesPagados = new Set(pagos.map(p=>p.month));

  // Determinar mes de inicio:
  // 1. Si hay pagos: desde el primer mes pagado
  // 2. Si no hay pagos pero tiene fecha_ingreso: desde ese mes
  // 3. Si no: desde hace 12 meses (límite razonable de búsqueda)
  let inicio;
  if(pagos.length > 0){
    // Partir desde el primer pago registrado
    inicio = pagos.map(p=>p.month).sort()[0];
  } else if(unit.fecha_ingreso){
    inicio = unit.fecha_ingreso.substr(0,7);
  } else {
    // Sin historial: revisar 12 meses hacia atrás
    const d = new Date(); d.setMonth(d.getMonth()-11);
    inicio = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }

  // FIN: mes ANTERIOR al mes actual
  // El mes en curso NO es deuda aún (el residente puede pagar hoy)
  const ahora = new Date();
  const mesActual = `${ahora.getFullYear()}-${String(ahora.getMonth()+1).padStart(2,'0')}`;
  const finDate = new Date(ahora.getFullYear(), ahora.getMonth(), 1);
  finDate.setMonth(finDate.getMonth()-1); // mes anterior
  const fin = `${finDate.getFullYear()}-${String(finDate.getMonth()+1).padStart(2,'0')}`;

  // Si el inicio es el mes actual o posterior, no hay deuda histórica
  if(inicio >= mesActual) return {mesesDeuda:[], totalDeuda:0, mesesSinPagar:0, tieneDeudaHistorica:false, mesActualPagado: mesesPagados.has(mesActual)};

  const mesesDeuda = [];
  let cur = new Date(inicio+'-02'); // día 2 para evitar timezone bugs
  const finObj = new Date(fin+'-02');

  while(cur <= finObj){
    const mes = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`;
    if(!mesesPagados.has(mes)){
      const multas = state.comunidadData.multas.filter(
        f=>f.unidad_id===unitId && f.month===mes && f.status==='pendiente'
      );
      const multasAmt = multas.reduce((s,f)=>s+f.amount,0);
      mesesDeuda.push({
        mes,
        gc: unit.monthly_fee,
        multas: multasAmt,
        total: unit.monthly_fee + multasAmt,
        diasAtraso: Math.floor((new Date() - new Date(mes+'-01')) / (1000*60*60*24))
      });
    }
    cur.setMonth(cur.getMonth()+1);
  }

  const totalDeuda = mesesDeuda.reduce((s,m)=>s+m.total,0);
  const mesActualPagado = mesesPagados.has(mesActual);
  const gcMesActual = mesActualPagado ? 0 : (unit.monthly_fee||0);

  const result = {
    mesesDeuda,
    totalDeuda,
    mesesSinPagar: mesesDeuda.length,
    tieneDeudaHistorica: mesesDeuda.length > 0,
    mesActualPagado,
    gcMesActual,
    // Total real incluyendo mes actual si no pagó
    totalConMesActual: totalDeuda + gcMesActual,
    mesActual,
  };
  _deudaCache[unitId] = result;
  return result;
}

// Devuelve true si una unidad tiene deuda en CUALQUIER mes (no solo el actual)
function esUnidadMorosa(unitId){
  const deuda = calcDeudaAcumulada(unitId);
  // Es morosa si tiene deuda histórica O no pagó el mes actual
  return deuda.tieneDeudaHistorica || !deuda.mesActualPagado;
}

// Devuelve el total adeudado real de una unidad (histórico + mes actual)
function getTotalDeudaUnidad(unitId){
  const deuda = calcDeudaAcumulada(unitId);
  return deuda.totalConMesActual || 0;
}

function buildEmisionGC(){
  const{unidades,residentes,pagos,gastos,multas,estacionamientos,bodegas}=state.comunidadData;
  const com=state.selectedComunidad;
  const curM=thisMonth();
  const selMes=state.gcMes||curM;

  // Gastos del mes seleccionado
  const gastosM=gastos.filter(g=>g.month===selMes);
  const totalEgresos=gastosM.reduce((s,g)=>s+g.amount,0);
  const totalIngresos=pagos.filter(p=>p.month===selMes).reduce((s,p)=>s+p.amount,0);

  // Calcular prorrateo total (m²)
  const totalSqm=unidades.reduce((s,u)=>s+(u.sqm||0),0);

  // Gastos fijos vs prorrateo
  const gastosProrate=gastosM.filter(g=>g.prorate);
  const gastosFixed=gastosM.filter(g=>!g.prorate);
  const totalProrate=gastosProrate.reduce((s,g)=>s+g.amount,0);
  const totalFixed=gastosFixed.reduce((s,g)=>s+g.amount,0);

  // Agrupar gastos por categoría para el desglose
  const catMap={};
  gastosM.forEach(g=>{
    if(!catMap[g.label])catMap[g.label]={icon:g.icon,label:g.label,total:0,items:[]};
    catMap[g.label].total+=g.amount;
    catMap[g.label].items.push(g);
  });

  // Unidades con residentes
  const occupied=unidades.filter(u=>residentes.some(r=>r.unidad_id===u.id));

  // Meses disponibles

            <tr><td>Total egresos del período</td><td style="text-align:right;color:var(--red);font-weight:700">${fmt(totalEgresos)}</td></tr>
            ${Object.values(catMap).map(c=>`<tr><td style="padding-left:20px;color:#6b7280">${c.icon} ${c.label}</td><td style="text-align:right">${fmt(c.total)}</td></tr>`).join('')}

      <!-- COBROS POR UNIDAD -->
      <div class="liq-gc-section">
        <div class="liq-gc-section-title">🏠 COBROS POR UNIDAD — ${selMes}</div>
        <table class="liq-gc-table">
          <thead><tr><th>Unidad</th><th>Residente</th><th>Estac.</th><th>Bodega</th><th>m²</th><th>Prorrateo %</th><th>GC mensual</th><th>Multas</th><th style="text-align:right">Total a pagar</th><th>Estado</th></tr></thead>
          <tbody>
            ${unidades.map(u=>{
              const r=residentes.find(x=>x.unidad_id===u.id);
              const estac=estacionamientos?.find(e=>e.unidad_id===u.id);
              const bod=bodegas?.find(b=>b.unidad_id===u.id);
              const pagado=pagos.some(p=>p.unidad_id===u.id&&p.month===selMes);
              const pf=multas.filter(f=>f.unidad_id===u.id&&f.status==='pendiente'&&f.month===selMes);
              const finesAmt=pf.reduce((s,f)=>s+f.amount,0);
              const gc=u.monthly_fee||0;
              const pct=totalSqm>0&&u.sqm?((u.sqm/totalSqm)*100).toFixed(2):'—';
              const total=gc+finesAmt;
              return`<tr style="${pagado?'background:#f0fdf4':''}">
                <td><b>Depto ${u.numero}</b><br><span style="font-size:10px;color:#9ca3af">P${u.piso}</span></td>

                <td>${u.sqm?u.sqm+'m²':'—'}</td>
                <td>${pct}%</td>
                <td>${gc?fmt(gc):'<span style="color:#9ca3af">Sin definir</span>'}</td>
                <td>${finesAmt>0?`<span style="color:var(--red);font-weight:700">${fmt(finesAmt)}</span>`:'—'}</td>
                <td style="text-align:right;font-weight:800;color:${total>0?'var(--navy)':'#9ca3af'}">${total>0?fmt(total):'—'}</td>
                <td><span style="padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:${pagado?'#d1fae5':'#fee2e2'};color:${pagado?'#065f46':'#991b1b'}">${pagado?'✓ Pagado':'⚠ Pendiente'}</span></td>

            <tr class="subtotal">
              <td colspan="8"><b>Total a recaudar</b></td>
              <td style="text-align:right;font-weight:800">${fmt(unidades.reduce((s,u)=>{
                const gc=u.monthly_fee||0;
                const pf=multas.filter(f=>f.unidad_id===u.id&&f.status==='pendiente'&&f.month===selMes).reduce((x,f)=>x+f.amount,0);
                return s+gc+pf;
              },0))}</td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- INGRESOS RECIBIDOS -->
      ${pagos.filter(p=>p.month===selMes).length>0?`<div class="liq-gc-section">
        <div class="liq-gc-section-title">💰 PAGOS RECIBIDOS — ${selMes}</div>
        <table class="liq-gc-table">
          <thead><tr><th>Depto</th><th>Residente</th><th>Fecha pago</th><th>Método</th><th style="text-align:right">Monto</th></tr></thead>
          <tbody>
            ${pagos.filter(p=>p.month===selMes).map(p=>{
              const r=residentes.find(x=>x.id===p.usuario_id);
              const u=unidades.find(x=>x.id===p.unidad_id);
              return`<tr><td><b>Depto ${u?.numero||'—'}</b></td><td>${r?.nombre||'—'}</td><td>${fmtD(p.date)}</td><td>${p.method}</td><td style="text-align:right;font-weight:700;color:var(--green)">${fmt(p.amount)}</td></tr>`;
            }).join('')}
            <tr class="subtotal"><td colspan="4"><b>Total recaudado</b></td><td style="text-align:right;color:var(--green)">${fmt(totalIngresos)}</td></tr>
          </tbody>
        </table>
      </div>`:''}

      <!-- MOROSOS -->
      ${occupied.filter(u=>!pagos.some(p=>p.unidad_id===u.id&&p.month===selMes)).length>0?`<div class="liq-gc-section">
        <div class="liq-gc-section-title">⚠️ UNIDADES CON PAGO PENDIENTE</div>
        <table class="liq-gc-table">
          <thead><tr><th>Depto</th><th>Residente</th><th>Teléfono</th><th style="text-align:right">Monto pendiente</th></tr></thead>
          <tbody>
            ${occupied.filter(u=>!pagos.some(p=>p.unidad_id===u.id&&p.month===selMes)).map(u=>{
              const r=residentes.find(x=>x.unidad_id===u.id);
              const gc=u.monthly_fee||0;
              const pf=multas.filter(f=>f.unidad_id===u.id&&f.status==='pendiente'&&f.month===selMes).reduce((s,f)=>s+f.amount,0);
              return`<tr style="background:#fef2f2">
                <td><b>Depto ${u.numero}</b></td>
                <td>${r?.nombre||'—'}</td>
                <td style="color:#6b7280">${r?.phone||'—'}</td>
                <td style="text-align:right;font-weight:700;color:var(--red)">${gc?fmt(gc+pf):'Sin GC definido'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`:''}

      <!-- OBSERVACIONES -->
      <div class="liq-gc-obs">
        <b>Observaciones de la administración</b><br><br>
        Estimados residentes, se adjunta la liquidación de gastos comunes correspondiente al período <b>${selMes}</b>.<br>
        Para consultas, contactar a la administración.<br><br>
        ${com?.nombre||''} · ${com?.direccion||''} · Emitido por <b>Vecinoo</b> · vecinoo.cl
      </div>

    </div><!-- end body -->

    <!-- Footer -->
    <div class="liq-gc-footer">
      <div>
        <div class="liq-gc-footer-brand">Veci<span>noo</span></div>
        <div style="font-size:10px;color:#6b7280">Todo tu edificio, en orden.</div>
      </div>
      <div style="font-size:11px;color:#6b7280;text-align:center">
        Liquidación generada el ${new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'})}
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;font-weight:700;color:#0F172A">${com?.nombre||''}</div>
        <div style="font-size:10px;color:#6b7280">Período: ${selMes}</div>
      </div>
    </div>

  </div><!-- end liq-gc -->

  <!-- Botones de acción abajo -->
  <div class="card" style="border-left:4px solid var(--gold)">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:13px;font-weight:700">¿Listo para emitir?</div>
        <div style="font-size:12px;color:#6b7280;margin-top:2px">Imprime o descarga como PDF para compartir con la comunidad</div>

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-gold" onclick="window.print()">🖨 Descargar PDF</button>
        <button class="btn btn-success" onclick="emitirGCTodos('${selMes}')">📩 Registrar emisión</button>

}

// Modal liquidación individual por residente
function buildLiqIndividual(mes){
  const{unidades,residentes,pagos,gastos,multas,estacionamientos,bodegas}=state.comunidadData;
  const com=state.selectedComunidad;
  const gastosM=gastos.filter(g=>g.month===mes);
  const totalSqm=unidades.reduce((s,u)=>s+(u.sqm||0),0);

  return`<div class="modal-overlay" id="modalOverlay"><div class="modal modal-lg" style="max-width:860px">
    <div class="modal-header">
      <span class="modal-title">👤 Liquidación por residente — ${mes}</span>
      <button class="close-btn" onclick="setState({modal:null})">×</button>
    </div>
    <p style="font-size:12px;color:#6b7280;margin-bottom:14px">Selecciona un residente para ver su liquidación individual e imprimirla.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">
      ${residentes.map(r=>{
        const u=unidades.find(x=>x.id===r.unidad_id);
        const pagado=pagos.some(p=>p.unidad_id===r.unidad_id&&p.month===mes);
        const gc=u?.monthly_fee||0;
        const pf=multas.filter(f=>f.unidad_id===r.unidad_id&&f.status==='pendiente'&&f.month===mes).reduce((s,f)=>s+f.amount,0);
        return`<div style="border:1px solid ${pagado?'#a7f3d0':'#fca5a5'};border-radius:8px;padding:10px;background:${pagado?'#f0fdf4':'#fef2f2'}">
          <div style="font-weight:700;font-size:12px">${r.nombre}</div>
          <div style="font-size:11px;color:#6b7280">Depto ${u?.numero||'—'}</div>
          <div style="font-size:13px;font-weight:800;color:${pagado?'var(--green)':'var(--red)'};margin-top:4px">${pagado?'✓ Pagado':gc?fmt(gc+pf):'Sin GC'}</div>
          <button class="btn btn-sm ${pagado?'btn-success':'btn-primary'}" style="margin-top:6px;width:100%" onclick="verLiqResidente('${r.id}','${mes}')">
            🖨 Ver liquidación
          </button>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn" onclick="setState({modal:null})">Cerrar</button></div>
  </div></div>`;
}
function buildExpenses(viewOnly=false){
  const{selectedCat}=state;
  const cat=selectedCat?EXPENSE_CATS.find(c=>c.id===selectedCat):null;
  // Filtro por mes
  const mesesDisp=[...new Set(state.comunidadData.gastos.map(g=>g.month))].sort().reverse();
  const selMesG=state.gastosMes||'todos';
  const gastosFilt=selMesG==='todos'?state.comunidadData.gastos:state.comunidadData.gastos.filter(g=>g.month===selMesG);
  const byCat=EXPENSE_CATS.map(c=>({...c,total:gastosFilt.filter(e=>e.cat_id===c.id).reduce((s,e)=>s+e.amount,0)})).filter(x=>x.total>0);
  const maxVal=Math.max(...byCat.map(x=>x.total),1);
  const totalFiltrado=gastosFilt.reduce((s,g)=>s+g.amount,0);
  return`
  <div class="page-header"><div><h2>${viewOnly?'Gastos Comunes':'Gastos del Edificio'}</h2></div></div>
  ${!viewOnly?`<div class="card">
    <div class="card-title" style="margin-bottom:10px">Selecciona categoría</div>
    <div class="cat-grid">${EXPENSE_CATS.map(c=>`<button class="cat-btn${selectedCat===c.id?' selected':''}" onclick="setState({selectedCat:'${c.id}'})">
      <span class="cat-icon">${c.icon}</span><span>${c.label}</span>${c.prorate?'<span style="font-size:9px;opacity:.7">prorrateo</span>':''}
    </button>`).join('')}</div>
    ${cat?`<div style="background:#f9fafb;border-radius:8px;padding:12px;border:1px solid #e5e5e5">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px">${cat.icon} ${cat.label} ${cat.prorate?'<span class="badge badge-gold">Prorrateo m²</span>':''}</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Monto ($) *</label><input class="form-control" id="eAmount" type="number" oninput="updateProrate()"></div>
        <div class="form-group"><label class="form-label">Fecha *</label><input class="form-control" id="eDate" type="date" value="${today()}"></div>
      </div>
      <div class="form-group"><label class="form-label">Descripción / N° Factura</label><input class="form-control" id="eDesc"></div>
      ${cat.prorate?`<div id="proratePreview" style="display:none;margin-top:10px"><div style="font-size:11px;font-weight:700;color:var(--navy);margin-bottom:5px">📊 Prorrateo por m²:</div><table><thead><tr><th>Depto</th><th>m²</th><th>%</th><th>A cobrar</th></tr></thead><tbody id="prorateBody"></tbody></table></div>`:''}
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-primary" id="btnSaveExpense">Registrar gasto</button>
        <button class="btn" onclick="setState({selectedCat:null})">Cancelar</button>
      </div>
    </div>`:''}
  </div>`:''}

  <!-- Filtro por mes -->
  <div class="card" style="padding:10px 14px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:12px;font-weight:600;color:#6b7280">Filtrar por mes:</span>
        <select class="form-control" style="width:auto;font-size:12px" onchange="setState({gastosMes:this.value})">
          <option value="todos" ${selMesG==='todos'?'selected':''}>Todos los meses</option>
          ${mesesDisp.map(m=>`<option value="${m}" ${m===selMesG?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
      <div style="font-size:12px;color:#6b7280">
        ${gastosFilt.length} gasto${gastosFilt.length!==1?'s':''} ·
        <span style="font-weight:700;color:var(--red)">${fmt(totalFiltrado)}</span>
      </div>
    </div>
  </div>

  ${byCat.length>0?`<div class="card"><div class="card-header"><span class="card-title">Por categoría${selMesG!=='todos'?' — '+selMesG:''}</span></div>
    ${byCat.sort((a,b)=>b.total-a.total).map(c=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>${c.icon} ${c.label}</span><span style="font-weight:700">${fmt(c.total)}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${Math.round(c.total/maxVal*100)}%;background:var(--navy)"></div></div></div>`).join('')}
    <div style="display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid #e5e5e5;font-weight:700;font-size:12px;margin-top:4px"><span>Total</span><span class="red">${fmt(totalFiltrado)}</span></div>
  </div>`:''}

  <div class="card"><table><thead><tr><th>Categoría</th><th>Descripción</th><th>Mes</th><th>Fecha</th><th>Monto</th><th>Tipo</th>${!viewOnly?'<th></th>':''}</tr></thead>
  <tbody>${gastosFilt.length===0?`<tr><td colspan="${viewOnly?6:7}" class="empty">Sin gastos${selMesG!=='todos'?' para '+selMesG:''}</td></tr>`:gastosFilt.map(e=>`<tr>
    <td>${e.icon} <b>${e.label}</b></td><td style="color:#6b7280;font-size:11px">${e.description||'—'}</td><td>${e.month}</td>
    <td>${fmtD(e.date)}</td><td style="font-weight:700;color:var(--red)">${fmt(e.amount)}</td>
    <td>${e.prorate?'<span class="badge badge-gold">Prorrateo</span>':'<span class="badge badge-gray">Fijo</span>'}</td>
    ${!viewOnly?`<td><button class="btn btn-sm btn-danger" onclick="deleteGasto('${e.id}','${e.label}','${e.month}')">🗑</button></td>`:''}
  </tr>`).join('')}</tbody></table></div>`;
}

function buildBank(){
  const{pagos,gastos,unidades}=state.comunidadData;
  const totalIn=pagos.reduce((s,p)=>s+p.amount,0);
  const totalOut=gastos.reduce((s,g)=>s+g.amount,0);
  const saldoActual=totalIn-totalOut;

  // Historial mensual acumulado (saldo real que va de mes a mes)
  const meses=[...new Set([...pagos.map(p=>p.month),...gastos.map(g=>g.month)])].sort();
  let saldoAcumulado=0;
  const historial=meses.map(m=>{
    const ingr=pagos.filter(p=>p.month===m).reduce((s,p)=>s+p.amount,0);
    const egr=gastos.filter(g=>g.month===m).reduce((s,g)=>s+g.amount,0);
    saldoAcumulado+=ingr-egr;
    return{mes:m,ingr,egr,balance:ingr-egr,saldoAcum:saldoAcumulado};
  });

  // Movimientos detallados (para la tabla)
  const allMovs=[
    ...pagos.map(p=>({...p,_t:'crédito',_desc:`GC Depto ${unidades.find(u=>u.id===p.unidad_id)?.numero||''}`})),
    ...gastos.map(g=>({...g,_t:'débito',_desc:`${g.icon} ${g.label}`}))
  ].sort((a,b)=>new Date(b.date||b.created_at)-new Date(a.date||a.created_at));

  return`
  <div class="page-header">
    <div><h2>Cuenta Corriente</h2><p>Saldo acumulado de toda la historia</p></div>
    <span class="badge badge-gold">Fintoc próximamente</span>
  </div>

  <div class="metrics" style="grid-template-columns:repeat(3,1fr)">
    <div class="metric"><div class="metric-label">Total ingresos GC</div><div class="metric-value green">${fmt(totalIn)}</div></div>
    <div class="metric"><div class="metric-label">Total egresos</div><div class="metric-value red">${fmt(totalOut)}</div></div>
    <div class="metric" style="border-left:4px solid ${saldoActual>=0?'var(--green)':'var(--red)'}">
      <div class="metric-label">Saldo en caja</div>
      <div class="metric-value ${saldoActual>=0?'green':'red'}">${fmt(saldoActual)}</div>
      <div style="font-size:10px;color:#6b7280;margin-top:3px">${saldoActual>=0?'✓ Superávit acumulado':'⚠ Déficit acumulado'}</div>
    </div>
  </div>

  ${historial.length>0?`
  <div class="card">
    <div class="card-header"><span class="card-title">📈 Historial mensual con saldo acumulado</span></div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Mes</th><th style="text-align:right">Ingresos</th><th style="text-align:right">Egresos</th><th style="text-align:right">Balance del mes</th><th style="text-align:right">Saldo acumulado</th></tr></thead>
        <tbody>
          ${[...historial].reverse().map(h=>`<tr>
            <td style="font-weight:600">${h.mes}</td>
            <td style="text-align:right;color:var(--green);font-weight:600">${fmt(h.ingr)}</td>
            <td style="text-align:right;color:var(--red)">${fmt(h.egr)}</td>
            <td style="text-align:right;font-weight:600;color:${h.balance>=0?'var(--green)':'var(--red)'}">${h.balance>=0?'+':''}${fmt(h.balance)}</td>
            <td style="text-align:right;font-weight:800;color:${h.saldoAcum>=0?'var(--navy)':'var(--red)'}">
              <span style="background:${h.saldoAcum>=0?'#f0fdf4':'#fef2f2'};padding:2px 8px;border-radius:10px">${fmt(h.saldoAcum)}</span>
            </td>
          </tr>`).join('')}
          <tr style="background:#f9fafb;border-top:2px solid #e5e5e5">
            <td style="font-weight:800">TOTAL</td>
            <td style="text-align:right;font-weight:800;color:var(--green)">${fmt(totalIn)}</td>
            <td style="text-align:right;font-weight:800;color:var(--red)">${fmt(totalOut)}</td>
            <td style="text-align:right;font-weight:800;color:${saldoActual>=0?'var(--green)':'var(--red)'}">${fmt(saldoActual)}</td>
            <td style="text-align:right;font-weight:900;font-size:14px;color:${saldoActual>=0?'var(--green)':'var(--red)'}">
              <span style="background:${saldoActual>=0?'#d1fae5':'#fee2e2'};padding:3px 10px;border-radius:10px">${fmt(saldoActual)}</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>`:''}

  <div class="card">
    <div class="card-header"><span class="card-title">Movimientos detallados</span></div>
    <div style="overflow-x:auto">
      <table><thead><tr><th>Fecha</th><th>Descripción</th><th>Tipo</th><th style="text-align:right">Monto</th></tr></thead>
      <tbody>${allMovs.length===0?`<tr><td colspan="4" class="empty">Sin movimientos</td></tr>`:allMovs.slice(0,50).map(m=>`<tr>
        <td>${fmtD(m.date)}</td><td>${m._desc}</td>
        <td><span class="badge ${m._t==='crédito'?'badge-green':'badge-red'}">${m._t}</span></td>
        <td style="text-align:right;font-weight:700;color:${m._t==='crédito'?'var(--green)':'var(--red)'}">
          ${m._t==='crédito'?'+':'-'}${fmt(m.amount)}
        </td>
      </tr>`).join('')}</tbody></table>
    </div>
    ${allMovs.length>50?`<div style="text-align:center;padding:10px;font-size:11px;color:#9ca3af">Mostrando los 50 más recientes de ${allMovs.length} movimientos</div>`:''}
  </div>`;
}

// Ficha histórica de residente
function buildFichaResidente(residenteId){
  const r=state.comunidadData.residentes.find(x=>x.id===residenteId);
  if(!r)return'';
  const u=state.comunidadData.unidades.find(x=>x.id===r.unidad_id);
  const misPagos=state.comunidadData.pagos.filter(p=>p.usuario_id===residenteId).sort((a,b)=>b.month.localeCompare(a.month));
  const mesesPagados=new Set(misPagos.map(p=>p.month));
  const deuda=calcDeudaAcumulada(r.unidad_id);
  const multas=state.comunidadData.multas.filter(f=>f.unidad_id===r.unidad_id);
  const totalPagado=misPagos.reduce((s,p)=>s+p.amount,0);

  // Generar grilla de últimos 12 meses
  const grilla=[];
  for(let i=11;i>=0;i--){
    const d=new Date(); d.setMonth(d.getMonth()-i);
    const mes=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const pago=misPagos.find(p=>p.month===mes);
    grilla.push({mes, pago, pagado:mesesPagados.has(mes)});
  }

  return`
  <div style="background:#f8fafc;border-radius:8px;padding:14px;margin-bottom:14px;border-left:4px solid var(--navy)">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-weight:800;font-size:15px">${r.nombre}</div>
        <div style="font-size:12px;color:#6b7280">${r.rut||''} ${r.email?'· '+r.email:''}</div>
        <div style="font-size:12px;color:#6b7280">Depto ${u?.numero||'—'} · Piso ${u?.piso||'—'} · GC: ${u?.monthly_fee?fmt(u.monthly_fee):'Sin definir'}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:#6b7280">Total pagado histórico</div>
        <div style="font-size:18px;font-weight:800;color:var(--green)">${fmt(totalPagado)}</div>
        ${deuda.totalDeuda>0?`<div style="font-size:13px;font-weight:700;color:var(--red)">Deuda: ${fmt(deuda.totalDeuda)}</div>`:''}
      </div>
    </div>
  </div>

  <!-- Grilla últimos 12 meses -->
  <div style="margin-bottom:14px">
    <div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:8px;text-transform:uppercase">Últimos 12 meses</div>
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px">
      ${grilla.map(g=>`<div style="background:${g.pagado?'#f0fdf4':'#fff1f2'};border:1px solid ${g.pagado?'#a7f3d0':'#fca5a5'};border-radius:6px;padding:6px;text-align:center">
        <div style="font-size:9px;color:#6b7280">${g.mes.slice(5)}</div>
        <div style="font-size:12px">${g.pagado?'✅':'❌'}</div>
        ${g.pago?`<div style="font-size:9px;font-weight:600;color:#065f46">${fmt(g.pago.amount).replace('$','')}</div>`:''}
      </div>`).join('')}
    </div>
  </div>

  <!-- Tabla de pagos -->
  <div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:6px;text-transform:uppercase">Historial de pagos</div>
  ${misPagos.length===0
    ?'<div style="font-size:12px;color:#9ca3af;padding:8px">Sin pagos registrados</div>'
    :`<table style="margin-bottom:14px"><thead><tr><th>Mes</th><th>Monto</th><th>Método</th><th>Fecha</th><th></th></tr></thead>
    <tbody>${misPagos.map(p=>`<tr>
      <td style="font-weight:600">${p.month}</td>
      <td class="green" style="font-weight:700">${fmt(p.amount)}</td>
      <td><span class="badge badge-blue">${p.method}</span></td>
      <td>${fmtD(p.date)}</td>
      <td><button class="btn btn-sm btn-primary" onclick="viewReceipt('${p.id}')">⬇</button></td>
    </tr>`).join('')}</tbody></table>`}

  <!-- Deuda acumulada -->
  ${deuda.mesesDeuda.length>0?`
  <div style="background:#fff1f2;border:1px solid #fca5a5;border-radius:8px;padding:12px;margin-bottom:14px">
    <div style="font-weight:700;color:#991b1b;margin-bottom:8px">⚠️ Meses sin pagar (${deuda.mesesSinPagar})</div>
    <table><thead><tr><th>Mes</th><th>GC</th><th>Multas</th><th>Total</th></tr></thead>
    <tbody>${deuda.mesesDeuda.map(m=>`<tr>
      <td style="font-weight:600">${m.mes}</td>
      <td>${fmt(m.gc)}</td>
      <td class="red">${m.multas>0?fmt(m.multas):'—'}</td>
      <td style="font-weight:700;color:var(--red)">${fmt(m.total)}</td>
    </tr>`).join('')}
    <tr style="font-weight:800;border-top:2px solid #fca5a5">
      <td colspan="3">DEUDA TOTAL</td>
      <td style="color:var(--red)">${fmt(deuda.totalDeuda)}</td>
    </tr></tbody></table>
  </div>`:''}

  <!-- Multas -->
  ${multas.length>0?`
  <div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:6px;text-transform:uppercase">Multas</div>
  <table><thead><tr><th>Mes</th><th>Motivo</th><th>Monto</th><th>Estado</th></tr></thead>
  <tbody>${multas.map(f=>`<tr>
    <td>${f.month}</td>
    <td>${f.reason}</td>
    <td style="font-weight:700">${fmt(f.amount)}</td>
    <td><span class="badge ${f.status==='pagada'?'badge-green':'badge-red'}">${f.status}</span></td>
  </tr>`).join('')}</tbody></table>`:''}`;
}

window.exportarCSV = () => {

  const sel=state.reportMonth;
  const mp=pagos.filter(p=>p.month===sel);
  let csv='Tipo,Mes,Depto,Residente,Monto,Método,Fecha\n';
  mp.forEach(p=>{

  showAlert('✅ CSV descargado');
};

window.exportarCSVAnual = () => {

window.exportarMorososCSV = () => {
  const{unidades,residentes,pagos,multas}=state.comunidadData;
  const com=state.selectedComunidad;
  const occupied=unidades.filter(u=>residentes.some(r=>r.unidad_id===u.id));
  let csv=`Comunidad: ${com?.nombre||''}\nFecha: ${new Date().toLocaleDateString('es-CL')}\n\n`;
  csv+='Depto,Piso,Residente,RUT,Meses sin pagar,Deuda total GC,Multas pendientes,DEUDA TOTAL\n';
  occupied.forEach(u=>{
    const r=residentes.find(x=>x.unidad_id===u.id);
    const deuda=calcDeudaAcumulada(u.id);
    if(deuda.totalDeuda===0)return;
    const multasPend=multas.filter(f=>f.unidad_id===u.id&&f.status==='pendiente').reduce((s,f)=>s+f.amount,0);
    csv+=`${u.numero},${u.piso},${r?.nombre||''},${r?.rut||''},${deuda.mesesSinPagar},${deuda.mesesDeuda.reduce((s,m)=>s+m.gc,0)},${multasPend},${deuda.totalDeuda}\n`;
  });
  _downloadFile(`morosos_${today()}.csv`, csv, 'text/csv');
  showAlert('✅ Nómina de morosos descargada');
};

function _downloadFile(nombre, contenido, tipo){
  const blob=new Blob([contenido],{type:tipo});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=nombre; a.click();
  URL.revokeObjectURL(url);
}

function buildVotaciones(){
  const{votaciones,votos,residentes}=state.comunidadData;
  const full=isFullAccess();
  const userId=state.currentUser?.id;
  const activas=votaciones.filter(v=>v.estado==='activa');
  const cerradas=votaciones.filter(v=>v.estado==='cerrada');

  function buildCard(v,readonly=false){
    let opciones=v.opciones||[];
    if(typeof opciones==='string'){try{opciones=JSON.parse(opciones);}catch(e){opciones=[];}}
    if(!Array.isArray(opciones))opciones=[];
    const votosDev=votos.filter(x=>x.votacion_id===v.id);
    const miVoto=votos.find(x=>x.votacion_id===v.id&&x.usuario_id===userId);
    const yaVote=!!miVoto;
    const totalVotos=votosDev.length;
    const mostrar=yaVote||readonly;
    return`<div class="votacion-card">
      <div class="votacion-header">
        <div>
          <div style="font-weight:700;font-size:14px">${v.titulo}</div>
          ${v.descripcion?`<div style="font-size:12px;color:#6b7280;margin-top:3px">${v.descripcion}</div>`:''}
          <div style="font-size:10px;color:#9ca3af;margin-top:5px">Cierre: ${fmtD(v.fecha_cierre)} · ${totalVotos} votos</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
          <span class="badge ${v.estado==='activa'?'badge-green':'badge-gray'}">${v.estado==='activa'?'✓ Activa':'Cerrada'}</span>
          ${yaVote?`<span class="badge badge-gold">✓ Ya votaste</span>`:''}
          ${full&&v.estado==='activa'?`<button class="btn btn-sm btn-danger" onclick="cerrarVotacion('${v.id}')">Cerrar</button>`:''}
          ${full&&v.estado==='cerrada'?`<button class="btn btn-sm btn-primary" onclick="generarActaVotacion('${v.id}')">📄 Generar Acta</button>`:''}
          ${full?`<button class="btn btn-sm" style="background:#fee2e2;color:#991b1b;border-color:#fca5a5" onclick="deleteVotacion('${v.id}')">🗑</button>`:''}
        </div>
      </div>
      ${mostrar?opciones.map(op=>{
        const n=votosDev.filter(x=>x.opcion_elegida===op).length;
        const pct=totalVotos>0?Math.round(n/totalVotos*100):0;
        const esMiVoto=miVoto?.opcion_elegida===op;
        return`<div class="resultado-row">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span style="font-weight:${esMiVoto?'700':'400'}">${esMiVoto?'✓ ':''} ${op}</span>
            <span style="font-weight:700">${n} votos · ${pct}%</span>
          </div>
          <div class="voto-bar"><div class="voto-fill" style="width:${pct}%;background:${esMiVoto?'var(--green)':'var(--navy)'}"></div></div>
        </div>`;
      }).join(''):`<div style="margin-top:8px">
        ${opciones.map(op=>`<div class="opcion-voto" onclick="emitirVoto('${v.id}','${op}')"><span>${op}</span><span style="font-size:11px;color:#6b7280">Votar →</span></div>`).join('')}
        <p style="font-size:10px;color:#9ca3af;margin-top:8px">Voto anónimo · Solo una vez</p>
      </div>`}
      ${(yaVote||readonly)&&totalVotos>0?`<div class="acta-box"><div style="font-size:12px;color:#6b7280">Total: <b>${totalVotos}</b> de <b>${residentes.length}</b> · Participación: <b>${Math.round(totalVotos/Math.max(residentes.length,1)*100)}%</b></div></div>`:''}
    </div>`;
  }

  return`
  <div class="page-header">
    <div><h2>Votaciones</h2><p>${activas.length} activas · ${cerradas.length} cerradas</p></div>
    ${full?`<button class="btn btn-gold" id="btnAddVotacion">🗳️ Nueva votación</button>`:''}
  </div>
  ${full?`<div id="votacionForm" style="display:none" class="card">
    <div class="form-group"><label class="form-label">Título *</label><input class="form-control" id="vTitulo"></div>
    <div class="form-group"><label class="form-label">Descripción</label><textarea class="form-control" id="vDesc" rows="2"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Fecha inicio</label><input class="form-control" id="vInicio" type="date" value="${today()}"></div>
      <div class="form-group"><label class="form-label">Fecha cierre *</label><input class="form-control" id="vCierre" type="date"></div>
    </div>
    <div class="section-div">Opciones</div>
    <div id="opcionesContainer">
      <div class="form-row" style="margin-bottom:8px">
        <input class="form-control opcion-input" placeholder="Opción 1 (ej: A favor)">
        <input class="form-control opcion-input" placeholder="Opción 2 (ej: En contra)">
      </div>
    </div>
    <button class="btn btn-sm" id="btnAddOpcion" style="margin-bottom:12px">+ Agregar opción</button>
    <div style="display:flex;gap:8px">
      <button class="btn btn-gold" id="btnSaveVotacion">Publicar votación</button>
      <button class="btn" id="btnCancelVotacion">Cancelar</button>
    </div>
  </div>`:''}
  ${activas.length>0?`<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:8px">Activas</div>${activas.map(v=>buildCard(v,false)).join('')}</div>`:''}
  ${cerradas.length>0?`<div><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:8px">Cerradas</div>${cerradas.map(v=>buildCard(v,true)).join('')}</div>`:''}
  ${activas.length===0&&cerradas.length===0?`<div class="card"><div class="empty">Sin votaciones</div></div>`:''}`;
}

function buildModal(){
  const m=state.modal;
  if(!m)return'';
  if(m.type==='acta_votacion') return buildActaVotacionModal(m.votacionId);
  if(m.type==='nueva_reserva') return buildModalNuevaReserva(m.espacioId||'sala');
  if(m.type==='nuevo_mantenimiento') return buildModalMantenimiento(null);
  if(m.type==='editar_mantenimiento') return buildModalMantenimiento(m.mant);
  if(m.type==='analisis_contrato') return buildModalAnalisisContrato(m.mant);
  if(m.type==='ficha_deuda') return buildModalFichaDeuda(m.unitId);
  if(m.type==='analisis_global_ia') return buildModalAnalisisGlobalIA();
  if(m.type==='confirm'){
    return`<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal" style="max-width:400px">

  }
  if(m.type==='edit_unit'){

    const bodAsig=bods.find(b=>b.unidad_id===u.id);

      <div class="modal-header"><span class="modal-title">✏️ Editar Depto ${sanitize(u.numero)}</span><button class="close-btn" onclick="setState({modal:null})" aria-label="Cerrar">×</button></div>

        <button class="btn" onclick="setState({modal:null})">Cerrar</button>
      </div>
    </div></div>`;
  }
  if(m.type==='liquidacion'){
    const w=m.worker;const liq=calcLiquidacion(w);
    const mes=new Date().toLocaleDateString('es-CL',{month:'long',year:'numeric'});
    return`<div class="modal-overlay" id="modalOverlay"><div class="modal modal-lg">
      <div class="modal-header"><span class="modal-title">Liquidación de Sueldo</span><button class="close-btn" onclick="setState({modal:null})">×</button></div>
      <div class="receipt">
        <div class="receipt-header"><div style="margin-bottom:4px">${LOGO_ICON_HTML}</div><p style="color:#6b7280;margin-top:4px">Liquidación — ${mes}</p></div>
        <div class="receipt-row"><span style="color:#6b7280">Trabajador</span><span style="font-weight:700">${w.nombre}</span></div>
        <div class="receipt-row"><span style="color:#6b7280">RUT</span><span>${w.rut}</span></div>
        <div class="receipt-row"><span style="color:#6b7280">Cargo</span><span>${w.rol}</span></div>
        <div class="receipt-row"><span style="color:#6b7280">AFP / Salud</span><span>${w.afp_type} / ${w.health_type}</span></div>
        <div style="height:6px"></div>
        <div class="receipt-row" style="font-weight:700"><span>Sueldo bruto</span><span>${fmt(liq.bruto)}</span></div>
        <div class="receipt-row"><span style="color:var(--red)">AFP (${(liq.afpPct*100).toFixed(2)}%)</span><span style="color:var(--red)">-${fmt(liq.afp)}</span></div>
        <div class="receipt-row"><span style="color:var(--red)">Salud</span><span style="color:var(--red)">-${fmt(liq.salud)}</span></div>
        <div class="receipt-row"><span style="color:var(--red)">Seg. cesantía (0.6%)</span><span style="color:var(--red)">-${fmt(liq.segCes)}</span></div>
        <div class="receipt-row"><span style="color:var(--red)">Imp. 2° categoría</span><span style="color:var(--red)">-${fmt(liq.imp)}</span></div>
        <div class="receipt-total"><span>LÍQUIDO A PAGAR</span><span style="color:var(--green)">${fmt(liq.liquido)}</span></div>
        <div style="margin-top:10px;background:#f9fafb;padding:10px;border-radius:6px;border-left:3px solid var(--gold)">
          <div class="receipt-row"><span>SIS empleador (1.54%)</span><span>${fmt(liq.sis)}</span></div>
          <div class="receipt-row" style="font-weight:700"><span>Costo total empleador</span><span>${fmt(liq.bruto+liq.sis)}</span></div>
        </div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:center"><button class="btn btn-primary" onclick="window.print()">🖨 Imprimir</button><button class="btn" onclick="setState({modal:null})">Cerrar</button></div>
    </div></div>`;
  }
  if(m.type==='boleta'){
    const w=m.worker;const bruto=w.gross_salary||0;const ret=Math.round(bruto*0.1525);
    const mes=new Date().toLocaleDateString('es-CL',{month:'long',year:'numeric'});
    return`<div class="modal-overlay" id="modalOverlay"><div class="modal">
      <div class="modal-header"><span class="modal-title">Boleta de Honorarios</span><button class="close-btn" onclick="setState({modal:null})">×</button></div>
      <div class="receipt">
        <div class="receipt-header"><div style="margin-bottom:4px">${LOGO_ICON_HTML}</div><p style="color:#6b7280;margin-top:4px">Boleta de Honorarios — ${mes}</p></div>
        <div class="receipt-row"><span style="color:#6b7280">Prestador</span><span style="font-weight:700">${w.nombre}</span></div>
        <div class="receipt-row"><span style="color:#6b7280">RUT</span><span>${w.rut}</span></div>
        <div class="receipt-row"><span style="color:#6b7280">Servicio</span><span>${w.rol}</span></div>
        <div style="height:6px"></div>
        <div class="receipt-row" style="font-weight:700"><span>Honorario bruto</span><span>${fmt(bruto)}</span></div>
        <div class="receipt-row"><span style="color:var(--red)">Retención 15.25%</span><span style="color:var(--red)">-${fmt(ret)}</span></div>
        <div class="receipt-total"><span>LÍQUIDO A PAGAR</span><span style="color:var(--green)">${fmt(bruto-ret)}</span></div>
        <div style="margin-top:10px;font-size:10px;color:#9ca3af;text-align:center">Retención vigente desde 01/01/2026 — Art. 74 LIR</div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:center"><button class="btn btn-primary" onclick="window.print()">🖨 Imprimir</button><button class="btn" onclick="setState({modal:null})">Cerrar</button></div>
    </div></div>`;
  }
  if(m.type==='finiquito'){
    const w=m.worker;const type=m.finType||'renuncia';const lastDay=m.lastDay||today();
    const fin=calcFiniquito(w,type,lastDay);
    return`<div class="modal-overlay" id="modalOverlay"><div class="modal modal-lg">
      <div class="modal-header"><span class="modal-title">Cálculo de Finiquito</span><button class="close-btn" onclick="setState({modal:null})">×</button></div>
      <div class="form-row" style="margin-bottom:12px">
        <div class="form-group"><label class="form-label">Tipo</label>
          <select class="form-control" id="finType" onchange="updateFiniquito('${w.id}')">
            <option value="renuncia" ${type==='renuncia'?'selected':''}>Renuncia voluntaria</option>
            <option value="despido" ${type==='despido'?'selected':''}>Despido Art. 161</option>
            <option value="mutuo" ${type==='mutuo'?'selected':''}>Mutuo acuerdo</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Último día trabajado</label>
          <input class="form-control" id="finLastDay" type="date" value="${lastDay}" onchange="updateFiniquito('${w.id}')">
        </div>
      </div>
      <div class="receipt">
        <div class="receipt-header"><div style="margin-bottom:4px">${LOGO_ICON_HTML}</div><p style="color:#6b7280;margin-top:4px">Finiquito de Trabajo</p></div>
        <div class="receipt-row"><span style="color:#6b7280">Trabajador</span><span style="font-weight:700">${w.nombre}</span></div>
        <div class="receipt-row"><span style="color:#6b7280">Cargo</span><span>${w.rol}</span></div>
        <div class="receipt-row"><span style="color:#6b7280">Antigüedad</span><span>${fin.years} años ${fin.months} meses</span></div>
        <div style="height:6px"></div>
        <div class="receipt-row"><span>Días proporcionales</span><span>${fmt(fin.dias)}</span></div>
        <div class="receipt-row"><span>Vacaciones proporcionales</span><span>${fmt(fin.vac)}</span></div>
        ${type==='despido'?`<div class="receipt-row"><span>Indemnización</span><span>${fmt(fin.ind)}</span></div>`:''}
        <div class="receipt-total"><span>TOTAL FINIQUITO</span><span style="color:var(--navy)">${fmt(fin.total)}</span></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:center">
        <button class="btn btn-primary" onclick="window.print()">🖨 Imprimir</button>
        <button class="btn btn-danger" onclick="confirmarFiniquito('${w.id}')">Confirmar desvinculación</button>
        <button class="btn" onclick="setState({modal:null})">Cerrar</button>
      </div>
    </div></div>`;
  }
  if(m.type==='inventario'){
    return buildInventarioModal(m.comunidadId,m.comunidadNombre);
  }
  if(m.type==='liq_individual'){
    return buildLiqIndividual(m.mes);
  }
  if(m.type==='liq_residente'){
    return buildLiqResidenteModal(m.residenteId,m.mes);
  }
  return'';
}

function buildLiqResidenteModal(residenteId,mes){
  const{unidades,residentes,pagos,gastos,multas,estacionamientos,bodegas}=state.comunidadData;
  const com=state.selectedComunidad;
  const r=residentes.find(x=>x.id===residenteId);
  const u=unidades.find(x=>x.id===r?.unidad_id);
  const estac=estacionamientos?.find(e=>e.unidad_id===u?.id);
  const bod=bodegas?.find(b=>b.unidad_id===u?.id);
  const gastosM=gastos.filter(g=>g.month===mes);
  const totalSqm=unidades.reduce((s,x)=>s+(x.sqm||0),0);
  const gc=u?.monthly_fee||0;
  const pf=multas.filter(f=>f.unidad_id===r?.unidad_id&&f.status==='pendiente'&&f.month===mes);
  const finesAmt=pf.reduce((s,f)=>s+f.amount,0);
  const pagado=pagos.find(p=>p.unidad_id===r?.unidad_id&&p.month===mes);
  const pct=totalSqm>0&&u?.sqm?((u.sqm/totalSqm)*100).toFixed(2):'—';
  const totalEgresos=gastosM.reduce((s,g)=>s+g.amount,0);
  const totalIngresos=pagos.filter(p=>p.month===mes).reduce((s,p)=>s+p.amount,0);
  const saldoCaja=totalIngresos-totalEgresos;
  return`<div class="modal-overlay" id="modalOverlay"><div class="modal modal-lg" style="max-width:680px;max-height:95vh;overflow-y:auto">
    <div class="modal-header">
      <span class="modal-title">📄 Liquidación — ${r?.nombre||''}</span>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm btn-primary" onclick="window.print()">🖨 Imprimir</button>
        <button class="close-btn" onclick="setState({modal:null})">×</button>
      </div>
    </div>

      <!-- Header -->
      <div class="liq-gc-header">
        <div class="liq-gc-header-left">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
            ${LOGO_SVG.replace('viewBox','style="width:32px;height:32px" viewBox')}
            <div>
              <h2 style="font-size:15px;font-weight:900;color:#F8FAFC;margin:0">LIQUIDACIÓN DE GASTOS COMUNES</h2>
              <p style="font-size:10px;color:#94A3B8;margin:0">Período: ${mes}</p>
            </div>
          </div>
          <div style="font-size:12px;font-weight:700;color:#F8FAFC">${com?.nombre||''}</div>
          <div style="font-size:10px;color:#94A3B8">${com?.direccion||''} ${com?.ciudad?'· '+com.ciudad:''}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:9px;color:#E6B800;font-weight:600">Fecha de emisión</div>
          <div style="font-size:12px;font-weight:700;color:#fff">${new Date().toLocaleDateString('es-CL')}</div>
        </div>
      </div>
      <div class="liq-gc-body">
        <!-- Datos residente -->
        <div class="liq-gc-info-grid" style="margin-bottom:14px">
          <div class="liq-gc-info-cell"><div class="liq-gc-info-label">Residente</div><div class="liq-gc-info-val">${r?.nombre||'—'}</div></div>
          <div class="liq-gc-info-cell"><div class="liq-gc-info-label">RUT</div><div class="liq-gc-info-val">${r?.rut||'—'}</div></div>
          <div class="liq-gc-info-cell"><div class="liq-gc-info-label">Unidad</div><div class="liq-gc-info-val">Depto ${u?.numero||'—'} · Piso ${u?.piso||'—'}</div></div>
          <div class="liq-gc-info-cell"><div class="liq-gc-info-label">Prorrateo</div><div class="liq-gc-info-val">${pct}%</div></div>
          ${estac?`<div class="liq-gc-info-cell"><div class="liq-gc-info-label">Estacionamiento</div><div class="liq-gc-info-val">${estac.numero}</div></div>`:''}
          ${bod?`<div class="liq-gc-info-cell"><div class="liq-gc-info-label">Bodega</div><div class="liq-gc-info-val">${bod.numero}</div></div>`:''}
          <div class="liq-gc-info-cell"><div class="liq-gc-info-label">Mes de cobro</div><div class="liq-gc-info-val">${mes}</div></div>
          <div class="liq-gc-info-cell"><div class="liq-gc-info-label">Estado</div><div class="liq-gc-info-val">${pagado?'✅ Pagado':'⚠️ Pendiente'}</div></div>
        </div>
        <!-- Total destacado -->
        <div class="liq-gc-destacado">
          <div><div class="liq-gc-destacado-label">TOTAL A PAGAR</div><div style="font-size:10px;color:#0F172A;opacity:.7">GC + multas del período</div></div>
          <div class="liq-gc-destacado-val">${gc?fmt(gc+finesAmt):'Sin GC definido'}</div>
        </div>
        <!-- Detalle cobros -->
        <div class="liq-gc-section">
          <div class="liq-gc-section-title">DETALLE DE COBROS</div>
          <table class="liq-gc-table">
            <tbody>
              <tr><td>Gasto común mensual</td><td style="text-align:right;font-weight:700">${gc?fmt(gc):'Sin definir'}</td></tr>
              ${pf.map(f=>`<tr style="background:#fef2f2"><td>Multa: ${f.reason}</td><td style="text-align:right;font-weight:700;color:var(--red)">${fmt(f.amount)}</td></tr>`).join('')}

          <div class="liq-gc-saldo-card"><div class="liq-gc-saldo-label">Total ingresos</div><div class="liq-gc-saldo-val" style="color:var(--green)">${fmt(totalIngresos)}</div></div>
          <div class="liq-gc-saldo-card"><div class="liq-gc-saldo-label">Total egresos</div><div class="liq-gc-saldo-val" style="color:var(--red)">${fmt(totalEgresos)}</div></div>
          <div class="liq-gc-saldo-card"><div class="liq-gc-saldo-label">Saldo en caja</div><div class="liq-gc-saldo-val" style="color:${saldoCaja>=0?'var(--green)':'var(--red)'}">${fmt(saldoCaja)}</div></div>
        </div>
        <div class="liq-gc-obs">
          Estimado/a <b>${r?.nombre||''}</b>, se adjunta la liquidación de gastos comunes correspondiente al período <b>${mes}</b>.<br>

          ${com?.nombre||''} · Emitido por <b>Vecinoo</b> · vecinoo.cl

function buildInventarioModal(comunidadId, comNombre){

          ${bodega?`<span class="badge badge-amber">📦 ${bodega.numero}</span>`:'<span style="font-size:11px;color:#9ca3af">Sin bodega</span>'}
