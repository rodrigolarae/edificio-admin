// Ficha histórica de residente
function buildFichaResidente(residenteId){
  const r=state.comunidadData.residentes.find(x=>x.id===residenteId);
  if(!r)return'';
  const u=state.comunidadData.unidades.find(x=>x.id===r.unidad_id);
  const misPagos=state.comunidadData.pagos.filter(p=>p.usuario_id===residenteId).sort((a,b)=>b.month.localeCompare(a.month));
  const mesesPagados=new Set(misPagos.map(p=>p.month));
  const deuda=calcDeudaAcumulada(r.unidad_id);
  const multas=state.comunidadData.multas.filter(f=>f.unidad_id===r.unidad_id);
  const totalPagado=misPagos.reduce((s,p)=>s+p.amount,0);

  // Generar grilla de últimos 12 meses
  const grilla=[];
  for(let i=11;i>=0;i--){
    const d=new Date(); d.setMonth(d.getMonth()-i);
    const mes=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const pago=misPagos.find(p=>p.month===mes);
    grilla.push({mes, pago, pagado:mesesPagados.has(mes)});
  }

  return`
  <div style="background:#f8fafc;border-radius:8px;padding:14px;margin-bottom:14px;border-left:4px solid var(--navy)">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-weight:800;font-size:15px">${r.nombre}</div>
        <div style="font-size:12px;color:#6b7280">${r.rut||''} ${r.email?'· '+r.email:''}</div>
        <div style="font-size:12px;color:#6b7280">Depto ${u?.numero||'—'} · Piso ${u?.piso||'—'} · GC: ${u?.monthly_fee?fmt(u.monthly_fee):'Sin definir'}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:#6b7280">Total pagado histórico</div>
        <div style="font-size:18px;font-weight:800;color:var(--green)">${fmt(totalPagado)}</div>
        ${deuda.totalDeuda>0?`<div style="font-size:13px;font-weight:700;color:var(--red)">Deuda: ${fmt(deuda.totalDeuda)}</div>`:''}
      </div>
    </div>
  </div>

  <!-- Grilla últimos 12 meses -->
  <div style="margin-bottom:14px">
    <div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:8px;text-transform:uppercase">Últimos 12 meses</div>
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px">
      ${grilla.map(g=>`<div style="background:${g.pagado?'#f0fdf4':'#fff1f2'};border:1px solid ${g.pagado?'#a7f3d0':'#fca5a5'};border-radius:6px;padding:6px;text-align:center">
        <div style="font-size:9px;color:#6b7280">${g.mes.slice(5)}</div>
        <div style="font-size:12px">${g.pagado?'✅':'❌'}</div>
        ${g.pago?`<div style="font-size:9px;font-weight:600;color:#065f46">${fmt(g.pago.amount).replace('$','')}</div>`:''}
      </div>`).join('')}
    </div>
  </div>

  <!-- Tabla de pagos -->
  <div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:6px;text-transform:uppercase">Historial de pagos</div>
  ${misPagos.length===0
    ?'<div style="font-size:12px;color:#9ca3af;padding:8px">Sin pagos registrados</div>'
    :`<table style="margin-bottom:14px"><thead><tr><th>Mes</th><th>Monto</th><th>Método</th><th>Fecha</th><th></th></tr></thead>
    <tbody>${misPagos.map(p=>`<tr>
      <td style="font-weight:600">${p.month}</td>
      <td class="green" style="font-weight:700">${fmt(p.amount)}</td>
      <td><span class="badge badge-blue">${p.method}</span></td>
      <td>${fmtD(p.date)}</td>
      <td><button class="btn btn-sm btn-primary" onclick="viewReceipt('${p.id}')">⬇</button></td>
    </tr>`).join('')}</tbody></table>`}

  <!-- Deuda acumulada -->
  ${deuda.mesesDeuda.length>0?`
  <div style="background:#fff1f2;border:1px solid #fca5a5;border-radius:8px;padding:12px;margin-bottom:14px">
    <div style="font-weight:700;color:#991b1b;margin-bottom:8px">⚠️ Meses sin pagar (${deuda.mesesSinPagar})</div>
    <table><thead><tr><th>Mes</th><th>GC</th><th>Multas</th><th>Total</th></tr></thead>
    <tbody>${deuda.mesesDeuda.map(m=>`<tr>
      <td style="font-weight:600">${m.mes}</td>
      <td>${fmt(m.gc)}</td>
      <td class="red">${m.multas>0?fmt(m.multas):'—'}</td>
      <td style="font-weight:700;color:var(--red)">${fmt(m.total)}</td>
    </tr>`).join('')}
    <tr style="font-weight:800;border-top:2px solid #fca5a5">
      <td colspan="3">DEUDA TOTAL</td>
      <td style="color:var(--red)">${fmt(deuda.totalDeuda)}</td>
    </tr></tbody></table>
  </div>`:''}

  <!-- Multas -->
  ${multas.length>0?`
  <div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:6px;text-transform:uppercase">Multas</div>
  <table><thead><tr><th>Mes</th><th>Motivo</th><th>Monto</th><th>Estado</th></tr></thead>
  <tbody>${multas.map(f=>`<tr>
    <td>${f.month}</td>
    <td>${f.reason}</td>
    <td style="font-weight:700">${fmt(f.amount)}</td>
    <td><span class="badge ${f.status==='pagada'?'badge-green':'badge-red'}">${f.status}</span></td>
  </tr>`).join('')}</tbody></table>`:''}`;
}

// ── Exportaciones CSV / JSON ──
window.exportarCSV = () => {
  const{pagos,residentes,unidades,gastos}=state.comunidadData;
  const sel=state.reportMonth;
  const mp=pagos.filter(p=>p.month===sel);
  let csv='Tipo,Mes,Depto,Residente,Monto,Método,Fecha\n';
  mp.forEach(p=>{
    const r=residentes.find(x=>x.id===p.usuario_id);
    const u=unidades.find(x=>x.id===p.unidad_id);
    csv+=`Ingreso,${p.month},${u?.numero||''},${r?.nombre||''},${p.amount},${p.method},${p.date}\n`;
  });
  const me=gastos.filter(g=>g.month===sel);
  me.forEach(g=>{ csv+=`Gasto,${g.month},,${g.label},${g.amount},,${g.date}\n`; });
  _downloadFile(`reporte_${sel}.csv`, csv, 'text/csv');
  showAlert('✅ CSV descargado');
};

window.exportarCSVAnual = () => {
  const anoActual=new Date().getFullYear();
  let csv='Mes,Ingresos,Egresos,Saldo\n';
  for(let i=1;i<=12;i++){
    const m=`${anoActual}-${String(i).padStart(2,'0')}`;
    const{totalIn,totalOut}=getMetrics(m);
    csv+=`${m},${totalIn},${totalOut},${totalIn-totalOut}\n`;
  }
  _downloadFile(`resumen_anual_${anoActual}.csv`, csv, 'text/csv');
  showAlert('✅ Resumen anual descargado');
};

window.exportarMorososCSV = () => {
  const{unidades,residentes,pagos,multas}=state.comunidadData;
  const com=state.selectedComunidad;
  const occupied=unidades.filter(u=>residentes.some(r=>r.unidad_id===u.id));
  let csv=`Comunidad: ${com?.nombre||''}\nFecha: ${new Date().toLocaleDateString('es-CL')}\n\n`;
  csv+='Depto,Piso,Residente,RUT,Meses sin pagar,Deuda total GC,Multas pendientes,DEUDA TOTAL\n';
  occupied.forEach(u=>{
    const r=residentes.find(x=>x.unidad_id===u.id);
    const deuda=calcDeudaAcumulada(u.id);
    if(deuda.totalDeuda===0)return;
    const multasPend=multas.filter(f=>f.unidad_id===u.id&&f.status==='pendiente').reduce((s,f)=>s+f.amount,0);
    csv+=`${u.numero},${u.piso},${r?.nombre||''},${r?.rut||''},${deuda.mesesSinPagar},${deuda.mesesDeuda.reduce((s,m)=>s+m.gc,0)},${multasPend},${deuda.totalDeuda}\n`;
  });
  _downloadFile(`morosos_${today()}.csv`, csv, 'text/csv');
  showAlert('✅ Nómina de morosos descargada');
};

window.exportarBackupJSON = () => {
  const backup={
    exportado: new Date().toISOString(),
    comunidad: state.selectedComunidad,
    datos: state.comunidadData,
  };
  _downloadFile(`backup_vecinoo_${today()}.json`, JSON.stringify(backup, null, 2), 'application/json');
  showAlert('✅ Backup JSON descargado');
};

function _downloadFile(nombre, contenido, tipo){
  const blob=new Blob([contenido],{type:tipo});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=nombre; a.click();
  URL.revokeObjectURL(url);
}

function buildVotaciones(){
  const{votaciones,votos,residentes}=state.comunidadData;
  const full=isFullAccess();
  const userId=state.currentUser?.id;
  const activas=votaciones.filter(v=>v.estado==='activa');
  const cerradas=votaciones.filter(v=>v.estado==='cerrada');

  function buildCard(v,readonly=false){
    let opciones=v.opciones||[];
    if(typeof opciones==='string'){try{opciones=JSON.parse(opciones);}catch(e){opciones=[];}}
    if(!Array.isArray(opciones))opciones=[];
    const votosDev=votos.filter(x=>x.votacion_id===v.id);
    const miVoto=votos.find(x=>x.votacion_id===v.id&&x.usuario_id===userId);
    const yaVote=!!miVoto;
    const totalVotos=votosDev.length;
    const mostrar=yaVote||readonly;
    return`<div class="votacion-card">
      <div class="votacion-header">
        <div>
          <div style="font-weight:700;font-size:14px">${v.titulo}</div>
          ${v.descripcion?`<div style="font-size:12px;color:#6b7280;margin-top:3px">${v.descripcion}</div>`:''}
          <div style="font-size:10px;color:#9ca3af;margin-top:5px">Cierre: ${fmtD(v.fecha_cierre)} · ${totalVotos} votos</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
          <span class="badge ${v.estado==='activa'?'badge-green':'badge-gray'}">${v.estado==='activa'?'✓ Activa':'Cerrada'}</span>
          ${yaVote?`<span class="badge badge-gold">✓ Ya votaste</span>`:''}
          ${full&&v.estado==='activa'?`<button class="btn btn-sm btn-danger" onclick="cerrarVotacion('${v.id}')">Cerrar</button>`:''}
          ${full&&v.estado==='cerrada'?`<button class="btn btn-sm btn-primary" onclick="generarActaVotacion('${v.id}')">📄 Generar Acta</button>`:''}
          ${full?`<button class="btn btn-sm" style="background:#fee2e2;color:#991b1b;border-color:#fca5a5" onclick="deleteVotacion('${v.id}')">🗑</button>`:''}
        </div>
      </div>
      ${mostrar?opciones.map(op=>{
        const n=votosDev.filter(x=>x.opcion_elegida===op).length;
        const pct=totalVotos>0?Math.round(n/totalVotos*100):0;
        const esMiVoto=miVoto?.opcion_elegida===op;
        return`<div class="resultado-row">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span style="font-weight:${esMiVoto?'700':'400'}">${esMiVoto?'✓ ':''} ${op}</span>
            <span style="font-weight:700">${n} votos · ${pct}%</span>
          </div>
          <div class="voto-bar"><div class="voto-fill" style="width:${pct}%;background:${esMiVoto?'var(--green)':'var(--navy)'}"></div></div>
        </div>`;
      }).join(''):`<div style="margin-top:8px">
        ${opciones.map(op=>`<div class="opcion-voto" onclick="emitirVoto('${v.id}','${op}')"><span>${op}</span><span style="font-size:11px;color:#6b7280">Votar →</span></div>`).join('')}
        <p style="font-size:10px;color:#9ca3af;margin-top:8px">Voto anónimo · Solo una vez</p>
      </div>`}
      ${(yaVote||readonly)&&totalVotos>0?`<div class="acta-box"><div style="font-size:12px;color:#6b7280">Total: <b>${totalVotos}</b> de <b>${residentes.length}</b> · Participación: <b>${Math.round(totalVotos/Math.max(residentes.length,1)*100)}%</b></div></div>`:''}
    </div>`;
  }

  return`
  <div class="page-header">
    <div><h2>Votaciones</h2><p>${activas.length} activas · ${cerradas.length} cerradas</p></div>
    ${full?`<button class="btn btn-gold" id="btnAddVotacion">🗳️ Nueva votación</button>`:''}
  </div>
  ${full?`<div id="votacionForm" style="display:none" class="card">
    <div class="form-group"><label class="form-label">Título *</label><input class="form-control" id="vTitulo"></div>
    <div class="form-group"><label class="form-label">Descripción</label><textarea class="form-control" id="vDesc" rows="2"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Fecha inicio</label><input class="form-control" id="vInicio" type="date" value="${today()}"></div>
      <div class="form-group"><label class="form-label">Fecha cierre *</label><input class="form-control" id="vCierre" type="date"></div>
    </div>
    <div class="section-div">Opciones</div>
    <div id="opcionesContainer">
      <div class="form-row" style="margin-bottom:8px">
        <input class="form-control opcion-input" placeholder="Opción 1 (ej: A favor)">
        <input class="form-control opcion-input" placeholder="Opción 2 (ej: En contra)">
      </div>
    </div>
    <button class="btn btn-sm" id="btnAddOpcion" style="margin-bottom:12px">+ Agregar opción</button>
    <div style="display:flex;gap:8px">
      <button class="btn btn-gold" id="btnSaveVotacion">Publicar votación</button>
      <button class="btn" id="btnCancelVotacion">Cancelar</button>
    </div>
  </div>`:''}
  ${activas.length>0?`<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:8px">Activas</div>${activas.map(v=>buildCard(v,false)).join('')}</div>`:''}
  ${cerradas.length>0?`<div><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:8px">Cerradas</div>${cerradas.map(v=>buildCard(v,true)).join('')}</div>`:''}
  ${activas.length===0&&cerradas.length===0?`<div class="card"><div class="empty">Sin votaciones</div></div>`:''}`;
}

          ${full&&a.status==='activa'?`<button class="btn btn-sm btn-success" onclick="resolveAlert('${a.id}')">Resolver</button>`:''}
        </div>
      </div>
    </div>`;
  }).join('')}`;
}

function buildInventarioModal(comunidadId, comNombre){
  // Cargar datos en tiempo real
  const{unidades,estacionamientos,bodegas}=state.comunidadData;
  const estLibres=estacionamientos?.filter(e=>!e.unidad_id)||[];
  const bodLibres=bodegas?.filter(b=>!b.unidad_id)||[];
  return`<div class="modal-overlay" id="modalOverlay"><div class="modal modal-lg">

      <span class="badge badge-amber">📦 ${bodegas?.length||0} bodegas (${bodLibres.length} libres)</span>
    </div>
    <div style="max-height:60vh;overflow-y:auto">
      ${unidades.map(u=>{
        const estac=estacionamientos?.find(e=>e.unidad_id===u.id);
        const bodega=bodegas?.find(b=>b.unidad_id===u.id);
        const res=state.comunidadData.residentes.find(r=>r.unidad_id===u.id);
        return`<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #f3f4f6;flex-wrap:wrap">
          <span style="font-weight:700;min-width:80px">Depto ${u.numero}</span>
          <span style="font-size:11px;color:#6b7280;min-width:40px">P${u.piso}</span>
          ${res?`<span class="badge badge-green">${res.nombre}</span>`:'<span class="badge badge-gray">Libre</span>'}
          ${u.monthly_fee?`<span class="badge badge-blue">${fmt(u.monthly_fee)}</span>`:'<span style="font-size:11px;color:#9ca3af">Sin GC</span>'}
          ${estac?`<span class="badge badge-blue">🅿️ ${estac.numero}</span>`:'<span style="font-size:11px;color:#9ca3af">Sin estac.</span>'}
          ${bodega?`<span class="badge badge-amber">📦 ${bodega.numero}</span>`:'<span style="font-size:11px;color:#9ca3af">Sin bodega</span>'}
          <button class="btn btn-sm" onclick="setState({modal:{type:'edit_unit',unit:${JSON.stringify(u).replace(/"/g,'&quot;')}}})">✏️</button>
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-sm btn-primary" id="btnAddUnitModal">+ Agregar depto</button>

  </div></div>`;

function attachEvents(){
  document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>{
    const v=btn.dataset.view;
    setState({view:v});
    limpiarBadgeNav(v);
  }));

  // Auto-focus en campos de login según paso activo
  setTimeout(()=>{
    const rutInput = document.getElementById('rutInput');
    const claveInput = document.getElementById('claveInput');
    const superClave = document.getElementById('superClave');
    if(rutInput && state.loginStep === 1) rutInput.focus();
    if(claveInput && state.loginStep === 2) claveInput.focus();
    if(superClave && state.loginStep === 3) superClave.focus();
  }, 50);

  // Unidades
  document.getElementById('btnAddUnit')?.addEventListener('click',()=>toggleForm('unitForm'));
  document.getElementById('btnCancelUnit')?.addEventListener('click',()=>toggleForm('unitForm',false));
  document.getElementById('btnSaveUnit')?.addEventListener('click',async()=>{
    const number=document.getElementById('uNumber').value.trim();
    const floor=document.getElementById('uFloor').value;
    const sqm=document.getElementById('uSqm').value;
    const personas=document.getElementById('uPersonas')?.value||null;
    if(!number||!floor){showAlert('Completa N° depto y piso','error');return;}
    const{data,error}=await sb.from('unidades').insert({
      comunidad_id:state.selectedComunidad.id,numero:number,piso:parseInt(floor),
      sqm:sqm?parseFloat(sqm):null,monthly_fee:null,
      personas_hogar:personas?parseInt(personas):null
    }).select();
    if(error){showAlert('Error: '+error.message,'error');return;}
    auditLog('UNIDAD_CREADA',`Depto ${data[0].numero} · P${data[0].piso} · ${data[0].sqm||'?'}m²`,{referencia_id:data[0].id,tabla:'unidades'});
    setState({comunidadData:{...state.comunidadData,unidades:[...state.comunidadData.unidades,...data]}});
    showAlert('✓ Departamento agregado');
  });

  // Residentes
  document.getElementById('btnAddResident')?.addEventListener('click',()=>toggleForm('residentForm'));
  document.getElementById('btnCancelResident')?.addEventListener('click',()=>toggleForm('residentForm',false));
  document.getElementById('btnSaveResident')?.addEventListener('click',async()=>{
    const nombre=document.getElementById('rName').value.trim();
    const unitId=document.getElementById('rUnit').value;
    const clave=document.getElementById('rClave').value.trim();
    const rol=document.getElementById('rRole').value;
    if(!nombre||!unitId||!clave){showAlert('Completa campos obligatorios','error');return;}
    // Validaciones de formato
    const rutInput=document.getElementById('rRut').value?.trim();
    const emailInput=document.getElementById('rEmail').value?.trim();
    if(rutInput&&!validarRUT(rutInput)){showAlert('RUT inválido — verifica el dígito verificador','error');return;}
    if(emailInput&&!validarEmail(emailInput)){showAlert('Email inválido — verifica el formato','error');return;}
    const{data,error}=await sb.from('usuarios').insert({
      comunidad_id:state.selectedComunidad.id,
      unidad_id:unitId,
      nombre,
      email:document.getElementById('rEmail').value,
      rut:document.getElementById('rRut').value,
      phone:document.getElementById('rPhone').value,
      rol,
      clave,
      activo:true
    }).select();
    if(error){showAlert('Error: '+error.message,'error');return;}
    const _uNew=state.comunidadData.unidades.find(u=>u.id===data[0].unidad_id);
    auditLog('RESIDENTE_CREADO',`${data[0].nombre} · Depto ${_uNew?.numero||'—'} · Rol: ${data[0].rol}`,{referencia_id:data[0].id,tabla:'usuarios'});
    setState({comunidadData:{...state.comunidadData,residentes:[...state.comunidadData.residentes,...data]}});
    showAlert('Residente registrado');
    // Email de bienvenida
    const unidadNueva = state.comunidadData.unidades.find(x=>x.id===unitId);
    emailBienvenida(data[0], unidadNueva, clave, state.selectedComunidad);
  });

  // Pagos
  document.getElementById('btnAddPayment')?.addEventListener('click',()=>toggleForm('paymentForm'));
  document.getElementById('btnCancelPayment')?.addEventListener('click',()=>toggleForm('paymentForm',false));
  document.getElementById('btnSavePayment')?.addEventListener('click',async(e)=>{
    const btn=e.currentTarget; if(btn.disabled)return; btn.disabled=true; btn.textContent='Procesando...';
    const userId=document.getElementById('pResident').value;
    const amount=document.getElementById('pAmount').value;
    const date=document.getElementById('pDate').value;
    const method=document.getElementById('pMethod').value;
    if(!userId||!amount||!date){showAlert('Completa campos','error');btn.disabled=false;btn.textContent='✓ Registrar y emitir comprobante';return;}
    const r=state.comunidadData.residentes.find(x=>x.id===userId);
    const curM=date.substr(0,7);
    // Verificar pago duplicado
    const yaExiste=state.comunidadData.pagos.some(p=>p.usuario_id===userId&&p.month===curM);
    if(yaExiste){if(!confirm(`⚠ Ya existe un pago de ${r?.nombre} para ${curM}. ¿Registrar de todas formas?`)){btn.disabled=false;btn.textContent='✓ Registrar y emitir comprobante';return;}}
    const pf=getPendingFines(r?.unidad_id,curM);
    const finesAmt=pf.reduce((s,f)=>s+f.amount,0);
    const{data,error}=await sb.from('pagos').insert({comunidad_id:state.selectedComunidad.id,unidad_id:r?.unidad_id,usuario_id:userId,amount:parseInt(amount),base_amount:parseInt(amount)-finesAmt,date,method,month:curM,registrado_por:state.currentUser?.nombre||'Admin'}).select();
    if(error){showAlert('Error al registrar pago','error');btn.disabled=false;btn.textContent='✓ Registrar y emitir comprobante';return;}
    if(pf.length>0){await sb.from('multas').update({status:'pagada'}).in('id',pf.map(f=>f.id));const multas=state.comunidadData.multas.map(f=>pf.find(x=>x.id===f.id)?{...f,status:'pagada'}:f);setState({comunidadData:{...state.comunidadData,multas}});}
    const _rPago=state.comunidadData.residentes.find(x=>x.id===data[0].usuario_id);
  const _uPago=state.comunidadData.unidades.find(x=>x.id===data[0].unidad_id);
  auditLog('PAGO_REGISTRADO',`Depto ${_uPago?.numero||'—'} · ${_rPago?.nombre||'—'} · ${fmt(data[0].amount)} · ${data[0].method}`,{referencia_id:data[0].id,tabla:'pagos'});
  setState({comunidadData:{...state.comunidadData,pagos:[...data,...state.comunidadData.pagos]},modal:{type:'receipt',payment:data[0]}});
    const residentePago=state.comunidadData.residentes.find(x=>x.id===userId);
    const unidadPago=state.comunidadData.unidades.find(x=>x.id===r?.unidad_id);
    emailComprobantePago(data[0],residentePago,unidadPago,state.selectedComunidad);
    btn.disabled=false;btn.textContent='✓ Registrar y emitir comprobante';
  });

  // Multas
  document.getElementById('btnAddFine')?.addEventListener('click',()=>toggleForm('fineForm'));
  document.getElementById('btnCancelFine')?.addEventListener('click',()=>toggleForm('fineForm',false));
  document.getElementById('btnSaveFine')?.addEventListener('click',async()=>{
    const sel=document.getElementById('fResident').value;
    const amount=document.getElementById('fAmount').value;
    const reason=document.getElementById('fReason').value.trim();
    const date=document.getElementById('fDate').value;
    const month=document.getElementById('fMonth').value;
    if(!sel||!amount||!reason){showAlert('Completa campos','error');return;}
    const[userId,unitId]=sel.split('|');
    const{data,error}=await sb.from('multas').insert({comunidad_id:state.selectedComunidad.id,unidad_id:unitId,usuario_id:userId,amount:parseInt(amount),reason,date,month,status:'pendiente'}).select();
    if(error){showAlert('Error','error');return;}
    const _uMul=state.comunidadData.unidades.find(u=>u.id===data[0].unidad_id);
    const _rMul=state.comunidadData.residentes.find(r=>r.id===data[0].usuario_id);
    auditLog('MULTA_APLICADA',`Depto ${_uMul?.numero||'—'} · ${_rMul?.nombre||'—'} · ${fmt(data[0].amount)} · Motivo: ${data[0].reason}`,{referencia_id:data[0].id,tabla:'multas'});
    setState({comunidadData:{...state.comunidadData,multas:[...data,...state.comunidadData.multas]}});
    showAlert('Multa aplicada');
    notifLocal('Nueva multa aplicada',`Se ha registrado una multa de ${fmt(parseInt(document.getElementById('fAmount')?.value)||0)}.`,'⚠️');
    // Email multa
    const[multaUserId]=sel.split('|');
    const residenteMulta = state.comunidadData.residentes.find(x=>x.id===multaUserId);
    emailMulta(data[0], residenteMulta, state.selectedComunidad);
  });

  // Trabajadores
  document.getElementById('btnAddWorker')?.addEventListener('click',()=>toggleForm('workerForm'));
  document.getElementById('btnCancelWorker')?.addEventListener('click',()=>toggleForm('workerForm',false));
  document.getElementById('btnSaveWorker')?.addEventListener('click',async()=>{
    const nombre=document.getElementById('wName').value.trim();
    const rut=document.getElementById('wRut').value.trim();
    const rol=document.getElementById('wRole').value.trim();
    const tipo=document.getElementById('wType').value;
    const gross_salary=parseInt(document.getElementById('wSalary').value)||0;
    const start_date=document.getElementById('wStart').value;
    if(!nombre||!rut||!rol){showAlert('Completa campos','error');return;}
    const afp_type=tipo==='contrato'?document.getElementById('wAfp').value:'';
    const health_type=tipo==='contrato'?document.getElementById('wHealth').value:'';
    const{data,error}=await sb.from('trabajadores').insert({comunidad_id:state.selectedComunidad.id,nombre,rut,rol,tipo,gross_salary,start_date,afp_type,health_type,health_amount:health_type==='Isapre'?parseInt(document.getElementById('wIsapreAmt')?.value||0):0,activo:true}).select();
    if(error){showAlert('Error','error');return;}
    auditLog('TRABAJADOR_CREADO',`${data[0].nombre} · ${data[0].rol} · ${data[0].tipo}`,{referencia_id:data[0].id,tabla:'trabajadores'});
    setState({comunidadData:{...state.comunidadData,trabajadores:[...state.comunidadData.trabajadores,...data]}});showAlert('Trabajador agregado');
  });

  // Votaciones
  document.getElementById('btnAddVotacion')?.addEventListener('click',()=>toggleForm('votacionForm'));
  document.getElementById('btnCancelVotacion')?.addEventListener('click',()=>toggleForm('votacionForm',false));
  document.getElementById('btnAddOpcion')?.addEventListener('click',()=>{
    const c=document.getElementById('opcionesContainer');if(!c)return;
    const d=document.createElement('div');d.style.marginBottom='8px';
    d.innerHTML=`<input class="form-control opcion-input" placeholder="Nueva opción">`;
    c.appendChild(d);
  });
  document.getElementById('btnSaveVotacion')?.addEventListener('click',async()=>{
    const titulo=document.getElementById('vTitulo').value.trim();
    const desc=document.getElementById('vDesc').value;
    const inicio=document.getElementById('vInicio').value;
    const cierre=document.getElementById('vCierre').value;
    const opciones=[...document.querySelectorAll('.opcion-input')].map(i=>i.value.trim()).filter(Boolean);
    if(!titulo||!cierre||opciones.length<2){showAlert('Completa título, fecha de cierre y al menos 2 opciones','error');return;}
    const{data,error}=await sb.from('votaciones').insert({comunidad_id:state.selectedComunidad.id,titulo,descripcion:desc,opciones:JSON.stringify(opciones),fecha_inicio:inicio||today(),fecha_cierre:cierre,estado:'activa',creada_por:state.currentUser?.nombre||'Admin'}).select();
    if(error){showAlert('Error','error');return;}
    setState({comunidadData:{...state.comunidadData,votaciones:[...data,...state.comunidadData.votaciones]}});
    showAlert('Votación publicada');toggleForm('votacionForm',false);
    notifLocal('Nueva votación activa',`"${document.getElementById('vTitulo')?.value||'Votación'}" ya está disponible.`,'🗳️');
    // Email a todos los residentes
    emailNuevaVotacion(data[0], state.comunidadData.residentes, state.selectedComunidad);
  });

  // Alertas
  document.getElementById('btnAddAlert')?.addEventListener('click',()=>toggleForm('alertForm'));
  document.getElementById('btnCancelAlert')?.addEventListener('click',()=>toggleForm('alertForm',false));
  document.getElementById('btnSaveAlert')?.addEventListener('click',async()=>{
    const titulo=document.getElementById('aTitle').value.trim();
    const tipo=document.getElementById('aType').value;
    const descripcion=document.getElementById('aDesc').value;
    if(!titulo){showAlert('Ingresa un título','error');return;}
    const full=isFullAccess();
    const residentSel=full?document.getElementById('aResident')?.value:'';
    const usuario_id=residentSel||state.currentUser?.id||null;
    const unidad_id=usuario_id?state.comunidadData.residentes.find(r=>r.id===usuario_id)?.unidad_id:null;
    const{data,error}=await sb.from('alertas').insert({comunidad_id:state.selectedComunidad.id,tipo,titulo,descripcion,usuario_id,unidad_id,date:today(),time:new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}),status:'activa'}).select();
    if(error){showAlert('Error','error');return;}
    setState({comunidadData:{...state.comunidadData,alertas:[...data,...state.comunidadData.alertas]}});
    showAlert('Alerta enviada');
    // Email alerta — si es para todos (sin residente específico) envía a toda la comunidad
    const destAlerta = residentSel
      ? state.comunidadData.residentes.filter(r=>r.id===residentSel)
      : state.comunidadData.residentes;
    emailAlerta(data[0], destAlerta, state.selectedComunidad);
  });

  // Gastos
  document.getElementById('btnSaveExpense')?.addEventListener('click',async()=>{
    const amount=document.getElementById('eAmount')?.value;
    const date=document.getElementById('eDate')?.value;
    if(!amount||!date){showAlert('Completa campos','error');return;}
    const cat=EXPENSE_CATS.find(c=>c.id===state.selectedCat);
    const{data,error}=await sb.from('gastos').insert({comunidad_id:state.selectedComunidad.id,cat_id:cat.id,label:cat.label,icon:cat.icon,prorate:cat.prorate,amount:parseInt(amount),date,description:document.getElementById('eDesc')?.value||'',month:date.substr(0,7)}).select();
    if(error){showAlert('Error','error');return;}
    auditLog('GASTO_REGISTRADO',`${data[0].icon||''} ${data[0].label} · ${fmt(data[0].amount)} · ${data[0].description||''}`,{referencia_id:data[0].id,tabla:'gastos'});
    setState({comunidadData:{...state.comunidadData,gastos:[...data,...state.comunidadData.gastos]},selectedCat:null});showAlert('Gasto registrado');
  });

  // Cambiar clave
  document.getElementById('btnCambiarClave')?.addEventListener('click',async()=>{
    const actual=document.getElementById('pwActual').value;
    const nueva=document.getElementById('pwNueva').value;
    const confirm=document.getElementById('pwConfirm').value;
    if(!actual||!nueva||!confirm){showAlert('Completa todos los campos','error');return;}
    if(actual!==state.currentUser.clave){showAlert('La clave actual es incorrecta','error');return;}
    if(nueva.length<6){showAlert('La nueva clave debe tener al menos 6 caracteres','error');return;}
    if(nueva!==confirm){showAlert('Las claves no coinciden','error');return;}
    const{error}=await sb.from('usuarios').update({clave:nueva}).eq('id',state.currentUser.id);
    if(error){showAlert('Error','error');return;}
    setState({currentUser:{...state.currentUser,clave:nueva}});
    showAlert('Clave cambiada exitosamente ✓');
    ['pwActual','pwNueva','pwConfirm'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  });

  // Configuración
  document.getElementById('btnSaveSettings')?.addEventListener('click',async()=>{
    const nombre=document.getElementById('bName').value.trim();
    const ciudad=document.getElementById('bCity').value.trim();
    const direccion=document.getElementById('bAddr').value.trim();
    const gc_default=parseInt(document.getElementById('bGcDefault')?.value)||null;
    const fondo_reserva_pct=Math.min(50,Math.max(0,parseFloat(document.getElementById('bFondoPct')?.value)||0));
    const _oldSet=state.selectedComunidad||{};
    await sb.from('comunidades').update({nombre,ciudad,direccion,gc_default,fondo_reserva_pct}).eq('id',state.selectedComunidad.id);
    const _diffSet=changeDiff(_oldSet,{nombre,ciudad,direccion,gc_default,fondo_reserva_pct},[
      {key:'nombre',label:'Nombre'},{key:'ciudad',label:'Ciudad'},
      {key:'gc_default',label:'GC default',fmt:v=>fmt(Number(v)||0)},
      {key:'fondo_reserva_pct',label:'Fondo',fmt:v=>`${v}%`}
    ]);
    setState({selectedComunidad:{...state.selectedComunidad,nombre,ciudad,direccion,gc_default,fondo_reserva_pct}});
    if(_diffSet!=='Sin cambios')auditLog('CONFIG_GUARDADA',_diffSet,{tabla:'comunidades'});
    showAlert('Configuración guardada');
  });

  document.getElementById('reportMonth')?.addEventListener('change',function(){setState({reportMonth:this.value});});
  document.getElementById('modalOverlay')?.addEventListener('click',function(e){if(e.target===this)setState({modal:null});});
  attachPaymentResidenteEvent();

  // Botón agregar depto desde modal inventario
  document.getElementById('btnAddUnitModal')?.addEventListener('click',async()=>{
    const numero=prompt('N° del departamento:');

const CSV_COLS_COMPLETO=['depto','piso','metros_cuadrados','gc_mensual','estacionamiento','bodega','residente_nombre','residente_rut','residente_email','residente_telefono','residente_clave'];

// ── Descarga plantilla CSV ──

// ── Parser CSV puro (sin dependencias) ──
function parseCSVText(text){
  // Normalizar saltos de línea y quitar BOM
  text=text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const lines=text.trim().split('\n');
  if(lines.length<2)return{rows:[],headers:[]};
  const parseRow=line=>{
    const res=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(c===','&&!inQ){res.push(cur.trim());cur='';}
      else cur+=c;
    }
    res.push(cur.trim());
    return res;
  };
  const headers=parseRow(lines[0]).map(h=>h.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,''));
  const rows=[];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    const vals=parseRow(lines[i]);
    const obj={};
    headers.forEach((h,idx)=>obj[h]=vals[idx]??'');
    rows.push(obj);
  }
  return{rows,headers};
}

// ── Validar y normalizar filas ──
function validarFilasCSV(rows,headers){
  const errors=[];
  const tieneResidente=headers.some(h=>h.includes('residente')||h==='nombre'||h==='rut');
  const tieneUnidad=headers.includes('depto')||headers.includes('numero')||headers.includes('unidad');

  if(!tieneUnidad&&!tieneResidente){
    errors.push('No se encontraron columnas reconocidas. Usa la plantilla descargable.');
    return{valid:[],errors};
  }

  // Normalizar nombres de columna flexibles
  const col=(row,alts)=>{
    for(const a of alts){if(row[a]!==undefined&&row[a]!=='')return String(row[a]).trim();}
    return '';
  };

  const valid=[];
  rows.forEach((row,i)=>{
    const rowNum=i+2; // +2: encabezado es fila 1, datos desde fila 2
    const depto=col(row,['depto','numero','n_depto','departamento','unidad']);
    if(!depto){errors.push(`Fila ${rowNum}: número de depto vacío`);return;}

    const piso=col(row,['piso','floor','nivel']);
    const sqm=col(row,['metros_cuadrados','m2','sqm','superficie','metros']);
    const gc=col(row,['gc_mensual','gasto_comun','monthly_fee','gc','gastos_comunes']);
    const estac=col(row,['estacionamiento','parking','estac','estacionamiento_num']);
    const bod=col(row,['bodega','storage','bod','bodega_num']);
    const nombre=col(row,['residente_nombre','nombre','nombre_residente','propietario']);
    const rut=col(row,['residente_rut','rut','rut_residente']);
    const email=col(row,['residente_email','email','correo','email_residente']);
    const telefono=col(row,['residente_telefono','telefono','phone','tel','celular']);
    const clave=col(row,['residente_clave','clave','password','contrasena']);

    // Validaciones de formato
    if(gc&&isNaN(Number(String(gc).replace(/\./g,'').replace(/,/g,'')))){
      errors.push(`Fila ${rowNum} (depto ${depto}): GC mensual debe ser número`);
    }
    if(sqm&&isNaN(Number(sqm))){
      errors.push(`Fila ${rowNum} (depto ${depto}): m² debe ser número`);
    }

    valid.push({depto,piso:piso||'1',sqm:sqm||'',gc:gc||'0',estac,bod,nombre,rut,email,telefono,clave});
  });

  return{valid,errors};
}

// ── Manejo de archivo subido ──
window.handleCSVFile=async(input,context)=>{
  const file=input.files[0];
  if(!file)return;
  setState({_csvPreview:null,_csvErrors:[]});
  try{
    let text;
    if(file.name.endsWith('.csv')){
      text=await file.text();
    }else{
      // XLSX: usar SheetJS si está disponible, sino avisar
      if(typeof XLSX==='undefined'){
        setState({_csvErrors:['Para archivos Excel, instala el soporte XLSX o usa formato CSV. Guarda tu archivo como CSV desde Excel: Archivo → Guardar como → CSV UTF-8.']});
        return;
      }
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      text=XLSX.utils.sheet_to_csv(ws);
    }
    const{rows,headers}=parseCSVText(text);
    if(rows.length===0){setState({_csvErrors:['Archivo vacío o sin datos válidos']});return;}
    const{valid,errors}=validarFilasCSV(rows,headers);
    if(errors.length>0&&valid.length===0){
      setState({_csvErrors:errors});return;
    }
    setState({_csvPreview:valid,_csvErrors:errors});
  }catch(e){
    setState({_csvErrors:['Error al leer el archivo: '+e.message]});
  }
};

window.handleCSVDrop=async(event,context)=>{
  event.preventDefault();
  event.currentTarget.style.borderColor='#d1d5db';
  event.currentTarget.style.background='';
  const file=event.dataTransfer.files[0];
  if(!file)return;
  const input={files:[file],name:file.name};
  await window.handleCSVFile({files:[file],name:file.name},context);
};

window.abrirImportacionExistente=comunidadId=>{

window.aplicarCSVExistente=async comunidadId=>{
  const rows=state._csvPreview||[];
  if(!rows.length){showAlert('Primero carga un archivo CSV','error');return;}
  setState({loading:true});
  try{
    const{data:unidades}=await sb.from('unidades').select('id,numero').eq('comunidad_id',comunidadId);
    const unitMap={};
    (unidades||[]).forEach(u=>{unitMap[u.numero]=u.id;});

    let creadas=0,actualizadas=0,residentes_creados=0,errores=[];

    for(const row of rows){
      let unitId=unitMap[row.depto];

      // Crear unidad si no existe
      if(!unitId){
        const gcNum=Number(String(row.gc||'0').replace(/\./g,'').replace(/,/g,''))||0;
        const sqmNum=Number(row.sqm)||null;
        const{data:newUnit,error}=await sb.from('unidades').insert({
          comunidad_id:comunidadId,numero:row.depto,piso:parseInt(row.piso)||1,
          monthly_fee:gcNum,sqm:sqmNum
        }).select();
        if(error){errores.push(`Depto ${row.depto}: ${error.message}`);continue;}
        unitId=newUnit[0].id;
        unitMap[row.depto]=unitId;
        creadas++;

        // Crear estac si viene en el CSV
        if(row.estac){
          await sb.from('estacionamientos').upsert({comunidad_id:comunidadId,numero:row.estac,unidad_id:unitId},{onConflict:'comunidad_id,numero'});
        }
        if(row.bod){
          await sb.from('bodegas').upsert({comunidad_id:comunidadId,numero:row.bod,unidad_id:unitId},{onConflict:'comunidad_id,numero'});
        }
      }else{
        // Actualizar GC y m² si vienen en el CSV
        const updates={};
        if(row.gc)updates.monthly_fee=Number(String(row.gc).replace(/\./g,'').replace(/,/g,''))||0;
        if(row.sqm)updates.sqm=Number(row.sqm)||null;
        if(Object.keys(updates).length){
          await sb.from('unidades').update(updates).eq('id',unitId);
          actualizadas++;
        }
      }

      // Crear residente si viene en el CSV y la unidad no tiene uno
      if(row.nombre&&unitId){
        const{data:existing}=await sb.from('usuarios').select('id').eq('comunidad_id',comunidadId).eq('unidad_id',unitId).maybeSingle();
        if(!existing){
          const claveDefault=row.clave||(row.rut?row.rut.replace(/[^0-9kK]/g,''):'cambiar123');
          await sb.from('usuarios').insert({
            comunidad_id:comunidadId,unidad_id:unitId,
            nombre:row.nombre,rut:row.rut||null,
            email:row.email||null,phone:row.telefono||null,
            rol:'residente',clave:claveDefault,activo:true
          });
          residentes_creados++;
        }
      }
    }

    // Recargar datos de la comunidad
    const comunidadData=await loadComunidadData(comunidadId);
    setState({loading:false,comunidadData,modal:null,_csvPreview:null,_csvErrors:[]});
    showAlert(`✅ Importación completa: ${creadas} unidades nuevas, ${actualizadas} actualizadas, ${residentes_creados} residentes creados${errores.length>0?`. ⚠️ ${errores.length} errores.`:'.'}`, creadas>0||residentes_creados>0?'success':'error');
    if(errores.length)console.warn('CSV errores:',errores);
  }catch(e){
    setState({loading:false});
    showAlert('Error durante la importación: '+e.message,'error');
    console.error(e);
  }
};

window.wizardCrearComunidad=async()=>{
  const{datos,inventario,asignaciones}=state.wizard;
  setState({loading:true});
  // 1. Crear comunidad
  const{data:comData,error:comError}=await sb.from('comunidades').insert({
    nombre:datos.nombre,direccion:datos.direccion,ciudad:datos.ciudad,region:datos.region,
    codigo_acceso:datos.codigo,plan:datos.plan,monto_implementacion:datos.impl,
    monto_mantencion:datos.mant,notas:datos.notas,activa:true,fecha_inicio:today()
  }).select();
  if(comError){setState({loading:false});showAlert('Error: el código ya existe','error');return;}
  const comId=comData[0].id;
  // 2. Crear admin
  await sb.from('usuarios').insert({comunidad_id:comId,nombre:datos.adminNombre,email:datos.adminEmail,phone:datos.adminPhone,rol:'admin',clave:datos.adminClave,activo:true});
  // 3. Crear departamentos y mapear número → id
  const deptoMap={};
  for(const d of inventario.deptos){
    const gcNum=d.monthly_fee?Number(String(d.monthly_fee).replace(/\./g,'').replace(/,/g,''))||null:null;
    const sqmNum=d.sqm?Number(d.sqm)||null:null;
    const{data}=await sb.from('unidades').insert({comunidad_id:comId,numero:d.numero,piso:parseInt(d.piso)||1,monthly_fee:gcNum,sqm:sqmNum}).select();
    if(data&&data[0])deptoMap[d.numero]=data[0].id;
  }
  // 4. Crear estacionamientos y asignar
  for(const e of inventario.estacs){
    const depto=Object.keys(asignaciones).find(k=>(asignaciones[k].estacs||[]).includes(e.label));
    const unidad_id=depto?deptoMap[depto]:null;
    await sb.from('estacionamientos').insert({comunidad_id:comId,numero:e.label,unidad_id});
    if(unidad_id){await sb.from('unidades').update({parking:true,parking_num:e.label}).eq('id',unidad_id);}
  }
  // 5. Crear bodegas y asignar
  for(const b of inventario.bods){
    const depto=Object.keys(asignaciones).find(k=>(asignaciones[k].bods||[]).includes(b.label));
    const unidad_id=depto?deptoMap[depto]:null;
    await sb.from('bodegas').insert({comunidad_id:comId,numero:b.label,unidad_id});
    if(unidad_id){await sb.from('unidades').update({storage:true,storage_num:b.label}).eq('id',unidad_id);}
  }
  // 6. Crear residentes desde CSV si vinieron con la importación
  const residentes_csv=state.wizard.residentes_csv||[];
  for(const r of residentes_csv){
    const unitId=deptoMap[r.depto];
    if(!unitId)continue;
    const claveDefault=r.clave||(r.rut?r.rut.replace(/[^0-9kK]/g,''):'cambiar123');
    await sb.from('usuarios').insert({
      comunidad_id:comId,unidad_id:unitId,
      nombre:r.nombre,rut:r.rut||null,email:r.email||null,
      phone:r.telefono||null,rol:'residente',clave:claveDefault,activo:true
    });
  }
  const resMsg=residentes_csv.length>0?` y ${residentes_csv.length} residentes`:'';
  const comunidades=await loadAllComunidades();
  setState({loading:false,comunidades,view:'sa_dashboard',wizard:{step:1,datos:{},inventario:{deptos:[],estacs:[],bods:[]},asignaciones:{},residentes_csv:[]}});
  showAlert(`🎉 Comunidad "${datos.nombre}" creada con ${inventario.deptos.length} deptos${resMsg}`);
};

// ── Paso 2: Verificar clave ──
window.doLoginRut=async()=>{
  if(_checkLock('user'))return;
  const clave=(document.getElementById('claveInput')?.value||'').trim();
  if(!clave){showAlert('Ingresa tu contraseña','error');return;}
  await new Promise(r=>setTimeout(r,150+Math.random()*150));
  setState({loading:true});
  try{
    // Verificar clave contra cualquier match del RUT (misma clave en todas sus comunidades)
    const matches=state.loginRutMatches||[];
    const validUser=matches.find(u=>u.clave===clave);
    if(!validUser){
      setState({loading:false});
      _registerFail('user');
      showAlert('Contraseña incorrecta','error');
      return;
    }
    _clearFail('user');
    // Guardar hash SHA-256 en segundo plano
    _sha256(clave).then(async hash=>{
      try{ await sb.from('usuarios').update({clave_hash:hash}).eq('rut',state.loginRut).eq('activo',true); }catch(e){}
    });
    // Cargar todos los perfiles completos del RUT (uno por comunidad)
    const{data:usuarios}=await sb.from('usuarios')
      .select('id,nombre,rol,unidad_id,email,phone,rut,clave,comunidad_id')
      .eq('rut',state.loginRut).eq('activo',true).eq('clave',clave);
    if(!usuarios||usuarios.length===0){setState({loading:false});showAlert('Error al cargar perfil','error');return;}

    // Cargar comunidades de esos usuarios
    const comIds=[...new Set(usuarios.map(u=>u.comunidad_id))];
    const{data:coms}=await sb.from('comunidades').select('*').in('id',comIds);

    // Construir perfiles enriquecidos (usuario + su comunidad + sus unidades)
    const perfiles=usuarios.map(u=>({
      ...u,
      comunidad:(coms||[]).find(c=>c.id===u.comunidad_id)||null
    }));

    // Usar el primer perfil como usuario activo y cargar su comunidad
    const primerPerfil=perfiles[0];
    const comunidadData=await loadComunidadData(primerPerfil.comunidad_id);
    const full=primerPerfil.rol==='admin'||primerPerfil.rol==='presidente'||primerPerfil.rol==='tesorero';
    _resetSessionTimer();
    setState({
      loading:false,screen:'app',
      currentUser:primerPerfil,
      selectedComunidad:primerPerfil.comunidad,
      comunidadData,
      perfilesRut:perfiles, // todos los perfiles del RUT
      perfilActivo:0,       // índice del perfil actualmente activo
      view:full?'dashboard':'my_account'
    });
    setTimeout(()=>auditLog('SESION_INICIO',`${primerPerfil.nombre} ingresó como ${primerPerfil.rol}`),300);
    setTimeout(onAppReady,1500);
  }catch(e){setState({loading:false});showAlert('Error al conectar. Verifica tu internet.','error');console.error(e);}
};

// Guard global: bloquea escrituras a Supabase cuando isDemo=true
const _sbOriginalFrom = sb.from.bind(sb);
sb.from = function(table){
  const query = _sbOriginalFrom(table);
  if(!state.isDemo) return query;
  // En modo demo, interceptar insert/update/delete y devolver respuesta simulada
  const demoResponse = { data: [], error: null };
  return {
    ...query,
    insert: (data) => ({ select: () => Promise.resolve({ data: Array.isArray(data)?data:[data], error: null }), then: (r)=>r({data:Array.isArray(data)?data:[data],error:null}) }),
    update: (data) => ({ eq: () => ({ eq: () => Promise.resolve(demoResponse) }), then: (r)=>r(demoResponse) }),
    delete: () => ({ eq: () => Promise.resolve(demoResponse), in: () => Promise.resolve(demoResponse) }),
    upsert: () => Promise.resolve(demoResponse),
    select: query.select.bind(query),
    eq: query.eq.bind(query),
    order: query.order.bind(query),
  };
};

// ── Seguridad: rate limiting y bloqueo por intentos fallidos ──
const _loginAttempts={};
const _MAX_ATTEMPTS=5;
const _LOCK_MS=15*60*1000; // 15 minutos

function _getLockKey(scope){return`login_${scope}_${state.selectedComunidad?.id||'sa'}`;}

function _checkLock(scope){
  const key=_getLockKey(scope);
  const rec=_loginAttempts[key];
  if(!rec)return false;
  if(Date.now()<rec.until){
    const mins=Math.ceil((rec.until-Date.now())/60000);
    showAlert(`Demasiados intentos. Espera ${mins} min.`,'error');
    return true;
  }
  delete _loginAttempts[key];
  return false;
}

function _registerFail(scope){
  const key=_getLockKey(scope);
  if(!_loginAttempts[key])_loginAttempts[key]={count:0,until:0};
  _loginAttempts[key].count++;
  if(_loginAttempts[key].count>=_MAX_ATTEMPTS){
    _loginAttempts[key].until=Date.now()+_LOCK_MS;
    showAlert('Cuenta bloqueada 15 min por múltiples intentos fallidos.','error');
  }else{
    const left=_MAX_ATTEMPTS-_loginAttempts[key].count;
    showAlert(`Clave incorrecta. ${left} intento${left!==1?'s':''} restante${left!==1?'s':''}.`,'error');
  }
}

function _clearFail(scope){delete _loginAttempts[_getLockKey(scope)];}

// Hash SHA-256 del lado cliente (para comparar con hash almacenado en BD)
async function _sha256(text){
  const enc=new TextEncoder();
  const buf=await crypto.subtle.digest('SHA-256',enc.encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// Sanitiza texto para prevenir XSS al renderizar en innerHTML
// ── Validadores de inputs ──
function debounce(fn, ms=300){
  let timer;
  return function(...args){clearTimeout(timer);timer=setTimeout(()=>fn.apply(this,args),ms);};
}

function validarRUT(rut){
  if(!rut)return false;
  const clean=rut.replace(/[^0-9kK]/g,'').toUpperCase();
  if(clean.length<8)return false;
  const dv=clean.slice(-1);
  const body=clean.slice(0,-1);
  let sum=0;let mul=2;
  for(let i=body.length-1;i>=0;i--){sum+=parseInt(body[i])*mul;mul=mul===7?2:mul+1;}
  const exp=(11-sum%11)%11;
  const calc=exp===10?'K':exp===11?'0':String(exp);
  return calc===dv;
}
function validarEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email||'');
}
function validarMonto(v){
  const n=Number(String(v||'0').replace(/\./g,'').replace(/,/g,'.'));
  return !isNaN(n)&&n>=0;
}

function sanitize(str){
  if(str==null)return'';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

window.doSuperLogin=async()=>{
  if(_checkLock('sa'))return;
  const clave=document.getElementById('superClave')?.value?.trim();
  if(!clave)return;
  await new Promise(r=>setTimeout(r,150+Math.random()*150));
  setState({loading:true});
  try{
    const hash=await _sha256(clave);
    // Intentar primero con hash SHA-256 (seguro)
    let{data,error}=await sb.from('superadmin').select('id,nombre').eq('clave_hash',hash).maybeSingle();
    // Fallback: clave en texto plano (BD antigua sin migrar) — solo para transición
    if(!data&&!error){
      const res=await sb.from('superadmin').select('id,nombre').eq('clave',clave).maybeSingle();
      data=res.data; error=res.error;
      // Migrar automáticamente al hash si el login con texto plano funciona
      if(data){
        try{ await sb.from('superadmin').update({clave_hash:hash,clave:null}).eq('id',data.id); }catch(e){}
      }
    }
    setState({loading:false});
    if(error||!data){
      _registerFail('sa');
      showAlert('Clave incorrecta','error');
      return;
    }
    _clearFail('sa');
    const comunidades=await loadAllComunidades();
    _resetSessionTimer();

function predecirRiesgoMora(unitId) {
  const pagos = state.comunidadData.pagos.filter(p => p.unidad_id === unitId);
  if (pagos.length < 3) return { riesgo: "insuficiente", mensaje: "No hay historial suficiente", color: "gray" };
  const ultimos = pagos.sort((a,b) => b.month.localeCompare(a.month)).slice(0,6);
  const mesesUltimos = ultimos.map(p => p.month.slice(5));
  const mesesEsperados = [];
  const d = new Date();
  for (let i = 0; i < 6; i++) {
    const fecha = new Date(d.getFullYear(), d.getMonth() - i, 1);
    mesesEsperados.push(String(fecha.getMonth()+1).padStart(2,'0'));
  }
  let atrasos = 0;
  for (let i = 0; i < mesesEsperados.length; i++) if (!mesesUltimos.includes(mesesEsperados[i])) atrasos++;
  if (atrasos >= 3) return { riesgo: "alto", mensaje: "Ya acumula 3+ meses sin pagar", color: "red" };
  if (atrasos === 2) return { riesgo: "medio", mensaje: "Riesgo de caer en mora crónica", color: "orange" };
  return { riesgo: "bajo", mensaje: "Historial de pagos estable", color: "green" };
}

function calcIVC() {
  const{unidades,residentes,multas,auditLogs}=state.comunidadData;
  const hac = calcHacinamiento(unidades);
  const rot = calcRotacion(residentes, auditLogs);
  const conf = calcConflictos(multas, unidades);
  const morosidad = unidades.filter(u => esUnidadMorosa(u.id)).length / Math.max(unidades.length,1);
  let puntos = 0;
  const pesosHac = { optimo:0, moderado:10, critico:20, severo:25 };
  puntos += pesosHac[hac.nivel] || 0;
  const pesosRot = { estable:0, moderada:10, alta:20, critica:25 };
  puntos += pesosRot[rot.nivel] || 0;
  const pesosConf = { bajo:0, moderado:10, alto:20, critico:25 };
  puntos += pesosConf[conf.nivel] || 0;
  puntos += Math.round(morosidad * 25);
  return Math.min(100, puntos);
}

function getConflictosPorPiso() {
  const { unidades, multas } = state.comunidadData;
  const porPiso = {};
  unidades.forEach(u => { porPiso[u.piso] = { deptos: 0, multas: 0, multados: new Set() }; });
  multas.forEach(m => {
    const u = unidades.find(x => x.id === m.unidad_id);
    if (u) {
      if(!porPiso[u.piso]) porPiso[u.piso] = { deptos:0, multas:0, multados: new Set() };
      porPiso[u.piso].deptos++;
      porPiso[u.piso].multas++;
      porPiso[u.piso].multados.add(m.unidad_id);
    }
  });
  const resultado = Object.entries(porPiso).map(([piso, data]) => ({
    piso: parseInt(piso),
    densidadMultas: data.multas / Math.max(data.deptos,1),
    unidadesConflictivas: data.multados.size
  }));
  return resultado.sort((a,b) => b.densidadMultas - a.densidadMultas);
}

let benchmarkDataGlobal = { region: "RM", promedioMorosidad: 12.5, promedioHacinamiento: 0.06, promedioRotacion: 18, promedioConflictos: 0.5 };
function getBenchmark() {
  const unidades = state.comunidadData.unidades;
  const morosidadActual = unidades.filter(u => esUnidadMorosa(u.id)).length / Math.max(unidades.length,1) * 100;
  const hac = calcHacinamiento(unidades);
  const rot = calcRotacion(state.comunidadData.residentes, state.comunidadData.auditLogs);
  const conf = calcConflictos(state.comunidadData.multas, unidades);
  return {
    morosidad: { actual: morosidadActual.toFixed(1), benchmark: benchmarkDataGlobal.promedioMorosidad, mejor: morosidadActual < benchmarkDataGlobal.promedioMorosidad },
    hacinamiento: { actual: hac.valor ? hac.valor.toFixed(2) : "N/D", benchmark: benchmarkDataGlobal.promedioHacinamiento, mejor: (hac.valor||99) < benchmarkDataGlobal.promedioHacinamiento },
    rotacion: { actual: rot.rotacionPct, benchmark: benchmarkDataGlobal.promedioRotacion, mejor: rot.rotacionPct < benchmarkDataGlobal.promedioRotacion },
    conflictos: { actual: conf.densidad, benchmark: benchmarkDataGlobal.promedioConflictos, mejor: conf.densidad < benchmarkDataGlobal.promedioConflictos }
  };
}

function getRecomendaciones() {
  const rec = [];
  const unidades = state.comunidadData.unidades;
  const morosos = unidades.filter(u => esUnidadMorosa(u.id));
  const conflictosPiso = getConflictosPorPiso();
  const hac = calcHacinamiento(unidades);
  const ivc = calcIVC();
  if (morosos.length > 5) rec.push('🔴 Hay '+morosos.length+' morosos. Programa una reunión con ellos o envía un recordatorio masivo.');
  if (conflictosPiso[0]?.densidadMultas > 1.5) rec.push('⚠️ El piso '+conflictosPiso[0].piso+' concentra muchos conflictos. Sugiere mediación vecinal.');
  if (hac.nivel === 'critico' || hac.nivel === 'severo') rec.push('📦 Hacinamiento crítico. Deriva el caso a la DIDECO para evaluación de subsidio habitacional.');
  if (ivc > 70) rec.push('🚨 El Índice de Vulnerabilidad es alto ('+ivc+'/100). Se recomienda intervención social prioritaria.');
  if (rec.length === 0) rec.push('✅ Todo en orden. Mantén el seguimiento mensual de pagos y revisa las alertas de mantenimiento.');
  return rec.slice(0,4);
}

// Calcular monto con cargo Vecinoo
function calcMontoConCargo(monto){
  const cargo = Math.round(monto * FLOW_CONFIG.cargoPlataformaPct / 100);
  return { base: monto, cargo, total: monto + cargo };
}

// Iniciar pago en Flow.cl
window.doIniciarPago = async function(montoPagar){
  const u = state.comunidadData.unidades.find(x=>x.id===state.currentUser?.unidad_id);
  const r = state.currentUser;
  const com = state.selectedComunidad;
  if(!u||!r||!com){ showAlert('Error al obtener datos','error'); return; }

  const m = thisMonth();
  const montoFinal = montoPagar || (()=>{
    const base = u.monthly_fee||0;
    const multas = state.comunidadData.multas.filter(f=>f.unidad_id===u.id&&f.status==='pendiente');
    const totalMultas = multas.reduce((s,f)=>s+f.amount,0);
    const deuda = calcDeudaAcumulada(u.id);
    return base + totalMultas + (deuda.mesesSinPagar>0?deuda.totalDeuda:0);
  })();

  if(montoFinal <= 0){ showAlert('No tienes montos pendientes','error'); return; }

  const { base, cargo, total } = calcMontoConCargo(montoFinal);

  // Detectar si la comunidad tiene Khipu configurado
  const cuentaCom = (state.cuentasBancarias||{})[com.id]||null;
  const khipuActivo = !!(cuentaCom?.khipu_activo && cuentaCom?.khipu_receiver_id && cuentaCom?.khipu_secret);


  // Mostrar confirmación antes de redirigir
  setState({modal:{
    type: 'confirmar_pago',
    montoBase: base,
    cargoPlatf: cargo,
    montoTotal: total,
    mes: m,
    unidad: u,
    residente: r,
    comunidad: com,
    khipuActivo,
    cuentaCom,
  }});
};

// Procesar el pago — llamar a Flow.cl
window.doConfirmarPago = async function(){
  const modal = state.modal;
  if(!modal||modal.type!=='confirmar_pago'){ return; }
  setState({modal:null, loading:true});

  const orderId = `VEC-${modal.comunidad.id}-${modal.unidad.id}-${Date.now()}`;

  try {
    // ── KHIPU — pago directo a cuenta del edificio ──
    if(modal.khipuActivo){
      const res = await fetch('/api/khipu-crear-cobro', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          receiverId:    modal.cuentaCom.khipu_receiver_id,
          secret:        modal.cuentaCom.khipu_secret,
          subject:       `GC ${modal.mes} - Depto ${modal.unidad.numero} - ${modal.comunidad.nombre}`,
          amount:        modal.montoTotal,
          currency:      'CLP',
          email:         modal.residente.email||'',
          orderId,
          returnUrl:     window.location.origin + '/?pago=exitoso&orden=' + orderId,
          cancelUrl:     window.location.origin + '/?pago=cancelado',
          notifyUrl:     window.location.origin + '/api/khipu-webhook',
          comunidadId:   modal.comunidad.id,
          unidadId:      modal.unidad.id,
          mes:           modal.mes,
          montoBase:     modal.montoBase,
        })
      });
      const data = await res.json();
      if(data.payment_url){
        setState({loading:false});
        window.location.href = data.payment_url;
        return;
      }
      throw new Error(data.error || 'Error al crear cobro Khipu');
    }

    // ── FLOW — fallback si no hay Khipu ──
    if(!FLOW_CONFIG.apiKey || FLOW_CONFIG.apiKey.includes('TU_API_KEY')){
      setState({loading:false});
      _mostrarInstruccionesFlow();
      return;
    }

    const res = await fetch('/api/flow-crear-orden', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        commerceOrder: orderId,
        subject: `GC ${modal.mes} - Depto ${modal.unidad.numero} - ${modal.comunidad.nombre}`,
        currency: 'CLP',
        amount: modal.montoTotal,
        email: modal.residente.email,
        urlReturn: FLOW_CONFIG.urlReturn + `?orden=${orderId}`,
        urlConfirmation: FLOW_CONFIG.urlConfirmation,
        comunidadId: modal.comunidad.id,
        unidadId: modal.unidad.id,
        mes: modal.mes,
        montoBase: modal.montoBase,
        cargoPlatf: modal.cargoPlatf,
        emailAdmin: modal.cuentaCom?.email||null,
      })
    });
    const data = await res.json();
    if(data.url && data.token){
      await sb.from('pagos_flow').insert({
        orden_id: orderId, token: data.token,
        comunidad_id: modal.comunidad.id, unidad_id: modal.unidad.id,
        usuario_id: modal.residente.id, mes: modal.mes,
        monto_base: modal.montoBase, cargo_plataforma: modal.cargoPlatf,
        monto_total: modal.montoTotal, status: 'pendiente',
        created_at: new Date().toISOString(),
      }).select().maybeSingle().catch(()=>null);
      setState({loading:false});
      window.location.href = data.url + '?token=' + data.token;
    } else {
      throw new Error(data.error || 'Error al crear orden Flow');
    }
  } catch(e){
    setState({loading:false});
    showAlert('Error al iniciar el pago: '+e.message,'error');
    console.error(e);
  }
};

// Notificación manual (fallback sin pasarela)
window.doNotificarPago=async()=>{
  const u=state.comunidadData.unidades.find(x=>x.id===state.currentUser?.unidad_id);
  const r=state.currentUser;
  const com=state.selectedComunidad;
  if(!u||!r||!com){showAlert('Error al obtener datos. Intenta nuevamente.','error');return;}

  const m=thisMonth();
  const multas=state.comunidadData.multas.filter(f=>f.unidad_id===u.id&&f.status==='pendiente');
  const totalMultas=multas.reduce((s,f)=>s+f.amount,0);
  const base=u.monthly_fee||0;
  const deuda=calcDeudaAcumulada(u.id);
  const totalAPagar=base+totalMultas+(deuda.mesesSinPagar>0?deuda.totalDeuda:0);

  setState({loading:true});
  try{
    // 1. Registrar la notificación en la BD
    await sb.from('notificaciones_pago').insert({
      comunidad_id:com.id,
      usuario_id:r.id,
      unidad_id:u.id,
      mes:m,
      monto_declarado:totalAPagar,
      estado:'pendiente_confirmacion',
      created_at:new Date().toISOString(),
    }).select().maybeSingle().catch(()=>null); // tabla opcional — no bloquea si no existe

    // 2. Enviar email al admin de la comunidad
    const admins=state.comunidadData.residentes.filter(x=>x.rol==='admin'&&x.activo&&x.email);
    const emailAdmin=admins[0]?.email||null;

    if(emailAdmin){
      const cuerpo=`Hola,\n\n${r.nombre} del Depto ${u.numero} ha notificado el pago de sus gastos comunes.\n\n`+
        `Mes: ${m}\nMonto declarado: $${totalAPagar.toLocaleString('es-CL')}\n`+
        `Comunidad: ${com.nombre}\n\nPor favor confirma el pago en la plataforma.`;
      await fetch('/api/send-email',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          to:emailAdmin,
          subject:`[Vecinoo] Notificación de pago — Depto ${u.numero} · ${com.nombre}`,
          text:cuerpo,
        })
      }).catch(()=>null); // No bloquear si el email falla
    }

    // 3. Registrar en auditoría
    await auditLog('PAGO_NOTIFICADO',`Depto ${u.numero} · ${r.nombre} · $${totalAPagar.toLocaleString('es-CL')} · Mes ${m}`);

    // 4. Rerender para mostrar estado "pendiente confirmación"
    render();
  }catch(e){
    setState({loading:false});

  }
};

function attachPaymentResidenteEvent(){
  document.getElementById('btnConfirmarPagoResidente')?.addEventListener('click',async(e)=>{
    const btn=e.currentTarget; if(btn.disabled)return; btn.disabled=true; btn.textContent='Procesando...';
    const u=state.currentUser;
    const unit=state.comunidadData.unidades.find(x=>x.id===u?.unidad_id);
    const monto=parseInt(document.getElementById('rp_monto')?.value)||0;
    const fecha=document.getElementById('rp_fecha')?.value||today();
    const metodo=document.getElementById('rp_metodo')?.value||'Transferencia';
    const operacion=document.getElementById('rp_operacion')?.value||'';
    if(!monto){showAlert('Ingresa el monto pagado','error');btn.disabled=false;btn.textContent='✅ Confirmar pago';return;}
    const curM=fecha.substr(0,7);
    // Anti-duplicado
    const yaExiste=state.comunidadData.pagos.some(p=>p.usuario_id===u?.id&&p.month===curM);
    if(yaExiste){showAlert('Ya tienes un pago registrado para este mes.','error');btn.disabled=false;btn.textContent='✅ Confirmar pago';return;}
    const pf=getPendingFines(u?.unidad_id,curM);
    const finesAmt=pf.reduce((s,f)=>s+f.amount,0);
    const{data,error}=await sb.from('pagos').insert({
      comunidad_id:state.selectedComunidad.id,
      unidad_id:u?.unidad_id,
      usuario_id:u?.id,
      amount:monto,
      base_amount:monto-finesAmt,
      date:fecha,
      method:metodo,
      month:curM,
      operacion_ref:operacion
    }).select();
    if(error){showAlert('Error al registrar: '+error.message,'error');btn.disabled=false;btn.textContent='✅ Confirmar pago';return;}
    if(pf.length>0){
      await sb.from('multas').update({status:'pagada'}).in('id',pf.map(f=>f.id));
      const multas=state.comunidadData.multas.map(f=>pf.find(x=>x.id===f.id)?{...f,status:'pagada'}:f);
      state.comunidadData={...state.comunidadData,multas};
    }
    const pagos=[...data,...state.comunidadData.pagos];
    setState({comunidadData:{...state.comunidadData,pagos},modal:{type:'receipt',payment:data[0]}});
    showAlert('✅ Pago registrado correctamente');
    notifLocal('Pago registrado',`Tu GC de ${curM} fue registrado exitosamente.`,'✅');
    const unidadRes=state.comunidadData.unidades.find(x=>x.id===u?.unidad_id);
    emailComprobantePago(data[0],u,unidadRes,state.selectedComunidad);
    btn.disabled=false;btn.textContent='✅ Confirmar pago';
  });
}

function buildActaVotacionModal(votacionId){
  const{votaciones,votos,residentes}=state.comunidadData;
  const com=state.selectedComunidad;
  const v=votaciones.find(x=>x.id===votacionId);
  if(!v)return'';

  let opciones=v.opciones||[];
  if(typeof opciones==='string'){try{opciones=JSON.parse(opciones);}catch(e){opciones=[];}}
  if(!Array.isArray(opciones))opciones=[];

  const votosDev=votos.filter(x=>x.votacion_id===votacionId);
  const totalVotos=votosDev.length;
  const totalPosibles=residentes.length;
  const pctParticipacion=totalPosibles>0?Math.round(totalVotos/totalPosibles*100):0;
  const ahora=new Date();

// Guardar acta en Documentos (sin abrir ventana PDF)
window.guardarActaEnDocumentos = async (votacionId) => {
  const{votaciones,votos,residentes}=state.comunidadData;
  const v=votaciones.find(x=>x.id===votacionId);
  if(!v){showAlert('Votación no encontrada','error');return;}

  // Verificar si ya existe
  const yaGuardada=state.comunidadData.documentos.some(d=>d.votacion_id===votacionId);
  if(yaGuardada){
    showAlert('Esta acta ya está guardada en Documentos','error');
    return;
  }

  const btn=document.getElementById('btnGuardarActaDoc');
  if(btn){btn.disabled=true;btn.textContent='Guardando...';}

  const ahora=new Date();
  const fechaEmision=ahora.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});
  const nActa='VOT-'+String(ahora.getFullYear()).slice(2)+String(ahora.getMonth()+1).padStart(2,'0')+'-'+String(Math.floor(Math.random()*9000)+1000);

  const votosDev=votos.filter(x=>x.votacion_id===votacionId);
  let opciones=v.opciones||[];
  if(typeof opciones==='string'){try{opciones=JSON.parse(opciones);}catch(e){opciones=[];}}
  const totalVotos=votosDev.length;
  const totalPosibles=residentes.length;
  const pctPart=totalPosibles>0?Math.round(totalVotos/totalPosibles*100):0;

  // Calcular ganador
  const resultados=opciones.map(op=>({op,n:votosDev.filter(x=>x.opcion_elegida===op).length})).sort((a,b)=>b.n-a.n);
  const ganador=resultados[0];
  const empate=resultados.length>1&&resultados[0].n===resultados[1].n;

  const docData={
    comunidad_id: state.selectedComunidad?.id,
    icon: '📄',
    titulo: 'Acta — '+v.titulo,
    title: 'Acta — '+v.titulo,
    descripcion: `Acta N° ${nActa} · Emitida el ${fechaEmision} · ${totalVotos} votos · Participación ${pctPart}%${!empate&&ganador?` · Ganador: "${ganador.op}"` :''}`,
    desc: `Acta de votación emitida el ${fechaEmision}. N° ${nActa}`,
    carpeta: 'actas',
    tipo: 'acta_votacion',
    numero_acta: nActa,
    votacion_id: votacionId,
    fecha_emision: ahora.toISOString(),
    emitida_por: state.currentUser?.nombre||'Admin',
    votos_total: totalVotos,
    participacion_pct: pctPart,
    ganador: empate?'Empate':(ganador?.op||'—'),
  };

  const{data,error}=await sb.from('documentos').insert(docData).select();
  if(btn){btn.disabled=false;btn.textContent='💾 Guardar en Documentos';}

  if(error){
    showAlert('Error al guardar: '+error.message,'error');
    return;
  }
  const documentos=[data[0],...state.comunidadData.documentos];
  setState({comunidadData:{...state.comunidadData,documentos}});
  showAlert('✅ Acta guardada en Documentos → Actas','success');
  // Re-render el modal para mostrar el banner de "ya guardada"
  setTimeout(()=>setState({modal:{type:'acta_votacion',votacionId}}),800);
};

//  MÓDULO EMAIL — Resend via /api/send-email (Vercel Function)
//  ⚠️  La API key de Resend NUNCA debe estar en el frontend.
//  Está guardada como variable de entorno RESEND_KEY en Vercel.

// EMAIL_FROM visible en frontend está bien — no es un secreto
const EMAIL_FROM = 'Vecinoo <noreply@vecinoo.cl>';

// sendEmail llama al backend seguro — no expone ninguna key
// ── Cola de emails para reintentos ──
const _emailQueue=[];
let _emailSending=false;

async function _processEmailQueue(){
  if(_emailSending||!_emailQueue.length)return;
  _emailSending=true;
  const job=_emailQueue[0];
  const ok=await _sendEmailDirect(job);
  if(ok){
    _emailQueue.shift();
  }else{
    job.retries=(job.retries||0)+1;
    if(job.retries>=3){
      console.warn('Email descartado tras 3 intentos:',job.to,job.subject);
      _emailQueue.shift();
    }else{
      // Esperar antes de reintentar
      await new Promise(r=>setTimeout(r,2000*job.retries));
    }
  }
  _emailSending=false;
  if(_emailQueue.length)setTimeout(_processEmailQueue,500);
}

async function _sendEmailDirect({to,subject,html}){
  if(!to||!to.includes('@'))return false;
  try{
    const res=await fetch('/api/send-email',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({to,subject,html,from:EMAIL_FROM})
    });
    if(!res.ok){
      const d=await res.json().catch(()=>({}));
      console.warn('Email error:',d.error||res.status,'→',to);
      return false;
    }
    console.info('📧 Email enviado →',to,'|',subject);
    return true;
  }catch(e){
    console.warn('sendEmail error:',e.message);
    return false;
  }
}

async function sendEmail({to, subject, html}){
  if(!to||!to.includes('@')){
    console.warn('Email ignorado — destinatario inválido:',to);
    return false;
  }
  if(state.isDemo){console.info('📧 [DEMO] Email simulado →',to,'|',subject);return true;}
  // Encolar para procesamiento asíncrono (no bloquea la UI)
  _emailQueue.push({to,subject,html,retries:0});
  setTimeout(_processEmailQueue,100);
  return true;
}

async function initPushNotifications(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return;
  if(Notification.permission==='denied')return;
  try{
    // Solo registrar si sw.js existe en el servidor
    const swCheck = await fetch('/sw.js',{method:'HEAD'}).catch(()=>null);
    if(!swCheck||!swCheck.ok)return; // sw.js no está en el servidor, omitir silenciosamente
    let reg = await navigator.serviceWorker.getRegistration('/sw.js');
    if(!reg) reg = await navigator.serviceWorker.register('/sw.js');
    const perm = await Notification.requestPermission();
    if(perm !== 'granted') return;
    const userId = state.currentUser?.id;
    if(userId){
      await sb.from('push_subscriptions').upsert({
        usuario_id: userId,
        comunidad_id: state.selectedComunidad?.id,
        updated_at: new Date().toISOString()
      }, {onConflict:'usuario_id'});
    }
  }catch(e){ console.warn('Push no disponible:', e); }
}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=window.atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

// Notificación local (sin servidor) — funciona siempre que el usuario haya dado permiso
function notifLocal(title, body, icon='💬'){
  if(Notification.permission==='granted'){
    new Notification(`${icon} ${title}`, {body, icon:'/icon-192.png', badge:'/icon-192.png'});
  }
}

// Disparadores de notificación integrados en las acciones existentes
function checkVotacionesActivas(){
  const activas = state.comunidadData.votaciones.filter(v=>v.estado==='activa');
  activas.forEach(v=>{
    const cierre = new Date(v.fecha_cierre||v.fecha_cierre_dt);
    const horasLeft = (cierre - new Date()) / 36e5;
    if(horasLeft > 0 && horasLeft <= 24){
      notifLocal('Votación por cerrar', `"${v.titulo}" cierra en menos de 24 horas.`, '🗳️');
    }
  });
}

function checkGCVencimiento(){
  const u = state.currentUser;
  if(!u) return;
  const unit = state.comunidadData.unidades.find(x=>x.id===u.unidad_id);
  if(!unit?.monthly_fee) return;
  const paid = state.comunidadData.pagos.some(p=>p.usuario_id===u.id&&p.month===thisMonth());
  if(!paid){
    const hoy = new Date().getDate();
    if(hoy >= 25){ // Avisar desde el día 25
      notifLocal('GC pendiente', `Tu gasto común de ${thisMonth()} aún no está registrado.`, '💰');
    }
  }
}

// Disparar verificaciones al cargar datos
function runNotifChecks(){
  if(!state.currentUser || state.screen !== 'app') return;
  setTimeout(()=>{ checkVotacionesActivas(); checkGCVencimiento(); }, 2000);
}

    ${catEntries.length===0

function buildMiniHistorial(){
  const meses=[];
  for(let i=5;i>=0;i--){
    const d=new Date(); d.setMonth(d.getMonth()-i);
    const mes=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const ingr=state.comunidadData.pagos.filter(p=>p.month===mes).reduce((s,p)=>s+p.amount,0);
    const egr=state.comunidadData.gastos.filter(g=>g.month===mes).reduce((s,g)=>s+g.amount,0);
    meses.push({mes,ingr,egr,bal:ingr-egr});
  }
  return`<table><thead><tr><th>Período</th><th>Ingresos</th><th>Egresos</th><th>Saldo</th></tr></thead>
  <tbody>${meses.map(m=>`<tr>
    <td style="font-weight:600">${m.mes}</td>
    <td class="green" style="font-weight:600">${fmt(m.ingr)}</td>
    <td class="red">${fmt(m.egr)}</td>
    <td style="font-weight:700" class="${m.bal>=0?'green':'red'}">${fmt(m.bal)}</td>
  </tr>`).join('')}</tbody></table>`;
}
