  const afp=Math.round(bruto*afpPct);
  const sis=Math.round(bruto*0.0154);
  const segCes=Math.round(bruto*0.006);
  const salud=w.health_type==='Fonasa'?Math.round(bruto*0.07):parseInt(w.health_amount)||0;
  const imp=calcImpuesto(bruto-afp-salud);
  const liquido=bruto-afp-salud-segCes-imp;
  return{bruto,afp,sis,segCes,salud,imp,liquido,afpPct,gratif:Math.round(bruto*0.25)};
}
function calcImpuesto(base){
  const utm=65443;const e=base/utm;
  if(e<=13.5)return 0;if(e<=30)return Math.round(base*0.04-0.192*utm);
  if(e<=50)return Math.round(base*0.08-1.392*utm);if(e<=70)return Math.round(base*0.135-4.142*utm);
  return Math.round(base*0.23-10.792*utm);
}
function calcFiniquito(w,type,lastDay){
  const liq=calcLiquidacion(w);
  const years=(new Date(lastDay)-new Date(w.start_date))/(1000*60*60*24*365);
  const yf=Math.floor(years);const mf=Math.round((years-yf)*12);
  const ind=type==='despido'?Math.round(liq.bruto*Math.min(yf+(mf>=6?1:0),11)):0;
  const dias=Math.round((new Date(lastDay).getDate()/30)*liq.liquido);
  const vac=Math.round(years*15/12*(liq.bruto/30));
  return{ind,dias,vac,total:ind+dias+vac,years:yf,months:mf};
}
function getTotalSqm(u){return(u.sqm||0)+(u.parking?u.parking_sqm||0:0)+(u.storage?u.storage_sqm||0:0);}
function calcProrate(amount,units){
  const total=units.reduce((s,u)=>s+getTotalSqm(u),0);
  return units.map(u=>({unitId:u.id,sqm:getTotalSqm(u),pct:total>0?getTotalSqm(u)/total:0,amount:total>0?Math.round(amount*getTotalSqm(u)/total):0}));
}

function checkVotacionesScheduled(){
  const now=new Date();
  state.comunidadData.votaciones.forEach(async v=>{
    if(v.estado==='programada'&&v.fecha_inicio_dt){
      const inicio=new Date(v.fecha_inicio_dt);
      if(now>=inicio){
        await sb.from('votaciones').update({estado:'activa'}).eq('id',v.id);

        state.comunidadData={...state.comunidadData,votaciones};
      }
    }
  });
}

function getMetrics(month){
  const{pagos,gastos,unidades,residentes}=state.comunidadData;
  const mp=pagos.filter(p=>p.month===month);
  const me=gastos.filter(g=>g.month===month);
  const totalIn=mp.reduce((s,p)=>s+p.amount,0);
  const totalOut=me.reduce((s,e)=>s+e.amount,0);
  const paidUnits=new Set(mp.map(p=>p.unidad_id));
  const occupied=unidades.filter(u=>residentes.some(r=>r.unidad_id===u.id));
  const morose=occupied.filter(u=>!paidUnits.has(u.id));
  return{totalIn,totalOut,balance:totalIn-totalOut,paidUnits,occupied,morose,mp,me};
}

function buildBank(){
  const{pagos,gastos,unidades}=state.comunidadData;
  const totalIn=pagos.reduce((s,p)=>s+p.amount,0);
  const totalOut=gastos.reduce((s,g)=>s+g.amount,0);
  const allMovs=[...pagos.map(p=>({...p,_t:'crédito',_desc:`GC Depto ${unidades.find(u=>u.id===p.unidad_id)?.numero||''}`})),...gastos.map(g=>({...g,_t:'débito',_desc:`${g.icon} ${g.label}`}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  let saldo=totalIn-totalOut;
  const movs=allMovs.map(m=>{const s=saldo;saldo+=m._t==='débito'?m.amount:-m.amount;return{...m,saldo:s}});
  return`
  <div class="page-header"><div><h2>Cuenta Corriente</h2></div><span class="badge badge-gold">Simulación · Fintoc próximamente</span></div>
  <div class="metrics" style="grid-template-columns:repeat(3,1fr)">
    <div class="metric"><div class="metric-label">Créditos</div><div class="metric-value green">${fmt(totalIn)}</div></div>
    <div class="metric"><div class="metric-label">Débitos</div><div class="metric-value red">${fmt(totalOut)}</div></div>
    <div class="metric"><div class="metric-label">Saldo</div><div class="metric-value ${totalIn-totalOut>=0?'green':'red'}">${fmt(totalIn-totalOut)}</div></div>
  </div>
  <div class="card"><table><thead><tr><th>Fecha</th><th>Descripción</th><th>Tipo</th><th>Monto</th><th>Saldo</th></tr></thead>
  <tbody>${movs.length===0?`<tr><td colspan="5" class="empty">Sin movimientos</td></tr>`:movs.map(m=>`<tr>
    <td>${fmtD(m.date)}</td><td>${m._desc}</td>
    <td><span class="badge ${m._t==='crédito'?'badge-green':'badge-red'}">${m._t}</span></td>
    <td style="font-weight:700;color:${m._t==='crédito'?'var(--green)':'var(--red)'}">${m._t==='crédito'?'+':'-'}${fmt(m.amount)}</td>
    <td>${fmt(m.saldo)}</td>
  </tr>`).join('')}</tbody></table></div>`;
}

    ${me.filter(e=>e.prorate).length===0?'<div class="empty">Sin gastos con prorrateo</div>':
    me.filter(e=>e.prorate).map(e=>`<div style="margin-bottom:16px">
      <div style="font-weight:700;margin-bottom:6px">${e.icon} ${e.label} · ${fmt(e.amount)}</div>
      <table><thead><tr><th>Depto</th><th>Residente</th><th>m²</th><th>%</th><th>A cobrar</th></tr></thead>
      <tbody>${calcProrate(e.amount,state.comunidadData.unidades).map(p=>{const u=state.comunidadData.unidades.find(x=>x.id===p.unitId);const r=state.comunidadData.residentes.find(x=>x.unidad_id===p.unitId);return`<tr><td>Depto ${u?.numero||''}</td><td>${r?.nombre||'—'}</td><td>${p.sqm}m²</td><td>${(p.pct*100).toFixed(1)}%</td><td style="font-weight:700;color:var(--navy)">${fmt(p.amount)}</td></tr>`;}).join('')}</tbody></table>
    </div>`).join('')}
  </div>`:''}
  ${tab==='votaciones'?buildReporteVotaciones(com):''}`;
}

// ── FIX 3: Reporte de votaciones ──
function buildReporteVotaciones(com){
  const{votaciones,votos,residentes}=state.comunidadData;
  if(!votaciones.length)return'<div class="card"><div class="empty">Sin votaciones registradas</div></div>';

  return`
  <div class="card" id="reporteVotacionesCard">
    <div class="card-header">
      <span class="card-title">🗳️ Actas de Votaciones — ${com?.nombre||''}</span>
      <button class="btn btn-primary btn-sm no-print" onclick="window.print()">🖨 Imprimir / Descargar PDF</button>
    </div>
    <div style="font-size:11px;color:#6b7280;margin-bottom:14px">Generado el ${new Date().toLocaleDateString('es-CL',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
    ${votaciones.map(v=>{
      const votosDev=votos.filter(x=>x.votacion_id===v.id);
      const totalVotos=votosDev.length;
      const opciones=v.opciones||[];
      const ganadora=opciones.reduce((prev,op)=>{const n=votosDev.filter(x=>x.opcion_elegida===op).length;return n>(prev.n||0)?{op,n}:prev},{});
      const participacion=Math.round(totalVotos/Math.max(residentes.length,1)*100);
      return`<div style="border:1px solid #e5e5e5;border-radius:8px;padding:14px;margin-bottom:14px;border-left:4px solid var(--gold)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <div>
            <div style="font-weight:700;font-size:14px">${v.titulo}</div>
            ${v.descripcion?`<div style="font-size:12px;color:#6b7280;margin-top:2px">${v.descripcion}</div>`:''}
            <div style="font-size:11px;color:#9ca3af;margin-top:4px">
              Creada por: ${v.creada_por||'—'} ·
              Inicio: ${v.fecha_inicio_dt?new Date(v.fecha_inicio_dt).toLocaleString('es-CL'):fmtD(v.fecha_inicio)} ·
              Cierre: ${v.fecha_cierre_dt?new Date(v.fecha_cierre_dt).toLocaleString('es-CL'):fmtD(v.fecha_cierre)}
            </div>
          </div>
          <span class="vot-estado-badge ${v.estado==='activa'?'vot-activa':v.estado==='programada'?'vot-programada':'vot-cerrada'}">${v.estado}</span>
        </div>
        <table style="font-size:12px;margin-bottom:10px">
          <thead><tr><th style="text-align:left;padding:6px 8px;background:#f9fafb;border-bottom:1px solid #e5e5e5">Opción</th><th style="text-align:center;padding:6px 8px;background:#f9fafb;border-bottom:1px solid #e5e5e5">Votos</th><th style="text-align:center;padding:6px 8px;background:#f9fafb;border-bottom:1px solid #e5e5e5">%</th><th style="padding:6px 8px;background:#f9fafb;border-bottom:1px solid #e5e5e5">Resultado</th></tr></thead>
          <tbody>
            ${opciones.map(op=>{
              const n=votosDev.filter(x=>x.opcion_elegida===op).length;
              const pct=totalVotos>0?Math.round(n/totalVotos*100):0;
              const esGanadora=op===ganadora.op&&totalVotos>0;
              return`<tr style="${esGanadora?'background:#f0fdf4;font-weight:700':''}">
                <td style="padding:6px 8px;border-bottom:1px solid #f3f4f6">${esGanadora?'🏆 ':''} ${op}</td>
                <td style="padding:6px 8px;text-align:center;border-bottom:1px solid #f3f4f6">${n}</td>
                <td style="padding:6px 8px;text-align:center;border-bottom:1px solid #f3f4f6">${pct}%</td>
                <td style="padding:6px 8px;border-bottom:1px solid #f3f4f6">
                  <div style="height:8px;background:#e5e5e5;border-radius:4px;overflow:hidden;width:100px">
                    <div style="height:100%;background:${esGanadora?'var(--green)':'var(--navy)'};border-radius:4px;width:${pct}%"></div>
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        <div style="display:flex;gap:16px;font-size:11px;color:#6b7280;padding:8px;background:#f9fafb;border-radius:6px">
          <span>📊 Total votos: <b>${totalVotos}</b></span>
          <span>👥 Residentes: <b>${residentes.length}</b></span>
          <span>📈 Participación: <b>${participacion}%</b></span>
          ${totalVotos>0&&ganadora.op?`<span style="color:var(--green);font-weight:700">✓ Resultado: ${ganadora.op}</span>`:''}
        </div>
      </div>`;
    }).join('')}
    <div style="margin-top:16px;padding-top:12px;border-top:2px dashed #e5e5e5;text-align:center;font-size:10px;color:#9ca3af">
      Vecinoo — ${com?.nombre||''} · ${com?.direccion||''} · vecinoo.cl
    </div>
  </div>`;
}

// ── FIX 2 APLICADO: Votaciones con hora y programación ──
function buildVotaciones(){
  const{votaciones,votos,residentes}=state.comunidadData;
  const full=isFullAccess();
  const userId=state.currentUser?.id;
  const now=new Date();

  // Auto-activar programadas
  votaciones.forEach(async v=>{
    if(v.estado==='programada'&&v.fecha_inicio_dt){
      if(new Date(v.fecha_inicio_dt)<=now){
        await sb.from('votaciones').update({estado:'activa'}).eq('id',v.id);
      }
    }
  });

  const activas=votaciones.filter(v=>v.estado==='activa');
  const programadas=votaciones.filter(v=>v.estado==='programada');
  const cerradas=votaciones.filter(v=>v.estado==='cerrada');

  function buildVotacionCard(v,readonly=false){
    const opciones=v.opciones||[];
    const votosDev=votos.filter(x=>x.votacion_id===v.id);
    const miVoto=votos.find(x=>x.votacion_id===v.id&&x.usuario_id===userId);
    const yaVote=!!miVoto;
    const mostrarResultados=yaVote||readonly;
    const totalVotos=votosDev.length;
    const inicioStr=v.fecha_inicio_dt?new Date(v.fecha_inicio_dt).toLocaleString('es-CL'):fmtD(v.fecha_inicio);
    const cierreStr=v.fecha_cierre_dt?new Date(v.fecha_cierre_dt).toLocaleString('es-CL'):fmtD(v.fecha_cierre);

    return`<div class="votacion-card">
      <div class="votacion-header">
        <div>
          <div style="font-weight:700;font-size:14px">${v.titulo}</div>
          ${v.descripcion?`<div style="font-size:12px;color:#6b7280;margin-top:3px">${v.descripcion}</div>`:''}
          <div style="font-size:10px;color:#9ca3af;margin-top:5px">
            🕐 Inicio: ${inicioStr} · Cierre: ${cierreStr} · ${totalVotos} votos
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
          <span class="vot-estado-badge ${v.estado==='activa'?'vot-activa':v.estado==='programada'?'vot-programada':'vot-cerrada'}">${v.estado==='activa'?'✓ Activa':v.estado==='programada'?'🕐 Programada':'Cerrada'}</span>
          ${yaVote?`<span class="badge badge-gold">✓ Ya votaste</span>`:''}
          ${full&&v.estado==='activa'?`<button class="btn btn-sm btn-danger" onclick="cerrarVotacion('${v.id}')">Cerrar</button>`:''}
          ${full&&v.estado==='programada'?`<button class="btn btn-sm btn-success" onclick="activarVotacion('${v.id}')">Activar ahora</button>`:''}
          ${full?`<button class="btn btn-sm" style="background:#fee2e2;color:#991b1b;border-color:#fca5a5" onclick="deleteVotacion('${v.id}')">🗑</button>`:''}
        </div>
      </div>
      ${v.estado==='programada'?`<div class="vot-schedule-box">
        <div style="font-size:11px;color:#6b7280;margin-bottom:3px">⏳ Esta votación comenzará automáticamente el:</div>
        <div class="vot-countdown">${inicioStr}</div>
      </div>`:''}
      ${mostrarResultados?
        opciones.map(op=>{
          const n=votosDev.filter(x=>x.opcion_elegida===op).length;
          const pct=totalVotos>0?Math.round(n/totalVotos*100):0;
          const esMiVoto=miVoto?.opcion_elegida===op;
          return`<div class="resultado-row">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
              <span style="font-weight:${esMiVoto?'700':'400'}">${esMiVoto?'✓ ':''} ${op}</span>
              <span style="font-weight:700">${n} votos · ${pct}%</span>
            </div>
            <div class="voto-bar"><div class="voto-fill" style="width:${pct}%;background:${esMiVoto?'var(--green)':'var(--navy)'}"></div></div>
          </div>`;
        }).join('')
      :v.estado==='activa'?`<div style="margin-top:8px">
          ${opciones.map(op=>`<div class="opcion-voto" onclick="emitirVoto('${v.id}','${op}')">
            <span style="font-size:13px">${op}</span>
            <span style="font-size:11px;color:#6b7280">Votar →</span>
          </div>`).join('')}
          <p style="font-size:10px;color:#9ca3af;margin-top:8px">Tu voto es anónimo · Solo una vez</p>
        </div>`:''
      }
      ${(yaVote||readonly)&&totalVotos>0?`<div class="acta-box">
        <div style="font-weight:700;margin-bottom:6px">📋 Resumen del acta</div>
        <div style="font-size:12px;color:#6b7280">Total: <b>${totalVotos}</b> de <b>${residentes.length}</b> · Participación: <b>${Math.round(totalVotos/Math.max(residentes.length,1)*100)}%</b></div>
      </div>`:''}
    </div>`;
  }

  return`
  <div class="page-header">
    <div><h2>Votaciones</h2><p>${activas.length} activas · ${programadas.length} programadas · ${cerradas.length} cerradas</p></div>
    ${full?`<button class="btn btn-gold" id="btnAddVotacion">🗳️ Nueva votación</button>`:''}
  </div>
  ${full?`<div id="votacionForm" style="display:none" class="card">
    <div class="form-group"><label class="form-label">Título *</label><input class="form-control" id="vTitulo"></div>
    <div class="form-group"><label class="form-label">Descripción</label><textarea class="form-control" id="vDesc" rows="2"></textarea></div>

    <!-- FIX 2: Toggle inicio inmediato o programado -->
    <div style="background:#f0f4ff;border-radius:8px;padding:12px;margin-bottom:12px;border:1px solid #c7d2fe">
      <div style="font-weight:700;font-size:12px;color:var(--navy);margin-bottom:10px">⏰ Cuándo iniciar la votación</div>
      <div class="toggle-row">
        <label class="toggle"><input type="checkbox" id="vInmediato" checked onchange="toggleVotacionTiming()"><span class="toggle-slider"></span></label>
        <span style="font-size:12px;font-weight:600">Iniciar ahora mismo</span>
      </div>
      <div id="vTimingFields" style="display:none">
        <div class="form-row" style="margin-top:8px">
          <div class="form-group"><label class="form-label">Fecha y hora de inicio *</label><input class="form-control" id="vInicioDt" type="datetime-local" value="${nowDateTime()}"></div>
          <div class="form-group"><label class="form-label">Fecha y hora de cierre *</label><input class="form-control" id="vCierreDt" type="datetime-local"></div>
        </div>
      </div>
      <div id="vTimingInmediato">
        <div class="form-group" style="margin-top:8px"><label class="form-label">Fecha y hora de cierre *</label>
          <input class="form-control" id="vCierreDtInmediato" type="datetime-local">
          <p style="font-size:10px;color:#6b7280;margin-top:3px">La votación comenzará al publicar y cerrará en la fecha indicada</p>
        </div>
      </div>
    </div>

    <div class="section-div">Opciones de votación</div>
    <div id="opcionesContainer">
      <div class="form-row" style="margin-bottom:8px">
        <input class="form-control opcion-input" placeholder="Opción 1 (ej: A favor)">
        <input class="form-control opcion-input" placeholder="Opción 2 (ej: En contra)">
      </div>
    </div>
    <button class="btn btn-sm" id="btnAddOpcion" style="margin-bottom:12px">+ Agregar opción</button>
    <div style="display:flex;gap:8px">
      <button class="btn btn-gold" id="btnSaveVotacion">Publicar votación</button>
      <button class="btn" id="btnCancelVotacion">Cancelar</button>
    </div>
  </div>`:''}
  ${activas.length>0?`<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:8px">✓ Activas (${activas.length})</div>${activas.map(v=>buildVotacionCard(v,false)).join('')}</div>`:''}
  ${programadas.length>0?`<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#1e40af;margin-bottom:8px">🕐 Programadas (${programadas.length})</div>${programadas.map(v=>buildVotacionCard(v,true)).join('')}</div>`:''}
  ${cerradas.length>0?`<div><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:8px">Cerradas (${cerradas.length})</div>${cerradas.map(v=>buildVotacionCard(v,true)).join('')}</div>`:''}
  ${activas.length===0&&programadas.length===0&&cerradas.length===0?`<div class="card"><div class="empty">Sin votaciones</div></div>`:''}`;
}

        </div>

}

function attachEvents(){
  document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>setState({view:btn.dataset.view})));
  // Unidades
  document.getElementById('btnAddUnit')?.addEventListener('click',()=>toggleForm('unitForm'));
  document.getElementById('btnCancelUnit')?.addEventListener('click',()=>toggleForm('unitForm',false));
  document.getElementById('btnSaveUnit')?.addEventListener('click',async()=>{
    const number=document.getElementById('uNumber').value.trim();
    const floor=document.getElementById('uFloor').value;
    const sqm=document.getElementById('uSqm').value;
    if(!number||!floor||!sqm){showAlert('Completa los campos obligatorios','error');return;}
    const parking=document.getElementById('uParking').checked;
    const storage=document.getElementById('uStorage').checked;
    const{data,error}=await sb.from('unidades').insert({
      comunidad_id:state.selectedComunidad.id,numero:number,piso:parseInt(floor),sqm:parseFloat(sqm),
      monthly_fee:parseInt(document.getElementById('uFee').value)||0,
      parking,parking_num:parking?document.getElementById('uParkingNum').value:'',
      parking_sqm:parking?parseFloat(document.getElementById('uParkingSqm').value||0):0,
      storage,storage_num:storage?document.getElementById('uStorageNum').value:'',
      storage_sqm:storage?parseFloat(document.getElementById('uStorageSqm').value||0):0
    }).select();
    if(error){showAlert('Error: '+error.message,'error');return;}
    setState({comunidadData:{...state.comunidadData,unidades:[...state.comunidadData.unidades,...data]}});
    showAlert('✓ Unidad agregada');
  });
  // Residentes
  document.getElementById('btnAddResident')?.addEventListener('click',()=>toggleForm('residentForm'));
  document.getElementById('btnCancelResident')?.addEventListener('click',()=>toggleForm('residentForm',false));
  document.getElementById('btnSaveResident')?.addEventListener('click',async()=>{
    const nombre=document.getElementById('rName').value.trim();
    const unitId=document.getElementById('rUnit').value;
    const clave=document.getElementById('rClave').value.trim();
    const rol=document.getElementById('rRole').value;
    if(!nombre||!unitId||!clave){showAlert('Completa campos obligatorios','error');return;}
    const{data,error}=await sb.from('usuarios').insert({comunidad_id:state.selectedComunidad.id,unidad_id:unitId,nombre,email:document.getElementById('rEmail').value,rut:document.getElementById('rRut').value,phone:document.getElementById('rPhone').value,rol,clave,activo:true}).select();
    if(error){showAlert('Error: '+error.message,'error');return;}
    setState({comunidadData:{...state.comunidadData,residentes:[...state.comunidadData.residentes,...data]}});showAlert('Residente registrado');
  });
  // Pagos
  document.getElementById('btnAddPayment')?.addEventListener('click',()=>toggleForm('paymentForm'));
  document.getElementById('btnCancelPayment')?.addEventListener('click',()=>toggleForm('paymentForm',false));
  document.getElementById('btnSavePayment')?.addEventListener('click',async()=>{
    const userId=document.getElementById('pResident').value;
    const amount=document.getElementById('pAmount').value;
    const date=document.getElementById('pDate').value;
    const method=document.getElementById('pMethod').value;
    if(!userId||!amount||!date){showAlert('Completa campos','error');return;}
    const r=state.comunidadData.residentes.find(x=>x.id===userId);
    const curM=date.substr(0,7);
    const pf=getPendingFines(r?.unidad_id,curM);
    const finesAmt=pf.reduce((s,f)=>s+f.amount,0);

// Generar números de departamento según formato
// Por piso: 4-6 dptos por piso, calculado dinámicamente según total
function calcDxp(cant) {
  if (cant <= 16) return 4;
  if (cant <= 30) return 5;
  return 6;
}

function generarNumeracion(cant, inicio, formato) {
  const nums = [];
  const n = parseInt(inicio) || 101;

  if (formato === 'secuencial') {
    for (let i = 0; i < cant; i++) nums.push(String(n + i));

  } else if (formato === 'por_piso') {
    const dxp = calcDxp(cant); // 4, 5 o 6 según cantidad total
    for (let i = 0; i < cant; i++) {
      const piso = Math.floor(i / dxp) + 1;
      const pos  = (i % dxp) + 1;
      // Formato: piso + número correlativo con 2 dígitos (101, 102... 201, 202...)
      nums.push(`${piso}${String(pos).padStart(2, '0')}`);
    }

  } else if (formato === 'letras') {
    const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const dxp = calcDxp(cant);
    let letra = 0, num = 1;
    for (let i = 0; i < cant; i++) {
      nums.push(`${letras[letra]}${num}`);
      num++;
      if (num > dxp) { num = 1; letra = (letra + 1) % letras.length; }
    }
  }
  return nums;
}

// Generar numeración estacionamientos/bodegas
function generarNumsItem(cant, inicio) {
  const nums = [];
  const prefijo = inicio.replace(/\d+$/, '');
  const numInicio = parseInt(inicio.replace(/\D/g, '')) || 1;
  for (let i = 0; i < cant; i++) nums.push(`${prefijo}${numInicio + i}`);
  return nums;
}

// Preview en tiempo real
window.previewInventario = function() {
  const cant = parseInt(document.getElementById('ncCantDeptos')?.value) || 0;
  const inicio = document.getElementById('ncNumInicio')?.value || '101';
  const formato = document.getElementById('ncFormato')?.value || 'secuencial';
  const preview = document.getElementById('previewNums');
  const previewText = document.getElementById('previewNumsText');
  if (!preview || !previewText) return;
  if (cant <= 0) { preview.style.display = 'none'; return; }
  const nums = generarNumeracion(cant, inicio, formato);
  const shown = nums.slice(0, 8);
  previewText.textContent = shown.join(', ') + (nums.length > 8 ? ` ... hasta ${nums[nums.length-1]}` : '');
  preview.style.display = 'block';
};

// Crear comunidad con inventario completo
window.crearComunidadConInventario = async function() {
  const nombre = document.getElementById('ncNombre').value.trim();
  const codigo_acceso = document.getElementById('ncCodigo').value.trim().toUpperCase();
  const adminNombre = document.getElementById('ncAdminNombre').value.trim();
  const adminClave = document.getElementById('ncAdminClave').value.trim();
  const cant = parseInt(document.getElementById('ncCantDeptos').value) || 0;
  const inicio = document.getElementById('ncNumInicio').value || '101';
  const formato = document.getElementById('ncFormato').value || 'secuencial';
  const gc = parseInt(document.getElementById('ncGC').value) || 0;
  const sqm = parseInt(document.getElementById('ncSqm').value) || 65;
  const cantEstac = parseInt(document.getElementById('ncCantEstac').value) || 0;
  const cantBodegas = parseInt(document.getElementById('ncCantBodegas').value) || 0;

  setState({ loading: true });

  // 1. Crear comunidad
  const { data: comData, error: comError } = await sb.from('comunidades').insert({
    nombre, direccion: document.getElementById('ncDir').value,
    ciudad: document.getElementById('ncCiudad').value,
    region: document.getElementById('ncRegion').value,
    codigo_acceso, plan: document.getElementById('ncPlan').value,
    monto_implementacion: parseInt(document.getElementById('ncImpl').value || 0),
    monto_mantencion: parseInt(document.getElementById('ncMant').value || 0),
    notas: document.getElementById('ncNotas').value,
    activa: true, fecha_inicio: today()
  }).select();

  if (comError) {
    setState({ loading: false });
    showAlert('Error: ' + (comError.message.includes('unique') ? 'El código ya existe' : comError.message), 'error');
    return;
  }
  const comId = comData[0].id;

  // 2. Crear admin
  await sb.from('usuarios').insert({
    comunidad_id: comId, nombre: adminNombre,
    email: document.getElementById('ncAdminEmail').value,
    phone: document.getElementById('ncAdminPhone').value,
    rol: 'admin', clave: adminClave, activo: true
  });

  // 3. Crear unidades automáticamente
  const numDeptos = generarNumeracion(cant, inicio, formato);
  const dxpInsert = calcDxp(cant);
  const unidadesInsert = numDeptos.map((num, i) => {
    const piso = Math.floor(i / dxpInsert) + 1;
    return { comunidad_id: comId, numero: num, piso, sqm, monthly_fee: gc||0, parking: false, storage: false };
  });

  // Insertar en lotes de 50
  for (let i = 0; i < unidadesInsert.length; i += 50) {
    await sb.from('unidades').insert(unidadesInsert.slice(i, i + 50));
  }

  // 4. Crear estacionamientos
  if (cantEstac > 0) {
    const numEstac = generarNumsItem(cantEstac, document.getElementById('ncEstacInicio').value || 'E-1');
    await sb.from('estacionamientos').insert(
      numEstac.map(num => ({ comunidad_id: comId, numero: num }))
    );
  }

  // 5. Crear bodegas
  if (cantBodegas > 0) {
    const numBodegas = generarNumsItem(cantBodegas, document.getElementById('ncBodegaInicio').value || 'B-1');
    await sb.from('bodegas').insert(
      numBodegas.map(num => ({ comunidad_id: comId, numero: num }))
    );
  }

  const comunidades = await loadAllComunidades();
  setState({ loading: false, comunidades, view: 'sa_dashboard' });
  showAlert(`✓ "${nombre}" creada con ${cant} deptos${cantEstac>0?', '+cantEstac+' estac.':''}${cantBodegas>0?', '+cantBodegas+' bodegas':''}`);
};

}
